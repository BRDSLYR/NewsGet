                      Comment\n                    </a><meta content=\"Comment\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71704748\" data-title=\"AI and the consciousness illusion\" data-url=\"https://www.thehindu.com/opinion/op-ed/ai-and-the-consciousness-illusion/article71704748.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">For an AI to conquer the world, it implies an intelligence to envision and plot a desired future</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 01:08 am IST </span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/jacob-koshy-673/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/jacob-koshy-673/\">Jacob Koshy</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/wqeivu/article71705805.ece/alternates/LANDSCAPE_1200/2026-11-09T110015Z_859933148_RC2B6OA8SP5B_RTRMADP_3_AI-BANKS-FINANCING.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/wqeivu/article71705805.ece/alternates/LANDSCAPE_1200/2026-11-09T110015Z_859933148_RC2B6OA8SP5B_RTRMADP_3_AI-BANKS-FINANCING.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/wqeivu/article71705805.ece/alternates/LANDSCAPE_660/2026-11-09T110015Z_859933148_RC2B6OA8SP5B_RTRMADP_3_AI-BANKS-FINANCING.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/wqeivu/article71705805.ece/alternates/LANDSCAPE_320/2026-11-09T110015Z_859933148_RC2B6OA8SP5B_RTRMADP_3_AI-BANKS-FINANCING.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Whatever AI intelligence is, or may evolve to be, for now we only have the human to fear. File.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71704748\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Every day, artificial intelligence (AI) surmounts some feat that was once exclusively human. In its early days, ChatGPT’s ability to spit rhyme and spin stories resembled a parlour trick, reminiscent of an 18th-century craze called the Mechanical Turk. This was a chess-playing ‘automaton’; a life-size figure in turban, robes and moustache, seated behind a wooden cabinet with a chessboard on top. Its doors opened to reveal cogs and clockwork, after which the performance began, where the Turk took on and decimated human challengers. Charles Babbage, credited with conceiving the first mechanical computer, the Analytical Engine, lost three games in London in 1819. The Turk’s conceit was that cogs and wheels could synthesise an ‘intelligence’ that outdid humans, and spectators were convinced they were in the presence of a devilish, otherworldly “intelligence.”</p><p>The secret survived 84 years until Edgar Allan Poe revealed what should have been obvious: a human chess master crouched inside in claustrophobic, candle-lit darkness, following the game by moving magnets beneath the board and working the Turk’s arm by levers.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 01:07 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71704748\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/op-ed/ai-and-the-consciousness-illusion/article71704748.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ -name lnk lnk\" href=\"https://www.thehindu.com/profile/author/sanjay-kumar-3385/\">Sanjay Kumar</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/xocq2t/article71705803.ece/alternates/LANDSCAPE_1200/PTI09_23_2026_000380B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/xocq2t/article71705803.ece/alternates/LANDSCAPE_1200/PTI09_23_2026_000380B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/xocq2t/article71705803.ece/alternates/LANDSCAPE_660/PTI09_23_2026_000380B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/xocq2t/article71705803.ece/alternates/LANDSCAPE_320/PTI09_23_2026_000380B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Vanchit Bahujan Aghadi (VBA) activists protest to demand a quick and fair investigation into the death of IIT-Bombay student Sahil Wakode, outside the IIT-B Powai campus, in Mumbai, Maharashtra. File.\n                                          | Photo Credit: PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71704737\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The recent case at IIT Bombay involving alleged caste discrimination in connection with a student’s death has renewed concerns about such incidents across higher educational institutions in India. Viewing these incidents solely through the lens of a student’s personal circumstances is likely to obscure the prevalence of caste-based discrimination and the role of an unsupportive campus environment in contributing to psychological distress.</p><p>Recognising that student suicides raise concerns beyond immediate cases, the Supreme Court constituted a National Task Force (NTF) in 2025 to examine existing institutional mechanisms for mental health support in higher educational institutions. </p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 01:01 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71704737\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/op-ed/when-institutional-safeguards-fail/article71704737.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP theast Asia. It is increasingly about working with ASEAN to shape a stable, prosperous and inclusive Indo-Pacific", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/opinion/\">\n                        Opinion\n                    </a><meta content=\"Opinion\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/opinion/op-ed/\">\n                        Comment\n                    </a><meta content=\"Comment\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71704669\" data-title=\"PM in Manila: Giving new momentum to India’s Act East Policy\" data-url=\"https://www.thehindu.com/opinion/op-ed/pm-in-manila-giving-new-momentum-to-indias-act-east-policy/article71704669.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Prime Minister Modi’s presence in Manila will reinforce a clear message: India’s Act East Policy is not merely an outreach to Southeast Asia. It is increasingly about working with ASEAN to shape a stable, prosperous and inclusive Indo-Pacific</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 12:36 am IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/gurjit-singh-6175/\">Gurjit Singh</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/qzmk5q/article71705790.ece/alternates/LANDSCAPE_1200/PTI10_26_2025_000261B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/qzmk5q/article71705790.ece/alternates/LANDSCAPE_1200/PTI10_26_2025_000261B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/qzmk5q/article71705790.ece/alternates/LANDSCAPE_660/PTI10_26_2025_000261B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/qzmk5q/article71705790.ece/alternates/LANDSCAPE_320/PTI10_26_2025_000261B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Prime Minister Modi’s presence in Manila will reinforce a clear message: India’s Act East Policy is not merely an outreach to Southeast Asia. File image: PMO via PTI Photo\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71704669\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Prime Minister Narendra Modi’s participation in the ASEAN-India Summit and East Asia Summit in Manila on November 16-17 comes at an important time for India-ASEAN engagement. Strategic rivalries, economic disruption and anxieties over the international order give the summit an opportunity to reaffirm ASEAN centrality, consolidate the results of the 2026 ASEAN-India Year of Maritime Cooperation and add fresh momentum to India’s Act East Policy. India is an ASEAN dialogue partner that respects ASEAN’s strategic autonomy and its inclusive institutions.</p><p>In 2027, the ASEAN-India Dialogue Partnership turns 35 and their Comprehensive Strategic Partnership five. The evolution from bilateral trade and cultural exchanges in 1992 into a multidimensional partnership reflects the contemporary significance of the relations.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 12:32 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71704669\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/op-ed/pm-in-manila-giving-new-momentum-to-indias-act-east-policy/article71704669.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: 90678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 29, "title": "India’s green law needs baselines, not snapshots", "section": "Opinion", "page": "", "teaser": "The Yamuna floodplain verdict rightly insists that the polluter pays principle requires a polluter, but the route it takes leaves a gap that the National Green Tribunal Act had already closed", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/opinion/\">\n                        Opinion\n                    </a><meta content=\"Opinion\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/opinion/lead/\">\n                        Lead\n                    </a><meta content=\"Lead\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71704654\" data-title=\"India’s green law needs baselines, not snapshots\" data-url=\"https://www.thehindu.com/opinion/lead/indias-green-law-needs-baselines-not-snapshots/article71704654.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Yamuna floodplain verdict rightly insists that the polluter pays principle requires a polluter, but the route it takes leaves a gap that the National Green Tribunal Act had already closed</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 12:53 am IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/prasanth-raju-30830/\">Prasanth  Raju</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/toefjb/article71705775.ece/alternates/LANDSCAPE_1200/13_Scene_at_the_flood_plain_of_Yamuna_River_10_02_Del.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/toefjb/article71705775.ece/alternates/LANDSCAPE_1200/13_Scene_at_the_flood_plain_of_Yamuna_River_10_02_Del.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/toefjb/article71705775.ece/alternates/LANDSCAPE_660/13_Scene_at_the_flood_plain_of_Yamuna_River_10_02_Del.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/toefjb/article71705775.ece/alternates/LANDSCAPE_320/13_Scene_at_the_flood_plain_of_Yamuna_River_10_02_Del.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    File image of the flood plain of Yamuna River (near to the site, which was used during the World Culture Festival 2016, organized by the Art of Living Foundation), in New Delhi.\n                                          | Photo Credit: Shanker Chakravarty\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71704654\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>On August 22 the Supreme Court set aside the National Green Tribunal’s judgment of December 2017, which had held the organisers of the World Culture Festival responsible for damage to the Yamuna floodplain. The festival ran from March 11 to 13, 2016, on 25 hectares of active floodplain upstream of the DND flyway in Delhi, on land allotted by the Delhi Development Authority, which holds that floodplain in trust for the public. The appellant was Vyakti Vikas Kendra India, which runs the Art of Living International Centre. The Authority must now refund the ₹5 crore the organisers deposited as environmental compensation.</p><p>The proposition on which the judgment rests deserves defending. The polluter pays principle presupposes a polluter. Liability for ecological harm must attach to the party to whom that harm is attributable, and not to whoever happens to be in occupation when the reckoning is finally attempted. A doctrine that operates without attribution forfeits the moral authority on which its severity depends. The difficulty lies in what the reasoning does with uncertainty, and that difficulty will outlive this case.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 12:53 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71704654\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/lead/indias-green-law-needs-baselines-not-snapshots/article71704654.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DF tal pollution\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/629-600/\">\n                        law\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/600/\">\n                        crime, law and justice\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 30, "title": "SMAT: J&K gets off the mark with a thrilling victory over Tamil Nadu in a run-fest", "section": "Sport", "page": "", "teaser": "Opener Qamran and skipper Shubham lay the platform for team with quickfire fifties; Sathvik’s 31-ball 67 in vain; Mayank’s burst sets up Delhi’s win", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708951\" data-title=\"SMAT: J&amp;K gets off the mark with a thrilling victory over Tamil Nadu in a run-fest\" data-url=\"https://www.thehindu.com/sport/jampk-gets-off-the-mark-with-a-thrilling-victory-over-tamil-nadu-in-a-run-fest/article71708951.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Opener Qamran and skipper Shubham lay the platform for team with quickfire fifties; Sathvik’s 31-ball 67 in vain; Mayank’s burst sets up Delhi’s win</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:52 pm IST - INDORE</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/s-prasanna-venkatesan-1010/\">S. Prasanna Venkatesan</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/2l08gu/article71709074.ece/alternates/FREE_1200/08_RVM_1639.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/2l08gu/article71709074.ece/alternates/FREE_1200/08_RVM_1639.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/2l08gu/article71709074.ece/alternates/FREE_1200/08_RVM_1639.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/2l08gu/article71709074.ece/alternates/FREE_1200/08_RVM_1639.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Qamran Iqbal provided a flying start to J&amp;K’s innings against Tamil Nadu.\n                                          | Photo Credit: R. V. MOORTHY\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708951\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p> After spectacular power-hitting from opener Qamran Iqbal (70, 37b, 10x4, 3x6) and skipper Shubham Khajuria (53, 34b, 2x4, 4x6), Jammu &amp; Kashmir edged past Tamil Nadu by six runs in a high-scoring Group-B Syed Mushtaq Ali Trophy (SMAT) clash at the Holkar Stadium here on Monday.</p><p>Tamil Nadu finished with 195 for nine in response to J&amp;K’s 201 for seven.</p><p>Qamran struck three successive fours off M. Siddharth, clearing mid-on, swatting one straight back past the bowler, and driving another through covers. He also smashed back-to-back sixes off Athisayaraj Davidson.</p><p>Shubham’s second-wicket partnership with Qamran yielded 70 off 39 balls, while his third-wicket stand with Yawer Hassan (16) produced 60 off 32. He repeatedly shuffled across, launching two sixes off Sunny Sandhu, one over deep midwicket and the other straight down the ground.</p><p>Opener Amith Sathvik (67, 31b, 9x4, 3x6), reprieved on nought and four, set up Tamil Nadu’s chase. He took Abid Mushtaq for 6-4-6 in one over, bringing up his half-century off just 22 deliveries. There were three fours in one over off Lone Nasir before he was caught at short third man off Yudhvir Singh, attempting to drag a delivery from outside off.</p><p>With 47 needed off 18 balls, R. Rajkumar (24, 10b) reduced the equation to 31 off 15 with two sixes and a four down the ground off Lone Nasir.</p><p>After Rajkumar fell, the tailenders could only manage to bring it down to 12 off the final ball. Brijesh Sharma then bowled a waist-high no-ball down the leg side, which Siddharth helped away for four. However, Siddharth failed to make contact with the free hit.</p><p>Later, skipper Priyansh Arya struck his second consecutive half-century (55, 32b, 4x4, 3x6) and Yash Dhull top-scored with an unbeaten 78 (40b, 7x4, 5x6) to power Delhi to 240 for five. Punjab folded for 131 in reply, handing Delhi a 109-run victory.</p><p>Mayank Yadav (four for 12) led Delhi’s bowling effort with a three-wicket maiden in his first over. He hurried the batters with his pace, having opener Vihaan Malhotra (23) caught at long-off, Uday Saharan (0) edging one to the ‘keeper, and Arjun Rajput (0) top-edging a pull to square leg.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:42 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708951\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/jampk-gets-off-the-mark-with-a-thrilling-victo  out Maharashtra for 117; spinner Ayush’s last-over heroics help Himachal edge Andhra", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/cricket/\">\n                        Cricket\n                    </a><meta content=\"Cricket\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708991\" data-title=\"SMAT: Nidheesh bowls Kerala to a thumping victory after the Rohan-Samson show\" data-url=\"https://www.thehindu.com/sport/cricket/smat-nidheesh-bowls-kerala-to-a-thumping-victory-after-the-rohan-samson-show/article71708991.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The pacer produces career-best figures of five for 27 to bundle out Maharashtra for 117; spinner Ayush’s last-over heroics help Himachal edge Andhra</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:28 pm IST - New Chandigarh</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/m-r-praveen-chandran-353/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/m-r-praveen-chandran-353/\">M.R. Praveen Chandran</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/ttp34f/article71708984.ece/alternates/LANDSCAPE_1200/VIS_8320.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/ttp34f/article71708984.ece/alternates/LANDSCAPE_1200/VIS_8320.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/ttp34f/article71708984.ece/alternates/LANDSCAPE_660/VIS_8320.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/ttp34f/article71708984.ece/alternates/LANDSCAPE_320/VIS_8320.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Kerala opener Rohan Kunnummal hit a 47-ball 75.\n                                          | Photo Credit: File photo: VIJAY SONEJI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708991\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p> A feisty spell from M.D. Nidheesh (five for 27) backed up scintillating knocks by Rohan S. Kunnummal (75, 47b, 9x4, 3x6) and Sanju Samson (47, 16b, 3x4, 5x6) as Kerala scored an emphatic 94-run win over Maharashtra in an Elite Group C match of the Syed Mushtaq Ali Trophy T20 tournament here on Monday.</p><p>Nidheesh dismantled Maharashtra’s top-order en route his career-best figures as Kerala registered its first win. Chasing 212, Maharashtra folded up for 117.</p><p>Nidheesh removed dangerman Prithvi Shaw (six) in the first over and fate of the contest was sealed before end of the PowerPlay as Maharashtra lost half the side for 37.</p><p>Earlier, Rohan shrugged off his lean patch by playing a forceful knock. Samson was in element, striking five sixes in his 16-ball 47 as the third-wicket stand of 66 off 26 balls seized the momentum in Kerala’s favour.</p><p>A stutter followed their dismissals but Salman Nizar’s cameo (29 n.o., 13b, 2x4, 2x6) lifted Kerala to 211 for eight.</p><p>In the morning, left-arm spinner Ayush Jamwal defended 11 runs in the last over as Himachal Pradesh eked out an eight-run win over Andhra at the I.S. Bindra Stadium.</p><p>Player-of-the-Match Ayush (three for 23) dismissed the set batters K.V. Sasikanth (25) and Saurabh Kumar (17) in last over to seal a second consecutive win for Himachal.</p><p>Ayush’s heroics followed a tight penultimate over from off-spinner Aryaman Singh, who conceded just five runs.</p><p>The spin duo’s late squeeze derailed the chase after Sasikanth and Saurabh, with their enterprising 44-run seventh-wicket partnership, had threatened to take the game away from Himachal.</p><p>Andhra, in pursuit of 159, was dented early by Rohit Kumar’s twin strike. Ashwin Hebbar injected urgency with a brisk 34 and added 46 runs for the fifth wicket with S.D.N.V. Prasad (28) before both were dismissed in quick succession to put pressure on the lower-order.</p><p>Earlier, fine bowling at the death by Andhra (32 runs and five wickets from the last five overs) restricted Himachal Pradesh to 158 for nine.</p><p><b>The scores: </b>Kerala 211/8 in 20 overs (Rohan Kunnummal 75, Sanju Samson 47, Mukesh Choudhary 3/34) bt Maharashtra 117 in 16 overs (M.D. Nidheesh 5/27, Biju Narayanan 3/11).</p><p>Himachal Pradesh 158/9 in 20 overs (Ayush Jamwal 36, Nehal Wadhera 35, C.V. Stephen 3/27) bt Andhra 150/8 in 20 overs (Ashwin Hebbar 34, Ayush Jamwal 3/23).</p><p>Madhya Pradesh 250/6 in 20 overs (Shivang Kumar 61, Rajat Patidar 135 n.o., Akash Sengupta 3/42) bt Assam 119 in 17.4 overs (Sibsankar Roy 32, Kumar Kartikeya 3/17).</p><p>Pondicherry 209 in 20 overs (Bhanu Anand 59, Aman Khan 69 n.o., Manisankar Murasingh 6/33) bt Tripura 169/9 in 20 overs (Sridam Paul 57).</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:12 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708991\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/cricket/smat-nidheesh-bowls-kerala-to-a-thumping-victory-after-the-rohan-samson-show/article71708991.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu P : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/1683-1569/\">\n                        cricket\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/1807-1569/\">\n                        sport\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 32, "title": "Chintan Parikh and Rohit Rajpal file nominations for the post of AITA president", "section": "Sport", "page": "", "teaser": "Leander Paes and Prashant Sutar will vie for the post of vice-president", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/tennis/\">\n                        Tennis\n                    </a><meta content=\"Tennis\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708926\" data-title=\"Chintan Parikh and Rohit Rajpal file nominations for the post of AITA president\" data-url=\"https://www.thehindu.com/sport/tennis/chintan-parikh-and-rohit-rajpal-file-nominations-for-the-post-of-aita-president/article71708926.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Leander Paes and Prashant Sutar will vie for the post of vice-president</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:26 pm IST - BENGALURU</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/sports-bureau-307/\">Sports Bureau</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708926\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Interim All India Tennis Association president Chintan Parikh, and Davis Cup captain and Delhi Lawn Tennis Association president Rohit Rajpal, have filed nominations for the post of AITA president ahead of the Executive Committee (EC) elections scheduled for November 27.</p><p>Indian tennis legend Leander Paes and Maharashtra State Lawn Tennis Association president Prashant Sutar will vie for the post of vice-president while Gurcharan Singh (interim AITA joint-secretary) and Sunder Iyer (interim AITA secretary) will contest to become the new secretary.</p><p>Karnataka’s Sunil Yajaman and Uttarakhand’s Sumit Goel will hope to occupy one of two joint-secretary positions, with Prerna Bhmabri set to be elected unopposed as the other. The competition for the post of treasurer is expected to be between Asit Tripathy and Sujit Roy.</p><p>For the two Athletes Committee representatives – one male and one female – in the AITA EC, Yuki Bhambri, Rutuja Bhosale and Sravya Shivani Chilakalapudi have thrown their hats into the ring.</p><p>Objections to these nominations can be lodged until November 20 with the scrutiny and disposal scheduled for November 21 and 22. The last date for withdrawal of nominations is November 24.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:10 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708926\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/tennis/chintan-parikh-and-rohit-rajpal-file-nominations-for-the-post-of-aita-president/article71708926.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 33, "title": "Total Chess: Arjun’s loss to Vaishali ends his semifinal hopes", "section": "Sport", "page": "", "teaser": "", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708642\" data-title=\"Total Chess: Arjun’s loss to Vaishali ends his semifinal hopes\" data-url=\"https://www.thehindu.com/sport/arjuns-loss-to-vaishali-ends-his-semifinal-hopes/article71708642.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:02 pm IST - BUDAPEST</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://sportstar.thehindu.com/profile/author/jayantho-sengupta-28872/\">Jayantho  Sengupta</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/sport/jj9s13/article71708881.ece/alternates/LANDSCAPE_1200/TH0-ANISH%20GIRI.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/sport/jj9s13/article71708881.ece/alternates/LANDSCAPE_1200/TH0-ANISH%20GIRI.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/sport/jj9s13/article71708881.ece/alternates/LANDSCAPE_660/TH0-ANISH%20GIRI.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/sport/jj9s13/article71708881.ece/alternates/LANDSCAPE_320/TH0-ANISH%20GIRI.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Anish Giri booked a place in the semifinals.\n                                          | Photo Credit: FLICKR/FIDE\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708642\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p> Arjun Erigaisi began Sunday’s final game with a title semifinal place within reach. R. Vaishali, already out of contention, ended those hopes with a victory that left India without a representative in the championship bracket of the Total Chess World Championship Tour Pilot in Budapest.</p><p>Maxime Vachier-Lagrave, Fabiano Caruana, Anish Giri and Alireza Firouzja won their groups. Vachier-Lagrave faces Giri, while Firouzja meets Caruana in the semifinals beginning Tuesday.</p><p>Arjun entered Sunday level with Vachier-Lagrave and Hans Niemann on 13 points in Group D. His 60-move victory with White against Vaishali put him two points clear after Vachier-Lagrave drew with Bibisara Assaubayeva and Niemann lost to Wesley So.</p><p>However, Vachier-Lagrave’s superior opening blitz tiebreak meant Arjun needed another victory to guarantee qualification.</p><p>Vaishali won the return with White in 61 moves, while Vachier-Lagrave beat Assaubayeva to top the group on 17 points. Niemann defeated So to join Arjun on 16, taking second place on tiebreak.</p><p>Vaishali finished sixth on seven points. R. Praggnanandhaa also finished last in Group B on seven after drawing twice against Liem Le. He remained winless, with seven draws and three defeats.</p><p>Arjun will contest places nine to 12, while Vaishali and Praggnanandhaa will play for positions 21 to 24.</p><p>Caruana secured Group B with a draw against Vladislav Artemiev before losing the return in 66 moves. His first defeat left him on 17 points, three ahead of Le.</p><p>That loss eased the pressure on Magnus Carlsen’s world No. 1 position. Caruana had started Sunday just 5.4 points behind the Norwegian in the live classical ratings.</p><p>Carlsen, whose hopes of winning the title ended on Saturday, drew twice against Ian Nepomniachtchi to finish fifth in Group C on nine points, with nine draws and one defeat.</p><p>Giri drew twice against Shakhriyar Mamedyarov to win the group on 15 points, two ahead of Nepomniachtchi and Haik Martirosyan.</p><p>Firouzja drew both games against Levon Aronian to top Group A on 15 points, one ahead of Jan-Krzysztof Duda and Jorden van Foreest, who exchanged victories.</p><p>The knockout matches will combine blitz, rapid, and Fast Classic games.</p><p><i>(The writer is in Budapest at the invitation of Total Chess).</i></p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 08:52 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span cl =\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 34, "title": "IPL 2027: Dhoni’s ‘will he, won’t he’ question takes centre-stage again", "section": "Sport", "page": "", "teaser": "Dhoni had promised that his last T20 game would be at the MAC Stadium; however, the former skipper is known to keep his cards close to his chest", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/cricket/\">\n                        Cricket\n                    </a><meta content=\"Cricket\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708792\" data-title=\"IPL 2027: Dhoni’s ‘will he, won’t he’ question takes centre-stage again\" data-url=\"https://www.thehindu.com/sport/cricket/ipl-2027-dhonis-will-he-wont-he-question-takes-centre-stage-again/article71708792.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Dhoni had promised that his last T20 game would be at the MAC Stadium; however, the former skipper is known to keep his cards close to his chest</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 08:55 pm IST - Chennai</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/s-dipak-ragav-679/\">S. Dipak Ragav</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/sport/vlh563/article71708807.ece/alternates/LANDSCAPE_1200/TH17MS.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/sport/vlh563/article71708807.ece/alternates/LANDSCAPE_1200/TH17MS.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/sport/vlh563/article71708807.ece/alternates/LANDSCAPE_660/TH17MS.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/sport/vlh563/article71708807.ece/alternates/LANDSCAPE_320/TH17MS.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\"><b>In focus: </b>It remains to be seen whether Dhoni will continue to play for CSK.\n                                          | Photo Credit: FILE PHOTO: R. RAGU\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708792\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>All eyes are once again on M.S. Dhoni and Chennai Super Kings as Tuesday’s IPL retention deadline looms large.</p><p>The former captain did not play a single game in 2026 due to a calf injury, a year when CSK finished eighth and failed to qualify for the third year in succession.</p><p>Since then, the five-time champion has overhauled its support staff, with Zaheer Khan appointed as head coach.</p><p>Dhoni and Zaheer shared a great relationship during their playing days. While Dhoni led the side, the left-arm pacer was the de facto head of the bowling unit, and it remains to be seen whether the 45-year-old wicketkeeper will stick around for one more year to help his former colleague find his feet at the franchise.</p><p>Not to mention, Dhoni had promised that his last T20 game would be at the MAC Stadium here. However, the former skipper is known to keep his cards close to his chest and famously announced his international retirement without fanfare with a one-line statement: “<i>From 1929 hrs consider me as retired</i>” on August 15, 2020. Could November 17 be another landmark moment?</p><p>Meanwhile, the Yellow Army is set to release a good chunk of players ahead of the mini auction on December 16. Overseas players like Matt Henry, Zak Foulkes, Spencer Johnson and even Matt Short could be on their way out. The team is also likely to release Prashant Veer, whom it acquired for ₹14.20 crore last year, while Kartik Sharma, bought for the same amount, will be retained. Some of the other players in the lower price category are likely to be released to give management a healthy purse to rebuild the squad and get back on track.</p><p>On Monday, CSK announced that Ashish Kaushik will be its physiotherapist, with V.P. Sudharshan and Anthony Peter Sharp joining as strength and conditioning coaches. Kaushik previously headed physiotherapy at the National Cricket Academy (now the BCCI Centre of Excellence).</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 08:37 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708792\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/cricket/ipl-2027-dhonis-will-he-wont-he-question-takes-centre-stage-again/article71708792.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-blo sher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 07:46 pm IST - BUDAPEST</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://sportstar.thehindu.com/profile/author/jayantho-sengupta-28872/\">Jayantho  Sengupta</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/sport/1qf1jl/article71708323.ece/alternates/LANDSCAPE_1200/Caruana_Nagy_Sher.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/sport/1qf1jl/article71708323.ece/alternates/LANDSCAPE_1200/Caruana_Nagy_Sher.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/sport/1qf1jl/article71708323.ece/alternates/LANDSCAPE_660/Caruana_Nagy_Sher.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/sport/1qf1jl/article71708323.ece/alternates/LANDSCAPE_320/Caruana_Nagy_Sher.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    The First Saturday tournament provided an opportunity to aspiring Grandmasters.\n                                          | Photo Credit: Special Arrangement\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708265\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p> In 1989, Fjodor Skripchenko, the Moldovan chess federation’s general-secretary, asked Laszlo Nagy to help him run a monthly chess tournament in Chisinau. The two had met at a junior event in Vilnius. Nagy, teaching chemistry in the Hungarian army, liked the idea. He had Budapest in mind.</p><p>Players could reach the city from across Europe, and Hungary had enough Grandmasters for Nagy to hire strong opponents at a price he could afford. After leaving the army, he launched First Saturday in 1992. The name told players when to come.</p><div class=\"article-picture verticle\"><div class=\"picture zoom-img\"><img alt=\"Hikaru Nakamura has featured in the First Saturday tournament.\" class=\"lazy\" data-src-template=\"https://th-i.thgim.com/public/sport/xx0esi/article71708361.ece/alternates/FREE_1200/Nakamura_USA1.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIBkAEsAMBIgACEQEDEQH/xAA1AAABBQEBAQAAAAAAAAAAAAAAAQIDBAUGBwgBAAMBAQEBAQAAAAAAAAAAAAABAgMEBQYH/9oADAMBAAIQAxAAAADqWa0Wk5zrTc7rJYRMtxaFTD0WR0Ois8z0uFzj69uvzVGkiSQ1blZEUFqvLk0Kd60jXpxaVke3lpEcwdORrpJopY5GTRT25LNez1xNPFL0TYqatHaa0Fmv5dtVTktWuQERyAI5EDXsGOa8TJGvYoCUKKnJoKCYKCRQAFAQUGgDEFRCCoAioDUc1DGvYOOvYiDEHJz6tkZIyTYyNjqzsslZ04PfG9ioKNARi5mlnXOPqYN3fPTKNaX0lvjdFLp38jpC3XZEyenm0qAruHbzis6Zk7Wzsc5rxWnC+6PMmvRIStI6ShasTNs5HscGzkq/RVmufp9JWZz7NqFme27COoOa0gqjk6/k+tk6BrlxqNstSlisl1bXN6DkZ00qS/W8UEV10Vlx6sc1S0EsjTfy9NuTI187JwV7dfncaSJmQVbtVEcFqvLsW61qkjZGcWlYVOWhj2DhVFkQCRssM2hLahs9cSyMftNiFrNEtaeHzrRReSxFAaKCRHtGMljTHIolc17BQFAipx6KANQEgFARQEAGCgNFQEFQEFQEa5ERtkYOKGeEMUVObUEUJtnI2OvO21ydWLXxStKqKNAATO0c6551g/qztmpzk1ooy+lz96pK1s3c7SxrOo7eUyWhdcFPeZpw6+nWupLLIWRSrNoVWXSjNbpRQUYtJU+bpdTTDma/SVUc1Dv1wwYNuung192nayGaTG6/Vc10SOoBcKTJ1oqUD8K4y7Snq0dLYqT/AFvFM+GcBzpGnx2nRTLjHzbq1mKaqU9LPwGI5MXFVt1gjhsxQ57UVrRQxTw8N1x6cltjliHAsbZJhSXHNFLorVmvZ7M5Ho/dJFNHAyOSPgsFOdjXtGgADXIhWPaAqoxXseCo5EVlDktQVMAEAAAACgIKgIjkQgoxqOQGtkYm1j2pxRTQBiipz6o5AdvVy9Xqytqi9eUThGpEUAQAM7RzrnltfJt9EdZzuqmL57R083QrVLWc1t3s7Qyp+XezxwzMc5358nXyc1Gxwwd/Pwl2V2trlN3U0HVpdx8MjKJFF0GxzIFSDRTMxKnRVsnzNPqKcHMUumz6Ofh2ogyduC8G6k6YXnwRRaJt7FWjRy gest American Grandmaster at 14, breaking Nakamura’s record.</p><p>Nagy pays three Grandmasters to play in a field of 10. The other seven pay to enter. Koneru Humpy won the Grandmaster section at 14 in 2001. Fellow Indian Akshat Khamparia won it in 2018 and L R Srihari last month. For young Indians, Nagy reckons tournaments at home offer sufficient opposition until their rating reaches around 2150.</p><p>One early entrant, Peter Leko, could not afford the fee. Nagy invited the teenage International Master to his flat and asked how long he thought it would take him to earn a Grandmaster norm. Within a year, Leko reckoned.</p><p>“I give you two tournaments for free. And if you become a Grandmaster, you pay me back this money,” Nagy recalled telling him. If Leko missed out, Nagy would take the loss.</p><p>Leko earned a norm at First Saturday in April 1993. The following year, he became a Grandmaster at 14, a world record at the time.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 07:29 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708265\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/how-a-budapest-tournament-helped-shape-chess-superstars/article71708265.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!
