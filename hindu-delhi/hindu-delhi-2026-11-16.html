})();

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #1a1a18;
  --ink-muted:  #4a4a45;
  --ink-faint:  #8a8a82;
  --paper:      #f8f6f0;
  --paper-warm: #f0ede4;
  --rule:       #c8c4b8;
  --red:        #b00020;
  --font-head:  'Georgia', 'Times New Roman', serif;
  --font-body:  'Georgia', 'Times New Roman', serif;
  --font-ui:    system-ui, -apple-system, sans-serif;
}

html.dark {
  --ink:        #e8e4dc;
  --ink-muted:  #a8a49c;
  --ink-faint:  #6a6660;
  --paper:      #181816;
  --paper-warm: #211f1c;
  --rule:       #38352f;
  --red:        #e05070;
}

html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ── Masthead ── */
#masthead {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--ink); color: var(--paper);
  padding: 0 1rem;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
  user-select: none;
}
#masthead .nameplate {
  font-family: var(--font-head);
  font-size: 1.3rem; font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
}
#masthead .edition-date {
  font-family: var(--font-ui);
  font-size: 0.7rem; color: #aaa;
  text-align: right; line-height: 1.35;
}
#masthead .back-btn {
  display: none; align-items: center; gap: 6px;
  background: none; border: none; color: var(--paper);
  font-family: var(--font-ui); font-size: 0.8rem;
  cursor: pointer; padding: 8px 0; min-width: 60px;
}
#masthead .back-btn svg { flex-shrink: 0; }

/* ── Section nav strip ── */
#section-nav {
  position: fixed; top: 52px; left: 0; right: 0; z-index: 99;
  background: var(--paper-warm);
  border-bottom: 2px solid var(--ink);
  overflow-x: auto; overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  transition: opacity 0.2s, transform 0.2s;
}
#section-nav::-webkit-scrollbar { display: none; }
#section-nav .nav-inner {
  display: inline-flex; padding: 0 0.5rem;
}
.sec-tab {
  display: inline-block;
  font-family: var(--font-ui); font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-muted);
  padding: 9px 10px;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.sec-tab.active {
  color: var(--ink);
  border-bottom-color: var(--red);
}

/* ── Pages viewport ── */
#pages-viewport {
  position: fixed;
  top: 93px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
#pages-track {
  display: flex; height: 100%;
  transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ── Individual section page ── */
.section-page {
  flex: 0 0 100vw; width: 100vw; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 1.2rem 0 2rem;
}
.section-page::-webkit-scrollbar { width: 3px; }
.section-page::-webkit-scrollbar-thumb { background: var(--rule); }

.sec-header {
  padding: 0 1rem 0.6rem;
  border-bottom: 3px double var(--ink);
  margin-bottom: 0.1rem;
}
.sec-header h2 {
  font-family: var(--font-head);
  font-size: 1.05rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red);
}
.sec-header .art-count {
  font-family: var(--font-ui); font-size: 0.7rem;
  color: var(--ink-faint); margin-top: 1px;
}

.article-row {
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 0.5px solid var(--rule);
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: background 0.12s;
  gap: 0.25rem;
}
.article-row:active { background: var(--paper-warm); }
@media (hover: hover) {
  .article-row:hover { background: var(--paper-warm); }
}

.art-meta {
  font-family: var(--font-ui); font-size: 0.65rem;
  color: var(--ink-faint); letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex; gap: 0.5rem; align-items: center;
}
.art-meta .page-tag {
  background: var(--ink); color: var(--paper);
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.6rem;
}
.art-headline {
  font-family: var(--font-head);
  font-size: 1.02rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
}
.art-teaser {
  font-family: var(--font-body); font-size: 0.8rem;
  color: var(--ink-muted); line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.art-read-cue {
  font-family: var(--font-ui); font-size: 0.68rem;
  color: var(--red); font-weight: 600;
  letter-spacing: 0.03em;
  align-self: end;
  text-align: right;
}

/* ── Article pane fly animations ── */
@keyframes fly-to-pip {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
}
@keyframes fly-from-pip {
  0%   { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
  100% { opacity: 1; transform: scale(1); }
}

/* ── Article pane — floating card ── */
#article-pane {
  position: fixed;
  top: 58px; left: 50%; bottom: 12px;
  transform: translateX(-50%) scale(0.96);
  width: min(900px, calc(100vw - 1rem));
  background: var(--paper);
  border-radius: 12px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity: 0;
  pointer-events: none;
  transform-origin: center bottom;
  z-index: 101;
  padding: 1.5rem 1.5rem 3rem;
  transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
}
#article-pane.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) scale(1);
  animation: none;
}
#article-pane.flying-out { pointer-events: none; animation: fly-to-pip 0.75s cubic-bezier(0.4,0,0.2,1) forwards; }
#article-pane.flying-in  { pointer-events: none; animation: fly-from-pip 0.4s cubic-bezier(0.2,0,0,1) forwards; }
#article-pane::-webkit-scrollbar { width: 3px; }
#article-pane::-webkit-scrollbar-thumb { background: var(--rule); }

#article-pane .art-pane-section {
  font-family: var(--font-ui); font-size: 0.68rem;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--red);
  margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 0.5rem;
}
#article-pane .art-pane-section::after {
  content: ''; flex: 1; height: 1px; background: var(--rule);
}
#article-pane h1 {
  font-family: var(--font-head);
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  font-weight: 700; line-height: 1.25;
  color: var(--ink); margin-bottom: 0.75rem;
}
#article-pane .art-pane-meta {
  font-family: var(--font-ui); font-size: 0.72rem;
  color: var(--ink-faint); margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--rule);
  display: flex; gap: 1rem; flex-wrap: wrap;
}
#article-pane .art-pane-body {
  font-size: 1rem; line-height: 1.75; color: var(--ink);
}
#article-pane .art-pane-body p { margin-bottom: 0.9rem; }
#article-pane .art-pane-body h2,
#article-pane .art-pane-body h3 {
  font-family: var(--font-head);
  font-weight: 700; margin: 1.25rem 0 0.4rem;
  color: var(--ink);
}
#article-pane .art-pane-body img {
  max-width: 100%; height: auto;
  display: block; margin: 1rem 0;
}
#article-pane .art-pane-body figcaption {
  font-size: 0.75rem; color: var(--ink-faint);
  margin-top: -0.5rem; margin-bottom: 1rem;
  font-style: italic;
}
#article-pane .art-source-link {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-faint);
}
#article-pane .art-source-link a { color: var(--red); }

.art-print-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 1rem;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 14px;
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-muted); cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.art-print-btn:hover { border-color: var(--ink-muted); color: var(--ink); }
.art-print-btn svg { flex-shrink: 0; }

/* ── Background blur overlay ── */
#blur-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 98;
  backdrop-filter: blur(6px) brightness(0.85);
  -webkit-backdrop-filter: blur(6px) brightness(0.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}


/* ── PiP card ── */
#pip-card {
  position: fixed;
  bottom: 14px; right: 14px;
  width: 200px;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--rule);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.88) translateY(8px);
  transform-origin: bottom right;
  transition: opacity 0.3s ease 0.52s, transform 0.35s cubic-bezier(0.34,1.4,0.64,1) 0.52s;
  z-index: 103;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
#pip-card.open { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
#pip-card:hover { border-color: var(--ink-muted); }
.pip-head {
  background: var(--ink); padding: 7px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.pip-logo { font-family: var(--font-head); font-size: 0.68rem; font-weight: 700; color: var(--paper); }
.pip-close {
  background: none; border: none; color: #aaa; cursor: pointer;
  padding: 2px; display: flex; align-items: center; border-radius: 3px;
  transition: color 0.15s;
}
.pip-close:hover { color: var(--paper); }
.pip-body { padding: 8px 10px 10px; }
.pip-sec {
  font-family: var(--font-ui); font-size: 0.58rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red); margin-bottom: 4px;
}
.pip-title {
  font-family: var(--font-head); font-size: 0.72rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.pip-hint { font-family: var(--font-ui); font-size: 0.58rem; color: var(--ink-faint); }

/* ── Fallback notice ── */
.fallback-notice {
  font-family: var(--font-ui); font-size: 0.75rem;
  background: #fff8dc; border: 1px solid #e0c000;
  color: #555; padding: 0.5rem 1rem;
  margin: 0.5rem 1rem 0;
  border-radius: 4px;
}

/* ── Print styles ── */
@media print {
  body, html { overflow: visible !important; background: #fff !important; }
  #masthead, #section-nav, #pages-viewport, #blur-overlay,
  #pip-card, #swipe-hint, .art-print-btn { display: none !important; }
  #article-pane {
    position: static !important;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    border-radius: 0 !important;
    padding: 2rem !important;
    background: #fff !important;
    color: #000 !important;
    box-shadow: none !important;
  }
  #article-pane .art-pane-section,
  #article-pane h1,
  #article-pane .art-pane-meta,
  #article-pane .art-pane-body,
  #article-pane .art-source-link { display: block !important; color: #000 !important; }
  #article-pane .art-pane-body img { max-width: 100% !important; }
  a { color: #000 !important; text-decoration: none !important; }
}

/* ── Swipe hint (first load) ── */
#swipe-hint {
  position: fixed; bottom: 1.2rem; left: 50%;
  transform: translateX(-50%);
  background: rgba(26,26,24,0.75); color: #f8f6f0;
  font-family: var(--font-ui); font-size: 0.72rem;
  padding: 6px 14px; border-radius: 20px;
  pointer-events: none;
  animation: fadeout 3s ease 1.5s forwards;
  white-space: nowrap; z-index: 200;
}
@keyframes fadeout { to { opacity: 0; } }

/* ── Desktop: wider article reading column ── */
/* ── Theme toggle ── */
#theme-toggle {
  background: none; border: none;
  color: var(--paper); cursor: pointer;
  padding: 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.75; transition: opacity 0.15s;
  flex-shrink: 0;
}
#theme-toggle:hover { opacity: 1; }
#theme-toggle svg { display: block; }

@media (min-width: 700px) {
  #article-pane {
    padding: 2rem 2.5rem 4rem;
  }
  .article-row {
    grid-template-columns: 1fr;
    padding: 0.9rem 1.5rem;
  }
  .sec-header { padding: 0 1.5rem 0.7rem; }
  .section-page { padding: 1.4rem 0 2rem; }
  .art-headline { font-size: 1.1rem; }
  #masthead .nameplate { font-size: 1.5rem; }
  .fallback-notice { margin: 0.5rem 1.5rem 0; }
}
</style>
</head>

ofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Chief Minister D.K. Shivakumar will inaugurate the three-day event, themed: “AI &amp; Beyond,” on Tuesday morning</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:55 pm IST - Bengaluru</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/fh3c8s/article71709377.ece/alternates/LANDSCAPE_1200/CM%20DKS%206.JPEG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/fh3c8s/article71709377.ece/alternates/LANDSCAPE_1200/CM%20DKS%206.JPEG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/fh3c8s/article71709377.ece/alternates/LANDSCAPE_660/CM%20DKS%206.JPEG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/fh3c8s/article71709377.ece/alternates/LANDSCAPE_320/CM%20DKS%206.JPEG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Chief Minister D.K. Shivakumar will inaugurate the tech summit at Bangalore International Exhibition Centre.\n                                          | Photo Credit: File Photo\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709164\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Karnataka is set to host the 29th edition of its flagship annual technology exposition, the Bengaluru Tech Summit (BTS), from November 17 to 19 at the Bangalore International Exhibition Centre (BIEC).</p><p>Chief Minister D.K. Shivakumar will inaugurate the three-day event, themed: “AI &amp; Beyond,” on Tuesday morning.</p><p>Addressing a media conference on the eve of the summit, Minister for Home, IT &amp; BT, and e-Governance Priyank Kharge said that the conference would feature over 120 knowledge sessions across 16 thematic tracks, including IT &amp; DeepTech, Frontier Tech, Electro-Semicon, Electric Mobility, Health &amp; Biotech, Digital Infrastructure &amp; Data Centres, Data &amp; Cybersecurity, Assistive Tech, Focus GCC, Circular Economy, Orange Economy, Finverse, Skilling &amp; Edutech, India–USA Tech Conclave, Global Collaborations, and India Innovates.</p><p>Highlighting the summit’s global trajectory, Mr. Kharge noted how the expo has expanded over the decades to draw international participation. “Bengaluru Tech Summit has evolved beyond an annual technology gathering into a platform where global conversations translate into partnerships, investments, and tangible opportunities,” the Minister said.</p><p>The State’s ambition was to make Bengaluru a gateway for the world to engage with India’s technology ecosystem, while taking Karnataka’s innovations and solutions to global markets, he added.</p><p>According to Mr. Kharge, the 2026 edition introduces several new initiatives, including the debut of the GCC India Leaders’ Dialogue on Wednesday and a new Workshops &amp; Masterclass Series featuring 11 sessions by global firms such as Nvidia, Cloudflare, and eBay. The summit will also host three co-located international events: the maiden edition of Germany’s embedded world India, alongside France-origin sustainability and health forums ChangeNOW and One Sustainable Health.</p><p>A 50,000 sq. ft. AI &amp; Robotics Pavilion co-curated by Bharat1.ai, showcasing indigenous humanoids, drones, and India’s first quadrupedal athletic showcase, would be a new feature. The summit will also mark the launch of AI Kavach, the country’s first AI cybersecurity lab for the BFSI (banking, financial services and insurance) sector developed with IIT Kanpur.</p><p>Backed by Karnataka’s Global Innovation Alliance, which has expanded from 10 countries in 2018 to over 40 nations, the event will have Sweden as its Country Partner, alongside delegations from over 65 countries. Over 1,000 startups from 100 Indian cities will participate, culminating on November 19 with the Future Makers Conclave to celebrate 10 years of Karnataka’s ELEVATE initiative and felicitate recent unicorns and IPO achievers.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:55 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709164\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/karnataka/29th-edition-of-bengaluru-tech-summit-to-kick-off-today/article71709164.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678 u --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 1, "title": "DVAC registers criminal case over alleged irregularities in the purchase of books", "section": "Front Page", "page": "", "teaser": "The criminal case has been registered against a Chennai-based publisher and “unidentified officials” of the Directorate of Public Libraries, Anna Centenary Library, Chennai, and Periyar Arivulagam, Coimbatore. On Monday (November 16, 2026), DVAC officials launched a search at seven places and seized receipt vouchers for book procurement and other documents. Mohan, proprietor of Akal Vizhakku Publishers, was arrested", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/tamil-nadu/\">\n                        Tamil Nadu\n                    </a><meta content=\"Tamil Nadu\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708504\" data-title=\"DVAC registers criminal case over alleged irregularities in the purchase of books\" data-url=\"https://www.thehindu.com/news/national/tamil-nadu/dvac-registers-criminal-case-over-alleged-irregularities-in-the-purchase-of-books/article71708504.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The criminal case has been registered against a Chennai-based publisher and “unidentified officials” of the Directorate of Public Libraries, Anna Centenary Library, Chennai, and Periyar Arivulagam, Coimbatore. On Monday (November 16, 2026), DVAC officials launched a search at seven places and seized receipt vouchers for book procurement and other documents. Mohan, proprietor of Akal Vizhakku Publishers, was arrested</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 11:40 pm IST - CHENNAI/COIMBATORE</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/s-vijay-kumar-566/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/s-vijay-kumar-566/\">S. Vijay Kumar</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/qjrwg1/article71709117.ece/alternates/LANDSCAPE_1200/Periyar%20Arivulagam%20Coimbatore%C2%A011.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/qjrwg1/article71709117.ece/alternates/LANDSCAPE_1200/Periyar%20Arivulagam%20Coimbatore%C2%A011.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/qjrwg1/article71709117.ece/alternates/LANDSCAPE_660/Periyar%20Arivulagam%20Coimbatore%C2%A011.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/qjrwg1/article71709117.ece/alternates/LANDSCAPE_320/Periyar%20Arivulagam%20Coimbatore%C2%A011.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Books sorted and kept on tables during the search conducted by DVAC officials at Periyar Arivulagam in Coimbatore on Monday (November 16, 2026). \n                                          | Photo Credit: S. Siva Saravanan\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708504\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The Directorate of Vigilance and Anti-Corruption (DVAC) has registered a criminal case against a Chennai-based publisher and “unidentified officials” of the Directorate of Public Libraries, Anna Centenary Library, Chennai, and Periyar Arivulagam, Coimbatore, over allegations of large-scale irregularities in the procurement of books.</p><p>The case was registered after <i>prima facie</i> evidence pointing to forgery, criminal conspiracy, and corruption was established in a detailed inquiry conducted on a complaint filed by the Secretary, School Education Department, who sought a probe into the alleged irregularities in the procurement of books for public libraries.</p><p>Investigation revealed that the “coordination committee” had added titles not recommended by the “books recommendation committee”, which had proposed around 26,000 books for purchase.</p><p>These additions were not brought on record in the official note file, the First Information Report said.</p><p>It also revealed that books were allegedly written in fictitious names, with plagiarised content and violations of the Transparent Book Procurement Policy, 2024, which prescribed a systematic, transparent, and structured procedure for the purchase of books for public libraries.</p><p>Besides the officials, the agency booked R. Mohan, proprietor of Akal Vizhakku Publishers (also known as Akal Vilakku Pathippagam), and Phoenix Publications, both based at Madipakkam, Chennai, and other unidentified persons.</p><p>The DVAC said in its FIR that the State government had sanctioned ₹50 crore for procuring books and e-books for Periyar Arivulagam. The procurement was also intended to cover Kamarajar Arivulagam, Tiruchi; Bharathidasan Arivulagam, Salem; Anjalai Ammal Arivulagam, Cuddalore; Quaid-e-Millath Arivulagam, Tirunelveli; and libraries in six newly formed districts.</p><p>The agency said Mohan was the proprietor of both publishing firms that had operated from the same address and were associated with Sigma Prints and Sigma Publishing Services. He had given a list of 2,339 titles in the name of Akal Vizhakku Publishers and 99 titles in the name of Phoenix Publications. Purchase orders for 1,857 books were issued to the two publishers on February 13 and 14, 2026. After the books were received and verified, the list submitted by Akal Vizhakku Publishers was forwarded for processing payment for 1,779 books.</p><h4 class=\"sub_head\">Copied content</h4><p>Investigators said Mohan had “created the books under fictitious author names, using information taken from websites and online applications, including ChatGPT. The contents were found to be vague, irrelevant and misleading, and of substandard language with no educational or informational value for a public library”.</p><p>The inquiry exposed instances of factually wrong information and plagiarism. One book described Naladiyar as a poet and philosopher, while another said the author of Madurai Kanchi was a king. The book titled Tourism: Principles, Practices and Philosophies, attributed to Emily Lawson, contained material copied from other books.</p><p>“The State government paid from public funds to the two publications for books which were written under false author names, in some cases copied from other works, and not fit for a public library,” the DVAC said.</p><p>The inquiry revealed that the procurement of books from Akal Vilakku Pathipagam and Phoenix Publications was done not only for Periyar Arivulagam but also for other public libraries at a cost of ₹1.74 crore. The investigation would be extended to unearth whether other publishers supplied similar books to the public libraries.</p><h4 class=\"sub_head\">DVAC conducts search</h4><p>Early on Monday (November 16, 2026), DVAC officials launched a search at seven places across Tamil Nadu in connection with the case. During the searches, a hard disc, receipt vouchers for the procurement of the books, and other documents were seized.</p><p>The DVAC said in a press note that Mohan, proprietor of Akal Vizhakku Publishers, was arrested.</p><p>DVAC sources said the officials also searched Periyar Arivulagam, the library-cum-science centre located on Dr. Nanjappa Road in Coimbatore. A team, headed by DVAC Deputy Superintendent of Police Immanuel Gnanasekar, began the search at 9 a.m. at the Tamil book section on the fourth floor. The team thoroughly checked the books from each rack and sorted them based on their findings.</p><p>The team found a large number of books purchased for a library in Chennai, said to be Anna Centenary Library, stacked in the Tamil section. The officials refused to disclose the other aspects being scrutinised by them. An official said it might take more than a day to verify all the books at the library, which is said to house around 80,000 books.</p><p>The other sections for books at Periyar Arivulagam are the children’s library on the second floor, the competitive examination section on the third floor, the English section on the fifth and sixth floors, and a digital library on the seventh floor.</p><p>Following allegations of irregularities in the procurement of books, the library has taken down around 2,000, including those from Akal Vilakku Pathipagam.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 10:36 pm IST</span></p></div><button clas News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709239\" data-title=\"Delhi car blast: SC allows transfer of cases to capital for joint trial\" data-url=\"https://www.thehindu.com/news/national/delhi-car-blast-sc-allows-transfer-of-cases-to-capital-for-joint-trial/article71709239.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">A powerful explosion ripped through a slow-moving car at a traffic signal near the Red Fort Metro station on November 10, 2025, killing 12 people and injuring several others.</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:33 pm IST - NEW DELHI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/pz101v/article71709351.ece/alternates/LANDSCAPE_1200/One-year-after-GVAGPGJ2Q.3.jpg.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/pz101v/article71709351.ece/alternates/LANDSCAPE_1200/One-year-after-GVAGPGJ2Q.3.jpg.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/pz101v/article71709351.ece/alternates/LANDSCAPE_660/One-year-after-GVAGPGJ2Q.3.jpg.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/pz101v/article71709351.ece/alternates/LANDSCAPE_320/One-year-after-GVAGPGJ2Q.3.jpg.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    A relative of a victim in the Red Fort blast weeps on the first anniversary of the incident in New Delhi on Tuesday.\n                                          | Photo Credit: ANI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709239\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The Supreme Court on Monday allowed a plea by the National Investigation Agency (NIA) for transfer of two criminal cases linked to the November 2025 car explosion near the Red Fort Metro station from Jammu and Kashmir and Haryana to a special court in the national capital.</p><p>A Bench headed by Justice Prashant Kumar Mishra also directed that three FIRs registered in the matter across Delhi, Jammu and Kashmir and Haryana be clubbed together for a joint trial in Delhi.</p><p>A powerful explosion ripped through a slow-moving car at a traffic signal near the Red Fort Metro station on November 10, 2025, killing 12 people and injuring several others.</p><p>The apex court pointed to the overlapping of accused persons, witnesses and evidence, making separate trials in different States unfeasible. The court also took into consideration the security of the trial, with several accused persons still absconding.</p><p>The NIA said the cases were linked through an interweaving of facts, like the proliferation of provocative and inflammatory posters associated with the proscribed terrorist organisation Jaish-e-Mohammad (JeM) in Srinagar, ahead of the blast.</p><p>All three cases were intricately connected and formed part of one overarching conspiracy, requiring a joint trial in one place.</p><p>Following the blast, several arrests were made, including that of four doctors. The alleged car bomber, Umar Nabi, was reported to be a doctor himself.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:33 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709239\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/delhi-car-blast-sc-allows-transfer-of-cases-to-capital-for-joint-trial/article71709239.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mi FP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 3, "title": "Chennithala promises speedy implementation of Kerala Lok Ayukta contempt rules", "section": "Front Page", "page": "", "teaser": "", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/kerala/\">\n                        Keralam\n                    </a><meta content=\"Keralam\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708913\" data-title=\"Chennithala promises speedy implementation of Kerala Lok Ayukta contempt rules\" data-url=\"https://www.thehindu.com/news/national/kerala/chennithala-promises-speedy-implementation-of-kerala-lok-ayukta-contempt-rules/article71708913.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 11:19 pm IST - THIRUVANANTHAPURAM</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/9l7kqi/article71709336.ece/alternates/LANDSCAPE_1200/Lok%20ayukta.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/9l7kqi/article71709336.ece/alternates/LANDSCAPE_1200/Lok%20ayukta.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/9l7kqi/article71709336.ece/alternates/LANDSCAPE_660/Lok%20ayukta.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/9l7kqi/article71709336.ece/alternates/LANDSCAPE_320/Lok%20ayukta.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Leader of the Opposition Pinarayi Vijayan delivering the keynote address at the Kerala Lokayukta Day celebrations held at the Legislative Assembly Banquet Hall on Monday.\n                                          | Photo Credit: JAYAMOHAN A.\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708913\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Home Minister Ramesh Chennithala has pledged to expedite the process of implementing the contempt rules for the Kerala Lok Ayukta.</p><p>The Minister made the commitment during the Lok Ayukta Day celebration held at the Kerala Legislative Assembly on Monday.</p><p>Participating in the function online as the chief guest, Mr. Chennithala assured to adopt necessary steps for the notification of the rules. He noted that as the chairperson of the Assembly Subject Committee on Home Affairs, which also includes the Leader of the Opposition, he would facilitate the quick progression of the draft rules through the panel.</p><p>The demand to expedite the rules was a key issue raised during the event since the Kerala Lok Ayukta presently lacks specific contempt rules despite possessing powers under Section 19 of the Kerala Lok Ayukta Act regarding the Contempt of Courts Act. In the absence of dedicated rules, the institution has been following the rules of the High Court.</p><p>In order to resolve the lacunae, the Lok Ayukta had comprised a Rules Committee comprising eminent lawyers and Bar Council members, to draft the rules. After being reviewed by an advisory committee, the draft had been submitted to the government over a year ago.</p><p>Keralam Lok Ayukta N. Anil Kumar presided over the function. Leader of the Opposition Pinaryai Vijayan was the guest of honour. Thiruvananthapuram Mayor V.V. Rajesh, Director General of Prosecution T. Asaf Ali, Kerala Lok Ayukta Registrar E. Baiju, Thiruvananthapuram Bar Association president Gopidas G. and Kerala Lok Ayukta Advocates’ Forum president N.S. Lal also took part in the programme. </p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:01 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708913\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/kerala/chennithala-promises-speedy-implementation-of-kerala-lok-ayukta-contempt-rules/article71708913.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Deskto         </a><meta content=\"Business\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709315\" data-title=\"Indian central bank seeks review of Supreme Court’s Yes Bank AT-1 bonds order\" data-url=\"https://www.thehindu.com/business/indian-central-bank-seeks-review-of-supreme-courts-yes-bank-at-1-bonds-order/article71709315.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The RBI filed a review petition in the Supreme Court against its judgment that set aside the write-off of ₹8,415 crore of Yes Bank’s additional tier-1 bonds</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 11:18 pm IST - MUMBAI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\">Reuters</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/vo2em/article71709329.ece/alternates/LANDSCAPE_1200/2026-02-04T030127Z_1361633183_RC2AQ9AVVN79_RTRMADP_3_YES-BANK-CEO.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/vo2em/article71709329.ece/alternates/LANDSCAPE_1200/2026-02-04T030127Z_1361633183_RC2AQ9AVVN79_RTRMADP_3_YES-BANK-CEO.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/vo2em/article71709329.ece/alternates/LANDSCAPE_660/2026-02-04T030127Z_1361633183_RC2AQ9AVVN79_RTRMADP_3_YES-BANK-CEO.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/vo2em/article71709329.ece/alternates/LANDSCAPE_320/2026-02-04T030127Z_1361633183_RC2AQ9AVVN79_RTRMADP_3_YES-BANK-CEO.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Last month, the Supreme Court had upheld a Bombay High Court ruling which had set aside the write-off of Yes Bank’s AT-1 bonds and said the write-off was impermissible. File\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709315\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>India’s central bank on Friday (November 13, 2026) filed a petition in the country’s apex court seeking a review of its judgment that set aside the write-off of 84.15 billion rupees ($893.8 million) of Yes Bank’s additional tier-1 bonds, the court’s website showed on Monday (November 16, 2026). An email query sent to the Reserve Bank of India (RBI) was not answered.</p><p>Last month, the Supreme Court had upheld a Bombay High Court ruling which had set aside the write-off of Yes Bank’s AT-1 bonds and said the write-off was impermissible.</p><p>Yes Bank, in which Japan’s Sumitomo Mitsui Banking Corporation now holds a 24% stake, was declared insolvent six years ago; as part of a restructuring scheme, new investors were brought in and its AT-1 bonds were written off.</p><p>On Friday (November 13, 2026), Yes Bank informed exchanges that it had filed a review petition without disclosing the grounds for seeking relief.</p><p>Earlier this month, Axis Trustee Services, acting on behalf of the bondholders, filed a contempt petition in the Supreme Court alleging Yes Bank’s failure to provide a “concrete roadmap” for restoring the bonds and implementing the court’s judgment.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:17 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709315\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/indian-central-bank-seeks-review-of-supreme-courts-yes-bank-at-1-bonds-order/article71709315.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_I u --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/692-684/\">\n                        business (general)\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/834-833-684/\">\n                        bonds\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/684/\">\n                        economy\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 5, "title": "ED’s arrest was politically motivated, Azam Khan tells Allahabad High Court", "section": "Front Page", "page": "", "teaser": "Former Uttar Pradesh Minister and Samajwadi Party leader told the Court that the arrest was intended to keep him behind bars until the 2027 Assembly elections", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/uttar-pradesh/\">\n                        Uttar Pradesh\n                    </a><meta content=\"Uttar Pradesh\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708140\" data-title=\"ED’s arrest was politically motivated, Azam Khan tells Allahabad High Court\" data-url=\"https://www.thehindu.com/news/national/uttar-pradesh/eds-arrest-was-politically-motivated-azam-khan-tells-allahabad-high-court/article71708140.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Former Uttar Pradesh Minister and Samajwadi Party leader told the Court that the arrest was intended to keep him behind bars until the 2027 Assembly elections</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:17 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/fprb0c/article71708444.ece/alternates/LANDSCAPE_1200/PTI11_16_2026_000192B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/fprb0c/article71708444.ece/alternates/LANDSCAPE_1200/PTI11_16_2026_000192B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/fprb0c/article71708444.ece/alternates/LANDSCAPE_660/PTI11_16_2026_000192B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/fprb0c/article71708444.ece/alternates/LANDSCAPE_320/PTI11_16_2026_000192B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Samajwadi Party leader Azam Khan being escorted by ED officials to a special court in Ghaziabad following the completion of his four-day custodial interrogation in a money laundering case, in New Delhi on Monday.\n                                          | Photo Credit: PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708140\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Former Uttar Pradesh Minister and <a href=\"https://www.thehindu.com/news/national/sp-leader-azam-khan-sent-to-10-day-judicial-custody-in-money-laundering-case/article71708278.ece\" target=\"_self\">Samajwadi Party leader Azam Khan</a> on Monday (November 16, 2026) told the Allahabad High Court that his recent arrest by the Enforcement Directorate (ED) was politically motivated and intended to keep him behind bars until the 2027 Assembly elections.</p><p>Mr. Khan, 78, was arrested by the ED on October 31, barely 40 minutes after being released on bail from Rampur district jail in a PAN fraud case.</p><p>The submissions were made before a Bench of Justices Rajiv Gupta and Devendra Singh. After hearing the arguments, the Bench directed the ED to file an affidavit confirming whether it had communicated the grounds of arrest to Mr. Khan.</p><h4 class=\"sub_head\">Diversion of funds</h4><p>The ED’s money-laundering investigation centres on alleged financial irregularities and illegal occupation of farmers’ agricultural land linked to the Rampur-based Mohammad Ali Jauhar University. The agency has alleged that funds and materials allocated for public projects were diverted to the university, government works were carried out on its private campus, and donations to the Mohammad Ali Jauhar Trust were routed through contractors holding government contracts. A special PMLA court in Ghaziabad remanded Khan to judicial custody on November 1.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/uttar-pradesh/bulldozers-versus-books/article71265953.ece\">\n\t\t\t\t\t\t\t\t\t\tBulldozers versus books</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy istered against his client between July 12 and 20, 2019, over alleged incidents dating back to 2006 and also questioned the similarity in the complaints, several of which were registered at night. He also mentioned the addition of 28 more FIRs, including those related to incidents dated back to 2016.</p><p>Challenging the attachment of university properties, Mr. Sibal argued that the ED cited 1.552 hectares of allegedly occupied farmers’ land worth ₹3.11 crore but attached university properties valued at approximately ₹500 crore. He submitted that the disputed land had already been restored to farmers.</p><p>Mr. Khan challenged his arrest, arguing that the ED had not properly communicated the grounds of detention.</p><p>ED denied allegations of political vendetta. Its counsel, Zoheb Hussain, and Additional Solicitor General S.V. Raju cited video recordings, a <i>panchnama</i> and other records, claiming that Mr. Khan repeatedly refused to accept the grounds of arrest. They maintained that due procedures were followed and informed the court that a charge sheet had been filed and cognisance taken.</p><p>The matter will be heard again on Tuesday.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:17 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708140\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/uttar-pradesh/eds-arrest-was-politically-motivated-azam-khan-tells-allahabad-high-court/article71708140.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /2239 item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/tamil-nadu/\">\n                        Tamil Nadu\n                    </a><meta content=\"Tamil Nadu\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709317\" data-title=\"Followed tiger out of curiosity, says Tamil Nadu Minister\" data-url=\"https://www.thehindu.com/news/national/tamil-nadu/followed-tiger-out-of-curiosity-says-tamil-nadu-minister/article71709317.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">A campaign is being unleashed against me for political reasons, said Social Justice Minister Vanni Arasu</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:15 pm IST - Chennai</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/an6rxo/article71709328.ece/alternates/FREE_1200/Minister-Vanni-G4LGQ7FJQ.3.jpg.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/an6rxo/article71709328.ece/alternates/FREE_1200/Minister-Vanni-G4LGQ7FJQ.3.jpg.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/an6rxo/article71709328.ece/alternates/FREE_1200/Minister-Vanni-G4LGQ7FJQ.3.jpg.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/an6rxo/article71709328.ece/alternates/FREE_1200/Minister-Vanni-G4LGQ7FJQ.3.jpg.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Screengrab of Tamil Nadu Minister for Social Justice, Adi Dravidar Welfare and Hill Tribes, Vanni Arasu, is seen running after a tiger at Mudumalai Tiger Reserve in The Nilgiris in November 2026. (Photo: Instagram/@vannikural)\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709317\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Facing flak from conservationists for allegedly pursuing a tiger inside the Mudumalai Tiger Reserve, Social Justice Minister Vanni Arasu on Monday (November 16, 2026) clarified that he had been trekking in forests and mountains for the past 15 years and that the issue had now been blown out of proportion because he had become a Minister.</p><p class=\"referpara\"><strong><b>Also read | <a href=\"https://www.thehindu.com/news/national/tamil-nadu/minister-vanni-arasu-faces-flak-for-pursuing-tiger-in-mudumalai-tiger-reserve/article71704393.ece\" target=\"_blank\">Complaint to National Tiger Conservation Authority seeks probe into Minister Vanni Arasu’s MTR visit</a></b></strong></p><p>“A campaign is being unleashed against me for political reasons,” he claimed to The Hindu.</p><p>Asked about allegations that he had chased animals, Mr. Vanni Arasu said he had followed the tiger out of “curiosity” and had neither chased nor disturbed it.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/tamil-nadu/minister-vanni-arasu-faces-flak-for-pursuing-tiger-in-mudumalai-tiger-reserve/article71704393.ece\">\n\t\t\t\t\t\t\t\t\t\tTamil Nadu Minister Vanni Arasu faces flak for pursuing tiger in Mudumalai Tiger Reserve</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/news/national/tamil-nadu/o1vo2t/article71708045.ece/alternates/SQUARE_80/Vanni%20Arasu%20Mudumalai.jpeg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAACAwEBAQAAAAAAAAAAAAADBAEFBgIHAAEAAgMBAAAAAAAAAAAAAAAAAgMBBAUA/9oADAMBAAIQAxAAAAD0vvLPORffYTtc7r7G61wmkcmJYVp1nhSm4yXV6ja/SppadV57LrJmFbyeftIK4hEtdUyVnj85WWLps22mr7PN4DGK0Vg0WRkp1SMr9QfmfN+LUPePU91kzWU747LkGeTDSksSE55oqtxlnocyWrDNWsyff//EADIQAAIBAwMCBQMCBQUAAAAAAA ce in conquering the challenges of the trail”.</p><p>“We appreciate your contribution towards nature conservation, sustainable tourism and local livelihood through participation in the Government of Tamil Nadu initiative. You have set an example of responsible trekking by adhering to our rules,” the Forest Department said in the certificate.</p><p>Mr. Vanni Arasu said he had obtained the requisite permission from the Forest Department and had not violated any rules.</p><p>“I have been fighting for the rights and welfare of the tribal community. I love nature and the environment and am keen on protecting wild animals,” he said.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:15 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709317\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/tamil-nadu/followed-tiger-out-of-curiosity-says-tamil-nadu-minister/article71709317.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\" /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/204-81/\">\n                        Tamil Nadu\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/topic/tamilaga-vettri-kazhagam/\">\n                        Tamilaga Vettri Kazhagam\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/1391-1385-1349/\">\n                        ministers (government)\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 7, "title": "SHRC seeks joint action to ease metro work-related traffic snarls", "section": "Front Page", "page": "", "teaser": "The District Police Chief (Kochi City) and the KMRL managing director have been asked to ensure that joint inspections are regularly carried out to prevent traffic bottlenecks at St. Martin Junction, Palarivattom, and surrounding areas.", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/kerala/\">\n                        Keralam\n                    </a><meta content=\"Keralam\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709078\" data-title=\"SHRC seeks joint action to ease metro work-related traffic snarls\" data-url=\"https://www.thehindu.com/news/national/kerala/shrc-seeks-joint-action-to-ease-metro-work-related-traffic-snarls/article71709078.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The District Police Chief (Kochi City) and the KMRL managing director have been asked to ensure that joint inspections are regularly carried out to prevent traffic bottlenecks at St. Martin Junction, Palarivattom, and surrounding areas.</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:11 pm IST - KOCHI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709078\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>State Human Rights Commission (SHRC) Chairperson Alexander Thomas has directed officials of Kochi Metro Rail Limited (KMRL) and the traffic police to conduct joint inspections and take effective measures to prevent traffic congestion at locations where Kochi metro construction works are under way.</p><p>The District Police Chief (Kochi City) and the KMRL managing director have been asked to ensure that joint inspections are regularly carried out to prevent traffic bottlenecks at St. Martin Junction, Palarivattom, and surrounding areas.</p><p>The Commission further directed that a joint meeting be convened once every two months, comprising the deputy manager (projects) and traffic consultant representing KMRL and the Assistant Commissioner of Police (Traffic East) and the Inspector (Traffic) representing the traffic police. The Commission instructed the officials to assess the prevailing situation and ensure the smooth flow of traffic. Remedial measures should also be decided during these meetings.</p><p>The directions were issued in a suo motu case registered by the Commission based on newspaper reports regarding severe traffic congestion at locations where metro construction activities are in progress. The Commission heard the Assistant Commissioner of Police (Traffic East) representing the District Police Chief (Kochi City), as well as the deputy general manager (projects) and the traffic consultant representing KMRL.</p><p>In a report submitted pursuant to the Commission’s order dated August 13, the District Police Chief said that proactive measures had been taken to ease traffic congestion. The report noted that damaged roads had been repaired and barricades rearranged to ensure smooth traffic.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:11 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709078\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/kerala/shrc-seeks-joint-action-to-ease-metro-work-related-traffic-snarls/article71709078.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" d
