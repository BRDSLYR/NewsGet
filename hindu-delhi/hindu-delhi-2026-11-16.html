. “Russia is losing 25,000 soldiers in the month. So we'll be talking about that.”</p><p>Mr. Trump suggested he'll talk with the leaders about the war even after Trump administration officials on Friday (November 13, 2026) told reporters that Trump would discuss nuclear disarmament and the Iran war with his Chinese and Russian counterparts but steer clear of <a href=\"https://www.thehindu.com/topic/russia-ukraine-crisis/\" target=\"_blank\">Russia's war with Ukraine</a>.</p><p>Mr. Trump's departure comes after the often-omnipresent president had remained largely out of public sight for the past several days, even as a nationwide ground stop snarled air traffic and his Republican administration faced tough questions on its handling of the situation.</p><p>His trip to Asia, which begins in Manila and then continues to the Chinese tech hub of Shenzhen, gives Mr. Trump the opportunity to change the narrative from his domestic woes, including the air travel problems and fallout from the November midterm election, where his party lost both chambers of Congress.</p><p>The controversy over tech powerhouse and chipmaker Nvidia is also certain to hang over Mr. Trump's visit to China, despite efforts by administration officials to downplay the president's close ties to Jensen Huang, who resigned as CEO last week after admitting to an affair with an alleged Chinese government agent.</p><p>Beijing has said it was not involved. Trump had no plans to raise the issue with Mr. Xi when the two leaders meet, said US officials who briefed reporters anonymously about the president's Asia trip under ground rules set by the White House.</p><p>Mr. Huang accompanied Mr. Trump on Air Force One during the president's last trip to China in May, and he has been a sporadic presence around Trump at the White House while speaking to him frequently. Mr. Trump has argued that America needs to preserve its leadership on artificial intelligence, and warned of dire consequences if China wins that competition.</p><p>Scrutiny of the Trump administration's actions as they relate to Nvidia has been growing, including on the Commerce Department's delay in placing restrictions on Nvidia chip exports to a company led by the alleged Chinese spy with whom Huang had the affair.</p><p>Asked about the matter in an interview that aired Sunday (November 15, 2026) with <i>Fox News Channel </i>anchor Larry Kudlow, Treasury Secretary Scott Bessent said he will “leave the internal workings of the Commerce Department to the Commerce Department.</p><p>“I think what's more important here, Larry, is to examine whether Nvidia had a culture of compliance around the US export restrictions ... and at what level?” Mr. Bessent said.</p><p>He added: “I think we're going to see answers.”</p><p>“Jensen Huang is an incredible innovator, but that does not abrogate their duties of compliance,” Mr. Bessent said.</p><p>Regarding North Korea, Trump met with Kim on three occasions during his first term but has not been able to get him to meaningfully engage since his return to the White House. Trump has sought to set the groundwork for further talks with Mr. Kim. In August, he ordered the Pentagon to scale back joint military exercises with South Korea.</p><p>Among the travellers on the Asia trip with Trump will be Elon Musk, the head of SpaceX and Tesla, who is shaping up to be a top investigative target of the incoming Democratic majority in Congress.</p><p>In the Philippines, Mr. Trump will meet with Southeast Asian leaders who look to the United States for help countering Beijing's aggression in the region. He plans to sign a trade deal with Thailand while in Manila, the White House said.</p><p>Then he heads to China for the Asia-Pacific Economic Cooperation summit — and at the end of the trip, the first-ever three-way talks with China's Xi and Putin to discuss nuclear stockpiles.</p><p>Mr. Trump and U.S. officials have indicated that the meeting with Mr. Putin and Mr. Xi will focus on nuclear weapons and that topics of discussion would not include Russia's war in Ukraine, now in its fifth year. Still, the President has recently played up chances for a settlement to the conflict.</p><p>The three-way meeting will also put in the spotlight the ongoing U.S. war with Iran, a country which has often allied with China and Russia. The war has been widely blamed for the Republican Party's steep losses in the midterms, and while Trump has tried to play down the chances he will order a resumption of major strikes against Iran, he also has said he does not see the need for talks.</p><p>China's Foreign Ministry spokesperson Mao Ning said Monday (November 16, 2026) that the trilateral talks would be of “groundbreaking significance” and that China aimed to have in-depth exchanges about safeguarding world peace and promoting stability.</p><p>“Under the current circumstances, the three countries shoulder an important responsibility to work together in addressing global challenges,” she said in a regular briefing in Beijing.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 08:55 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708808\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/trumps-asia-trip-deals-in-manila-and-shenzhen-nuclear-summit-with-xi-and-putin-maybe-kim-meeting/article71708808.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype PAKISTAN-POLITICS-KHAN.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Former Pakistani Prime Minister Imran Khan. File.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708296\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>J<a href=\"https://www.thehindu.com/news/international/imran-khan-a-timeline-of-jailed-ex-pakistan-pms-legal-battles/article71372370.ece\" target=\"_self\">ailed former Pakistan Prime Minister Imran Khan </a>has warned that his deteriorating health could leave him at a point from which he may not \"return alive\", appealing to the country's top judges to ensure medical treatment for himself and his wife, Bushra Bibi.</p><p>In an open letter, made public on Monday (November 16, 2026), which was addressed to the chief justices of Pakistan’s Supreme Court, Federal Constitutional Court and Islamabad High Court, Khan sought implementation of earlier court orders concerning his medical treatment and prison conditions.</p><p>Khan's lawyer, Salman Safdar, shared the letter on social media platform X after meeting Khan at Adiala jail last week. During the November 11 meeting, Khan had directed Safdar to “carry his words to your lordships”.</p><p>“I have conveyed this letter faithfully and solely on these instructions. The words that follow are his [Khan’s],” the letter said, which also bore Safdar’s signature.</p><p>\"At 74, this unrelenting state is taking me to a place from which I may not return alive,\" Khan said in the letter.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/pakistan-govt-denying-rights-to-imran-khan-and-his-wife-his-party-unit-alleges/article71069538.ece\">\n\t\t\t\t\t\t\t\t\t\tPakistan govt. denying rights to Imran Khan and his wife; his party unit alleges</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/6v61ya/article71069588.ece/alternates/SQUARE_80/TH18-IMRAN-APPEGVCFJNH08.3.jpg.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAwEBAQEAAAAAAAAAAAADBgIFBwQBAAgBAAIDAQEAAAAAAAAAAAAAAAMEAAECBQb/2gAMAwEAAhADEAAAAEQ7AVci0vvaFq6Yj3GbrO/hfKGqCcJVM2763rb8368KjUr3NLXJUyfoMyeuSy6Hm4kKUieVnqDyNd8sU43d0pxcCHokqtp59LiMTvlI9jhuqu8I9RWynZMdYB0fcMygH0zmTHHMBMxj2zEGNJ+hWxHcSHMZdZLHwVznaVn9DDv/xAA3EAACAQMCBAMHAQYHAAAAAAABAgMABBEFIQYSMUETYXEHFCIyUYGhkRUjQlKxwRYkYpKi0fD/2gAIAQEAAT8ATh5j2x9qHDrY6iv8OMfpWrzW9hM1vGwklU4YgZCn6eZppLiWV1Mjcq7kAAGklkjdcMDtur75+9abpsepWiXMIPKSQVxupHUUNBdex/ShpMijGT/tptEVjllyfSo76xbpOtG+sRsZlq/1W1ttOuLhJBzJGSvr2/NaNwzqGuF5oIjIQdmJwM9cetWXs21SYFpIPCJBBYnrWoez6aGP4pkEgXYgbZrg3UPcNXuNOugUEq8wB7SLsR9x/SvebY7BiftXPG3yhz6KaWMv8sMp9IzUcjKdjUB8XcmtcJbR5ljxtysc/QGvZ/LFLpFqYRhRkHtk53pXIUApgYriQryMOZQ3L8udz9qu45n45tzbIA/MJCxGRy43JpLqaP5F/wCNJqN+rZj2PkKGpasc/vZAPIUKtmwfrS+FKvhTRc0T7OPqO9cOac9npa20LoDAxjbm3HUnJx9qs0uoFRGug3PGQRGDyq+OoyTtmn05ryzMoupWdlw6+EuzA7kv1/NQ20UWu3UigFki8IMPMgn7bUruOg/FQzzocqg/SmuLsqTkAelCrZ1Eoyaju4IjsATWg6jJJqPMv7vmjx5OV6Z+21S3Dm4iuIljl5AwMTHGduxqN5LaG4t3kRZZnYxpGc8pP0rV+KJdJ1O5htbeJ2bfxJCTy9e3eo+M9dkG0luPPwRVtxxq9vKPHitrhB8y8nISPIj/AKrR+INN1+2McTeDddGt5D8Xqv8AMPSrq+8PZetaBY3+u6j7vZxGVwpcjmAAUdTk1q2g3/D8EU93ZNyyHlVw4K5+m29WWq3EHEFrLJOwjGxGfhQnocVpt1FqSs55VnRsPkkYPY4zWt3kGjIDEU94kYgcox6n0FapP73qFzKjc6lwqsO4FQRLHlW6429akOJ8kdNjSB0nV43ZJEOVdTgqR3BrT9H1LX7/AN3061knfIBIHwr6noK4K4LtOFrNllkWe+mwl1Ky4CAjKhPLPfvXFFl4HAl/CzMptNSd1YksHGfhGSSQMNj7UMyTP5HH4r9t3lnhI7g7DADZzj6ZG+KvJBeWVqY7iWSaRC1yJHJw3NgLk/w4GcedCAxsq98gn/32orsG/wBQq4b/ADGP5jWCgjJ6kmvY/NG66hphYK+0/N67Y+2PzSpqFzcSWhAWNVVDI25Izk/2x617RntdL4ObT4wAZ5lG3dupP4pHWOLmzuWJGKbEjczL8Y/FR48XI77bUwUlvrn+1EDIXzB/NTtyyLL15aZudQB3BIPn2r2ZXs1pxpCkQ+GeJ0cZ7Ac39RVzeRQzrMpCu3zb7YxXGWvvruqYjbNrbFlQ/wAzdz+MCuUKi56DrXXr16moBgZHagQASxppMRSSee1S5Ea/XlzXD3Aup8QcE6jr9hKJDp03IbQRkvKoUMSpHUgHpjtXAOv6foGo3Mt/bu/OoVHRQSmDv+ue30riX2hafLb+Bpkcpkkzl2TkC59dzSSeC8kRBbB/UZpyshHKfgG9E/CfqagTDDL7b7npUp5fDGf4earg8tsidz1qX5h5AV7DbeeTgIeCY44xfzc7d2OF/tiv/8QAIREAAgICAQQDAAAAAAAAAAAAAAECEQMhEAQTMVESIkH/2gAIAQIBAT8AuQnSuR3oeyV3o+3oR1fhI14MLuPFpbZkiskLQlaoxxqKRRmm7+J01uOztq7K4y45SnpEIqMaR+8M/8QAIhEAAgIBAwUBAQAAAAAAAAAAAQIAEQMEEiEFEDFBURQy/9oACAEDAQE/AN+P6J/fCcz82SrqblHkzcn2ZFFXOhMSGA9TmrE6gtZfMAP0xdK+QTRYc2mzAk0PYhfjdcyqruWIhxL6mkwqFDjzNXW8V8m9qrvp8qpj5Mdi7Fj3Auf/2Q==\"/></div></div></div><p>Khan, the former cricketer-turned-politician and founder of the Pakistan Tehreek-e-Insaf party, has been incarcerated since 2023 and faces more than 100 cases, including corruption and charges related to inciting violence.</p><p>His wife, Bushra Bibi, was arrested on January 17, 2025, in a separate case in which the couple were sentenced.</p><p>Khan, in his letter, said his health had deteriorated due to prolonged solitary confinement and lack of access to medical care.</p><p>He alleged that since December 20, 2025, he had been kept in prolonged solitary confinement, isolated from the outside world for up to 22 hours a day, without access to family, lawyers, telephone calls to his sons, books or television.</p><p>He claimed that he had been allowed to meet his lawyers only four times during the year, while Bushra Bibi had been permitted just one meeting with her counsel.</p><p>He also alleged that prison authorities had repeatedly denied him weekly meetings with his wife and prevented his sons, Kasim and Sulaiman, from speaking to him despite court orders.</p><p>Khan said a jail medical board had recorded his anxiety and recommended more frequent contact with his wife and family, along with access to reading material and television. He alleged that these recommendations had not been implemented.</p><p>\"No one in the jail is permitted to respond to me or speak to me, not when I offer them <i>Salam </i>[Greetings], and not when I recite a verse of the Holy Quran. The purpose, I can only conclude, is to make me ill and to break my will,\" he wrote.</p><p>He also expressed concern over the health of his wife, alleging that she was suffering from deteriorating eyesight and needed further eye surgery.</p><p>Bushra Bibi suffered a retinal detachment in April and underwent surgery. Khan claimed that she was subsequently returned to solitary confinement and denied access to her doctors and medical records.</p><p>He said that when he met her on November 11, she could neither tolerate light nor open her eyes, warning that she risked permanent loss of vision without further surgery.</p><p>Khan said the Supreme Court had, on August 18, directed authorities to shift him to Shifa International Hospital in Islamabad within two days, constitute a medical board to examine him and to allow him to interact with his family.</p><p>The court had also ordered weekly meetings with his family and telephone contact with his sons twice a week.</p><p>He alleged that the order had not been implemented and that his medical condition had worsened since then.</p><p>Khan further claimed that his blood pressure had risen to 192 and 193 on November 10, alleging that doctors had warned him of the risk of brain haemorrhage and cardiac arrest.</p><p>He maintained that neither he nor his wife had sought medical relief as a litigation tactic and insisted that he continued to contest the cases on merit.</p><p>\"I do not ask Your Lordships for any favour. All I request as justice is the implementation of the orders of the Honourable Supreme Court and proper treatment for our medical conditions,\" Khan wrote.</p><p>The allegations in the letter could not be independently verified.</p><p>Concluding his appeal, Khan invoked his record of establishing hospitals and providing free medical care to the poor, saying he was now asking for treatment for himself and his wife.</p><p>\"I will only remain able to prove my innocence if I stay alive. I appeal to Your Lordships, on the most basic grounds of human compassion: give me justice before it is too late,\" he wrote.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 07:20 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708296\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/former-pakistan-pm-imran-khan-warns-he-may-not-return-alive-seeks-medical-treatment-for-himself-wife/article71708296.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu -->< ly in India, plans $10 bn global quantum push: CEO\" data-url=\"https://www.thehindu.com/business/ibm-investing-3-billion-annually-in-india-plans-10-bn-global-quantum-push-ceo/article71709347.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Chairman and Chief Executive Arvind Krishna said AI could displace 10-20% of jobs over the next decade, with the BPO industry likely to face some of the biggest reductions</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:29 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/8a68j4/article71709343.ece/alternates/LANDSCAPE_1200/20261116545L.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/8a68j4/article71709343.ece/alternates/LANDSCAPE_1200/20261116545L.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/8a68j4/article71709343.ece/alternates/LANDSCAPE_660/20261116545L.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/8a68j4/article71709343.ece/alternates/LANDSCAPE_320/20261116545L.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    IBM Chairman and CEO Arvind Krishna, along with senior IBM executives, calls on Delhi Lieutenant Governor Taranjit Singh Sandhu at Lok Niwas, in New Delhi.\n                                          | Photo Credit: X/@LokNiwasDelhi\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709347\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>the next five years, Chairman and Chief Executive Arvind Krishna said, underlining the technology major’s long-term commitment to the country even as he flagged significant disruption to employment from artificial intelligence.</p><p>AI could displace 10-20% of jobs over the next decade, with the business process outsourcing (BPO) industry likely to face some of the biggest reductions in employment, Mr. Krishna said, arguing that businesses and governments would need to prepare workers for changes in the nature of work.</p><p>“Whenever these happen, there is some level of displacement. I think we should face up to that,” he said during an interaction with journalists.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/Industry/ibm-to-end-us-visa-green-card-sponsorship-for-most-roles-in-its-consulting-arm/article71688291.ece\">\n\t\t\t\t\t\t\t\t\t\tIBM to end U.S. visa, green card sponsorship for most roles in its Consulting arm</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/ue5bgv/article71688323.ece/alternates/SQUARE_80/2026-10-21T201220Z_944618672_RC225JA7TL9X_RTRMADP_3_IBM-RESULTS.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAwADAQAAAAAAAAAAAAAEBgMFBwECCAABAAMBAQEBAAAAAAAAAAAAAAMEBQIBBgD/2gAMAwEAAhADEAAAACgLAWfQ3EtKaqM03jnjmoawGjZWzhioCpr4ZoRirmqUmM6L6CLptBU5IAnpTzz6IzoBMqO09G1n4zv0l1bCZ3TGwwEKjWdK4pBpDDSKclgYLeCEhefpPtVljC6iqnrcRw6BHXFsgz/dFDWA0M17CTx26UIrirJXhiS+9mtqK6782taKrZ1//8QAJRAAAgMBAAAFBQEBAAAAAAAABAUBAgMGABESExQHISIkJTUz/9oACAEBAAEFAGNY+W2yrdxbfDbDP/n4mYiJjLXwytFR7+5o0BIiTDY/ZYxEuiztAdlzDIzDxaPOrjp689Jf1ISmLFxWe5JhUUNX3tchh5Q6jPI6jYbcM8TEqQteyErv0QcGoyOWa5MLFXW7COs9cFsfss/9Uv5i4hE2aSt+o3SwP9PE81O1k3CyoQrBi9K4Lnvd2SKR1q37kMI83O3CVu57UjXDVw/U9DyvORy6ku22bukpgxVjE4y+foMI8fDyELYfd3rPo8d459pWAOTtxqrI8Zdz2JyfDpGUHrsz/lFc4vwmSvsYwv6XWTCvUgdMPNOTz6ZwLgN1zffcdyRUbpOsISZ3PJYMBeX3QcwTMyYx/wBjFu0Ssze6K6VNbOakjkRk6rp5eOkFyNG4Tksi+x7ZORflwydSNz5/saZ0v43y8ra+dNmGEzC86hQmV9SLcQ9GSPuq7FWz45Xbz2Ot/Y96PVt+eZX4ECzWY0WUrKOu0zG44uBzHRrv/8QAOBAAAgEDAgMFAwoHAQAAAAAAAQIDAAQREiETMUEFIlFhsXFyshAUMjNkdIGRocEkQkNEUlNzhP/aAAgBAQAGPwBdh9SvqaiB6W0HoKYxYcHwpdsbcvkyeVEkZqUopACmpJOhkJ/Wo0Y4yppOf1CHf2mkH2aH0FBLUFs4ytLhwJQO8hO4+Qiv4m1leL/NBmpuDJ32UgAjFDJ3zk0nDGy8yOlXWpmbD4GTnG5pD9mh9BR4BUsMbjfpVvPBM6SDukr+9CWa9kzpyTkYFWVrbdpRzTPcrHJvnbO9XMQRWcodOfGpUYKEG4K0w5Opwd6Ytuxq798+pr/yRfDWIrma3MoRQ8UpXbTjoaFl2wkjX9k4jd3P1iHdWz122rEBliadkjZhthc771bwWJd5mYYHn5UplkCvwxqBOCDipLaaZVUtjOedXUruGLKSdTZxVy6yjKk6Tmrv3z6mgPG2iH6VGkup7fUpDk4Gw8KhgsC+eHiWXRsuPOkhuoEMVsBG6SISeLjAI0yqSN+ekj8qtZrbs+NHuVPAMcb5OOf0pTj8cVdGNJC8bMjaVkyGHLk2mjfX1oyZywlYTjGeW6DHhR4dzMqsMP3zv7aWCCbWCdwTTiIth0Vzk53OaXB/tofSo1JUsg72kYBJ8BUlhBEzSIQ8sqkYRDzBFT8IK4mmE6qs67qMZJGsYOx2K5qxtH7PumBj0yuoJEWOWQI2znyzV4Z4pHt/nXclkiIDLkAkFoSPHqPdq9hSFS1vKsYCxqWz3Sf6Ibr4jzFTQae4vXFS3GBhRzo/8l9TWrAOm2iOD5Cn7Q7EVfnsABnsGbBzjPdar67mjjS5eIiRT0HQUlnb37raKpQQlEYKPAZUnrTW80lo4K7k2MAb8CEzSWRituFsC4gAkxnP0uZoLZW0cwmLGV5JZlIJGOaSLn8QaAtreK2eUJFw7cEAkADO5O55nzNWzTkAygAjzNHP+pP3qT7tH8NPedm3s1pKNIZo/wCYaRsRyI8jT9n9sxwwXDju3kYwH99OntH5USCCM4O+1BGOARgGlfwI3q1QY1SMKmJAK2qBx7TtQvFvmQ2g4gTHdbbGDU5lfUVwo9gzUv3aP4akJUHLrz9wVrURc98AE/rTbHnUdzEuWjOSB4UrKc9CKhbnwTyq9ub2BwJ0Cq4GQMVPaQzHjy4UJjlvmrn3v3NTfd4/hplJwQw+EUcjP61nfB8q0kZBFa7Y8Ns5IHI0xZdIUYOTzp5pwMAVw7SIhM9K/8QAIhEAAgEDBAIDAAAAAAAAAAAAAQIAAxESITFCcQQQUdHw/9oACAECAQE/AAdW/fEKkeqYsQb6dwtk5MXlPFrLmFaVmIJBE32lPxjUuRF5dRCC+sVFC4jaIbCwiBcTBy6+o9C7BlNrQSk4FNktvGbE2i8vakiMQTrP/8QAJREAAQMDAwMFAAAAAAAAAAAAAQACAxExcQQQEhMh0SIyQUJR/9oACAEDAQE/AH+1ufKBrs8mwCHZqks1SxOIqFGz8KtdGXj2Ulm5UrQIzxXI1qnipqtNAdRqGx/BT7Nz5TZvSWu2fGS9r62Win6L6mxvhSfXO9KoBf/Z\"/></div></div></div><p>The impact, however, would unfold over a decade rather than within a year, he said, adding that society needed to consider how to help workers adapt to the transition.</p><p>“If I was to tell you the part, I think the area that I would worry about a little is what is called classically the BPO industry. That is probably the place where you’re going to see the biggest impact of AI in reducing the total number of roles. It doesn’t go to zero, but there could be a significant reduction in those roles,” Mr. Krishna said.</p><p>IBM, meanwhile, continues to expand its workforce in India, having hired an estimated 5,000-10,000 people in the country over the past year, he said. The company is increasing recruitment in chip design, software development, testing, site reliability engineering and AI.</p><p>Nearly half of the code written at IBM is already being generated using AI, Mr. Krishna said, adding that the technology would change the nature of programming rather than eliminate the need for programmers. “Programmers will not be writing code. Programmers will be telling AI what to write,” he said, predicting that programmers would increasingly evolve into system engineers.</p><h4 class=\"sub_head\">India’s AI opportunity</h4><p>Mr. Krishna said India could play a much larger role in the global AI ecosystem, estimating that AI could add around $500 billion to the country’s gross domestic product by the end of the decade. However, he said the country needed to accelerate the adoption of AI across businesses and government rather than focus disproportionately on developing large language models.</p><p>Citing IBM research, he said more than 90% of Indian enterprises recognise AI’s potential, but over 75% have made little progress in adopting the technology.</p><p>The gap reflects challenges around data readiness, skills and the willingness of companies to redesign business processes, he said. Unlike earlier technologies, such as the internet and mobile phones, AI would deliver its full benefits only when integrated across entire business processes rather than deployed in isolated functions.</p><p>“If each of those 100 is doing something on a different stack in a different way, with a different way of organising data, how do you scale it at the end for an enterprise?” he said, referring to companies running multiple AI experiments without a common strategy.</p><p>Mr. Krishna said India’s achievements in biometric identification and digital payments demonstrated its ability to scale technology adoption. However, he urged the country to establish itself as a more significant supplier to global technology supply chains.</p><p>His advice to the government was to scale existing initiatives, particularly in semiconductors and AI deployment, before pursuing additional technology bets. “Let’s get some of these bets to scale before we take new ones,” he added.</p><p>India accounted for only a small share of global semiconductor production, he said, adding that the country needed to build its manufacturing ecosystem to a meaningful scale and become a credible supplier to international markets.</p><p>He also favoured a relatively light-touch approach to AI regulation, arguing that excessive government intervention could undermine innovation. Existing laws, he said, already addressed several potential harms associated with the technology.</p><h4 class=\"sub_head\">IBM’s India and quantum computing plans</h4><p>“We spend and invest about USD 3 billion a year, which is significant compared to what most other people do,” Mr. Krishna said, adding that a portion of IBM’s global quantum investment would also flow into India.</p><p>The company has expanded its presence in India through facilities at Kochi, GIFT City, Lucknow and Visakhapatnam, with operations spanning AI, government technology, software development and global delivery. India is also an important centre for developing products that IBM exports to global customers, including software, mainframe and data products, he said.</p><p>On quantum computing, he said IBM planned to invest about $10 billion globally over five years, with India expected to benefit from a portion of the spending. The company is working with the Andhra Pradesh government and private-sector partners, including Tata Consultancy Services, to establish a quantum computer in Amaravati, with installation expected in early 2027.</p><p>At least two other similar public-private partnerships were under discussion, he said, declining to identify the prospective partners.</p><p>Mr. Krishna said IBM expected quantum computing to generate significant revenues by 2028-29, as customers increasingly identify commercial and scientific applications for the technology.</p><p>Potential applications include materials science, financial services, complex optimisation problems and weather modelling. He also cited work by IBM’s India team with global space agencies on AI models that NASA is using to forecast climate patterns based on data collected over three decades.</p><h4 class=\"sub_head\">AI infrastructure and investment economics</h4><p>On the broader AI infrastructure boom, Mr. Krishna distinguished between companies building physical infrastructure, such as data centres and fibre networks, and those funding and operating AI models. While demand for computing infrastructure was unlikely to disappear, he questioned whether the enormous capital commitments being made by some foundation-model developers would generate adequate returns.</p><p>Mr. Krishna predicted that open models would account for 80% of all AI tokens before the end of the decade, potentially limiting the pricing power of a small number of large model providers. “If there’s an alternative which is much cheaper, then you’re capped on your price taking. That, I think, is the dilemma that is upon us,” he said.</p><p>He also criticised technology companies for failing to adequately engage local communities over data centre construction, particularly on electricity requirements, tax concessions and the wider economic benefits. Companies need to demonstrate that such projects create jobs, strengthen local infrastructure and deliver tangible benefits to surrounding communities, he said.</p><p>On the possibility of an AI-driven stock market correction, Mr. Krishna said a correction of around 20% was possible, but he did not expect a substantially larger decline. He argued that technology spending would continue to grow as a share of corporate revenues, supporting long-term expansion in the sector.</p><h4 class=\"sub_head\">Technology companies must reinvent themselves</h4><p>Mr. Krishna warned businesses against becoming overly attached to existing products and business models as technological change accelerates, drawing parallels with companies such as Nokia and Kodak. Businesses often fail not because demand for their products disappears, but because those products become commoditised, eroding pricing power and margins, he said.</p><p>“You’ve got to be able to move your innovation and your business model to where there is more margin possible. And that’s only possible in new areas than old areas,” he said.</p><p>On immigration, Mr. Krishna said restrictions on cross-border movement of skilled workers were becoming a global trend, extending beyond the United States to Europe and parts of Asia.</p><p>IBM would increasingly prioritise employing skilled workers in countries where they live rather than moving employees across borders through company-sponsored visas, he said.</p><p>On India-U.S. technology ties, he said he did not foresee significant restrictions on technology exports to India, apart from established controls on defence-related technologies.</p><p>He also called for educational institutions to place greater emphasis on critical thinking, arguing that technical qualifications alone would not determine success in an AI-driven economy. While engineering and technical expertise would remain essential for complex technology roles, humanities education offered valuable training in analytical reasoning and evaluating competing perspectives.</p><p>“The people who will do the best in the vast majority of companies are those who are the best critical thinkers,” he said.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:29 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709347\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/ibm-investing-3-billion-annually-in-india-plans-10-bn-global-quantum-push-ceo/article71709347.ece\"></span></button><div class=\ class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 19, "title": "Lakshmi Venu seeks partition of assets of Venu Srinivasan branch of TVS family", "section": "Business", "page": "", "teaser": "With Lakshmi Venu’s notice to her father Venu Srinivasan, it is now clear the differences over the division of property have not been resolved amicably and will most likely be fought in the courts", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/business/\">\n                        Business\n                    </a><meta content=\"Business\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/business/Industry/\">\n                        Industry\n                    </a><meta content=\"Industry\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71707438\" data-title=\"Lakshmi Venu seeks partition of assets of Venu Srinivasan branch of TVS family\" data-url=\"https://www.thehindu.com/business/Industry/lakshmi-venu-seeks-formal-partition-of-assets-of-the-venu-srinivasan-branch-of-the-tvs-family/article71707438.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">With Lakshmi Venu’s notice to her father Venu Srinivasan, it is now clear the differences over the division of property have not been resolved amicably and will most likely be fought in the courts</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 10:07 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/kunal-shankar-3019/\">Kunal Shankar</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/guswjv/article71707447.ece/alternates/LANDSCAPE_1200/Untitled%20design%205.png\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/guswjv/article71707447.ece/alternates/LANDSCAPE_1200/Untitled%20design%205.png\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/guswjv/article71707447.ece/alternates/LANDSCAPE_660/Untitled%20design%205.png\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/guswjv/article71707447.ece/alternates/LANDSCAPE_320/Untitled%20design%205.png\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Lakshmi Venu, daughter of TVS Holdings chairman Venu Srinivasan. File\n                                          | Photo Credit: PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71707438\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Lakshmi Venu, the daughter of TVS Holdings chairman Venu Srinivasan, has sought formal partition of assets of the Venu Srinivasan branch of the TVS family by issuing a legal notice to her father.</p><p>The Venu Srinivasan branch controls TVS Motor Company, India’s third largest two-wheeler manufacturer by market share worth over $20 billion. It is currently headed by Ms. Lakshmi Venu’s younger brother Sudarshan Venu, who is the CMD of TVS Motor Company, and was named the Significant Beneficial Owner in April 2025, signalling that he would inherit the larger chunk of the businesses under TVS Holdings. A senior executive privy to the family dispute, but who did not wish to be named had told <i>The Hindu </i>attempts to seek clarity by Ms. Lakshmi Venu on the April 2025 SBO disclosure had been met with “silence”.</p><p><i><a href=\"https://www.thehindu.com/business/ownership-issues-cloud-tvs-venu-srinivasan-family/article71565380.ece\" target=\"_self\">The Hindu</a></i><a href=\"https://www.thehindu.com/business/ownership-issues-cloud-tvs-venu-srinivasan-family/article71565380.ece\" target=\"_self\"> had reported</a> on the differences that had appeared over the division of assets in October, when it was still unclear whether the matter would reach the courts. With the filing of a caveat in the Madras High Court by Mr. Srinivasan, followed by the notice issued by Ms. Lakshmi Venu to her father, it is now clear that the differences over the division of property have not been resolved amicably and will most likely be fought in the courts.</p><p>In her statement to the media, Ms. Lakshmi Venu has cited the Hindu Succession Act 1956, which was amended in 2005 to include Section 6, enabling women to be equal inheritors of family property.</p><p>Ms. Lakshmi Venu has said she “is being wrongfully denied her rightful share of the joint family property”. The statement goes on to state, “Patriarchy has no place in law or in a progressive India. The rights of daughters to joint family property, she maintains, cannot be overridden through unilateral decisions or corporate arrangements,” citing the April 2025 decision to include her brother Mr. Sudarshan Venu as Significant Beneficial Owner of TVS Motor Company.</p><p>Ms. Venu has sought the partition of of asets that include the the VS Trust, whose trustee is Venu Srinivasan, and through which TVS Holdings owns 50.26% of TVS Motor Company. Ms. Venu has effectivdly sought the partition of assets allotted to the Venu Srinivasan branch of the family under the 2020 TVS family arrangement, including interests in TVS Holdings, TVS Motor Company, TVS Credit Services and Sundaram-Clayton.</p><p>Dr. Lakshmi maintains that the larger TVS family arrangement did not constitute a partition within the Venu Srinivasan family. No settlement or partition of the assets within her immediate family was ever initiated, let alone concluded. In her view, management does not confer exclusive ownership or extinguish lawful rights of other family members.</p><p>Crucially, this statement has the endorsement of Ms. Lakshmi Venu’s mother Mallika Srinivasan. The statement reads: “Mrs. Mallika Srinivasan, supporting Ms. Venu’s legitimate right in the family assets, said, ‘It is unfortunate that requests for an amicable settlement have not so far progressed in a meaningful and timely way. As a mother, to me, a son and daughter are equal in every respect. I do believe that Lakshmi has a legitimate share of the family assets, not inequal to that of Sudarshan’s. I reiterate that this is a matter to be settled, in the interests of all stakeholders, through transparent dialogue, with equity, clarity and amity. I sincerely hope that we can move forward constructively, with grace and dignity.’”</p><p>Shares of TVS Motor Company closed at ₹4,453 apiece on the NSE signalling no material impact on account of the legal notice so far.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 03:28 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71707438\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/lakshmi-venu-seeks-formal-partition-of-assets-of-the-venu-srinivasan-branch-of-the-tvs-family/article71707438.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /2239 s://www.thehindu.com/tag/692-684/\">\n                        business (general)\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/supreme-court/\">\n                        court\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 20, "title": "Asgard Alcobev expanding northeast brewing unit capacity to 10.8 million cases", "section": "Business", "page": "", "teaser": "", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/business/\">\n                        Business\n                    </a><meta content=\"Business\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709123\" data-title=\"Asgard Alcobev expanding northeast brewing unit capacity to 10.8 million cases\" data-url=\"https://www.thehindu.com/business/asgard-alcobev-expanding-northeast-brewing-unit-capacity-to-108-million-cases/article71709123.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:56 pm IST - MUMBAI</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/lalatendu-mishra-435/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/lalatendu-mishra-435/\">Lalatendu Mishra</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709123\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p> </p><p>With growing demand for beer across the country Asgard Alcobev Ltd., formerly Banganga Paper Industries Ltd., is expanding brewing capacity from 8.4 million to 10.8 million cases at its manufacturing facility at Byrnihat, Meghalaya, at an estimated investment of about ₹30 crore.</p><p>The facility owned and operated by CMJ Breweries, in which the company has 78.90% stake, currently has an installed annual capacity of 8.4 million cases. </p><p>The company is now undertaking an expansion that is expected to increase annual capacity to 10.8 million cases by March 2027, representing an increase of 29%.</p><p>Over the longer term, Asgard has outlined plans to expand its manufacturing footprint to four facilities with a combined annual capacity of 48 million cases.</p><p>Potential markets identified for future expansion include Karnataka, Maharashtra, Rajasthan and Uttar Pradesh, the company said.  These plans reflect management’s ambition to transform Asgard from a regional brewing specialist into a larger contract manufacturing platform serving multiple Indian markets, the company said.</p><p>Actual expansion will depend on demand, investment requirements and regulatory approvals, it added.</p><p>Alongside contract manufacturing Asgard Alcobev is building a portfolio of seven owned beer labels, including Shimla, Magpie, The Himalayan Monkey, Nutcracker 9000, Sayawm, Savage and Red Indian.</p><p>The products span lager, India Pale Ale and strong beer categories, providing exposure to different consumer preferences.</p><p>While contract manufacturing provides the foundation of the business, owned brands offer an additional avenue for revenue growth and potentially stronger margins, it said.  The company’s strategy is to focus initially on Northeast India, leveraging its established manufacturing infrastructure and regional understanding before pursuing broader distribution opportunities.</p><p>With manufacturing relationships involving Carlsberg India, United Breweries, Mohan Meakin Ltd, Yuksom Breweries Ltd and Sona Beverages Private Ltd, Asgard Alcobev is seeking to build a scalable business around contract manufacturing, capacity expansion and its own portfolio of beer brands, it said. </p><p>Its manufacturing portfolio includes beer brands such as Kingfisher, Carlsberg, Tuborg, Golden Eagle, Asia 72, Heman 9000 and Simba.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:48 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709123\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/asgard-alcobev-expanding-northeast-brewing-unit-capacity-to-108-million-cases/article71709123.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu -->< iv><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The DICVS business reported revenue of approximately ₹2,400 crore in FY26, accounting for nearly 60% of Pricol’s consolidated revenue.</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:54 pm IST - COIMBATORE:</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/m-soundariya-preetha-4013/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/m-soundariya-preetha-4013/\">M. Soundariya Preetha</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/ijvgw0/article71709050.ece/alternates/LANDSCAPE_1200/Pricol.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/ijvgw0/article71709050.ece/alternates/LANDSCAPE_1200/Pricol.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/ijvgw0/article71709050.ece/alternates/LANDSCAPE_660/Pricol.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/ijvgw0/article71709050.ece/alternates/LANDSCAPE_320/Pricol.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Pricol board approved the execution of a share purchase agreement with Topaz Terrace Investments, an affiliate of Warburg Pincus LLC.\n                                          | Photo Credit: The Hindu\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708941\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Coimbatore-based automotive technology and precision components company, Pricol Limited, which is expected to demerge completely within a year its Driver Information &amp; Connected Vehicle Solutions (DICVS) business into Pricol Autotech, will focus on Actuation, Control &amp; Fluid Management Systems (ACFMS) and Precision Products (polymer) divisions.</p><p>Pricol’s Board of Directors approved a scheme on July 27 this year to demerge the DICVS business into Pricol Autotech, leaving Pricol Limited to focus on its Actuation, Control &amp; Fluid Management Systems (ACFMS) and Precision Products (polymer) divisions.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/cities/Coimbatore/topaz-terrace-investments-to-acquire-3851-stake-in-pricol-autotech/article71702271.ece\">\n\t\t\t\t\t\t\t\t\t\tTopaz Terrace Investments to acquire 38.51 % stake in Pricol Autotech</a></div><div class=\"picture\"></div></div></div><p>As part of the restructuring, the board on November 13 approved the execution of a share purchase agreement with Topaz Terrace Investments, an affiliate of Warburg Pincus LLC, under which the promoter group will sell its 38.51% stake in Pricol Autotech.</p><p>The DICVS business reported revenue of approximately ₹2,400 crore in FY26, accounting for nearly 60% of Pricol’s consolidated revenue.</p><p>Vikram Mohan, Chairman and Managing Director of Pricol Limited, told The Hindu on Monday that of the 16 plants that the company has, 11 will continue to be with Pricol for its two divisions. Nearly 50 % of its current total workforce of 12,000 will also continue with Pricol Limited and its subsidiary Pricol Precision Products when the demerger is completed. Part of the proceeds from the sale of shares in the DICVS business will be ploughed back into Pricol Limited and Pricol Precision Products and already development of five new plants is in process for these two divisions, he said.</p><p>Pricol’s shares, however, came under sharp selling pressure on Monday, plunging 17.9% to close at ₹613.75.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:28 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708941\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/pricol-targets-top-three-position-in-two-wheeler-polymer-segment-by-2030-after-dicvs-demerger/article71708941.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu tial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Moderating momentum in global AI stocks, coupled with improving earnings prospects, particularly among large-cap companies, appears to have revived foreign investor interests.</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:52 pm IST - MUMBAI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/gowri-lakshmi-30949/\">Gowri Lakshmi</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/ns8f5t/article71708526.ece/alternates/LANDSCAPE_1200/iStock-1289580676.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/ns8f5t/article71708526.ece/alternates/LANDSCAPE_1200/iStock-1289580676.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/ns8f5t/article71708526.ece/alternates/LANDSCAPE_660/iStock-1289580676.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/ns8f5t/article71708526.ece/alternates/LANDSCAPE_320/iStock-1289580676.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    For illustration\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708488\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Foreign portfolio investors (FPIs) have staged a dramatic comeback in Indian equities, recording a net investment of ₹89,856 crore in November so far, their highest-ever monthly inflow, reversing months of aggressive selling.</p><p>According to the latest National Securities Depository Ltd (NSDL) data, FPIs have invested ₹89,856 crore in Indian equities in the first two weeks of November, against net outflows of ₹34,843 crore in October and ₹35,861 crore in September.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/Industry/early-november-trend-indicates-return-of-fpis-into-indian-equities/article71681716.ece\">\n\t\t\t\t\t\t\t\t\t\tEarly November trend indicates return of FPIs into Indian equities</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/gn44kf/article71681818.ece/alternates/SQUARE_80/2025-03-19T073426Z_2098456575_RC2UADAB02MK_RTRMADP_3_INDIA-MARKETS-FOREIGN-INVESTORS.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMj to have revived foreign investor interest.</p><p>The improved sentiment has also lifted benchmark indices. The Nifty 50 has narrowed its year-to-date losses to 3.3%, from around 13% in October.</p><h4 class=\"sub_head\">Domestic investors turn sellers</h4><p>In a reversal of the recent trend, domestic institutional investors (DIIs) have turned net sellers in November, offloading equities worth ₹52,607 crore so far. Profit-booking gathered pace after the Nifty reclaimed the psychologically important 25,000 mark earlier this month.</p><p>“This should be viewed as tactical profit booking rather than a reversal in the broader domestic investment trend,” said Pabitro Mukherjee, deputy vice-president, research, Bajaj Broking.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/Industry/stock-markets-end-higher-on-foreign-fund-inflows-lower-crude-oil-sensex-up-512-points/article71707675.ece\">\n\t\t\t\t\t\t\t\t\t\tStock markets end higher on foreign fund inflows, lower crude oil; Sensex up 512 points</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/m8fxel/article71707716.ece/alternates/SQUARE_80/VIX-stays-elevaG1HGOO9RQ.3.jpg.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAABBQEBAAAAAAAAAAAAAAAEAgMFBgcBAAEAAgMBAAAAAAAAAAAAAAAAAQUCAwQA/9oADAMBAAIQAxAAAACZvFQ5w0hAhOijyVIsCU9RMeR1J6vkR6EbGfiI5vjIzVVRfToTdRmt+aRTH8tjjlcs1cRv7MgxGpUJwnx4XxIYt7wxgdQrnn+h5HhskK8wROKF7ppKs1eZjDSfZm7j0Y9qWY7fncRzUYzcpmfQjhJEvV3ZR1ftdIrP/8QAQhAAAgEDAgMEBAkICwAAAAAAAQIDAAQRBSEGEjETQVFxFCJhkRUWIyQygZOh0Qc0UlWSscHSM             </a><meta content=\"Industry\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708776\" data-title=\"MCL fixes IPO price band at ₹129-136; Coal India to raise ₹9,000 cr.\" data-url=\"https://www.thehindu.com/business/Industry/mcl-fixes-ipo-price-band-at-129-136-coal-india-to-raise-9000-cr/article71708776.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The proposed listing is part of the government’s broader strategy to unlock value in Coal India’s subsidiaries through public listings and widen investor participation in the country’s coal sector</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:28 pm IST - NEW DELHI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/business/i159uo/article71708988.ece/alternates/LANDSCAPE_1200/MCL.png\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/business/i159uo/article71708988.ece/alternates/LANDSCAPE_1200/MCL.png\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/business/i159uo/article71708988.ece/alternates/LANDSCAPE_660/MCL.png\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/business/i159uo/article71708988.ece/alternates/LANDSCAPE_320/MCL.png\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Another major step in the government’s plan to list all Coal India subsidiaries by 2030\n                                          | Photo Credit: Special Arrangement\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708776\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Coal India subsidiary Mahanadi Coalfields Ltd (MCL) on Monday fixed a price band of ₹129-136 per equity share for its approximately ₹9,000-crore initial public offering (IPO), marking another major step in the government’s plan to list all Coal India subsidiaries by 2030.</p><p>The IPO, entirely an offer for sale (OFS), will see Coal India offload around 66.2 crore equity shares, representing a 10% stake in its Sambalpur-headquartered subsidiary. The bidding window will open on November 19 and close on November 23.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/markets/mahanadi-coalfields-files-rhp-for-proposed-ipo-worth-nearly-9500-crore/article71702765.ece\">\n\t\t\t\t\t\t\t\t\t\tMahanadi Coalfields files RHP for proposed IPO worth nearly ₹9,500 crore</a></div><div class=\"picture\"></div></div></div><p>MCL produced 218.31 million tonnes (MT) of coal in FY26. It accounts for approximately 21% of India’s domestic coal production. The company operates 17 mines, including 14 opencast and three underground mines.</p><p>MCL reported a net profit of ₹4,880.66 crore during the six months ended September 30, while revenue stood at ₹16,093.04 crore.</p><p>The proposed listing is part of the government’s broader strategy to unlock value in Coal India’s subsidiaries through public listings and widen investor participation in the country’s coal sector.</p><p>South Eastern Coalfields Ltd (SECL) and NLC India’s renewable energy arm, NLC India Renewables Ltd (NIRL), are also expected to make their stock market debuts during the current fiscal.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:12 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708776\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/mcl-fixes-ipo-price-band-at-129-136-coal-india-to-raise-9000-cr/article71708776.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\" nt-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 24, "title": "Jimmy Tata backs Tata Sons listing, accuses Noel of ‘back-door takeover’", "section": "Business", "page": "", "teaser": "He urged the RBI to enforce strict listing timelines and prevent any breakup of the group, while calling on the government and Charity Commissioner to safeguard the trusts’ founding objectives.", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/business/\">\n                        Business\n                    </a><meta content=\"Business\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/business/Industry/\">\n                        Industry\n                    </a><meta content=\"Industry\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708314\" data-title=\"Jimmy Tata backs Tata Sons listing, accuses Noel of ‘back-door takeover’\" data-url=\"https://www.thehindu.com/business/Industry/jimmy-tata-backs-tata-sons-listing-accuses-noel-of-back-door-takeover/article71708314.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">He urged the RBI to enforce strict listing timelines and prevent any breakup of the group, while calling on the government and Charity Commissioner to safeguard the trusts’ founding objectives.</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 07:48 pm IST </span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/lalatendu-mishra-435/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/lalatendu-mishra-435/\">Lalatendu Mishra</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/23gc6i/article71708356.ece/alternates/LANDSCAPE_1200/ANI-20261116041221.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/23gc6i/article71708356.ece/alternates/LANDSCAPE_1200/ANI-20261116041221.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/23gc6i/article71708356.ece/alternates/LANDSCAPE_660/ANI-20261116041221.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/23gc6i/article71708356.ece/alternates/LANDSCAPE_320/ANI-20261116041221.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708314\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Amid an intensifying power struggle within the Tata Group, Jimmy Naval Tata, 85, younger brother of late Ratan Tata, has thrown his weight behind the listing of Tata Sons, accusing Tata Trusts Chairman Noel Tata of attempting a “back-door takeover” of the holding company by inducting family members into key trusts.</p><p>In a strongly worded communication responding to queries from a Tata stalwart, believed to be Tata Trusts trustee Vijay Singh, Mr. Jimmy Tata alleged that the composition of the trusts was being altered to consolidate family control over Tata Sons.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/why-to-tinker-with-something-that-has-delivered-value-for-150-years-noel-tata/article71702445.ece\">\n\t\t\t\t\t\t\t\t\t\tWhy to tinker with something that has delivered value for 150 years: Noel Tata</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-var ited the successful public listing of TCS under Ratan Tata as evidence of its benefits.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/tata-sons-rejects-noels-request-for-audio-video-recording-of-september-17-boardmeet/article71698410.ece\">\n\t\t\t\t\t\t\t\t\t\tTata Sons rejects Noel's request for audio-video recording of September 17 boardmeet</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/jfswkn/article68744956.ece/alternates/SQUARE_80/PTI10_11_2024_000143B.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAABBQEBAAAAAAAAAAAAAAAGAgMEBQcBAAEAAgMBAAAAAAAAAAAAAAAAAwQAAQIF/9oADAMBAAIQAxAAAABS1OMKIf4QCMK8IgwDFq3MS0pCRORUcc85vPFdiBNAC7kVU6GvezfQ3uY4l30ptfF6r2anmRZJowKaAYmH3GqUmN0fFCywJ8zVgOHDmxZPCGueHIGUciruaSWV6Lk+r1i74rvA7UAAN6ZgefJ0CpdUBIF1RMgl6dlm26x//8QANhAAAgEDAgQDBAkEAwAAAAAAAQIDAAQRBRIGITFRIkFhE0JxsQcUFTKBkaHB0RAj4fBDwvH/2gAIAQEAAT8AVaCUEq3tJbl9sa5wMknkAO5NXUotZduxpF5eNByqG4hncxqcOBnaepHcdxRSilFKMdKtBaC1pdm22LZIoSRN0mBlup/auJoLaxtgwUpE7DdnnV1qdi3EtjFZldmWj5HOQQenbnRTNGOjHRjoLypVoCo5NWhctpckaFiBIzgHC5/yf0rVLG+1C81A3GtZjhkYCNj4jGDjkOnUdRVk8K63aTYVI4plCrnBclgM/lWPKttbKKUBQFYrU0LWJYTGJY2WRjnkQDnB9Kvrf7MM0zq6Wsp3OSy/3WI5Yxzxzq2jjmgvbuc4gto2EZPvSEYVR864e4vvrMRwagGubZQFEn/Io/7fjVpdwXsCz20qyxN0ZT+h7H0/oRQFAUeVcXarPc6lcW6yE28DbEjB5Fh1J78/lV9w5ZXum6RFpDxyK1sCZ2PJsAF2cnpjxZ7YArW3jVo9NtGItIvHk8i2fePqev4ireMLDnv0qz1K60W6+s2rED34z92QdiP38qs7qO9s4bmE5jlQOvwI/oBXStY1FNK0yW5YjcBtjU+856D/AHtVzO89wzyMzOz7mJ8yeea4XeC24BvZZ2DSTXTwxIwyEXYu9h2xnr607q0klxIfvknn5AfwKSYtCJX8KkZAPbyq9vnlchW+GOg/mv  Singh as examples.</p><p>Contrasting the present leadership with the group’s earlier tradition of appointing independent trustees and nurturing professional talent, Mr. Jimmy Tata named Nani Palkhivala, Gautam Sarabhai, Homi Sethna and Homi Bhabha among past trustees, and Sumant Moolgaokar, Darbari Seth, Xerxes Desai and Rusi Mody among its celebrated executives.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 07:18 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708314\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/jimmy-tata-backs-tata-sons-listing-accuses-noel-of-back-door-takeover/article71708314.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publ
