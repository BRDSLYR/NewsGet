 DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 8, "title": "Child rights panel registers suo motu case over boy’s death after fall from houseboat", "section": "National", "page": "", "teaser": "The Commission initiated the proceedings based on media reports of the incident on October 12, 2026. The boy’s family has alleged that negligence on the part of the houseboat operators led to the accident.", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/kerala/\">\n                        Keralam\n                    </a><meta content=\"Keralam\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708220\" data-title=\"Child rights panel registers suo motu case over boy’s death after fall from houseboat\" data-url=\"https://www.thehindu.com/news/national/kerala/child-rights-panel-registers-suo-motu-case-over-boys-death-in-houseboat-accident/article71708220.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Commission initiated the proceedings based on media reports of the incident on October 12, 2026. The boy’s family has alleged that negligence on the part of the houseboat operators led to the accident.</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 11:07 pm IST - KOZHIKODE</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708220\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Amid allegations of official apathy and failure to rein in unauthorised houseboat operations at Akalapuzha, a backwater tourism destination near Koyilandy in Kozhikode district, the Kerala State Commission for Protection of Child Rights has registered a suo motu case in connection with the death of a five-year-old child who fell overboard from a houseboat during a family outing last month.</p><p>The Commission initiated the proceedings based on media reports of the incident on October 12, 2026. The boy’s family has alleged that negligence on the part of the houseboat operators led to the accident. They claimed that the boat lacked basic safety arrangements, including life jackets, and that the authorities had failed to act despite complaints against the vessel, which was allegedly operating without a licence.</p><p>The Commission has sought reports from the Kozhikode District Collector, District Police Chief (Kozhikode Rural), Local Self-Government department Deputy Director, and the District Tourism Promotion Council Secretary.</p><p>Earlier, following the incident, the Kerala State Human Rights Commission (SHRC) had also directed the authorities to take stringent action against houseboats operating illegally in Akalapuzha in Thikkodi grama panchayat and submit a report.</p><p>The SHRC intervened following reports that more than half of the nearly 40 houseboats operating along the Akalapuzha stretch lacked valid fitness and pollution certificates, registration documents, or operational licences from the Port and other relevant departments. Many boats reportedly operated with more passengers than permitted, while adequate facilities for rescue operations in the event of an accident were lacking in the area.</p><p>Acting on a petition alleging that the authorities had remained silent despite complaints about houseboats operating in Akalapuzha without adequate safety measures, the commission directed officials to conduct a joint inspection and take stringent legal action against boats operating in violation of rules.</p><p>The SHRC is expected to consider the case again at a sitting scheduled to be held at the Government Guest House in Kozhikode on November 25.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 07:14 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708220\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/kerala/child-rights-panel-registers-suo-motu-case-over-boys-death-in-houseboat-accident/article71708220.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu - -12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 9, "title": "CAG focuses on technology, reforms to strengthen public accountability", "section": "National", "page": "", "teaser": "Reforms in the last couple of years, including breaking departmental silos; auditing themes, including ‘Ease of Living’ and ‘Ease of Doing Business’; and focusing on local bodies, were aligned with the nation’s development goals, says K. Sanjay Murthy", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708509\" data-title=\"CAG focuses on technology, reforms to strengthen public accountability\" data-url=\"https://www.thehindu.com/news/national/cag-focuses-on-technology-reforms-to-strengthen-public-accountability/article71708509.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Reforms in the last couple of years, including breaking departmental silos; auditing themes, including ‘Ease of Living’ and ‘Ease of Doing Business’; and focusing on local bodies, were aligned with the nation’s development goals, says K. Sanjay Murthy</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 11:04 pm IST - NEW DELHI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/fybr52/article71709309.ece/alternates/LANDSCAPE_1200/PTI11_16_2025_000073B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/fybr52/article71709309.ece/alternates/LANDSCAPE_1200/PTI11_16_2025_000073B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/fybr52/article71709309.ece/alternates/LANDSCAPE_660/PTI11_16_2025_000073B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/fybr52/article71709309.ece/alternates/LANDSCAPE_320/PTI11_16_2025_000073B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Comptroller and Auditor General (CAG) K. Sanjay Murthy said the CAG’s role extended beyond safeguarding public money to earning people’s trust. File\n                                          | Photo Credit: PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708509\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Comptroller and Auditor General (CAG) of India K. Sanjay Murthy has called for greater use of technology while ensuring that the institution remains firmly rooted in its constitutional mandate to strengthen public accountability and contribute to the country’s development.</p><p>Addressing the ‘Audit Divas’ celebrations marking 166 years of the institution, Mr. Murthy said the CAG’s role extended beyond safeguarding public money to earning people’s trust. He said the reforms undertaken in recent years, including breaking departmental silos, focusing on themes such as ‘Ease of Living’ and ‘Ease of Doing Business’, and expanding audits of local bodies, were aligned with the country’s development goals.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\" le improvements at the grassroots level.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/Industry/cag-widens-purview-of-power-sector-audit-starting-with-discoms-consumer-satisfaction-in-focus/article71694907.ece\">\n\t\t\t\t\t\t\t\t\t\tCAG widens purview of power sector audit, starting with DISCOMs; consumer satisfaction in focus</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/vn4rys/article71695053.ece/alternates/SQUARE_80/CAG%20INDIA%20DELHI%202025%20INDEX_06_05_5.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAwEBAQAAAAAAAAAAAAAFBgMEBwIAAQEAAQUBAQAAAAAAAAAAAAAAAwABAgQFBgf/2gAMAwEAAhADEAAAAHgGfG6lLKVR8as0qLoTX1p0o7MQIkWOFeupzQG3nPP9DroQaVQ6h+NOt0mlboB1W77DcptZxXRVqjsjW4BelWfVkKKg0HIEqMROWTr0rDq3w0Hn/T23bKdNaVmDOlaIrPX05EE/KjW2QaBcEzAMYkGTxeqnvssZZiwmuQOvFYvAL//EADYQAAIBAwIFAQUGBQUAAAAAAAECAwAEERIhBRMiMUFRBhQyUmEQQnGBkaFictHh8BYjscHx/9oACAEBAAE/AcVecHtLyB4mjCam1FkG+a4nw224bCFVizI+rV27+taXuWZ8Z15Jx4NcM9n5Ly2gmdmRZGOcfdA/w1/p+x5WjRvq1av+qiRI0VAOlRgU9ysZVAMZ7GhcHXjPbxUr62zTHTj6nFSXAibJOFJx+dcY4bLPxELbnWbrfl+mP+K4XwCGHhwZuYVuAGZT43yKRAi6VAA9BWPskuCbI5XmZU4ZR3P4UbhViaSRWIlAzp7Z9KM2iLJXpABz9Kfo17Y0j9aVdU0QZcjXq3/hGasdLW7acFgxB+lRq62d3PYSrdTPKSAx6Rv8NQcYtnkEF2jWNx8s3wH8Gp1ZFzpz6Y800idS6wGGxz4zRdrXlx8nLRtsS2QP71Nd64AsmME5IPrUl+S41/Fj8Kvp1tLZ52Lso223Jq8vZ2nR4sxMBr0lviFWXG7eGJbJIZdSn4m21Z7mkgS39nOWk62uuPPOP3Wbz+9S25uHt7eWBLi1MR5ksm51eP1qGWKyhMnD7tki7+6XG/6VxG9eYaeVyCR1ZOQzeN6NySgymGHfqyam/wByUPGN2J2HrQ5anrzK3k5wKvnK22y6m7hdtz+dPJO8szSZZs4Jx6VFLc2k1teCMskhwnNGxIHcVc8b5tmYb6OJlIBZQD  mind’ if he was reinstated, while adding that there’s a ‘big group of people that would like him to return’</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 11:19 pm IST - Washington</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/2mpu4a/article71709271.ece/alternates/LANDSCAPE_1200/2026-11-16T162329Z_2005700223_RC27ZNAB2UCN_RTRMADP_3_USA-TRUMP-NVIDIA.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/2mpu4a/article71709271.ece/alternates/LANDSCAPE_1200/2026-11-16T162329Z_2005700223_RC27ZNAB2UCN_RTRMADP_3_USA-TRUMP-NVIDIA.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/2mpu4a/article71709271.ece/alternates/LANDSCAPE_660/2026-11-16T162329Z_2005700223_RC27ZNAB2UCN_RTRMADP_3_USA-TRUMP-NVIDIA.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/2mpu4a/article71709271.ece/alternates/LANDSCAPE_320/2026-11-16T162329Z_2005700223_RC27ZNAB2UCN_RTRMADP_3_USA-TRUMP-NVIDIA.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    U.S. President Donald Trump stands with NVIDIA CEO Jensen Huang. File\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709259\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p><a href=\"https://www.thehindu.com/sci-tech/technology/jensen-huang-ai-rainmaker-meets-his-waterloo/article71702817.ece\" target=\"_self\">Jensen Huang</a> is reportedly trying to make a comeback as CEO of Nvidia as a campaign to reinstate him picked up steam Monday, with support from tech industry leaders as well as many of the chipmaker's employees.</p><p class=\"referpara\"><strong><b>Also read | <a href=\"https://www.thehindu.com/news/international/trumps-close-ties-to-nvidias-huang-scrutinised-after-foreign-intelligence-concerns/article71683989.ece\" target=\"_blank\">Trump’s close ties to Nvidia’s Huang scrutinised after foreign intelligence concerns</a></b></strong></p><p>U.S. President Donald Trump, who has been close with Mr. Huang, also suggested he could return to Nvidia. Mr. Trump said Mr. Huang “learned a big lesson” and he “would certainly not mind” if he was reinstated.</p><p>There’s a “big group of people that would like him to return,” Mr. Trump added.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sci-tech/technology/untangling-nvidia-chief-jensen-huangs-chinese-spy-connection/article71681955.ece\">\n\t\t\t\t\t\t\t\t\t\tUntangling Nvidia chief Jensen Huang’s Chinese spy connection</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/bvjadl/article71681951.ece/alternates/SQUARE_80/2026-10-19T181225Z_1947160221_RC2H6OA4B07J_RTRMADP_3_GERMANY-POLITICS-MERZ-NVIDIA.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAACAwEBAQAAAAAAAAAAAAAFBwMEBgIAAQEAAgMBAAAAAAAAAAAAAAAAAgMAAQQF/9oADAMBAAIQAxAAAABOaXX7fP0kUCfyEePNqvOZ9V7UVFF7r5YsM8qGdz2mVhsRsFfSaYr0c+QqM6FLVr6Xz wEBPwDGhYXBfsUw/UuYQvxozIVqr1DkURe62vBbwR1ZQA0MTIVGohJuBqa4+Qudz8itUxnrc94PGHaT/9k=\"/></div></div></div><p>SpaceX and Tesla boss Elon Musk and Tim Sweeney, CEO of video game maker Epic Games, were among thousands of people who signed an online petition calling for Huang to return to the company.</p><p>Mr. Huang resigned last week from Nvidia, apparently ousted by the board after revelations that he had extramarital affairs, both with a Chinese businesswoman suspected of being an intelligence asset for Beijing and with a senior executive who reported to him. Chief Financial Officer Colette Kress has stepped in as interim CEO while the board searches for a replacement.</p><p>Mr. Huang is plotting a comeback, the <i>Financial Times </i>reported over the weekend, citing multiple anonymous sources. The newspaper said he has been discussing the possibility with confidants, as his allies assembled a “war room” of Silicon Valley allies to lobby for his return.</p><p>The “Stand with Jensen” petition was set up Friday (November 13) and soon gathered momentum, gaining signatures from current and former Nvidia staff, investors and other supporters. It calls on the board to bring back Mr. Huang while an independent investigation proceeds or there's “compelling evidence” that his departure is in the company's best interests.</p><p>“We are concerned that Jensen was removed without meaningful due process,” the petition's organizers said in an open letter. “We do not have access to the Board's private deliberations. We have not been shown evidence substantiating the allegation that the woman at the center of this controversy was a spy.”</p><p>The identities of the signatories could not be independently verified, and the website said that their “affiliations are self-reported and not verified.”</p><p>Some people posted on their personal accounts that they supported the effort.</p><p>“A petition is underway to reinstate Jensen and I'm signing it too,” Mr. Musk posted on X, while Mr. Sweeney wrote, “Save Jensen!”</p><p>Nvidia did not immediately respond to a request for comment on the petition.</p><p>The petition urged institutional investors who back Mr. Huang to dial into the company's next quarterly earnings call, scheduled for 5 p.m. Eastern time on Tuesday (November 17), to give “a voice to the supporters.”</p><p>The leadership scandal has thrown the wider artificial intelligence industry into turmoil because Nvidia is a key player in the AI boom, and its chips are vital for cloud computing and data centers that underpin the technology.</p><p>Mr. Huang was a driving force in building the company into a tech giant since co-founding it more than three decades ago, thanks to his technical knowledge, as well as his flair for publicity, underscored by his signature leather-jacket look.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 10:46 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709259\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/trump-says-would-not-mind-huang-being-reinstated-at-nvidia/article71709259.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_In web_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">During his ongoing visit to Egypt, Commerce Minister Piyush Goyal co-chaired, along with Egypt’s Minister of Investment and Foreign Trade Mohamed Farid Saleh, the 7th session of the India-Egypt Joint Trade Committee (JTC) in Egypt’s New Administrative Capital.</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 10:46 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/cjdqcd/article71706918.ece/alternates/LANDSCAPE_1200/15th-PTI-IndiaGVLGQ7IHB.3.jpg.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/cjdqcd/article71706918.ece/alternates/LANDSCAPE_1200/15th-PTI-IndiaGVLGQ7IHB.3.jpg.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/cjdqcd/article71706918.ece/alternates/LANDSCAPE_660/15th-PTI-IndiaGVLGQ7IHB.3.jpg.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/cjdqcd/article71706918.ece/alternates/LANDSCAPE_320/15th-PTI-IndiaGVLGQ7IHB.3.jpg.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Union Minister Piyush Goyal with Egypt's Minister of Investment and Foreign Trade Mohamed Farid Saleh during the 7th India-Egypt Joint Trade Committee, in Egypt. Photo: X/@PiyushGoyal via PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71706845\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>India and Egypt have agreed to establish a joint working group to explore the Terms of Reference (ToR) for a Preferential Trade Agreement or Free Trade Agreement between the two countries, the government announced on Monday (November 16, 2026).</p><p>During his ongoing visit to Egypt, Commerce Minister Piyush Goyal co-chaired, along with Egypt’s Minister of Investment and Foreign Trade Mohamed Farid Saleh, the 7th session of the India-Egypt Joint Trade Committee (JTC) in Egypt’s New Administrative Capital.</p><p>This was the first time this JTC has been convened at the ministerial level.</p><p>“As a key outcome of the 7th Joint Trade Committee meeting, both Ministers agreed to establish a Joint Working Group to explore the Terms of Reference for a Preferential Trade Agreement or Free Trade Agreement to facilitate stronger bilateral trade, improve access to both markets and promote investment linkages between the two countries,” the government said in a release.</p><p>The release also said that both sides reaffirmed their commitment to expanding bilateral trade, with a target of $12 billion.</p><p>“Egypt’s proximity to the Suez Canal and its connectivity with African, Arab and European markets make it a valuable partner for export-oriented manufacturing and regional supply chains,” the release said.</p><p>“India, in turn, offers Egyptian investors and exporters a large and dynamic market, increasingly competitive infrastructure and opportunities for technology and production partnerships,” it added.</p><p>The committee also reviewed the growth in India-Egypt trade, which increased by 35% to $6.5 billion in 2025-26. Trade during the first half of the current financial year (April-September 2026) also stood at a little more than $5 billion, up 65% over its level in the same period of 2025.</p><div class=\"related-stories-inline print-hide\"><h2>\n\t\t\t\t\t\t\t\tRelated Stories</h2><ul class=\"inline-stories\"><li data-ga-label=\"InlineRelatedArticle1\"><p><a href=\"https://www.thehindu.com/news/national/piyush-goyal-in-egypt-both-sides-to-discuss-increasing-cooperation-in-infra-manufacturing-logistics/article71701055.ece\">Piyush Goyal in Egypt: Both sides to discuss increasing cooperation in infra, manufacturing, logistics</a></p><a href=\"https://www.thehindu.com/news/national/piyush-goyal-in-egypt-both-sides-to-discuss-increasing-cooperation-in-infra-manufacturing-logistics/article71701055.ece\"><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/o8zhm7/article71701070.ece/alternates/SQUARE_80/PTI11_13_2026_000442B.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAABBQEBAAAAAAAAAAAAAAAGAAECAwUEBwEAAwEBAQEAAAAAAAAAAAAAAAIEAwUBBv/aAAwDAQACEAMQAAAA8VTzPE116NwpO6snQJOgjVdr+NtFw0Xy2eP0FQtTJF0mR2dgi/bU3m6S+Y3ZbauX0VPnVo8B8rZI17t4kulUqK7ZO7SySztz4/R3xqzxCSiKMceTkEUYHqTcrbTLg8s7szqNduF0WgHrPUE9PzPU/8QAORAAAgEDAgQEAwYCCwAAAAAAAQIDAAQRBSEGEjFBECJRcRNhgRQVMkKh0XKRBxYgIzOSorLB4fH/2gAIAQEAAT8A8FidgCEOD0PamRk/EMVisf2cUh5G5vLgDJBGaheSVmjiBkZiOVV37V9nvvgSSSW7fAXZmx/hmlPMgb1FYrHhjxkYK7ZPmxge1cG21rbRiZwsbNli8nQD5Ut9pdxoN01vZT3UZflk8oXr+YZ7bY/lV1ai1lePzDDkKrjDBeoz9PHFEVjw4f0e21i6nilJMyQlokDcpbGSa4fto5ZbeGdEdETIbffBq8u4rGUJYz2iL8Iq8Uqs7OD1PKOtcdCGXVLa7gj5EmhH5eXOO+O3Xp4Hw7+Gd8UZZ7flmgYpIpyG9K0XiKLnSeaSNblXYSwnyhlPdf2qDjCxt1keayeV8bMhGGx64NcQ6z99am1wsXwolHLHH6DvXKeUNjbw0mwGoSXKcju0du8 673/\">Jacob Koshy</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/th5nur/article71707988.ece/alternates/LANDSCAPE_1200/2026-11-16T105849Z_1724054406_RC2YOOAMO005_RTRMADP_3_CLIMATE-COP31-ACTIVISM-PLASTIC.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/th5nur/article71707988.ece/alternates/LANDSCAPE_1200/2026-11-16T105849Z_1724054406_RC2YOOAMO005_RTRMADP_3_CLIMATE-COP31-ACTIVISM-PLASTIC.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/th5nur/article71707988.ece/alternates/LANDSCAPE_660/2026-11-16T105849Z_1724054406_RC2YOOAMO005_RTRMADP_3_CLIMATE-COP31-ACTIVISM-PLASTIC.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/th5nur/article71707988.ece/alternates/LANDSCAPE_320/2026-11-16T105849Z_1724054406_RC2YOOAMO005_RTRMADP_3_CLIMATE-COP31-ACTIVISM-PLASTIC.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Activists take part in a \"Less Plastic, More Life\" demonstration organized by GAIA during the U.N. Climate Change Conference (COP31) in Antalya, Turkiye, November 16, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71707955\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Developing countries have called on developed nations to take the lead in achieving net-zero emissions by 2030 and net-negative emissions by 2045, as divergent positions emerged in the draft cover text at the ongoing COP31 climate negotiations in Antalya, Turkiye.</p><p>Net zero refers to balancing the amount of carbon dioxide emitted with the amount removed from the atmosphere. Several developed countries have set 2050 targets for achieving net-zero emissions, while major developing economies such as India and China have committed to targets of 2070 and 2060, respectively.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sci-tech/energy-and-environment/urgent-climate-finance-pleas-at-cop31-face-a-non-urgent-response/article71699520.ece\">\n\t\t\t\t\t\t\t\t\t\tUrgent climate finance pleas at COP31 face a non-urgent response</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/g8he2w/article71699615.ece/alternates/SQUARE_80/Climate_COP31_Turkey_47865.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAgMBAQAAAAAAAAAAAAAGBwMFAQQIAgABAAIDAQEAAAAAAAAAAAAAAAAEAQMFAgb/2gAMAwEAAhADEAAAANwHLx9P0BffC5czixY2Bea77FDb89e4tqPqsSJViwaNuoPF0yLEMqNvL2aNa1GDWu26injuVR7CWjCzvZ1x+r/bnn4a0OumMs0BnYgwO2dzexuZ+byjbi2+lTcF6TldFeugdhnHWC/6LhDnO4c0oczGoWXZPuQfpLnHolvAIMaeGcbc86fkNuPVjg//xABBEAABAgQDBAYECQ0AAAAAAAABAgMABAURBhIhEzFBYQcUUXGBkSKhscEVFyQyQmKS0dIWGCMzNFJTY3SCsrPh/9oACAEBAAE/AMVP9UwpUXQbEslA71ae+JVnLhMj6w9kYQc22F5E78qCg+BIhKIKIKIywUQpMKTGOmHpqgok5excefToTa4Tr90dWcl8NqadQpC0qAKVCxGkdH7m0w6pv+E+oedjCUwU6RW6tNqqYpVPeTLrAG0eyBStdbJB0HfExJVmkNdbFVmHha6m5kJWg+QBHgYpk+mqU5qaSjIVXCkXvlUDYi8KTCkxiysS8jW6ZLPhWUpU4SnXLqANPOK/TGalgkzstlU42kLCk/TTxEdG7l2aix+64lY8QR7oAjLcRPz9QcxNPvyjAQS8pCC8ohSSnQgpseI37rGKhVsTTVLQw6ZNDYJT1lKrbUi10jstfXttpGBnnnKdNNONAIQ7dLiScq ribute voluntarily towards climate finance. This funding is intended to help countries adapt to a fossil-fuel-free economy and address losses and damage caused by climate change.</p><p>Under the UN climate framework, developed countries, which bear greater historical responsibility for accumulated carbon emissions, are expected to support developing countries through finance and technology as they pursue lower-emission development pathways.</p><p>Developing countries have also called for the elimination of measures such as the European Union’s Carbon Border Adjustment Mechanism (CBAM) by the end of 2027. The mechanism imposes a tariff on certain imports, including steel, based on the carbon emissions generated during production. Developing countries argue that such measures disadvantage their industries, which often have lower production costs but higher emissions.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sci-tech/energy-and-environment/at-cop31-the-overshoot-narrative-cannot-replace-climate-action/article71677165.ece\">\n\t\t\t\t\t\t\t\t\t\t At COP31, the ‘overshoot’ narrative cannot replace climate action</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/sci-tech/science/c98iwb/article71677157.ece/alternates/SQUARE_80/AFP__20261102__AA_02112026_3022513__v1__HighRes__PreparationsUnderwayForCop31Climate.jpg.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAgMBAAAAAAAAAAAAAAAFBgEDAAQHAgEAAwEAAwAAAAAAAAAAAAAAAQIDBQAEBv/aAAwDAQACEAMQAAAAMTGSPrNWhgSkXQCalaJDhONWs8rWtKmMTlreGo6QF7WNB4c5v+w5V nGhwdHw/9oACAECAQE/AFhKIIz8lCi8+Vc5EARDiboVCe+rTZNlI4NcBXRY2fCeCMCIwFzgQEzr926DC8Etv6ITMDa9kJmW2llOYbFc1rbtFzvOgLtI3iGjRoHwP28qWEKHCBLhXVXN9nWeFlUakyh0KgTnXssZX//EACYRAAEDAwMCBwAAAAAAAAAAAAEAAhEDEiEEQVEFExBxgZGhwdH/2gAIAQMBAT8AVwQIPhIRrU7+3OVYgIREoMM5VKm7v3kCMq8DdMF7g1mSVU09anF7SJ5CqU30jFQEeeFa7hFj+F0bt0mPeXBrzgE7DchDU6TT4pEOedyfkn69gupap1eqQ0SNzGT+DgepkqDynSFKAlWhf//Z\"/></div></div></div><p>Another proposal in the draft concerns a target to source 35% of energy use from electricity by 2035. Some countries have called for there to be no obligation to meet this goal, which was proposed by the COP31 presidency.</p><p>COP31 president of negotiations Chris Bowens said the first draft was intended to incorporate proposals from all parties, acknowledging that countries would disagree on certain elements. He said the draft had been released early to ensure transparency and reflect the range of positions.</p><p>Andreas Sieber, head of political strategy at activist group 350.org, called for a transition towards renewable energy and electrification, supported by adequate funding. He said the credibility of the climate negotiations depended on leadership in moving away from fossil fuels.</p><p>In his first statement at the conference, Environment Minister Bhupender Yadav said the global just transition agenda — which involves moving workers from fossil-fuel-based industries towards renewable energy sectors — needed to move beyond dialogue and exchanges of experience towards practical, country-driven implementation. He reiterated India’s commitment to an inclusive and equitable global transition that leaves no one behind.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 06:03 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-co _AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/993/\">\n                        environmental issues\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 13, "title": "Third American aircraft carrier arrives in West Asia as Trump keeps options open in Iran war", "section": "International", "page": "", "teaser": "The USS Theodore Roosevelt has arrived in the Middle East, once again bringing the total number of U.S. aircraft carriers in the West Asia to three, an unusually high number", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709128\" data-title=\"Third American aircraft carrier arrives in West Asia as Trump keeps options open in Iran war\" data-url=\"https://www.thehindu.com/news/international/third-american-aircraft-carrier-arrives-in-west-asia-as-trump-keeps-options-open-in-iran-war/article71709128.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The USS Theodore Roosevelt has arrived in the Middle East, once again bringing the total number of U.S. aircraft carriers in the West Asia to three, an unusually high number</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 10:30 pm IST - WASHINGTON</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/3ws3um/article71709213.ece/alternates/LANDSCAPE_1200/AP10_19_2026_000358B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/3ws3um/article71709213.ece/alternates/LANDSCAPE_1200/AP10_19_2026_000358B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/3ws3um/article71709213.ece/alternates/LANDSCAPE_660/AP10_19_2026_000358B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/3ws3um/article71709213.ece/alternates/LANDSCAPE_320/AP10_19_2026_000358B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    The U.S. aircraft carrier USS Theodore Roosevelt. File.\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709128\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The U<i>SS Theodore Roosevelt </i>has arrived in the West Asia, once again bringing the total number of U.S. aircraft carriers in the West Asia to three — an unusually high number.</p><p>A U.S. official, who spoke on condition of anonymity to discuss sensitive military operations, on Monday (November 16, 2026) confirmed the carrier’s arrival in the region.</p><p>It brings thousands of additional troops to the Middle East as President Donald Trump has kept his options open during the more than 8-month-old Iran war.</p><p>The Roosevelt, along with its accompanying strike force, left San Diego in September.</p><p>The Theodore Roosevelt joins the USS George H.W. Bush and the USS George Washington aircraft carriers, as well as scores of smaller navy ships, that are in the region maintaining a blockade of Iranian shipping. The H.W. Bush arrived in the region in April while the George Washington arrived in August.</p><p>According to the Navy, the flotilla in the Arabian Sea now includes three aircraft carriers as well as 13 destroyers, two cruisers and a littoral combat ship.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 10:30 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709128\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/third-american-aircraft-carrier-arrives-in-west-asia-as-trump-keeps-options-open-in-iran-war/article71709128.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><! -size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 14, "title": "After Yemen setback, Saudi Arabia replaces military commander", "section": "International", "page": "", "teaser": "The Houthis have made rapid gains ⁠against the Saudi-backed Yemeni government since the U.S.-Iran conflict reignited Yemen’s frozen civil war this summer, drawing Riyadh back into confrontation with the group", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709122\" data-title=\"After Yemen setback, Saudi Arabia replaces military commander\" data-url=\"https://www.thehindu.com/news/international/after-yemen-setback-saudi-arabia-replaces-military-commander/article71709122.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Houthis have made rapid gains ⁠against the Saudi-backed Yemeni government since the U.S.-Iran conflict reignited Yemen’s frozen civil war this summer, drawing Riyadh back into confrontation with the group</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 10:15 pm IST - RIYADH</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\">Reuters</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/4tfvep/article71709178.ece/alternates/LANDSCAPE_1200/2026-11-15T185151Z_1602078490_RC2IOOAF6U4J_RTRMADP_3_IRAN-CRISIS-SAUDI-YEMEN-HOUTHIS.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/4tfvep/article71709178.ece/alternates/LANDSCAPE_1200/2026-11-15T185151Z_1602078490_RC2IOOAF6U4J_RTRMADP_3_IRAN-CRISIS-SAUDI-YEMEN-HOUTHIS.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/4tfvep/article71709178.ece/alternates/LANDSCAPE_660/2026-11-15T185151Z_1602078490_RC2IOOAF6U4J_RTRMADP_3_IRAN-CRISIS-SAUDI-YEMEN-HOUTHIS.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/4tfvep/article71709178.ece/alternates/LANDSCAPE_320/2026-11-15T185151Z_1602078490_RC2IOOAF6U4J_RTRMADP_3_IRAN-CRISIS-SAUDI-YEMEN-HOUTHIS.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Military vehicles ride on a road amid clashes between Houthi fighters and Saudi-backed Yemeni government forces in a location given as Kahbob and Matharebah, Lahj province, Yemen, in this screengrab obtained from a video released November 15, 2026. Photo: Houthi Military Media/Handout via Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709122\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Saudi Arabia replaced the commander overseeing its coalition against Yemen’s Iran-allied Houthis ‌on Monday (November 16, 2026) after Riyadh’s Yemeni allies were forced to withdraw from swathes of territory in ​a major setback for their campaign against the group.</p><p>The Houthis have made rapid gains ⁠against the Saudi-backed Yemeni government since the U.S.-Iran conflict reignited Yemen’s frozen civil war this summer, drawing Riyadh back into confrontation with the group.</p><p>After gaining ground in a counter-attack in October, the Yemeni government said on Sunday (November 15, 2026) it was withdrawing from ‌areas near the Bab el-Mandeb Strait, a global shipping artery, to focus on defending its base of operations in Aden, a port city on the southern coast.</p><p>People in the Yemeni military ‌said on Monday (November 16, 2026) the Houthis had advanced to the southern coastal area of Khor Omairh, ‌some ⁠100 km (62 miles) west of Aden and were 25 km (16 miles) from government lines at Qawah, ⁠another coastal area.</p><p>A royal decree issued by Saudi Arabia’s King Salman spelt out changes to the command of the Saudi-led coalition.</p><p>The existing commander, Lieutenant General Fahd bin Hamad Al-Salman, was appointed as adviser to the defence minister for military affairs, while Chief of ​the General Staff General Fayyad Al-Ruwaili was assigned ‌the additional role of commanding the joint forces, Saudi state media reported.</p><p>Two Western diplomats linked the change directly to battlefield developments in Yemen and the Houthi advance.</p><p>The Saudi government media office didn’t immediately respond to a request for comment.</p><p>The Houthis have been firing ballistic missiles and drones at Saudi airports and ‌oil facilities since the Yemen war restarted.</p><h4 class=\"sub_head\">‘People are worried’</h4><p>Houthi gains in Yemen and attacks on ​Saudi Arabia and Red Sea shipping have enhanced Iran’s position in the wider Middle East conflict.</p><p>Residents of Aden said government security forces had set up more checkpoints and were carrying ⁠out identity checks in the city, the government’s seat of power since the Houthis took Sanaa in 2014.</p><p>“Food supplies are available, and so is fuel. However, people are worried about the retreat of government forces and the ‌possibility of fighting drawing closer to Aden,” government employee Amin Mahmoud told Reuters by phone from the city.</p><p>The Yemeni government’s focus is to secure Aden and the province of Lahj, three people in the government said.</p><p>Government forces were redeploying and reorganising along front lines to prepare for the recapture of areas seized by the Houthis, the sources said.</p><p>Mohammed Al-Qadhi, a political and conflict analyst, said “there is a serious threat to Aden because they are getting closer and closer”.</p><p>“It is a major setback. The government was aiming to recapture Sanaa, ‌but now they are defending Aden,” he said.</p><h4 class=\"sub_head\">Infighting seen weakening Government side</h4><p>One of the major problems facing government forces ​is their fragmented state, he said, adding that the Houthis were benefiting from “an accumulation of years of disagreements and infighting” on the government side.</p><p>Yemen’s civil war had been dormant since ⁠2022 until it reignited this summer as a spillover of the Iran war.</p><p>The Houthis made rapid gains to capture ⁠the coast along the Red Sea and the Bab el-Mandeb Strait that controls access to it, while besieging government forces in Taiz, the country’s third-biggest city, in mountains above the approach to ‌Aden.</p><p>Saudi-backed government forces rapidly retook key positions around the strait, notably Dhubab, in an offensive last month. But they were unable to drive the Houthis entirely away from the area or to retake the ​city of al-Mocha further up the coast.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 10:15 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709122\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/after-yemen-setback-saudi-arabia-replaces-military-commander/article71709122.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/424-244/\">\n                        Yemen\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/385-244/\">\n                        Saudi Arabia\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 15, "title": "Israeli opposition chiefs denounce Netanyahu over ‘attempted coup’", "section": "International", "page": "", "teaser": "Netanyahu subsequently accused Arab parties of electoral fraud after they gained a record number of seats", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709115\" data-title=\"Israeli opposition chiefs denounce Netanyahu over ‘attempted coup’\" data-url=\"https://www.thehindu.com/news/international/israeli-opposition-chiefs-denounce-netanyahu-over-attempted-coup/article71709115.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Netanyahu subsequently accused Arab parties of electoral fraud after they gained a record number of seats</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 10:05 pm IST - Jerusalem</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AFP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/divz21/article71709172.ece/alternates/LANDSCAPE_1200/AP11_10_2026_000234B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/divz21/article71709172.ece/alternates/LANDSCAPE_1200/AP11_10_2026_000234B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/divz21/article71709172.ece/alternates/LANDSCAPE_660/AP11_10_2026_000234B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/divz21/article71709172.ece/alternates/LANDSCAPE_320/AP11_10_2026_000234B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Israeli Prime Minister Benjamin Netanyahu. File.\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709115\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Two Israeli opposition leaders denounced Monday (November 16, 2026) an \"attempted coup\" following press reports that outgoing Prime Minister Benjamin Netanyahu's office tried to frame members of an Arab-Israeli party ahead of last month's election.</p><p>\"As more and more details come to light, it becomes clear: This wasn't an attempt to disrupt the elections. It was an attempted coup,\" wrote Yair Lapid on X, who headed the opposition in the previous legislature and co-chairs the Beyachad list.</p><p>Israel's<i> Channel 12 </i>reported Sunday (November 15, 2026) that on the eve of the October 27 election, Mr. Netanyahu's chief of staff Ido Norden had phoned in a complaint to the police about members of the Arab-Israeli Raam party.</p><p>Mr. Norden reportedly pointed the police to a purported intelligence source -- a former employee of Mr. Netanyahu's office -- who provided information that led to the arrest of three Raam members.</p><p>The three men were later released when the police determined that the information was unfounded.</p><p>Mr. Netanyahu subsequently accused Arab parties of electoral fraud after they gained a record number of seats. His Likud party issued a statement denying the latest allegations.</p><p>The Israeli newspaper <i>Haaretz </i>also reported that David Zini, head of the Shin Bet domestic security service, sought to wiretap leaders of the other Arab slate, the Joint List, but the attorney general turned down his request due to lack of evidence.</p><p>Following the report, Joint List leader Yousef Jabareen also denounced an \"attempted coup by Netanyahu\".</p><p>\"If the findings are confirmed, this is a criminal mechanism that operated from the heart of government to rig the election results. Everyone found responsible must be held accountable, including Netanyahu,\" he wrote on X.</p><p>Raam's number two, former police chief Yoav Segalovitz, called for an urgent investigation.</p><p>\"These suspicions require an immediate, independent and thorough criminal investigation that reaches everyone involved, at every level and in every role,\" he wrote on X.</p><p>\"Netanyahu cried out that his election was being stolen, while he himself tried to steal the country and is still trying to do so now,\" he added.</p><p>Mr. Netanyahu's main rival, former army chief of staff Gadi Eisenkot, wrote on Sunday (November 15, 2026) that the caretaker prime minister \"cannot remain at the head of the government for a minute longer\".</p><p>Neither Mr. Netanyahu's bloc nor Mr. Eisenkot's opposition secured the 61 seats required to form a government following last month's election.</p><p>The two Arab parties, the Joint List and Raam, have indicated support for Mr. Eisenkot.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 10:02 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709115\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/israeli-opposition-chiefs-denounce-netanyahu-over-attempted-coup/article71709115.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/333-244/\">\n                        Israel\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/1349/\">\n                        politics\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 16, "title": "Trump’s Asia trip: Deals in Manila and Shenzhen, nuclear summit with Xi and Putin, maybe Kim meeting", "section": "International", "page": "", "teaser": "Trump said he plans to talk about Russia's war in Ukraine during the highly anticipated meeting with Chinese President Xi Jinping and Russian leader Vladimir Putin in China", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708808\" data-title=\"Trump’s Asia trip: Deals in Manila and Shenzhen, nuclear summit with Xi and Putin, maybe Kim meeting\" data-url=\"https://www.thehindu.com/news/international/trumps-asia-trip-deals-in-manila-and-shenzhen-nuclear-summit-with-xi-and-putin-maybe-kim-meeting/article71708808.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Trump said he plans to talk about Russia's war in Ukraine during the highly anticipated meeting with Chinese President Xi Jinping and Russian leader Vladimir Putin in China</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:05 pm IST - Washington</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/e4lqyx/article71708820.ece/alternates/LANDSCAPE_1200/Trump_85_84.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/e4lqyx/article71708820.ece/alternates/LANDSCAPE_1200/Trump_85_84.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/e4lqyx/article71708820.ece/alternates/LANDSCAPE_660/Trump_85_84.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/e4lqyx/article71708820.ece/alternates/LANDSCAPE_320/Trump_85_84.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    President Donald Trump walks to board Marine One from the South Lawn of the White House, on November 16, 2026, in Washington. ]\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708808\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>President Donald Trump was preparing to depart for Asia on Monday (November 16, 2026), turning his focus to economic deals and historic three-way nuclear talks with Russia and China as his administration adjusts to a new political reality in Washington. He said he may meet with Kim Jong Un while in China as the U.S. looks to reengage North Korea on its nuclear program.</p><p>Mr. Trump said he plans to talk about Russia's war in Ukraine during the highly anticipated meeting with Chinese President Xi Jinping and Russian leader Vladimir Putin in China.</p>
