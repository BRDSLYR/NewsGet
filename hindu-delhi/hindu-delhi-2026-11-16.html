DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 36, "title": "AIIMS Delhi performs a life-changing spinal repair in utero, before the patient’s first breath", "section": "Science", "page": "", "teaser": "This is India’s first open foetal repair for myelomeningocele, a defect in which the spinal cord and its coverings protrude through an opening in the spine; over 30 clinicians and nurses involved in multidisciplinary procedure", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/sci-tech/\">\n                        Sci-Tech\n                    </a><meta content=\"Sci-Tech\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sci-tech/health/\">\n                        Health\n                    </a><meta content=\"Health\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708137\" data-title=\"AIIMS Delhi performs a life-changing spinal repair in utero, before the patient’s first breath\" data-url=\"https://www.thehindu.com/sci-tech/health/aiims-delhi-performs-a-life-changing-spinal-repair-in-utero-before-the-patients-first-breath/article71708137.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">This is India’s first open foetal repair for myelomeningocele, a defect in which the spinal cord and its coverings protrude through an opening in the spine; over 30 clinicians and nurses involved in multidisciplinary procedure</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:28 pm IST - NEW DELHI</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/bindu-shajan-perappadan-396/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/bindu-shajan-perappadan-396/\">Bindu Shajan Perappadan</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/rg90ss/article71708968.ece/alternates/LANDSCAPE_1200/iStock-1332985409.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/rg90ss/article71708968.ece/alternates/LANDSCAPE_1200/iStock-1332985409.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/rg90ss/article71708968.ece/alternates/LANDSCAPE_660/iStock-1332985409.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/rg90ss/article71708968.ece/alternates/LANDSCAPE_320/iStock-1332985409.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Image used for representational purposes only.\n                                          | Photo Credit: Getty Images/iStockphoto\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708137\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The All India Institute of Medical Sciences (AIIMS), Delhi has performed India’s first open foetal repair of a lumbosacral myelomeningocele — the most severe form of spina bifida — at 25 weeks’ gestation.</p><p class=\"referpara\"><strong><b>Also read | <a href=\"https://www.thehindu.com/news/cities/Delhi/aiims-surgery-department-marks-1000-robotic-operations-milestone/article70531032.ece\" target=\"_blank\">AIIMS surgery department marks 1,000 robotic operations milestone</a> </b></strong></p><p>“The six-hour operation repaired the cerebrospinal-fluid-leaking lumbosacral defect in utero. It followed more than five weeks of multidisciplinary planning, detailed foetal imaging, non-directive counselling, anaesthetic preparation, and operative simulation,’’ AIIMS said in a statement.</p><p>A myelomeningocele is an open neural tube defect in which the spinal cord and its coverings protrude through an opening in the spine.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/cities/Delhi/aiims-doctors-perform-bariatric-surgery-on-man-weighing-209-kg/article71314951.ece\">\n\t\t\t\t\t\t\t\t\t\tAIIMS doctors perform bariatric surgery on man weighing 209 kg</a></div><div class=\"picture\"></div></div></div><h4 class=\"sub_head\">Multidisciplinary procedure</h4><p>The patient was first screened and counselled by K. Aparna Sharma from the Maternal–Fetal Medicine team. The multidisciplinary procedure was performed using high-end microscopy and continuous high-end ultrasonography assistance at the Neurosciences Centre. The procedure was provided free of cost to the family under the Union government’s Janani Shishu Suraksha Karyakram (JSSK).</p><p>Deepak Gupta, who led the neurosurgical component, said that the intervention was done after rigorous selection. “Prenatal repair seeks to limit ongoing injury to exposed neural tissue, reduce the subsequent need for cerebrospinal-fluid diversion for hydrocephalus, and improve selected neurological outcomes. It is not a cure, and long-term multidisciplinary care remains essential,” he said.</p><p>More than 30 clinicians and nurses from the Obstetrics and Gynaecology, Maternal–Fetal Medicine, Neurosurgery, Obstetrics and Neuroanaesthesia, Plastic Surgery, Radiodiagnosis, Neonatology, and Nursing teams of the Neurosciences Centre and Obstetrics–Gynaecology services participated in the procedure.</p><h4 class=\"sub_head\">‘Not a substitute for prevention’</h4><p>Professor Aparna Sharma added that this foetal intervention was well-reasoned and a planned decision aimed to optimise the outcomes of both the baby and the mother. The safety of both mother and foetus was ensured through detailed counselling, high-quality anaesthesia, and coordinated surveillance before and after surgery.</p><p>“International trial evidence supports prenatal repair in carefully selected foetuses with open myelomeningocele. The procedure nevertheless carries important maternal and foetal risks, including prematurity and uterine-scar complications, and must be performed only in specialised centres,’’ she said.</p><p>The team emphasised that foetal surgery is a treatment for selected pregnancies, not a substitute for prevention. Neural-tube closure occurs by approximately 28 days after conception, often before pregnancy is recognised. Pre-conception folic-acid counselling, evidence-based food fortification with folates, and robust national surveillance remain essential to reducing India’s burden of neural tube defects.</p><h4 class=\"sub_head\">Lifelong challenges</h4><p>“The mother and foetus will continue to receive close multidisciplinary surveillance through pregnancy, delivery, and the newborn period,’’ the AIIMS statement said, adding that a child with spina bifida may begin life with paralysis, hydrocephalus, and lifelong challenges.</p><p>Traditionally, neurosurgeons have done this operation after the child is born. But by then, some of the neurological damage may already have occurred. For some children with spina bifida, the opportunity to protect the spinal cord now begins before birth.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:11 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708137\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sci-tech/health/aiims-delhi-performs-a-life-changing-spinal-repair-in-utero-before-the-patients-first-breath/article71708137.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div> ence-when-motherhood-needs-mental-health-support/article71669544.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">At least one in five women will experience mental health problems during pregnancy until  the first year after childbirth. This cannot be ignored any longer: we need better, more comprehensive policies and programmes to support mothers during this vulnerable period</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 08:35 pm IST </span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/contributor/prabha-s-chandra-17016/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/contributor/prabha-s-chandra-17016/\">Prabha S. Chandra</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/dw2y18/article71707316.ece/alternates/LANDSCAPE_1200/HR-WOMAN-10-DAUGBEFDGA9C.3.jpg.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/dw2y18/article71707316.ece/alternates/LANDSCAPE_1200/HR-WOMAN-10-DAUGBEFDGA9C.3.jpg.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/dw2y18/article71707316.ece/alternates/LANDSCAPE_660/HR-WOMAN-10-DAUGBEFDGA9C.3.jpg.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/dw2y18/article71707316.ece/alternates/LANDSCAPE_320/HR-WOMAN-10-DAUGBEFDGA9C.3.jpg.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Protecting maternal sleep through shared infant care, partner and family support, and opportunities for uninterrupted sleep is an important part of postpartum mental health care. Image used for representational purposes only\n                                          | Photo Credit: Getty Images\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71669544\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Monica was not prepared for a caesarean section. She had done everything right and had been assured of a vaginal delivery. Then two weeks before the expected date of delivery, she had to be rushed to the emergency for a caesarean. Monica felt that she had completely lost control of the situation. She found herself alone in an intensive care ward away from her baby, who was in the neonatal ICU and described her birth experience as being extremely traumatic. She is now unable to bond with her baby and keeps questioning herself. Am I such a terrible mother? Will I be like this lifelong?</p><p>Priya became pregnant after multiple IVF procedures but did not disclose the pregnancy to anyone till the third trimester, as she didn’t want to jinx it. After a healthy baby girl was born, Priya continued to be anxious and could not trust anyone else to take care of the baby. She would be hypervigilant, and even the smallest change in the infant’s spit-up or breathing would make her panic. </p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 08:21 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71669544\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sci-tech/health/matrescence-when-motherhood-needs-mental-health-support/article71669544.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The ck artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Curated by friend and fellow collector Jaiveer Johal, the show at Space 118 explores the enduring possibilities of figurative art</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 11:16 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/team-magazine-8647/\">Team Magazine</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/life-and-style/iuhmro/article71709314.ece/alternates/LANDSCAPE_1200/Utkarsh%20Shakyas%20Divided%20Priorities.png\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/life-and-style/iuhmro/article71709314.ece/alternates/LANDSCAPE_1200/Utkarsh%20Shakyas%20Divided%20Priorities.png\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/life-and-style/iuhmro/article71709314.ece/alternates/LANDSCAPE_660/Utkarsh%20Shakyas%20Divided%20Priorities.png\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/life-and-style/iuhmro/article71709314.ece/alternates/LANDSCAPE_320/Utkarsh%20Shakyas%20Divided%20Priorities.png\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Utkarsh Shakya’s Divided Priorities\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709326\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>“When you see your own collection through another person’s eyes, you discover so much about yourself,” says art collector Saloni Doshi. War/conflict wasn’t a theme she thought could be created from the art she’s been collecting for years until fellow collector, friend, and now curator of her latest show <i>In Quiet Measure</i>, Jaiveer Johal culled out enough pieces from the Saloni Doshi Collection to fill a room.</p><p>The show, which opened four days ago at Doshi’s arts foundation, Space 118 — in collaboration with Asia Society India Centre — explores the enduring possibilities of figurative art. It brings together works by artists such as Anju Dodiya, T. Venkanna, Sonia Jose, Jitish Kallat, and Khadim Ali.</p><div class=\"article-video\"><div class=\"lead-video-cont\"><div><!-- JW Player container with videoId --><div id=\"botr_E7RycqXd_HxxKTB2U_div\"></div><div id=\"botr_E7RycqXd_lUyqynWW_div\"></div></div></div></div><div class=\"caption\">In Quiet Measure\n                | Video Credit: \n                    The Hindu\n                            </div><p>“There were several starting points for exhibition, not just a single artwork,” explains Johal. “In the first room, a Kulpreet Singh artwork was the first work that was hung. In another room, a T&amp;T [Thukral &amp; Tagra] work became the focal point.” Through it all, the exhibition attempts to examine the human figure “through varied approaches to memory, identity, psychological tension and lived experience”.</p><p><i>In Quiet Measure</i> is the last in a six-part series of public exhibitions, which kicked off in 2023 with a show called <i>The Right To Look</i>, by the Saloni Doshi Collection.</p><p><i>In Quiet Measure is on till December 12 at Space 118.</i></p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 11:15 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709326\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/entertainment/art/in-quiet-measure-art-collector-saloni-doshi-figurative-art-jaiveer-johal-space-118/article71709326.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_De ></div></div></div></div></div>"}, {"id": 39, "title": "Raye leads 2027 Grammy nominations, followed by Rosalía, Ella Langley, Olivia Rodrigo and more", "section": "Arts", "page": "", "teaser": "The Recording Academy announced the 2027 Grammy Award nominations on Monday, with English singer-songwriter Raye leading the pack", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/entertainment/\">\n                        Entertainment\n                    </a><meta content=\"Entertainment\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/entertainment/music/\">\n                        Music\n                    </a><meta content=\"Music\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71709052\" data-title=\"Raye leads 2027 Grammy nominations, followed by Rosalía, Ella Langley, Olivia Rodrigo and more\" data-url=\"https://www.thehindu.com/entertainment/music/raye-leads-2027-grammy-nominations-followed-by-rosalia-ella-langley-olivia-rodrigo-and-more/article71709052.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Recording Academy announced the 2027 Grammy Award nominations on Monday, with English singer-songwriter Raye leading the pack</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 16, 2026 09:44 pm IST - NEW YORK</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/vczg5y/article71709060.ece/alternates/LANDSCAPE_1200/Grammy_Awards_66616.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/vczg5y/article71709060.ece/alternates/LANDSCAPE_1200/Grammy_Awards_66616.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/vczg5y/article71709060.ece/alternates/LANDSCAPE_660/Grammy_Awards_66616.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/vczg5y/article71709060.ece/alternates/LANDSCAPE_320/Grammy_Awards_66616.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    This combination of images shows performers, from left, Raye, Rosalia, Ella Langley and Olivia Rodrigo.\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71709052\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Call her a Raye of sunshine. The English singer-songwriter leads the 2027 Grammy Award nominations, the Recording Academy announced Monday (November 16, 2026).</p><p>Raye is up for 11 awards at February’s ceremony: record, song and album of the year — the first time she's been nominated in those big categories — as well as songwriter of the year non-classical, a variety of pop categories and music video.</p><p>Her 11 nods also mean she has tied Beyoncé’s record at the 2025 Grammys for the most nominations in a single year by a female artist.</p><p>Speaking of Bey: She continues her reign as the most-nominated artist in Grammy history, scoring her 100th nod for “Morning Dew (Donk)” in the R&amp;B solo performance category.</p><p>Raye, who is riding the success of her critically acclaimed album “This Music May Contain Hope,” has 15 Grammy nominations across her career. She's never won one, though she was previously recognized by the Recording Academy with the noncompetitive Harry Belafonte best song for social change award.</p><p>Spanish singer Rosalía, fresh off her album of the year win at the 27th annual Latin Grammy Awards on Thursday for her avant-garde “Lux,” follows Raye with nine nominations. She's a first-time nominee in all the categories she's up for: record, song and album of the year as well as pop solo performance, alternative music performance, alternative music album, Latin song, global music performance and music video.</p><p>Following her are Miranda Lambert, Olivia Rodrigo, Phoebe Bridgers and first-time nominee Ella Langley, who are tied with seven nods each.</p><p>Bruno Mars, Leon Thomas and 2026's best new artist winner Olivia Dean have six nominations each.</p><p>In addition to Raye's “This Music May Contain Hope” and Rosalía's “Lux,” the album of the year category is rounded out by Bridgers' “Lost Weekend,” Dean's “The Art of Loving,” Langley's “Dandelion,” Mars' “The Romantic,” Rodrigo's “You Seem Pretty Sad for a Girl So in Love” and Taylor Swift's “The Life of a Showgirl.”</p><p>Swift's nomination is her fifth consecutive studio album to be nominated for album of the year, something only one other artist has ever done: Kendrick Lamar.</p><p>Only recordings commercially released in the U.S. between Aug. 31, 2025, and Aug. 28, 2026, were eligible for nominations. The final round of Grammy voting, which determines the winners, will take place between Dec. 10 and Jan. 7.</p><p>The record of the year category is made up of Dean's “Man I Need,” Langley's “Choosin' Texas,” Mars' “I Just Might,” Raye's “Where Is My Husband!”, Rodrigo's “The Cure,” Rosalía’s “Berghain” featuring Björk and Yves Tumor, Swift's “The Fate of Ophelia” and Tame Impala and Jennie's “Dracula.”</p><p>Jennie, perhaps best known as one-fourth of the juggernaut girl group Blackpink, is also a first-time nominee at the 2027 Grammys. Last year her bandmate Rosé became the first K-pop artist to ever receive a nomination in the record of the year field for “APT.,” her megahit with Mars. Jennie's “Dracula” nomination makes her the second.</p><p>Song of the year — an award for a track’s songwriters, which sometimes includes the performer but not always — is made up of an almost identical list to record of the year, featuring the same song selections from Dean, Langley, Raye, Rodrigo and Rosalía. But it also includes Ariana Grande's “Hate That I Made You Love Me,” Swift's “Toy Story 5” song “I Knew It, I Knew You” and Mars' “Risk It All.”</p><p>In the best new artist category, Langley, Angine de Poitrine, Geese, Slayyyter, Sienna Spiro, Don Toliver, Remi Wolf and The Womack Sisters will go head-to-head.</p><p>“It’s a privilege to congratulate all the incredible music creators recognized in this year’s Grammy nominations,” said Recording Academy CEO Harvey Mason jr. in a statement. “From first-time nominees to artists reaching career milestones, it’s inspiring to see musicians at every stage of their careers represented. Together, they reflect the extraordinary diversity of genres, crafts and backgrounds that make up our community. We look forward to a remarkable season of celebration, and I’m grateful to our Voting Members for their continued commitment to honoring the music that moves us year after year.”</p><p>There are a number of other first-time nominees this year, including Geese, Tinashe, Slayyyter, Angine de Poitrine, Ryan Castro, Milo J, Megan Moroney, John Cale — who accepted the Recording Academy’s Lifetime Achievement Award on behalf of his band The Velvet Underground in 2017 but has never been nominated before — and many more.</p><p>The 2027 Grammy Awards will air Feb. 7 at 7 p.m. Eastern, live on ABC for the first time since 1972, from the Crypto.com Arena in Los Angeles. It will also stream on Disney+ and Hulu.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:30 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71709052\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/entertainment/music/raye-leads-2027-grammy-nominations-followed-by-rosalia-ella-langley-olivia-rodrigo-and-more/article71709052.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01 opnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 40, "title": "Robert Pattinson is named the 7th James Bond, taking over the role from Daniel Craig", "section": "Arts", "page": "", "teaser": "Mike Hopkins, head of Prime Video and Amazon MGM Studios, has vowed to uphold the franchise's legacy and usher in “the next phase in the legendary 007 for audiences around the world”", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/entertainment/\">\n                        Entertainment\n                    </a><meta content=\"Entertainment\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/entertainment/movies/\">\n                        Movies\n                    </a><meta content=\"Movies\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71708862\" data-title=\"Robert Pattinson is named the 7th James Bond, taking over the role from Daniel Craig\" data-url=\"https://www.thehindu.com/entertainment/movies/robert-pattinson-is-named-the-7th-james-bond-taking-over-the-role-from-daniel-craig/article71708862.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Mike Hopkins, head of Prime Video and Amazon MGM Studios, has vowed to uphold the franchise's legacy and usher in “the next phase in the legendary 007 for audiences around the world”</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:01 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/79xenm/article71708896.ece/alternates/LANDSCAPE_1200/Britain_LFF_Primetime_Red_Carpet_15444.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/79xenm/article71708896.ece/alternates/LANDSCAPE_1200/Britain_LFF_Primetime_Red_Carpet_15444.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/79xenm/article71708896.ece/alternates/LANDSCAPE_660/Britain_LFF_Primetime_Red_Carpet_15444.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/79xenm/article71708896.ece/alternates/LANDSCAPE_320/Britain_LFF_Primetime_Red_Carpet_15444.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    The naming of Pattinson comes during the longest hiatus in 007 history and ends years of rampant speculation. File\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71708862\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Robert Pattinson was unveiled as the next James Bond on Monday (November 16, 2026), becoming the seventh actor to play the iconic British spy and the first since Amazon MGM took over the beloved film franchise.</p><p>The naming of Pattinson comes during the longest hiatus in 007 history and ends years of rampant speculation about who would inherit <a href=\"https://www.thehindu.com/entertainment/movies/daniel-craig-bids-farewell-to-james-bond-weve-tried-to-tell-one-story-with-all-my-bond-movies/article36691236.ece\" target=\"_self\">the role from Daniel Craig.</a> It comes five years after 2021's “No Time to Die,” the first film in Bond’s 64-year history on the silver screen to conclude with the character's death. But 007 will be reborn, yet again, in the 26th Bond film, directed by Denis Villeneuve.</p><p>“James Bond is one of the most legendary characters in cinema, and to be entrusted with 007 is the honour of a lifetime,\" Pattinson said in a statement. “... To say this role is a dream come true is an understatement. I couldn’t be more excited about this partnership and the work ahead with this fantastic team.”</p><p class=\"referpara\"><strong><b>Also read:<a href=\"https://www.thehindu.com/features/magazine/baradwaj-rangan-on-james-bond-movie-spectre/article7923916.ece\" target=\"_self\"> Bonded to bond</a></b></strong></p><p>Pattinson only entered the Bond rumor mill recently after the revelation that he screen-tested for the role. Others reportedly in the mix included Callum Turner, Josh O’Connor, Jack Lowden and Nicholas Hoult.</p><p>While producers were long expected to go with a young, less-proven star, they instead opted for one of the best-known actors of his generation. Pattinson, 40, is also relatively old to begin as 007. The actor is currently in production on another iconic role in “The Batman Part II.”</p><p>Pattinson comes in already associated with three mega-franchises in “The Batman,” “Twilight” and “Harry Potter.” But since his breakthrough in “Twilight,” Pattinson has worked largely in more independent, auteur-driven films such as “Good Time” with the Safdie brothers, Robert Eggers’ “The Lighthouse” and Bong Joon Ho’s “Mickey 17.” Earlier this year, he drew rave reviews for his villainous performance in Christopher Nolan’s “The Odyssey.”</p><div class=\"inline_embed article-block-item\"><blockquote class=\"instagram-media\" data-instgrm-captioned=\"\" data-instgrm-permalink=\"https://www.instagram.com/p/DfzoK8nTJqI/?utm_source=ig_embed&amp;utm_campaign=loading\" data-instgrm-version=\"14\" style=\" background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin: 1px; max-width:540px; min-width:326px; padding:0; width:99.375%; width:-webkit-calc(100% - 2px); width:calc(100% - 2px);\"><div style=\"padding:16px;\"><a href=\"https://www.instagram.com/p/DfzoK8nTJqI/?utm_source=ig_embed&amp;utm_campaign=loading\" style=\" background:#FFFFFF; line-height:0; padding:0 0; text-align:center; text-decoration:none; width:100%;\" target=\"_blank\"><div style=\" display: flex; flex-direction: row; align-items: center;\"><div style=\"background-color: #F4F4F4; border-radius: 50%; flex-grow: 0; height: 40px; margin-right: 14px; width: 40px;\"></div><div style=\"display: flex; flex-direction: column; flex-grow: 1; justify-content: center;\"><div style=\" background-color: #F4F4F4; border-radius: 4px; flex-grow: 0; height: 14px; margin-bottom: 6px; wi r: #F4F4F4; border-radius: 50%; height: 12.5px; width: 12.5px; transform: translateX(9px) translateY(-18px);\"></div></div><div style=\"margin-left: 8px;\"><div style=\" background-color: #F4F4F4; border-radius: 50%; flex-grow: 0; height: 20px; width: 20px;\"></div><div style=\" width: 0; height: 0; border-top: 2px solid transparent; border-left: 6px solid #f4f4f4; border-bottom: 2px solid transparent; transform: translateX(16px) translateY(-4px) rotate(30deg)\"></div></div><div style=\"margin-left: auto;\"><div style=\" width: 0px; border-top: 8px solid #F4F4F4; border-right: 8px solid transparent; transform: translateY(16px);\"></div><div style=\" background-color: #F4F4F4; flex-grow: 0; height: 12px; width: 16px; transform: translateY(-4px);\"></div><div style=\" width: 0; height: 0; border-top: 8px solid #F4F4F4; border-left: 8px solid transparent; transform: translateY(-4px) translateX(8px);\"></div></div></div><div style=\"display: flex; flex-direction: column; flex-grow: 1; justify-content: center; margin-bottom: 24px;\"><div style=\" background-color: #F4F4F4; border-radius: 4px; flex-grow: 0; height: 14px; margin-bottom: 6px; width: 224px;\"></div><div style=\" background-color: #F4F4F4; border-radius: 4px; flex-grow: 0; height: 14px; width: 144px;\"></div></div></a><p style=\" color:#c9c8cd; font-family:Arial,sans-serif; font-size:14px; line-height:17px; margin-bottom:0; margin-top:8px; overflow:hidden; padding:8px 0 7px; text-align:center; text-overflow:ellipsis; white-space:nowrap;\"><a href=\"https://www.instagram.com/p/DfzoK8nTJqI/?utm_source=ig_embed&amp;utm_campaign=loading\" style=\" color:#c9c8cd; font-family:Arial,sans-serif; font-size:14px; font-style:normal; font-weight:normal; line-height:17px; text-decoration:none;\" target=\"_blank\">A post shared by James Bond 007 (@007)</a></p></div></blockquote></div><p>The casting comes at a pivotal juncture for the franchise. In 2022, Bond’s longtime studio, MGM, was bought by Amazon for $8.5 billion. After haggling over next steps for 007, producers Barbara Broccoli and Michael G. Wilson relinquished creative control of Bond in 2025. The still-untitled Bond 26 is the first Bond movie since 1962's inaugural “Dr. No” where a Broccoli didn't handpick the super spy.</p><p>Casting a new Bond fell instead to producers Amy Pascal — the former Sony Pictures chief and “Spider-Man” producer — and David Heyman, shepherd of “Harry Potter” and “Paddington.” Steven Knight (“Peaky Blinders,” “Locke”) was brought in to write the script.</p><p>Before Craig even departed the role, rumors and odds-making persisted nearly round-the-clock on who would follow in the footsteps of Sean Connery, George Lazenby, Roger Moore, Timothy Dalton, Pierce Brosnan and Craig. Idris Elba, for one, has spent half his career deflecting 007 conjecture.</p><p>The Bond machine has historically never slowed down. But the 26th installment will follow the longest absence ever for Bond. Given that “No Time to Die” completed principal photography in 2019 (its release was delayed due to the coronavirus pandemic), the lull is even longer.</p><p>Some fans are skeptical about the new Amazon-controlled chapter for Bond. Mike Hopkins, head of Prime Video and Amazon MGM Studios, has vowed to uphold the franchise's legacy and usher in “the next phase in the legendary 007 for audiences around the world.”</p><p>At stake is one of the most lucrative film series in Hollywood, based on Ian Fleming's series of novels. The Bond movies have grossed more than $7 billion worldwide in ticket sales. “No Time to Die” collected $774 million in 2021. The movies also spin out endless other revenue streams, from streaming deals and video games to Aston Martins.</p><p>Although some Bond actors came to view the role as a yoke around their necks, it turned Craig into a household name. The British actor wasn't widely known before his casting and, at the time, was derided as the first “blond Bond.”</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 09:01 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71708862\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/entertainment/movies/robert-pattinson-is-named-the-7th-james-bond-taking-over-the-role-from-daniel-craig/article71708862.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : \"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The actor opens up about his recently released Sony LIV film, ‘Parivaarik ManuRanjan’, sharing his thoughts on drifting ideas on love, his relationship with social media and more.</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 16, 2026 06:22 pm IST </span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/shreyas-pande-28110/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/shreyas-pande-28110/\">Shreyas Pande</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/entertainment/movies/7zpfev/article71707983.ece/alternates/LANDSCAPE_1200/Pankaj%20Tripathi\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/entertainment/movies/7zpfev/article71707983.ece/alternates/LANDSCAPE_1200/Pankaj%20Tripathi\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/entertainment/movies/7zpfev/article71707983.ece/alternates/LANDSCAPE_660/Pankaj%20Tripathi\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/entertainment/movies/7zpfev/article71707983.ece/alternates/LANDSCAPE_320/Pankaj%20Tripathi\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Pankaj Tripathi\n                                          | Photo Credit: Special Arrangement\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71707897\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Pankaj Tripathi brings his trademark tenderness and sensitivity to the recently released Sony LIV film, <i>Parivaarik ManuRanjan</i>. The romantic drama stars him as a lonely middle-class man, Ranjan, in Lucknow. He hires a young woman, Helen (Aditi Rao Hydari), as his live-in housekeeper, resulting in gossip in his neighbourhood. Ranjan forms an unlikely connection with Helen as his bond goes beyond traditional ideas of masculinity, exploring the softer echoes of love. Pankaj says he has an affinity for such “slice-of-life romance stories”, expressing his disdain for “filmy romance”.</p><p>“Filmy romance has put a lot of pressure on young middle-class people by providing an image of love. But that is beyond relatability,” says the actor, mentioning how market factors determine the face of love. “It is difficult to tell if our love is influenced by the market, cinema or our own hormones,” he adds, before proclaiming, “I feel real love happens only after the age of 30.”</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 16,              \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/489-483-428/\">\n                        Indian cinema\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/488-483-428/\">\n                        Hindi cinema\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/topic/The_Hindu_Metro_Plus/\">\n                        The Hindu MetroPlus\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}];
const SECTIONS = [{"name": "Front Page", "ids": [0, 1, 2, 3, 4, 5, 6, 7]}, {"name": "National", "ids": [8, 9]}, {"name": "International", "ids": [10, 11, 12, 13, 14, 15, 16, 17]}, {"name": "Business", "ids": [18, 19, 20, 21, 22, 23, 24]}, {"name": "Opinion", "ids": [25, 26, 27, 28, 29]}, {"name": "Sport", "ids": [30, 31, 32, 33, 34, 35]}, {"name": "Science", "ids": [36, 37]}, {"name": "Arts", "ids": [38, 39, 40, 41]}];

let currentSection = 0;
let articlePaneOpen = false;
const track = document.getElementById('pages-track');
const navInner = document.getElementById('nav-inner');
const pane = document.getElementById('article-pane');
const backBtn = document.getElementById('back-btn');

function syncThemeIcon() {
  const dark = document.documentElement.classList.contains('dark');
  document.getElementById('icon-sun').style.display  = dark ? 'block' : 'none';
  document.getElementById('icon-moon').style.display = dark ? 'none'  : 'block';
}

function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('th-theme', dark ? 'dark' : 'light');
  syncThemeIcon();
}

function buildUI() {
  SECTIONS.forEach((sec, si) => {
    const tab = document.createElement('div');
    tab.className = 'sec-tab' + (si === 0 ? ' active' : '');
    tab.textContent = sec.name;
    tab.onclick = () => goToSection(si);
    navInner.appendChild(tab);

    const page = document.createElement('div');
    page.className = 'section-page';
    page.id = 'page-' + si;

    const header = document.createElement('div');
    header.className = 'sec-header';
    header.innerHTML = `<h2>${sec.name}</h2><div class="art-count">${sec.ids.length} article${sec.ids.length !== 1 ? 's' : ''}</div>`;
    page.appendChild(header);

    sec.ids.forEach(aid => {
      const art = ARTICLES[aid];
      const row = document.createElement('div');
      row.className = 'article-row';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      row.setAttribute('aria-label', art.title);

      let metaHtml = '';
      if (art.page) metaHtml += `<span class="page-tag">P.${art.page}</span>`;
      metaHtml += `<span>${sec.name}</span>`;

      row.innerHTML = `
        <div class="art-meta">${metaHtml}</div>
        <div class="art-headline">${escHtml(art.title)}</div>
        ${art.teaser ? `<div class="art-teaser">${escHtml(art.teaser)}</div>` : ''}
        <div class="art-read-cue">Read &rsaquo;</div>
      `;
      row.onclick = () => openArticle(aid);
      row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openArticle(aid); };
      page.appendChild(row);
    });

    track.appendChild(page);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function goToSection(idx) {
  if (articlePaneOpen) return;
  currentSection = idx;
  track.style.transform = `translateX(${-idx * 100}vw)`;
  document.querySelectorAll('.sec-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  const activeTab = navInner.children[idx];
  if (activeTab) activeTab.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
}

function openArticle(aid) {
  const art = ARTICLES[aid];
  document.getElementById('pane-section').textContent = art.section;
  document.getElementById('pane-title').textContent = art.title;

  let metaHtml = '';
  if (art.page) metaHtml += `<span>Page ${art.page}</span>`;
  metaHtml += `<span>${art.section}</span>`;
  document.getElementById('pane-meta').innerHTML = metaHtml;

  const body = art.body || '<p><em>Content not available.</em></p>';
  document.getElementById('pane-body').innerHTML = body;

  const srcEl = document.getElementById('pane-source');
  srcEl.innerHTML = art.url
    ? `Read on thehindu.com: <a href="${escHtml(art.url)}" target="_blank" rel="noopener">${escHtml(art.url)}</a>`
    : '';

  pane.scrollTop = 0;
  pane.classList.remove('flying-out', 'flying-in');
  pane.classList.add('open');
  document.getElementById('pip-card').classList.remove('open');
  document.getElementById('blur-overlay').style.opacity = '1';
  document.getElementById('blur-overlay').style.pointerEvents = 'auto';
  articlePaneOpen = true;
  backBtn.style.display = 'flex';
  document.getElementById('section-nav').style.opacity = '0.4';
  document.getElementById('section-nav').style.pointerEvents = 'none';
  history.pushState({ article: aid }, '');
}

function pipArticle() {
  if (!articlePaneOpen) return;
  const sec  = document.getElementById('pane-section').textContent;
  const titl = document.getElementById('pane-title').textContent;
  document.getElementById('pip-sec').textContent   = sec;
  document.getElementById('pip-title').textContent = titl;
  pane.classList.remove('open');
  pane.classList.add('flying-out');
  pane.addEventListener('animationend', () => {
    pane.classList.remove('flying-out');
  }, { once: true });
  document.getElementById('blur-overlay').style.opacity = '0';
  document.getElementById('blur-overlay').style.pointerEvents = 'none';
  document.getElementById('pip-card').classList.add('open');
  articlePaneOpen = false;
  backBtn.style.display = 'none';
  document.getElementById('section-nav').style.opacity = '';
  document.getElementById('section-nav').style.pointerEvents = '';
}

function restoreArticle() {
  document.getElementById('pip-card').classList.remove('open');
  pane.classList.remove('open');
  pane.classList.add('flying-in');
  pane.addEventListener('animationend', () => {
    pane.classList.remove('flying-in');
    pane.classList.add('open');
  }, { once: true });
  setTimeout(() => {
    document.getElementById('blur-overlay').style.opacity = '1';
    document.getElementById('blur-overlay').style.pointerEvents = 'auto';
  }, 100);
  articlePaneOpen = true;
  backBtn.style.display = 'flex';
  document.getElementById('section-nav').style.opacity = '0.4';
  document.getElementById('section-nav').style.pointerEvents = 'none';
}

function closeArticle(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  pane.classList.remove('open', 'flying-out', 'flying-in');
  document.getElementById('pip-card').classList.remove('open');
  document.getElementById('blur-overlay').style.opacity = '0';
  document.getElementById('blur-overlay').style.pointerEvents = 'none';
  articlePaneOpen = false;
  backBtn.style.display = 'none';
  document.getElementById('section-nav').style.opacity = '';
  document.getElementById('section-nav').style.pointerEvents = '';
}

window.addEventListener('popstate', () => {
  if (articlePaneOpen) pipArticle();
  else closeArticle();
});

// Touch swipe on pages viewport
let touchStartX = 0, touchStartY = 0, swiping = false;
const viewport = document.getElementById('pages-viewport');

viewport.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  swiping = false;
}, { passive: true });

viewport.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!swiping && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
    swiping = true;
  }
  if (swiping) e.preventDefault();
}, { passive: false });

viewport.addEventListener('touchend', e => {
  if (!swiping || articlePaneOpen) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 45) {
    const next = currentSection + (dx < 0 ? 1 : -1);
    if (next >= 0 && next < SECTIONS.length) goToSection(next);
  }
}, { passive: true });

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (articlePaneOpen) pipArticle(); else closeArticle(); return; }
  if (e.key === 'ArrowRight' && currentSection < SECTIONS.length - 1) goToSection(currentSection + 1);
  if (e.key === 'ArrowLeft' && currentSection > 0) goToSection(currentSection - 1);
});

buildUI();
goToSection(0);
syncThemeIcon();
</script>
