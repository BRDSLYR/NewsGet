<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>The Hindu — Delhi — 25 August 2026</title>
<script>
(function(){
  var saved = localStorage.getItem('th-theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #1a1a18;
  --ink-muted:  #4a4a45;
  --ink-faint:  #8a8a82;
  --paper:      #f8f6f0;
  --paper-warm: #f0ede4;
  --rule:       #c8c4b8;
  --red:        #b00020;
  --font-head:  'Georgia', 'Times New Roman', serif;
  --font-body:  'Georgia', 'Times New Roman', serif;
  --font-ui:    system-ui, -apple-system, sans-serif;
}

html.dark {
  --ink:        #e8e4dc;
  --ink-muted:  #a8a49c;
  --ink-faint:  #6a6660;
  --paper:      #181816;
  --paper-warm: #211f1c;
  --rule:       #38352f;
  --red:        #e05070;
}

html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ── Masthead ── */
#masthead {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--ink); color: var(--paper);
  padding: 0 1rem;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
  user-select: none;
}
#masthead .nameplate {
  font-family: var(--font-head);
  font-size: 1.3rem; font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
}
#masthead .edition-date {
  font-family: var(--font-ui);
  font-size: 0.7rem; color: #aaa;
  text-align: right; line-height: 1.35;
}
#masthead .back-btn {
  display: none; align-items: center; gap: 6px;
  background: none; border: none; color: var(--paper);
  font-family: var(--font-ui); font-size: 0.8rem;
  cursor: pointer; padding: 8px 0; min-width: 60px;
}
#masthead .back-btn svg { flex-shrink: 0; }

/* ── Section nav strip ── */
#section-nav {
  position: fixed; top: 52px; left: 0; right: 0; z-index: 99;
  background: var(--paper-warm);
  border-bottom: 2px solid var(--ink);
  overflow-x: auto; overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  transition: opacity 0.2s, transform 0.2s;
}
#section-nav::-webkit-scrollbar { display: none; }
#section-nav .nav-inner {
  display: inline-flex; padding: 0 0.5rem;
}
.sec-tab {
  display: inline-block;
  font-family: var(--font-ui); font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-muted);
  padding: 9px 10px;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.sec-tab.active {
  color: var(--ink);
  border-bottom-color: var(--red);
}

/* ── Pages viewport ── */
#pages-viewport {
  position: fixed;
  top: 93px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
#pages-track {
  display: flex; height: 100%;
  transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ── Individual section page ── */
.section-page {
  flex: 0 0 100vw; width: 100vw; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 1.2rem 0 2rem;
}
.section-page::-webkit-scrollbar { width: 3px; }
.section-page::-webkit-scrollbar-thumb { background: var(--rule); }

.sec-header {
  padding: 0 1rem 0.6rem;
  border-bottom: 3px double var(--ink);
  margin-bottom: 0.1rem;
}
.sec-header h2 {
  font-family: var(--font-head);
  font-size: 1.05rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red);
}
.sec-header .art-count {
  font-family: var(--font-ui); font-size: 0.7rem;
  color: var(--ink-faint); margin-top: 1px;
}

.article-row {
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 0.5px solid var(--rule);
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: background 0.12s;
  gap: 0.25rem;
}
.article-row:active { background: var(--paper-warm); }
@media (hover: hover) {
  .article-row:hover { background: var(--paper-warm); }
}

.art-meta {
  font-family: var(--font-ui); font-size: 0.65rem;
  color: var(--ink-faint); letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex; gap: 0.5rem; align-items: center;
}
.art-meta .page-tag {
  background: var(--ink); color: var(--paper);
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.6rem;
}
.art-headline {
  font-family: var(--font-head);
  font-size: 1.02rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
}
.art-teaser {
  font-family: var(--font-body); font-size: 0.8rem;
  color: var(--ink-muted); line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.art-read-cue {
  font-family: var(--font-ui); font-size: 0.68rem;
  color: var(--red); font-weight: 600;
  letter-spacing: 0.03em;
  align-self: end;
  text-align: right;
}

/* ── Article pane fly animations ── */
@keyframes fly-to-pip {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
}
@keyframes fly-from-pip {
  0%   { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
  100% { opacity: 1; transform: scale(1); }
}

/* ── Article pane — floating card ── */
#article-pane {
  position: fixed;
  top: 58px; left: 50%; bottom: 12px;
  transform: translateX(-50%) scale(0.96);
  width: min(900px, calc(100vw - 1rem));
  background: var(--paper);
  border-radius: 12px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity: 0;
  pointer-events: none;
  transform-origin: center bottom;
  z-index: 101;
  padding: 1.5rem 1.5rem 3rem;
  transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
}
#article-pane.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) scale(1);
  animation: none;
}
#article-pane.flying-out { pointer-events: none; animation: fly-to-pip 0.75s cubic-bezier(0.4,0,0.2,1) forwards; }
#article-pane.flying-in  { pointer-events: none; animation: fly-from-pip 0.4s cubic-bezier(0.2,0,0,1) forwards; }
#article-pane::-webkit-scrollbar { width: 3px; }
#article-pane::-webkit-scrollbar-thumb { background: var(--rule); }

#article-pane .art-pane-section {
  font-family: var(--font-ui); font-size: 0.68rem;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--red);
  margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 0.5rem;
}
#article-pane .art-pane-section::after {
  content: ''; flex: 1; height: 1px; background: var(--rule);
}
#article-pane h1 {
  font-family: var(--font-head);
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  font-weight: 700; line-height: 1.25;
  color: var(--ink); margin-bottom: 0.75rem;
}
#article-pane .art-pane-meta {
  font-family: var(--font-ui); font-size: 0.72rem;
  color: var(--ink-faint); margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--rule);
  display: flex; gap: 1rem; flex-wrap: wrap;
}
#article-pane .art-pane-body {
  font-size: 1rem; line-height: 1.75; color: var(--ink);
}
#article-pane .art-pane-body p { margin-bottom: 0.9rem; }
#article-pane .art-pane-body h2,
#article-pane .art-pane-body h3 {
  font-family: var(--font-head);
  font-weight: 700; margin: 1.25rem 0 0.4rem;
  color: var(--ink);
}
#article-pane .art-pane-body img {
  max-width: 100%; height: auto;
  display: block; margin: 1rem 0;
}
#article-pane .art-pane-body figcaption {
  font-size: 0.75rem; color: var(--ink-faint);
  margin-top: -0.5rem; margin-bottom: 1rem;
  font-style: italic;
}
#article-pane .art-source-link {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-faint);
}
#article-pane .art-source-link a { color: var(--red); }

.art-print-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 1rem;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 14px;
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-muted); cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.art-print-btn:hover { border-color: var(--ink-muted); color: var(--ink); }
.art-print-btn svg { flex-shrink: 0; }

/* ── Background blur overlay ── */
#blur-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 98;
  backdrop-filter: blur(6px) brightness(0.85);
  -webkit-backdrop-filter: blur(6px) brightness(0.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}


/* ── PiP card ── */
#pip-card {
  position: fixed;
  bottom: 14px; right: 14px;
  width: 200px;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--rule);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.88) translateY(8px);
  transform-origin: bottom right;
  transition: opacity 0.3s ease 0.52s, transform 0.35s cubic-bezier(0.34,1.4,0.64,1) 0.52s;
  z-index: 103;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
#pip-card.open { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
#pip-card:hover { border-color: var(--ink-muted); }
.pip-head {
  background: var(--ink); padding: 7px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.pip-logo { font-family: var(--font-head); font-size: 0.68rem; font-weight: 700; color: var(--paper); }
.pip-close {
  background: none; border: none; color: #aaa; cursor: pointer;
  padding: 2px; display: flex; align-items: center; border-radius: 3px;
  transition: color 0.15s;
}
.pip-close:hover { color: var(--paper); }
.pip-body { padding: 8px 10px 10px; }
.pip-sec {
  font-family: var(--font-ui); font-size: 0.58rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red); margin-bottom: 4px;
}
.pip-title {
  font-family: var(--font-head); font-size: 0.72rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.pip-hint { font-family: var(--font-ui); font-size: 0.58rem; color: var(--ink-faint); }

/* ── Fallback notice ── */
.fallback-notice {
  font-family: var(--font-ui); font-size: 0.75rem;
  background: #fff8dc; border: 1px solid #e0c000;
  color: #555; padding: 0.5rem 1rem;
  margin: 0.5rem 1rem 0;
  border-radius: 4px;
}

/* ── Print styles ── */
@media print {
  body, html { overflow: visible !important; background: #fff !important; }
  #masthead, #section-nav, #pages-viewport, #blur-overlay,
  #pip-card, #swipe-hint, .art-print-btn { display: none !important; }
  #article-pane {
    position: static !important;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    border-radius: 0 !important;
    padding: 2rem !important;
    background: #fff !important;
    color: #000 !important;
    box-shadow: none !important;
  }
  #article-pane .art-pane-section,
  #article-pane h1,
  #article-pane .art-pane-meta,
  #article-pane .art-pane-body,
  #article-pane .art-source-link { display: block !important; color: #000 !important; }
  #article-pane .art-pane-body img { max-width: 100% !important; }
  a { color: #000 !important; text-decoration: none !important; }
}

/* ── Swipe hint (first load) ── */
#swipe-hint {
  position: fixed; bottom: 1.2rem; left: 50%;
  transform: translateX(-50%);
  background: rgba(26,26,24,0.75); color: #f8f6f0;
  font-family: var(--font-ui); font-size: 0.72rem;
  padding: 6px 14px; border-radius: 20px;
  pointer-events: none;
  animation: fadeout 3s ease 1.5s forwards;
  white-space: nowrap; z-index: 200;
}
@keyframes fadeout { to { opacity: 0; } }

/* ── Desktop: wider article reading column ── */
/* ── Theme toggle ── */
#theme-toggle {
  background: none; border: none;
  color: var(--paper); cursor: pointer;
  padding: 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.75; transition: opacity 0.15s;
  flex-shrink: 0;
}
#theme-toggle:hover { opacity: 1; }
#theme-toggle svg { display: block; }

@media (min-width: 700px) {
  #article-pane {
    padding: 2rem 2.5rem 4rem;
  }
  .article-row {
    grid-template-columns: 1fr;
    padding: 0.9rem 1.5rem;
  }
  .sec-header { padding: 0 1.5rem 0.7rem; }
  .section-page { padding: 1.4rem 0 2rem; }
  .art-headline { font-size: 1.1rem; }
  #masthead .nameplate { font-size: 1.5rem; }
  .fallback-notice { margin: 0.5rem 1.5rem 0; }
}
</style>
</head>

<header id="masthead">
  <button class="back-btn" id="back-btn" onclick="closeArticle(event)" aria-label="Back to section">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    </button>

</header>

<nav id="section-nav"><div class="nav-inner" id="nav-inner"></div></nav>



<div id="pages-viewport">

</div>

let currentSection = 0;
let articlePaneOpen = false;
const track = document.getElementById('pages-track');
const navInner = document.getElementById('nav-inner');
const pane = document.getElementById('article-pane');
const backBtn = document.getElementById('back-btn');

function syncThemeIcon() {
  const dark = document.documentElement.classList.contains('dark');
  document.getElementById('icon-sun').style.display  = dark ? 'block' : 'none';
  document.getElementById('icon-moon').style.display = dark ? 'none'  : 'block';
}

function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('th-theme', dark ? 'dark' : 'light');
  syncThemeIcon();
}

function buildUI() {
  SECTIONS.forEach((sec, si) => {
    const tab = document.createElement('div');
    tab.className = 'sec-tab' + (si === 0 ? ' active' : '');
    tab.textContent = sec.name;
    tab.onclick = () => goToSection(si);
    navInner.appendChild(tab);

    const page = document.createElement('div');
    page.className = 'section-page';
    page.id = 'page-' + si;

    const header = document.createElement('div');
    header.className = 'sec-header';
    header.innerHTML = `<h2>${sec.name}</h2><div class="art-count">${sec.ids.length} article${sec.ids.length !== 1 ? 's' : ''}</div>`;
    page.appendChild(header);

    sec.ids.forEach(aid => {
      const art = ARTICLES[aid];
      const row = document.createElement('div');
      row.className = 'article-row';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      row.setAttribute('aria-label', art.title);

      let metaHtml = '';
      if (art.page) metaHtml += `<span class="page-tag">P.${art.page}</span>`;
      metaHtml += `<span>${sec.name}</span>`;

      row.innerHTML = `
        <div class="art-meta">${metaHtml}</div>
        <div class="art-headline">${escHtml(art.title)}</div>
        ${art.teaser ? `<div class="art-teaser">${escHtml(art.teaser)}</div>` : ''}
        <div class="art-read-cue">Read &rsaquo;</div>
      `;
      row.onclick = () => openArticle(aid);
      row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openArticle(aid); };
      page.appendChild(row);
    });

    track.appendChild(page);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function goToSection(idx) {
  if (articlePaneOpen) return;
  currentSection = idx;
  track.style.transform = `translateX(${-idx * 100}vw)`;
  document.querySelectorAll('.sec-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  const activeTab = navInner.children[idx];
  if (activeTab) activeTab.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
}

function openArticle(aid) {
  const art = ARTICLES[aid];
  document.getElementById('pane-section').textContent = art.section;
  document.getElementById('pane-title').textContent = art.title;

  let metaHtml = '';
  if (art.page) metaHtml += `<span>Page ${art.page}</span>`;
  metaHtml += `<span>${art.section}</span>`;
  document.getElementById('pane-meta').innerHTML = metaHtml;

  const body = art.body || '<p><em>Content not available.</em></p>';
  document.getElementById('pane-body').innerHTML = body;

  const srcEl = document.getElementById('pane-source');
  srcEl.innerHTML = art.url
    ? `Read on thehindu.com: <a href="${escHtml(art.url)}" target="_blank" rel="noopener">${escHtml(art.url)}</a>`
    : '';

  pane.scrollTop = 0;
  pane.classList.remove('flying-out', 'flying-in');
  pane.classList.add('open');
  document.getElementById('pip-card').classList.remove('open');
  document.getElementById('blur-overlay').style.opacity = '1';
  document.getElementById('blur-overlay').style.pointerEvents = 'auto';
  articlePaneOpen = true;
  backBtn.style.display = 'flex';
  document.getElementById('section-nav').style.opacity = '0.4';
  document.getElementById('section-nav').style.pointerEvents = 'none';
  history.pushState({ article: aid }, '');
}

function pipArticle() {
  if (!articlePaneOpen) return;
  const sec  = document.getElementById('pane-section').textContent;
  const titl = document.getElementById('pane-title').textContent;
  document.getElementById('pip-sec').textContent   = sec;
  document.getElementById('pip-title').textContent = titl;
  pane.classList.remove('open');
  pane.classList.add('flying-out');
  pane.addEventListener('animationend', () => {
    pane.classList.remove('flying-out');
  }, { once: true });
  document.getElementById('blur-overlay').style.opacity = '0';
  document.getElementById('blur-overlay').style.pointerEvents = 'none';
  document.getElementById('pip-card').classList.add('open');
  articlePaneOpen = false;
  backBtn.style.display = 'none';
  document.getElementById('section-nav').style.opacity = '';
  document.getElementById('section-nav').style.pointerEvents = '';
}

function restoreArticle() {
  document.getElementById('pip-card').classList.remove('open');
  pane.classList.remove('open');
  pane.classList.add('flying-in');
  pane.addEventListener('animationend', () => {
    pane.classList.remove('flying-in');
    pane.classList.add('open');
  }, { once: true });
  setTimeout(() => {
    document.getElementById('blur-overlay').style.opacity = '1';
    document.getElementById('blur-overlay').style.pointerEvents = 'auto';
  }, 100);
  articlePaneOpen = true;
  backBtn.style.display = 'flex';
  document.getElementById('section-nav').style.opacity = '0.4';
  document.getElementById('section-nav').style.pointerEvents = 'none';
}

function closeArticle(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  pane.classList.remove('open', 'flying-out', 'flying-in');
  document.getElementById('pip-card').classList.remove('open');
  document.getElementById('blur-overlay').style.opacity = '0';
  document.getElementById('blur-overlay').style.pointerEvents = 'none';
  articlePaneOpen = false;
  backBtn.style.display = 'none';
  document.getElementById('section-nav').style.opacity = '';
  document.getElementById('section-nav').style.pointerEvents = '';
}

window.addEventListener('popstate', () => {
  if (articlePaneOpen) pipArticle();
  else closeArticle();
});

// Touch swipe on pages viewport
let touchStartX = 0, touchStartY = 0, swiping = false;
const viewport = document.getElementById('pages-viewport');

viewport.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  swiping = false;
}, { passive: true });

viewport.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!swiping && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
    swiping = true;
  }
  if (swiping) e.preventDefault();
}, { passive: false });

viewport.addEventListener('touchend', e => {
  if (!swiping || articlePaneOpen) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 45) {
    const next = currentSection + (dx < 0 ? 1 : -1);
    if (next >= 0 && next < SECTIONS.length) goToSection(next);
  }
}, { passive: true });

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (articlePaneOpen) pipArticle(); else closeArticle(); return; }
  if (e.key === 'ArrowRight' && currentSection < SECTIONS.length - 1) goToSection(currentSection + 1);
  if (e.key === 'ArrowLeft' && currentSection > 0) goToSection(currentSection - 1);
});

buildUI();
goToSection(0);
syncThemeIcon();
</script>
</body>
</html>
