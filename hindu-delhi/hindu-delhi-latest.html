></div></div></div></div></div>"}, {"id": 22, "title": "Straws in the wind: On the Bankipur, Datia and Manjalpur by-elections", "section": "Editorial", "page": "", "teaser": "India’s voters do not seem averse to fresh political experiments", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Opinion\n                    </a><meta content=\"Opinion\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/editorial/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Editorial\n                    </a><meta content=\"Editorial\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 editorial\" data-id=\"71305481\" data-title=\"Straws in the wind: On the Bankipur, Datia and Manjalpur by-elections\" data-url=\"https://www.thehindu.com/opinion/editorial/straws-in-the-wind-on-the-bankipur-datia-and-manjalpur-by-elections/article71305481.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">India’s voters do not seem averse to fresh political experiments</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - August 05, 2026 11:09 am IST </span></p></div><div class=\"author\"></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71305481\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>The by-elections held on July 30, 2026 in three Assembly constituencies across three Bharatiya Janata Party (BJP)-ruled States threw up some surprises, but it may be risky to read them as indicators of any definitive or enduring political trend. Still, <a href=\"https://www.thehindu.com/news/national/bihar/bankipur-bihar-bypoll-result-prashant-kishor-rekha-guptaneeraj-kumar-august-3-2026/article71299772.ece\" target=\"_self\">Bankipur</a> in Bihar, <a href=\"https://www.thehindu.com/news/national/madhya-pradesh/datia-bypoll-boost-for-congress-reality-check-for-bjp/article71302520.ece\" target=\"_self\">Datia</a> in Madhya Pradesh and <a href=\"https://www.thehindu.com/news/national/gujarat/manjalpur-assembly-bypoll-in-gujarat-result/article71299773.ece\" target=\"_self\">Manjalpur</a> in Gujarat were among the most closely watched electoral contests. Though involving only three seats, the results were significant, offering clues about regional political currents, the strength of major parties and the prospects of emerging political formations. These were also the first electoral tests after student protests forced the BJP to remove Union Education Minister Dharmendra Pradhan on July 25. The most consequential result came from Bankipur. The seat fell vacant after BJP national president Nitin Nabin resigned following his election to the Rajya Sabha. Jan Suraaj Party (JSP) founder <a href=\"https://www.thehindu.com/news/national/bihar/prashant-kishor-from-a-political-strategist-to-a-legislator/article71300459.ece\" target=\"_self\">Prashant Kishor</a> chose the constituency for his electoral debut, turning what would otherwise have been a routine by-election into a high-profile political contest. He defeated BJP candidate Neeraj Kumar by 19,324 votes, ending decades of BJP dominance in the constituency. It marks the JSP’s first major electoral success and gives Mr. Kishor political legitimacy after years as an election strategist.</p><p>In Datia, the Congress secured an important victory as its candidate, Ghanshyam Singh, defeated BJP candidate Ashutosh Tiwari by just over 6,000 votes. Unlike Bankipur, Datia witnessed a robust voter turnout of 71.44%, indicating strong local engagement with the contest and suggesting that the Congress retains pockets of resilience in Madhya Pradesh despite the BJP’s dominance. The victory does not alter the balance of power in the Assembly, but gives the Congress evidence that local anti-incumbency and candidate-specific factors can still work in its favour. For the BJP, the defeat serves as a reminder that its Statewide strength does not automatically translate into victory in every constituency. The third contest, in Manjalpur produced a different outcome. The BJP retained the constituency, with Satish Govindbhai Patel defeating his rival by over 30,000 votes. Manjalpur demonstrates the BJP’s ability to hold its core support base. At the same time, the outcomes in Bankipur and Datia suggest some volatility among the BJP’s core social base of Hindu voters, particularly the upper castes. There is also a larger acceptance among the electorate for fresh political experiments, and that is a trend that connects what happened in the Tamil Nadu Assembly elections with Bankipur. If this trend holds, the challenge will be not only for the BJP but also for other legacy parties, including and particularly the Congress.</p><div class=\"fragmentcontent lazy\" data-fragment-url=\"https://www.thehindu.com/fragment/getregionallist/71305481\" id=\"reginallist\"></div></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 12:20 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71305481\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/editorial/straws-in-the-wind-on-the-bankipur-datia-and-manjalpur-by-elections/article71305481.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x tion/\">\n                        education\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/topic/cockroach-janta-party/\">\n                        Cockroach Janta Party\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/978-976-923/\">\n                        students\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/1417-1415-1349/\">\n                        Rajya Sabha\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/topic/indian-national-congress/\">\n                        Indian National Congress\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/1379-1369-1349/\">\n                        voting\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/caste/\">\n                        Caste\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/topic/tamil-nadu-assembly-elections-2026/\">\n                        Tamil Nadu Assembly Elections 2026\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/topic/jan-suraaj-party/\">\n                        Jan Suraaj Party\n                    </a></p></div></div></div><div class=\"print-hide col-x nan and Gurjapneet help Madurai Panthers pull off a heist against Trichy Grand Cholas\" data-url=\"https://www.thehindu.com/sport/tnpl-saravanan-and-gurjapneet-help-madurai-panthers-pull-off-a-heist/article71310854.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 11:54 pm IST - Dindigul</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/s-shrivathsan-28634/\">S. Shrivathsan</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/cx848n/article71310938.ece/alternates/FREE_1200/10216_5_8_2026_19_26_11_2_05_08_2026_SARAVANAN_SINGH_1.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/cx848n/article71310938.ece/alternates/FREE_1200/10216_5_8_2026_19_26_11_2_05_08_2026_SARAVANAN_SINGH_1.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/cx848n/article71310938.ece/alternates/FREE_1200/10216_5_8_2026_19_26_11_2_05_08_2026_SARAVANAN_SINGH_1.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/cx848n/article71310938.ece/alternates/FREE_1200/10216_5_8_2026_19_26_11_2_05_08_2026_SARAVANAN_SINGH_1.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Gurjapneet Singh and P. Saravanan emerged unlikely batting heroes to take Madurai Panthers home against Trichy Grand Cholas.\n                                          | Photo Credit: G. KARTHIKEYAN\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310854\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>The phrase ‘it’s not over until it’s over’ holds true for sport, especially the shortest format of cricket where the complexion of a match can change in the blink of an eye.</p><p>The unpredictable nature of T20s was on full display at the Tamil Nadu Premier League on Wednesday, when Madurai Panthers snatched victory from the jaws of defeat against Trichy Grand Cholas. At the NPR College Ground here, P. Saravanan (26 not out off 13 balls, 2x4, 2x6) and Gurjapneet Singh (21 not out off nine balls, 3x4, 1x6) emerged as the unlikely batting heroes, pulling off a nail-biting two-wicket win with two deliveries to spare.</p><p>When Gurjapneet joined forces with Saravanan, Panthers appeared to be down in the dumps – they required 42 runs off just 17 balls in their 174-run pursuit.</p><p>But Gurjapneet provided a glimmer of hope, smacking Antony Dhas for two fours and a six in the 18th over, before Saravanan completed the epic turnaround with a maximum and a four off R. Rajkumar in the final over. Panthers experienced a slice of luck in the penultimate over, during which Shyam Sundar spilled a chance offered by Saravanan at long-off.</p><p>Earlier, pacer S. Rajalingam (three for 26) helped Madurai keep Trichy down to 173 for seven after B. Anirudh Sitaram elected to field.</p><p>In the other game, a final flourish with the bat and a well-executed bowling show propelled Nellai Royal Kings to a comfortable 50-run victory over Chepauk Super Gillies.</p><p><b>The scores:</b> Trichy Grand Cholas 173/7 in 20 overs (J. Suresh Kumar 43, Sanjay Yadav 37 n.o., R. Rajkumar 35, S. Rajalingam 3/26) lost to Madurai Panthers 174/8 in 19.4 overs (Kiran Karthikeyan 38, Gowtham Thamarai Kannan (Impact Player) 2/36, R. Rajkumar 2/37, Antony Dhas 3/36).</p><p>Nellai Royal Kings 204/6 in 20 overs (S.R. Athish 41, Rithik Easwaran 36, Sonu Yadav 35 n.o., Abhishek Tanwar 2/54, M. Silambarasan 2/24) bt Chepauk Super Gillies 154 in 17.2 overs (Ashwanth Valthapa 31, R. Rohit 2/41, B. Rocky (IP) 2/22, N.S. Harish 4/25, Sonu Yadav 2/16).</p><p><b>Thursday’s match:</b> SKM Salem Spartans vs. Vida Kovai Kings, 7.30 p.m.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 11:54 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310854\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/tnpl-saravanan-and-gurjapneet-help-madurai-panthers-pull-off-a-heist/article71310854.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_ her: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/1683-1569/\">\n                        cricket\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 24, "title": "Asunta Lakra denies charges against her, questions Hockey India’s Ethics Committee jurisdiction", "section": "Sport", "page": "", "teaser": "", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/sport/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Sport\n                    </a><meta content=\"Sport\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310638\" data-title=\"Asunta Lakra denies charges against her, questions Hockey India’s Ethics Committee jurisdiction\" data-url=\"https://www.thehindu.com/sport/asunta-denies-charges-questions-ethics-committee-jurisdiction/article71310638.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:28 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://sportstar.thehindu.com/profile/author/uthra-ganesan-12364/\">Uthra Ganesan</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310638\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p> Former Indian women’s hockey team captain and selector Asunta Lakra has not only denied all allegations made against her by another player but also questioned the jurisdiction of the Ethics Committee itself and the maintainability of the proceedings against her.</p><p>“I deny each and every allegation, insinuation and imputation levelled against me in the said complaints, whether express or implied...The allegations are false, baseless, malicious, motivated, defamatory and are a complete distortion of facts,” Asunta wrote in a detailed preliminary reply to the chairman of Hockey India’s Ethics Committee Justice (Retd) Raghvendra Kumar on Wednesday.</p><p>Asunta, who has levelled serious allegations of sexual misconduct against coach Sudhir Golla and criminal intimidation against Hockey India Secretary-General Bholanath Singh, had complaints filed against her by Albela Rani Toppo and had been asked to reply by August 5.</p><p>“Both the complaints in question are, on their own face, addressed to the Secretary General, Hockey India, and not to the President, Hockey India...Under the scheme of the bylaws of Hockey India adopted on 20th June, 2026 and the Code of Ethics framed thereunder, the Ethics Committee is not a body of original or <i>suo-motu</i> jurisdiction... A complaint referable to the Ethics Committee must first be placed before, examined by and referred in writing by the President, Hockey India, who alone performs the gatekeeping function.</p><p>“Until such a written reference is made by the President, the Ethics Committee is not, and cannot be, seized of the complaint, and no inquiry – fact-finding or otherwise - can be commenced against any person,” she stated.</p><p>She also questioned the veracity of the notice issued to her “at the instance of secretary-general” given that he is a person of interest in the matter. Asunta also questioned the constitution of the Ethics Committee and the authority of the chairman to hold an enquiry, issue notice or record findings singly. “The Ethics Committee is a collegiate body which must act as a body and through a validly constituted quorum,” she wrote.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:28 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310638\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/asunta-denies-charges-questions-ethics-committee-jurisdiction/article71310638.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 25, "title": "Durand Cup | Indian Army eases past Baghpat, on top of Group B", "section": "Sport", "page": "", "teaser": "", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/sport/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Sport\n                    </a><meta content=\"Sport\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/sport/football/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Football\n                    </a><meta content=\"Football\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310695\" data-title=\"Durand Cup | Indian Army eases past Baghpat, on top of Group B\" data-url=\"https://www.thehindu.com/sport/football/durand-cup-indian-army-eases-pastbaghpat-on-top-of-group-b/article71310695.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 09:44 pm IST - KOLKATA:</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/sports-bureau-307/\">Sports Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/sport/t3hz3x/article71310702.ece/alternates/LANDSCAPE_1200/TH06DURAND.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/sport/t3hz3x/article71310702.ece/alternates/LANDSCAPE_1200/TH06DURAND.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/sport/t3hz3x/article71310702.ece/alternates/LANDSCAPE_660/TH06DURAND.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/sport/t3hz3x/article71310702.ece/alternates/LANDSCAPE_320/TH06DURAND.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Samir opened the scoring for Indian Army in the 11th minute.\n                                          | Photo Credit: X@thedurandcup\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310695\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Indian Army stormed to the top of Group B with a dominant 4-0 victory over Baghpat FC in a group league match of the 135th Durand Cup tournament at the Kishore Bharati Stadium on Wednesday.</p><p>The Army side produced a fine first-half performance, with Samir Murmu, Saikhom Borish Singh, Shubham Rana, and Christopher Kamei finding the net in succession to seal their team’s second successive win.</p><p>The win also took Indian Army to six points from two matches and moved it ahead of Samaleswari FC — also on six points — on the basis of a superior goal difference. Baghpat, which suffered its third consecutive defeat, exited the tournament without a point.</p><p>In the other match of the day, Indian Navy FT beat NEROCA FC 2-0 in a Group D encounter at the Khuman Lampak Main Stadium in Imphal.</p><p>Roshan Panna opened the scoring in the first half before E. Muhammed Inayath doubled the lead after the break to seal the Sailors’ first win. Indian Navy had lost its opening fixture 0-1 to local side FC Raengdai.</p><p>The win lifted Indian Navy to three points from two matches, leaving it second in the group behind FC Raengdai (six points).</p><p><b>The results: Group B: (Kolkata): </b>Indian Army FT 4 (Samir Murmu 11, Saikhom Borish Singh 22, Shubham Rana 35, Christopher Kamei 45+3) bt Baghpat FC 0.</p><p><b>Group D (Imphal):</b> Indian Navy FT 2 (Roshan Panna 23, Muhammed Inayath 65) bt NEROCA FC 0.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 09:44 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310695\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/football/durand-cup-indian-army-eases-pastbaghpat-on-top-of-group-b/article71310695.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 26, "title": "Sindhu, Lakshya get easy openers, Ayush draws top-ranked Shi Yu Qi at World Championships", "section": "Sport", "page": "", "teaser": "Fifth-seed pair of Satwiksairaj Rankireddy and Chirag Shetty receive a bye in the opening round", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/sport/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Sport\n                    </a><meta content=\"Sport\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71309857\" data-title=\"Sindhu, Lakshya get easy openers, Ayush draws top-ranked Shi Yu Qi at World Championships\" data-url=\"https://www.thehindu.com/sport/sindhu-lakshya-get-easy-openers-ayush-draws-top-ranked-shi-yu-qi-at-world-championships/article71309857.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Fifth-seed pair of Satwiksairaj Rankireddy and Chirag Shetty receive a bye in the opening round</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 08:43 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://sportstar.thehindu.com/profile/author/uthra-ganesan-12364/\">Uthra Ganesan</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/8ifqc9/article71310249.ece/alternates/FREE_1200/TH12-BAD-THAI-OGCVFVFBQ5.3.jpg.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/8ifqc9/article71310249.ece/alternates/FREE_1200/TH12-BAD-THAI-OGCVFVFBQ5.3.jpg.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/8ifqc9/article71310249.ece/alternates/FREE_1200/TH12-BAD-THAI-OGCVFVFBQ5.3.jpg.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/8ifqc9/article71310249.ece/alternates/FREE_1200/TH12-BAD-THAI-OGCVFVFBQ5.3.jpg.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Lakshya Sen will begin his campaign against Collins Valentine Filimon.\n                                          | Photo Credit: File photo: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309857\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p> P.V. Sindhu will kickstart her pursuit of a sixth World Championship medal against Sophia Noble of Ireland but the road to the top will be anything but easy for most Indians after a mixed bag at the draw here on Wednesday.</p><p>With a 64-player draw for the men’s and women’s singles, there are no byes for the seeded players, unlike the doubles which is a 48-pair event allowing the 16 seeded pairs, including Satwiksairaj Rankireddy and Chirag Shetty to advance to the second round.</p><p>Placed in the top half of the draw, Sindhu is likely to run into China’s Wang Zhi Yi in the pre-quarters, followed by Putri Kusuma Wardani of Indonesia and then a possible semifinal clash with top-ranked An Se Young.</p><p>Lakshya Sen, meanwhile, will begin against Collins Valentine Filimon of Austria but the road to the final is peppered with possible tough outings against World No. 2 Kunlavut Vitidsarn, Christo Popov or Alex Lanier and then Loh Kean Yew or Victor Lai starting from pre-quarterfinals onwards. Ayush Shetty drew the short end of the stick, setting up an opening round clash aganst defending champion and World No. 1 Shi Yu Qi in a repeat of their Asian Championships final.</p><p>Chief national coach Pullela Gopichand was cautiously optimistic of India’s chances. “I think it’s great to see the World Championships come back to India after 17 years. And the difference now is that India as a nation, sporting-wise and badminton-wise has grown. We’re looking at many stars who could end up on the podium.</p><p>“Having said that, it’s a tough event. We have a couple of tough initial rounds, especially Ayush against Shi Yu Qi. Sindhu has done well in Japan, Unnati has a favourable draw. Overall, happy with the way the draw has has come out,” Goipichand said on the sidelines of the draw.</p><p>Doubles coach Kim Tan Her, meanwhile, insisted that the players were all fit but admitted that recurring injuries have been a hurdle to sustained success. “Last year, they (Sat-Chi) had eight semifinals and two finals so the results were quite consistent. Game wise, they are getting better now. Confidence, okay. But what’s bothering them is the injury. That’s bothering me and bothering them also. Especially for Satwik, his shoulder, it’s on and off. Hopefully this time, he can overcome,” Kim hoped.</p><p>The World Championships are scheduled at the revamped Indira Gandhi Indoor Stadium here from August 17-23.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 08:43 pm IST</span></p></div><button cl ebutant Nirankar rises\" data-url=\"https://www.thehindu.com/sport/cricket/nirankars-dream-debut-helps-dindigul-dragons-overcome-ashwin-varun-absence-in-tnpl-10-opener/article71309863.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">While Ashwin is in the dugout as a mentor and not on the field, Varun Chakaravarthy is yet to recover from a hamstring injury</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - August 05, 2026 08:28 pm IST - Dindigul</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/s-shrivathsan-28634/\">S. Shrivathsan</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/tyigkb/article71309899.ece/alternates/FREE_1200/10216_4_8_2026_21_22_35_2_04_08_2026_NIRANKAR_4.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/tyigkb/article71309899.ece/alternates/FREE_1200/10216_4_8_2026_21_22_35_2_04_08_2026_NIRANKAR_4.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/tyigkb/article71309899.ece/alternates/FREE_1200/10216_4_8_2026_21_22_35_2_04_08_2026_NIRANKAR_4.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/tyigkb/article71309899.ece/alternates/FREE_1200/10216_4_8_2026_21_22_35_2_04_08_2026_NIRANKAR_4.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\"><b>Miserly spell: </b>Nirankar, who moved from Madhya Pradesh to Tamil Nadu to fuel his cricket dream, tightened the screws in the middle overs.\n                                          | Photo Credit: G. KARTHIKEYAN\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309863\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>When Dindigul Dragons strolled out for the Tamil Nadu Premier League season-opener here on Tuesday, there was uncertainty over how the 2024 title-winner would cope with the absence of two masters of the spin-bowling craft.</p><p>R. Ashwin is in the dugout as a mentor and not on the field while Varun Chakaravarthy is yet to recover from a hamstring injury. But in an encouraging sign for its adaptive strategy, the Dindigul side watched debutant leggie Nirankar Sharma dish out a Player-of-the-Match performance of three for 21 against iDream Tiruppur Tamizhans.</p><p>Nirankar, who moved from Madhya Pradesh to Tamil Nadu to fuel his cricket dream, tightened the screws in the middle overs with his miserly spell.</p><p>“I was just so excited. It was an emotional moment for me because I had waited for it (making his maiden appearance at such a level) for years. I could not have asked for a better debut. The Dragons management, Ashwin <i>bhaiya</i> and Inder (B. Indrajith) <i>anna</i> have been supporting me a lot,” said Nirankar, the lone DD spinner in action on Tuesday.</p><p>The 26-year-old is enjoying the time of his professional life while learning the tricks of the trade from Ashwin. “I had dreamt of working with him. He has been superb with his mentorship. He is expecting a lot from me. Hopefully, I fulfil his expectations. I cannot ask for anything better with what is going on in my life,” he added.</p><p>After making a good first impression, Nirankar should strive for consistency.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 07:31 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71309863\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/cricket/nirankars-dream-debut-helps-dindigul-dragons-overcome-ashwin-varun-absence-in-tnpl-10-opener/article71309863.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" da : The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 28, "title": "A calculated risk which came off for Sakshi", "section": "Sport", "page": "", "teaser": "", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/sport/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Sport\n                    </a><meta content=\"Sport\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71309601\" data-title=\"A calculated risk which came off for Sakshi\" data-url=\"https://www.thehindu.com/sport/a-calculated-risk-which-came-off-for-sakshi/article71309601.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 08:07 pm IST - KOLKATA</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://sportstar.thehindu.com/profile/author/y-b-sarangi-12395/\">Y.B. Sarangi</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/6vn93r/article71309759.ece/alternates/LANDSCAPE_1200/20260801470L.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/6vn93r/article71309759.ece/alternates/LANDSCAPE_1200/20260801470L.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/6vn93r/article71309759.ece/alternates/LANDSCAPE_660/20260801470L.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/6vn93r/article71309759.ece/alternates/LANDSCAPE_320/20260801470L.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Sakshi Chaudhary.\n                                          | Photo Credit: ANI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309601\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p> A calculated risk to drop from 54kg to 51kg paid off for newly-crowned Commonwealth Games champion boxer Sakshi Chaudhary, as she finally made an impact at a multi-sport event.</p><p>A former World junior champion, two-time World youth champion, Asian championships bronze medallist and World Boxing Cup gold medallist, Sakshi secured most of her international medals in 54kg.</p><p>Hungry for success at a multi-sport event, the gutsy Sakshi sought the advice of her coach Chhote Lal Yadav at the Army Sports Institute (ASI) in Pune, and decided to switch to 51kg after the National championships in January, when boxers were allowed to change weight categories.</p><p>For Sakshi, it was a risky decision as the lower weight class had several accomplished boxers, including double World champion Nikhat Zareen and reigning world champion Meenakshi Hooda.</p><p>“Since (another Army boxer) Preeti (Pawar) was doing well in 54kg, it made sense for Sakshi to come down to 51kg. She was capable of beating everyone. Once we made the make-or-break decision, I asked her to keep quiet as it could have backfired,” Chhote Lal told The Hindu, as his ward stayed busy attending felicitation functions.</p><p>“Only a few boxers have qualities like Sakshi. She is aggressive, has good endurance and has a superb left jab, which she used effectively in Glasgow. Even during her training at the ASI, she used to beat male boxers because of the jab. I am sure she will medal at the Asian Games as well.”</p><p>Former Indian women’s team head coach Bhaskar Bhatt, under whom Sakshi claimed her maiden World youth gold in Guwahati in 2017, appreciated her performance. “Sakshi didn’t stop for a moment during her bouts at the Commonwealth Games and didn’t give her opponents any chance. It shows how much work she has put in to increase her endurance and strengthen her legs.</p><p>“She should work on two areas to become even more effective. She needs to connect her punches with the full knuckle to unleash maximum power and stop using her elbow to stay away from trouble,” said Bhatt.</p><p>--EOM--</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 08:07 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71309601\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/a-calculated-risk-which-came-off-for-sakshi/article71309601.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Des List. Photo: Special Arrangement.\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309607\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Meghalaya has launched a dedicated programme for its State animal—the mainland clouded leopard (<i>Neofelis nebulosa</i>).</p><p>On Tuesday (August 4, 2026), Chief Minister Conrad K. Sangma unveiled Mission Clouded Leopard. The feline is found in the State’s community-managed forests and in the forest landscapes of Nokrek, Balpakram, Baghmara, Narpuh and Nongkhyllem.</p><p class=\"referpara\"><strong><b>Also read: <a href=\"https://www.thehindu.com/sci-tech/energy-and-environment/understanding-clouded-leopards-and-their-habitats/article29245150.ece\" target=\"_blank\">Understanding clouded leopards and their habitats</a></b></strong></p><p>“The mission covers habitat protection and restoration, scientific research and long-term monitoring, stronger protection measures, landscape connectivity, capacity building of frontline staff, community participation, and public awareness. It will be guided by the Meghalaya Clouded Leopard Action Plan, now being prepared by the Forest and Environment Department,” the Chief Minister said.</p><p>“An ongoing scientific assessment has so far identified 21 individual clouded leopards in the Balpakram National Park. The assessment will be extended to all major habitats in the State, so that Meghalaya has, for the first time, a comprehensive population estimate of its State animal,” he said.</p><p>Distinct from the Sunda clouded leopard, which is found on the islands of Borneo and Sumatra, the mainland clouded leopard is listed as “vulnerable” on the International Union for Conservation of Nature (IUCN) Red List, and protected under Schedule I of the Wildlife (Protection) Act, 1972.</p><p>According to the Conservation Action Plan (CAP) for the caracal, fishing cat, and clouded leopard released by the Wildlife Institute of India on Tuesday, India supports one of the most important remaining populations of the mainland clouded leopard.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sci-tech/energy-and-environment/with-nimble-feet-clouded-leopards-play-hide-and-seek-in-the-forests/article67162151.ece\">\n\t\t\t\t\t\t\t\t\t\tWith nimble feet, clouded leopards play hide-and-seek in the forests</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/latest-news/9nl3bm/article67163137.ece/alternates/SQUARE_80/CloudedLeopard.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAADAQEBAQEAAAAAAAAAAAAEBQYHAwECAAEAAgMBAQAAAAAAAAAAAAAAAQQAAgMFBv/aAAwDAQACEAMQAAAALGHT+fVq8npbdraWpfYzoXYUyWnVSCN9WKUy/wDDvHGBL/O9LLxA3M0MASVBDlekqsdeTnzzkXudGFjJ2OD1Q5hRtdkzhHzK76VW8q887ieftpJ6bMN8m5j2lnJp1lm6e5r20ePXmaSj1Xkv0crb6EtN0ObbF9GY8VtZRthH1vI0n//EACMQAAMBAAEEAgMBAQAAAAAAAAECAwQFABESEwYUISIjMhX/2gAIAQEAAQwBc+ylCf36bEXstrNN0Otp1nKqrR+W4wz5JVx53WfE/GMlHI3MSafE+FY/g0XrX8TwS/pBt1FyfH8jsdGCU16qk56hK7TTVFm28NbsrTpj2+cyBML1oumkevFKitO1QdFxs7NI/VyUjKKUoNGbVneWvGcrcjh+kr78NyTklu/5r00KJW4+sOL+NE6H8G2IOXzIuhgWnS8peNQe2lKDUiOW8N1NNtJkaqzce876UB/UaoVvyUZu8vPZhGna3r/pXBjadYWZHRN+t+O2OpAcc9umVxt+Ky4H5A77XWsV9PPhZnPoFSofZ7bZxVVBuiFAbCcacZO6N9klfXDfVuUuJZVZ8tdU+Yp2SKdb/sT46EG8OufdLUyO0QlNGSu9EerKj3yDLSS5/Y72rp0JFNtHJrFKbGOc+xcN/YSXbwPGPopqbOUHVM+uWmLpqeatqdM8qaR2X7knIpGfmecpXT6v8+Xx+WT/AJQFf6Ns+vlv7AVc3KuPs3qqdNIlfsCor0sggAHYDjjaXIyI/wA5tjb9VFrkpF9RtOrJlpGrRrbjs0k0JNZ6R7CdHuHpx7p5sgE1Ex9n7tqBFbrbi0brr6/AIMS41n6c k-video-addressing-students/article71277733.ece\" target=\"_self\">Meta</a> CEO Mark Zuckerberg has been given a three-day ultimatum by a parliamentary standing committee on Wednesday (August 5, 2026) to issue an apology for Facebook taking down <a href=\"https://www.thehindu.com/news/national/representatives-of-social-media-platforms-like-google-meta-appear-before-parliamentary-panel-on-it/article71301259.ece\" target=\"_self\">Prime Minister Narendra Modi’s video</a>, with the panel warning that the company’s legal immunity could be revoked if he fails to comply.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/it-ministry-summons-meta-after-pm-modis-post-removed/article71275927.ece\">\n\t\t\t\t\t\t\t\t\t\tIT ministry summons Meta after PM Modi's post on strict action over paper ‘leaks’ removed</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/5j9fi9/article71275991.ece/alternates/SQUARE_80/modi%20angle.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAADAQEBAQEAAAAAAAAAAAAEBQYDAAIBBwEBAQEBAQAAAAAAAAAAAAAAAgEDAAT/2gAMAwEAAhADEAAAAKDDc/HVQx1PZE43KxStLVZr02ELK7bHEU8peMy++RJfaWk6v+ZJ1g2U7Y8tZJ8WSAdjb5MEWOngNGnn1fotsfV5uXMbgdL5VcapKn1mqSzZNd0IltHOS9WyVN3HStCGe/GvFyuFKqBVSlOmppld/8QAMxAAAgECBAQEBQMEAwAAAAAAAQIDBBEABRIhBhMxQSJRkfAQMmFxgRShsRUjUtEHFpL/2gAIAQEAAT8AxTVmXSVDRz1QiAuLgat/thKqlaSwmj/9YnWkj0cuqjkBUG42sfLEdPE1KZebHsQNN9z9cUtOtRLy1eMHfdmAHripdIyfEPXEtUm/iwtUHlVV8RuOnxy3L8uWYievo0mbxBHKg7/cjE+R0bZqAaigZSb7EH8bHGZcLU8kMZRKUG23a+P+t0QoeUViDf5Am38YoeGKeLWrLG9+hEjC3qMZ1w2aSffW content moderation on social media platforms should not be subject to political influence.</p><h4 class=\"sub_head\">Revoking safe harbour</h4><p>It is unclear if safe harbour can be revoked by the government. “There is no express legal provision under the present legal framework through which the Government can directly remove or revoke the safe harbour protection provided to intermediaries under Section 79 of the IT Act,” law firm Scriboard’s partner Ravi Goyal told <i>The Hindu.</i></p><p>“Moreover, the safe harbour protection provided under Section 79 is not a blanket or platform-wide immunity and instead applies in relation to specific content or instances. Therefore, even if an intermediary is found not to be entitled to such protection in respect of a particular piece of content or instance, it could still continue to avail the protection under Section 79 for its services, subject to compliance with law. Thus, such actions are determined on a case-to-case basis by a court of law,” he added.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 03:25 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71308695\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/parliamentary-it-committee-to-meta-apologise-for-pm-video-removal-or-lose-safe-harbour/article71308695.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" da le=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/avu62z/article71310504.ece/alternates/LANDSCAPE_1200/iStock-157376651.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/avu62z/article71310504.ece/alternates/LANDSCAPE_1200/iStock-157376651.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/avu62z/article71310504.ece/alternates/LANDSCAPE_660/iStock-157376651.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/avu62z/article71310504.ece/alternates/LANDSCAPE_320/iStock-157376651.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Image for representational purposes only.\n                                          | Photo Credit: Getty Images\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310132\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>The All India Institute of Medical Sciences (AIIMS), Delhi, recalled certain batches of disposable syringes earlier this year as a precautionary measure after receiving quality-related complaints from user departments, the Union Health Ministry informed Parliament on Wednesday (August 5, 2026).</p><p>In a written reply to a question by MP Haris Beeran in the Rajya Sabha, Minister of State for Health Prataprao Jadhav said the affected batches had been manufactured by Noble Pharmacare Ltd. and Veekay Surgicals. The recall, he said, was undertaken as a patient-safety measure following complaints regarding the quality of the syringes.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\" tainment/movies/irs6mc/article71309287.ece/alternates/LANDSCAPE_320/godzilla%20minus%20zero%20still.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    A still from ‘Godzilla Minus Zero’\n                                          | Photo Credit: @TheNYFF/X\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309278\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p><a href=\"https://www.thehindu.com/entertainment/movies/godzilla-minus-zero-teaser-the-monster-strikes-back-with-deadlier-wrath-in-takashi-yamazakis-sequel/article71205800.ece\" target=\"_self\"><i>Godzilla Minus Zero</i></a>, the sequel to Takashi Yamazaki's Oscar-winning blockbuster <a href=\"https://www.thehindu.com/entertainment/movies/godzilla-minus-one-movie-review-takashi-yamazakis-glorious-modern-day-monsterpiece/article68242570.ece\" target=\"_self\"><i>Godzilla Minus One</i></a>, will have its world premiere as the Spotlight Gala presentation at the 64th New York Film Festival.</p><p>The film will premiere at Alice Tully Hall on September 26, with Yamazaki and members of the cast and crew expected to attend. The festival, presented by Film at Lincoln Centre in partnership with Rolex, will run from September 25 to October 12.</p><p>Set in 1949, two years after the events of <i>Godzilla Minus One</i>, the sequel continues the story of the Shikishima family as they confront a new catastrophe in post-World War II Japan.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/entertainment/movies/godzilla-day-2025-what-the-iconic-kaiju-teaches-us-about-the-monsters-of-our-own-making/article70236134.ece\">\n\t\t\t\t\t\t\t\t\t\tGodzilla Day 2025: What the iconic kaiju teaches us about the monsters of our own making</a></div><div ygcvdzPjCnqLEohwDC7KtIZkCroQqS2hMgNUYycWtphTltplQ2KgA9COsTEHPeAW0//xAAgEQACAgMAAgMBAAAAAAAAAAABAgARAxIhBDEiIzJB/9oACAEDAQE/AACYUIlVCh1uJjsbfyeKKGxjYywo9iY6WiJkx38RF+k6EzASOVE4tkTx8pcHb3G4CYup64mBSRcelFmYypOwEY7fmO1cExZQoNx8jObaJkK+o2UhRrL5P//Z\"/></div></div></div><p>The actor's <i>Lagaan</i> co-star Yashpal Sharma shared the news of his friend's death with a tribute on social media.</p><p>\"Pradeep Rawat, Ghajini our Deva of Lagaan RIP,\" Mr. Sharma wrote.</p><p class=\"referpara\"><strong><b><a href=\"https://www.thehindu.com/entertainment/movies/ghajini-2-aamir-khan-ar-murugadoss-sikandar-salman-khan/article69356737.ece\" target=\"_blank\">ALSO READ: ‘Ghajini 2’ on cards? AR Murugadoss reveals meeting Aamir Khan on ‘Sitaare Zameen Par’ sets; sparks speculations on sequel</a></b></strong></p><p>Rawat rose to stardom with his portrayal of Ashwatthama in <i>Mahabharat</i> and later went on to work across industries.</p><p>His other prominent roles include TV serials <i>Tehkikaat</i>, <i>Chandrakanta,</i> and <i>Yug,</i> and movies such as <i>Meri Jung</i>, <i>Sarfarosh</i>, <i>The Hero:Story of a Spy</i> and <i>Chhava</i>.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 12:15 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71306933\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/entertainment/movies/actor-pradeep-rawat-of-ghajini-fame-dies-at-74/article71306933.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div cl
