p=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310333\" data-title=\"Misri urges Sri Lanka to hold provincial polls ‘at the earliest’\" data-url=\"https://www.thehindu.com/news/international/misri-urges-sri-lanka-to-hold-provincial-polls-at-the-earliest/article71310333.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\"><b>Discusses India-backed energy, infrastructure and technology projects during Colombo visit </b> </h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 09:27 pm IST - Colombo</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/meera-srinivasan-311/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/meera-srinivasan-311/\">Meera Srinivasan</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/news/national/rcaxui/article71310635.ece/alternates/LANDSCAPE_1200/2c6fb4a3-c8ea-49a9-bc44-2cf16b699dd5.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/news/national/rcaxui/article71310635.ece/alternates/LANDSCAPE_1200/2c6fb4a3-c8ea-49a9-bc44-2cf16b699dd5.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/news/national/rcaxui/article71310635.ece/alternates/LANDSCAPE_660/2c6fb4a3-c8ea-49a9-bc44-2cf16b699dd5.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/news/national/rcaxui/article71310635.ece/alternates/LANDSCAPE_320/2c6fb4a3-c8ea-49a9-bc44-2cf16b699dd5.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Foreign Secretary Vikram Misri with Sri Lanka President Anura Kumara Dissanayake during his official visit, in Colombo on August 5, 2026. Photo: Sri Lanka Presidential Media Division\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310333\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p><b>Colombo</b></p><p>Foreign Secretary Vikram Misri on Wednesday (August 5, 2026) urged the Sri Lankan leadership to hold the long-delayed elections to the Provincial Councils “at the earliest” and to “fully implement” constitutional provisions to meet the aspirations of the Tamil people, according to the Ministry of External Affairs (MEA). </p><p><a href=\"https://www.thehindu.com/news/international/sri-lanka-civil-war-17-years-later-the-imprints-remain/article70984264.ece?utm_campaign=socialflow&amp;fbclid=IwY2xjawTgL4RleHRuA2FlbQIxMQBicmlkETFnbmE3VE9pclRMdmNYcFVzc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHhNqA499IHEvtShv0v6Ic6WKH7G8JXBQkJ6UpOp1L7JPOfm7iLxNJqFcX1Wn_aem_05mv8Byma9C3zG7q-5sNqQ\" target=\"_self\"><b>Sri Lanka civil war: 17 years later, the imprints remain</b></a><b> </b> </p><p>Issued following Mr. Misri’s daylong visit to Colombo, the Ministry’s statement further highlighted bilateral discussions on Indian assistance to Sri Lanka’s recovery from Cyclone Ditwah, collaborations in the energy sector, and possible upgradation of the trade agreement. The two sides discussed modalities for the faster implementation of India-backed initiatives, including the Unique Digital Identity project, development of the eastern district of Trincomalee as an energy hub, and the rehabilitation and modernisation of Kankesanthurai harbour in Jaffna. </p><p><b><a href=\"https://www.thehindu.com/opinion/lead/reality-check-on-sri-lankas-tamil-question/article69005505.ece\" target=\"_self\">Reality check on Sri Lanka’s Tamil question</a></b> </p><p>A media statement from President Anura Kumara Dissanayake’s office said the discussions focused on “further strengthening cooperation between the two countries in areas including technology, energy and trade, in a manner that would deliver mutual benefits to both nations“. However, it made no mention of any discussion of the provincial elections, revealing an apparent difference in the two sides’ priorities in messaging. </p><p>President Dissanayake’s office said he sought India’s support and “fullest cooperation” in combating drug trafficking, and underscored the importance of regional cooperation in addressing the challenges posed by climate change.  </p><p>The reference in New Delhi’s statement to the provincial elections draws attention at a time when a recently formed <a href=\"https://www.thehindu.com/news/international/medai-a-common-platform/article71239096.ece\" target=\"_self\">common platform,</a> representing Sri Lanka’s Tamil-speaking ethnic minorities, has been pushing for the same, <a href=\"https://www.thehindu.com/news/international/dissanayake-holds-talks-with-leaders-of-ethnic-minorities-underscores-need-for-national-consensus-on-new-constitution/article71305219.ece\" target=\"_self\">including at a meeting with President Dissanayake on August 03, 2026.</a>  </p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/dissanayake-holds-talks-with-leaders-of-ethnic-minorities-underscores-need-for-national-consensus-on-new-constitution/article71305219.ece\">\n\t\t\t\t\t\t\t\t\t\tDissanayake holds talks with leaders of ethnic minorities, underscores need for ‘national consensus’ on new Constitution</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/news/international/f2t5ri/article71305216.ece/alternates/SQUARE_80/1000953779.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAADAAMBAAAAAAAAAAAAAAAEBQYCAwcAAQADAQEBAAAAAAAAAAAAAAACAwQFBgH/2gAMAwEAAhADEAAAAFVJJNOa6nzZGxsVp3inH7uy0efMvaJH01UixStjFdU4rAW3XsZdXtMYpxrQeKbKTGzY9O5nqZ9DwjspIkgdCELaRznpEmYsRUztRds5P1GMskT0uKRL9A+L+enD3jq4oeyNsXyzMzVKRoynDtGVqr7UGgrjkDB8VOqUsEX0HPf/xAAnEAACAgEEAQUAAgMAAAAAAAACAwEEBQAREhMxFCEiIyQyM0FDUv/aAAgBAQABDAE/kQRHnjxASjeZgv0zo5GoMWWxJRSsMyBuJk/YJfbpk7hrsFKmOP8AjTyBWzbL4iSePCuX+dNOImN9WLnYmvHqiPVQxO5BR4yUExELCJIseiKt+F9wmbhiLXto/eI1kh2oMEfKao1GAJlPe6fysjbUz89AATJzw30meu1uOhn1Y9aGwpgAFOtDCiJJbJNhGXlsxxGdf2HIQWxqq+jFsMZBzZdBJKB8U+d+3Ff3WT8fYoMj9hMChikOrzYaw4Ys2Y+z3NUXXlwOOkgndchc7DgOK9GqxKROUlt2Ej9RqIhsuDIYyLKpKNNsQMyst9xqHQmq0VyKJKbeV9KxcQu2wyrEdXjDH81r7+6GwzITllV69eNtWqNa6C55yO IAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The ⁠woman was ​arrested on ‌suspicion of possession of an offensive weapon ‌and assault</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 07:28 pm IST - London</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> Agencies</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/mg4lqp/article71292147.ece/alternates/LANDSCAPE_1200/iStock-1401717334.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/mg4lqp/article71292147.ece/alternates/LANDSCAPE_1200/iStock-1401717334.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/mg4lqp/article71292147.ece/alternates/LANDSCAPE_660/iStock-1401717334.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/mg4lqp/article71292147.ece/alternates/LANDSCAPE_320/iStock-1401717334.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Image for representational purposes only.\n                                          | Photo Credit: Getty Images\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309893\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p> Four people were stabbed in central London and a woman has been arrested, police said on Wednesday (August 5, 2026).</p><p>The ⁠woman, who ⁠was in her 40s, was ​arrested on ‌suspicion of possession of an offensive weapon ‌and assault, ​<i>Sky News</i> reported. Covent Garden ⁠is a popular area ‌for tourists.</p><p>The Metropolitan Police has yet to provide further details about the incident, which took place around lunchtime.</p><p>The four patients were treated at the scene ‌and taken to ​a nearby trauma centre, a ⁠London Ambulance Service ⁠spokesperson said.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 07:28 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71309893\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/4-people-stabbed-in-londons-covent-garden-area-woman-arrested/article71309893.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead midd "page": "", "teaser": "Demis Hassabis becomes chief scientist, relinquishes DeepMind CEO role; Jeff Dean and other key engineers leave to found new startup; moves follow departure of two star researchers to AI rivals", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/sci-tech/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Sci-Tech\n                    </a><meta content=\"Sci-Tech\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/sci-tech/technology/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Technology\n                    </a><meta content=\"Technology\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310807\" data-title=\"Google shakes up AI leadership as DeepMind chief Demis Hassabis shifts role\" data-url=\"https://www.thehindu.com/sci-tech/technology/google-shakes-up-ai-leadership-as-deepmind-chief-demis-hassabis-shifts-role/article71310807.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Demis Hassabis becomes chief scientist, relinquishes DeepMind CEO role; Jeff Dean and other key engineers leave to found new startup; moves follow departure of two star researchers to AI rivals</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:44 pm IST - SAN FRANCISCO</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> Reuters</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/en0k6c/article71310835.ece/alternates/LANDSCAPE_1200/2026-08-05T155919Z_364787156_RC205JADA8CT_RTRMADP_3_ALPHABET-AI.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/en0k6c/article71310835.ece/alternates/LANDSCAPE_1200/2026-08-05T155919Z_364787156_RC205JADA8CT_RTRMADP_3_ALPHABET-AI.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/en0k6c/article71310835.ece/alternates/LANDSCAPE_660/2026-08-05T155919Z_364787156_RC205JADA8CT_RTRMADP_3_ALPHABET-AI.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/en0k6c/article71310835.ece/alternates/LANDSCAPE_320/2026-08-05T155919Z_364787156_RC205JADA8CT_RTRMADP_3_ALPHABET-AI.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Demis Hassabis, a Nobel laureate, will take the newly-created title of Alphabet’s chief scientist and transition from ‌being Google DeepMind CEO to being its chairman. File\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310807\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Google parent company Alphabet on Wednesday (August 5, 2026) announced a leadership overhaul of its AI division, with AI chief Demis Hassabis leaving his main managerial role and several ‌leaders of its Gemini model, including veteran engineer Jeff Dean, departing the company. The shakeup comes during a pivotal ​juncture for Google DeepMind: the flagship version of its latest Gemini model remains unreleased despite a planned June launch, ⁠sparking investor and industry concerns that Google is falling behind its rivals Anthropic and OpenAI, each of which scooped up a star Google AI staffer this summer.</p><p>Shares of Alphabet fell 4% after the news. <a href=\"https://www.thehindu.com/sci-tech/science/a-new-era-the-2024-nobel-prizes-and-the-power-of-machine-learning/article68739836.ece\" target=\"_self\">Mr. Hassabis, a Nobel Prize recipient</a>, will take the newly-created title of Alphabet’s chief scientist and transition from ‌being Google DeepMind CEO to being its chairman, he said in a memo to staff. He cited the closeness of artificial general intelligence (AGI), an advanced state of AI in which computers in essence become as smart as humans, as ‌the impetus for his role change.</p><p>“[And] I have been long discussing a role that allows him to put his ‌full ⁠attention on actively shaping the future of AGI,” Alphabet chief Sundar Pichai said in a separate companywide memo. “It’s work ⁠that is vitally important to Alphabet and humanity, and I can’t imagine a better person than Demis to do it.” Koray Kavukcuoglu, the unit’s chief technology officer, will assume day-to-day responsibilities. He will hold the title of senior vice-president, rather than CEO, of the business unit, in addition to his parallel role as Alphabet’s chief AI ​architect.</p><p>Mr. Dean, Sanjay Ghemawat, Oriol Vinyals and Quoc Le — some ‌of Google’s most famous and lauded AI and engineering leaders — left the company to launch a startup called Discovery Loop, which will focus on researching breakthroughs in machine learning, science and engineering. The startup is structured as a public benefit corporation.</p><p>Alphabet did not provide any details on what precipitated the moves or their coincident timing. Mr. Hassabis — who has long prioritized research over profits — will explore research and ‌strategy related to societal impacts of AGI and will have few direct reports, a Google spokesperson told Reuters.</p><p>In his company ​memo, Mr. Hassabis touted the “great progress” on Google’s AI models including an unreleased upgrade called Gemini 4.</p><p>He also said in his memo that he would spend more time with Isomorphic Labs, a drug discovery company that spun out ⁠of DeepMind for which he is the founder and CEO.</p><p>“I’ve always believed the No.1 application of AI should be to improve human health,” he said. “It’s time for AI to prove its unequivocal value to the world, and what better way to demonstrate that than to help finally ‌cure diseases like cancer.”</p><h4 class=\"sub_head\">Brain drain</h4><p>Mr. Dean and Mr. Hassabis were considered the two leading AI figures at Google for years before the field became the center of technological innovation.</p><p>Mr. Hassabis co-founded DeepMind in 2010 and continued to run the lab from London after selling it to Google for around $650 million in 2014.</p><p>Mr. Dean in 2011 co-founded Google Brain, a U.S.-based unit he led that researched AI separately from Mr. Hassabis’ team. By then, he was already a revered figure inside Google known for his collaboration with Mr. Ghemawat on many of the landmark infrastructure projects that still power the company today. In 2023, after the launch of OpenAI’s ChatGPT caught Google off guard, Mr. Pichai announced the merger of DeepMind and Google Brain into ‌a new organisation called Google DeepMind. Mr. Hassabis was appointed its CEO and Mr. Dean its chief scientist. Until recently, Mr. Dean, Mr. Vinyals and Noam Shazeer had co-led development of Gemini. ​Under their stewardship, Google released Gemini 3 in November 2025, which the industry widely saw as closing the gap with leading models from Anthropic and OpenAI. But subsequent advances from those rivals, as well as momentum for cheaper Chinese ⁠open-source models, have set Google on the defensive. At Google’s annual developer conference in May, Mr. Pichai and other Google leaders touted Gemini’s cost advantage, rather ⁠than its state-of-the-art capabilities. Mr. Shazeer left for OpenAI in June, less than two years after Google paid billions to hire him and a team of his researchers away from the startup he led. The same week, senior research scientist <a href=\"https://www.thehindu.com/sci-tech/science/chemistry-nobel-prize-2024-awarded-to-david-baker-along-with-demis-hassabis-and-john-m-jumper/article68735686.ece\" target=\"_self\">John Jumper, ‌who won a Nobel Prize alongside Mr. Hassabis</a> in 2024, said he would join Anthropic. Mr. Vinyals, Mr. Le and former OpenAI chief scientist Ilya Sutskever coauthored a 2014 research paper that became foundational to modern AI research by establishing the concept that scaling up data to “pre-train” AI ​systems would send them to new heights.</p><p>Discovery Loop received investment from Google and also penned a partnership with its cloud division to provide computing capacity.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:44 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310807\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sci-tech/technology/google-shakes-up-ai-leadership-as-deepmind-chief-demis-hassabis-shifts-role/article71310807.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_De lass=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/lalatendu-mishra-435/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/lalatendu-mishra-435/\">Lalatendu Mishra</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/lbz16/article71309193.ece/alternates/LANDSCAPE_1200/PTI08_05_2026_000147B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/lbz16/article71309193.ece/alternates/LANDSCAPE_1200/PTI08_05_2026_000147B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/lbz16/article71309193.ece/alternates/LANDSCAPE_660/PTI08_05_2026_000147B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/lbz16/article71309193.ece/alternates/LANDSCAPE_320/PTI08_05_2026_000147B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Reserve Bank of India Governor Sanjay Malhotra addresses a press conference on the Post-Monetary Policy, in Mumbai\n                                          | Photo Credit: PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309112\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>I</p><p>Asserting that India’s macroeconomic fundamentals are “very strong”, the Reserve Bank of (RBI) has said the country has emerged strong with each disruption and the present episode has opened up opportunities to further enhance the resilience’.</p><p>“Even this particular episode [West Asia conflict] of shock is being treated as an opportunity for us to further enhance our resilience. Our macroeconomic fundamental is very strong, growth is resilient, inflation, although headline is going up, the underlying inflation pressures are muted while we are aligning with core inflation,” RBI governor Sanjay Malhora said on Wednesday.</p><p>Answering a question from The Hindu during his post Monetary Policy Committee (MPC) meeting press conference in Mumbai, he said “we have not only faced these challenges [Covid, Russia-Ukraine war, Israel-West Bank conflict, U.S. tariffs and the ongoing West Asia conflict] but have come out stronger.”</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/Economy/rbi-mpc-keeps-policy-rate-unchanged-at-525/article71308074.ece\">\n\t\t\t\t\t\t\t\t\t\tRBI MPC keeps policy rate unchanged at 5.25%</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/xmv4ac/article71308072.ece/alternates/SQUARE_80/2026-08-03T013106Z_1034122156_RC25UDAMPMSG_RTRMADP_3_INDIA-ECONOMY-RATES.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAABBAMBAAAAAAAAAAAAAAACAwQGBwABBQgBAAIDAQAAAAAAAAAAAAAAAAABAgMEBf/aAAwDAQACEAMQAAAAsXD0S2WGLFNYM00axgpWhGEFG1S1lktkBgRgKK855xor6E5aTOJjVxSVlko71VSXPst9LN3Y6+hDg3XZeofzqZXFWtjVrZfxW7V5k6NpdQT28uF1R6NicY05zZTywduIunohbyXKLmdeYyjzD6A38uRG2JNcU8R//8QANBAAAQMDAwIEBgEDBAMAAAAAAQIDBAAFEQYSITFBE1FhcRQiMoGRoQcVJEIWI1LBsfDx/9oACAEBAAE/AMbiecVk7sg8+Zrvnt1pKVFXNDPJ9aTkEcDA5NA8d6mTolsimVOktx2c7QpZ5Uf+KQOVH0Gana3d 11 new flying training schools; annual pilot training capacity to increase by 750 cadets\" data-url=\"https://www.thehindu.com/business/Industry/centre-issues-lois-for-11-new-flying-training-schools-annual-pilot-training-capacity-to-increase-by-750-cadets/article71310773.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">With the addition of these 11 FTOs, India’s annual pilot training capacity is expected to increase by 750 cadets, providing a significant boost to the domestic training ecosystem</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:34 pm IST - NEW DELHI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/pepoql/article71310798.ece/alternates/LANDSCAPE_1200/20260805566L.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/pepoql/article71310798.ece/alternates/LANDSCAPE_1200/20260805566L.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/pepoql/article71310798.ece/alternates/LANDSCAPE_660/20260805566L.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/pepoql/article71310798.ece/alternates/LANDSCAPE_320/20260805566L.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Union Minister for Civil Aviation Kinjarapu Ram Mohan Naidu during the handing over of LoI to 11 new FTOs in New Delhi\n                                          | Photo Credit: ANI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310773\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>The Centre on Tuesday issued Letters of Intent (LoIs) for the establishment of 11 new Flying Training Organisations (FTOs) across seven airports operated by Airports Authority of India (AAI), in a significant step towards strengthening the country’s aviation training infrastructure.</p><p>With the addition of these 11 FTOs, India’s annual pilot training capacity is expected to increase by 750 cadets, providing a significant boost to the domestic training ecosystem, according to a Ministry of Civil Aviation statement.</p><p>“India has already witnessed the establishment of six new FTOs over the last two years. During this period, the number of training aircraft available with Indian FTOs has increased from 324 to 385, resulting in a 25% rise in annual flying hours across the pilot training ecosystem. This is not just expansion in numbers; it is a clear improvement in training capacity and operational utilisation,” Minister for Civil Aviation Ram Mohan Naidu said at an event.</p><p>The number of Commercial Pilot Licences (CPLs) issued rose from 1,347 in 2024 to 1,652 in 2025, the highest annual number issued in the last decade.</p><p>The Minister also said the manufacturing ecosystem for trainer aircraft and seaplanes would be strengthened.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:34 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310773\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/centre-issues-lois-for-11-new-flying-training-schools-annual-pilot-training-capacity-to-increase-by-750-cadets/article71310773.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publishe "><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">In the analyst call, senior executive of ONGC stated they expect oil prices to hover at about $75 per barrel, which would also make it ideal to pursue deepwater exploration</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:28 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/4lp82p/article71267177.ece/alternates/LANDSCAPE_1200/2018-12-19T102515Z_1854511038_RC1469118390_RTRMADP_3_ONGC-ONGCVIDESH-LISTING.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/4lp82p/article71267177.ece/alternates/LANDSCAPE_1200/2018-12-19T102515Z_1854511038_RC1469118390_RTRMADP_3_ONGC-ONGCVIDESH-LISTING.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/4lp82p/article71267177.ece/alternates/LANDSCAPE_660/2018-12-19T102515Z_1854511038_RC1469118390_RTRMADP_3_ONGC-ONGCVIDESH-LISTING.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/4lp82p/article71267177.ece/alternates/LANDSCAPE_320/2018-12-19T102515Z_1854511038_RC1469118390_RTRMADP_3_ONGC-ONGCVIDESH-LISTING.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    ONGC expects cumulative oil plus gas production to scale 39 MMT in the ongoing fiscal \n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310726\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Oil and Natural Gas Corporation (ONGC) expects cumulative oil plus gas production to scale 39 million metric tonnes (MMT) in the ongoing fiscal and 40 MMT in FY 2028, Anupam Agarwal, Director (Finance) at the state-owned explorer told analysts in a post-results call on Tuesday (August 4, 2026).</p><p>“Last year, our oil plus gas standalone production was in the range of 38.87 million metric tonnes of oil equivalent (MMTOE). This year we expect to reach about 39 MMT this year. The upside will come mainly from gas,” he stated, adding separately, “Next year, another almost 1 MMTOE of oil and gas gain will be there in FY 2027-28.”</p><h4 class=\"sub_head\">Conducive to pursue deepwater exploration</h4><p>Responding to a query, Mr. Agarwal stated that with oil prices expected to hover at about $75 per barrel, pursuing deepwater exploration would be lucrative and in turn, further the country’s energy security in the backdrop of the post West Asia conflict.</p><p>“Now, with the Hormuz crisis, there is a security layer which is coming at the baseline and we believe it [oil prices] would be $75 per barrel in the long run,” he stated.</p><p>Separately, he elaborated, “At $60-65 [per barrel prices], many of the deepwater [exploration] is high-risk, high-reward game, and the size of the reservoir is such that the economics must be very good to develop them. So, maybe some of the fields might not have good to explore at $60-65 [per barrel price regime] but at $75 [per barrel] they would be lucrative also and important for energy security.”</p><p>Mr. Agarwal also stated that the explorer is seeing positive signs for its overseas arm ONGC Videsh’s projects in Venezuela’s San Cristobal and Carabobo-1.</p><p>“Now we have full freedom to work on Venezuela project because earlier we were restricting our operations there because of the sanction-related risk. Those risks are behind us,” he stated, adding separately, “We believe very soon we will see some positive development, the new agreement signed, and we [are] taking over the operatorship for some of those projects from PDVSA.”</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:28 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310726\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/ongc-expects-oil-plus-gas-production-of-39-mmtoe-this-fiscal-40-mmtoe-next-year/article71310726.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devi indu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/804-793-684/\">\n                        oil and gas - upstream activities\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/692-684/\">\n                        business (general)\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/803-793-684/\">\n                        oil and gas - downstream activities\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 12, "title": "India may charge gas users to fund planned $42 billion fuel reserves, sources say", "section": "Business", "page": "", "teaser": "Under the plan, cooking and natural gas storage infrastructure would be financed through levies on ‌users ⁠that could raise about $1.5 billion annually, the two sources said", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/business/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Business\n                    </a><meta content=\"Business\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310774\" data-title=\"India may charge gas users to fund planned $42 billion fuel reserves, sources say\" data-url=\"https://www.thehindu.com/business/india-may-charge-gas-users-to-fund-planned-42-billion-fuel-reserves-sources-say/article71310774.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Under the plan, cooking and natural gas storage infrastructure would be financed through levies on ‌users ⁠that could raise about $1.5 billion annually, the two sources said</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:26 pm IST - NEW DELHI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> Reuters</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/r1lo30/article71201842.ece/alternates/LANDSCAPE_1200/LPG%201.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/r1lo30/article71201842.ece/alternates/LANDSCAPE_1200/LPG%201.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/r1lo30/article71201842.ece/alternates/LANDSCAPE_660/LPG%201.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/r1lo30/article71201842.ece/alternates/LANDSCAPE_320/LPG%201.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    India may impose a charge on cooking gas and natural gas on consumers to ⁠help fund a planned $42 billion strategic fuel reserve.\n                                          | Photo Credit: Getty Images\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310774\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p> India may impose a charge on cooking gas and natural gas on consumers to ⁠help fund a planned $42 billion strategic fuel reserve, according to two sources with direct knowledge of the matter, after disruptions from the Iran war exposed supply chain vulnerabilities.</p><p>The plan would extend India's strategic reserves beyond crude oil for the first ‌time, with stockpiles designed to cover about two months of crude and liquefied natural gas demand, and around six weeks of liquefied petroleum gas, or cooking gas, consumption, the two sources ‌said.</p><p>Under the plan, cooking and natural gas storage infrastructure would be financed through levies on ‌users ⁠that could raise about $1.5 billion annually, the two sources said.</p><p>Ministry of Petroleum and ⁠Natural Gas is considering a levy of ₹1.29 ($0.0136) per kg of LPG, which would raise about $460 million a year based on current consumption and add about 18 rupees to the cost of a standard domestic cooking gas cylinder, the sources said.</p><p>For natural ​gas, the ministry has proposed a levy ‌of ₹1.43 per standard cubic metre, generating about $1 billion annually at current consumption levels, the sources said.</p><p>It was not immediately clear how the levies would be collected. The proceeds would primarily fund natural and cooking gas storage infrastructure, while crude reserves and strategic fuel inventories would continue to be ‌financed by the federal government, the sources said.</p><p>The Ministry of Petroleum and Ministry of Finance did not respond to requests for comment sent by <i>Reuters</i> on Tuesday (August 4, 2026).</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <s \"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/business/Economy/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Economy\n                    </a><meta content=\"Economy\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310771\" data-title=\"India's services sector growth hits four-and-a-half-year low in July on weak demand: PMI\" data-url=\"https://www.thehindu.com/business/Economy/indias-services-sector-growth-hits-four-and-a-half-year-low-in-july-on-weak-demand-pmi/article71310771.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Business activity rose at the weakest rate in 53 months</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:20 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/8gme86/article68217785.ece/alternates/LANDSCAPE_1200/171522-01-02.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/8gme86/article68217785.ece/alternates/LANDSCAPE_1200/171522-01-02.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/8gme86/article68217785.ece/alternates/LANDSCAPE_660/171522-01-02.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/8gme86/article68217785.ece/alternates/LANDSCAPE_320/171522-01-02.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    On the job front, after sinking to a six-month low in June, there was an improvement in the rate of job creation during July.\n                                          | Photo Credit: AFP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310771\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p> India's services sector growth fell to a four-and-a-half-year low in July as new business orders eased in both domestic and export markets, constrained by fierce competition and fading demand, a monthly survey said on Wednesday (August 5, 2026).</p><p>Business activity rose at the weakest rate in 53 months, as new business inflows increased moderately amid reports of softer demand and competitive pressures.</p><p>The seasonally adjusted HSBC India Services PMI Business Activity Index fell from 57.4 in June to 53.3 in July, registering the weakest growth rate in close to four-and-a-half years.</p><p>The seasonally adjusted HSBC India Services PMI Business Activity Index – based on a single question asking how the level of business activity compares with the situation the month before – remained above the neutral mark of 50 and therefore signalled another expansion in output.</p><p>\"India's services sector continued to expand in July, albeit at a slightly slower pace, as new business growth eased in both domestic and export markets after several months of strong performance,\" said Pranjul Bhandari, chief India economist at HSBC.</p><p>New business inflows expanded at a moderate pace, the slowest since February 2022.</p><p>According to panel members, growth was constrained by fierce competition, fading demand, softer market conditions and order postponements.</p><p>On the job front, after sinking to a six-month low in June, there was an improvement in the rate of job creation during July. The uptick was however, modest, as only 6% of firms reported higher payroll numbers and the vast majority (92 per cent) indicated no change.</p><p>\"Hiring showed a moderate rebound, while profit margins improved as input costs softened and firms increased their selling prices,\" Mr. Bhandari said.</p><p>On the prices front, July data highlighted another increase in input costs across the service economy, with panellists signalling greater fuel, labour, material, technology and transportation costs.</p><p>Meanwhile, new export business remained a bright spot, with firms citing gains from the UAE, U.K. and U.S. Also, service providers continued to add to their payrolls.</p><p>On business confidence, the survey said that hopes of better demand and market conditions, as well as plans to price competitively and forecasts of greater inbound tourism, supported positive sentiment among services companies. The overall level of confidence, however, slipped to a seven-month low in July.</p><p>Meanwhile, the HSBC India Composite PMI Output Index fell from 57.1 in June to 54.3 in July, indicating the weakest pace of expansion since March 2022.</p><p>Composite PMI indices are weighted averages of comparable manufacturing and services PMI indices. Weights reflect the relative size of the manufacturing and service sectors according to official GDP data.</p><p>There was a particularly sharp slowdown in the service economy, while factory production growth ticked marginally higher.</p><p>Regarding employment, stronger growth in the service economy more than offset a slowdown in manufacturing and contributed to faster job creation at the composite level.</p><p>The rate of input cost inflation across the private sector eased to a six-month low, but selling charges rose at the fastest pace since April.</p><p>The HSBC India Services PMI is compiled by S&amp;amp;P Global from responses to questionnaires sent to a panel of around 400 service sector companies.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:20 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310771\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Economy/indias-services-sector-growth-hits-four-and-a-half-year-low-in-july-on-weak-demand-pmi/article71310771.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : / e well positioned to capitalise on these opportunities", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/business/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Business\n                    </a><meta content=\"Business\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/business/Industry/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Industry\n                    </a><meta content=\"Industry\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310731\" data-title=\"Bondada Engineering Q1 net up 29%, to capitalise on renewable energy, power and telecom\" data-url=\"https://www.thehindu.com/business/Industry/bondada-engineering-q1-net-up-29-to-capitalise-on-renewable-energy-power-and-telecom/article71310731.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">As India’s investments in renewable energy, power infrastructure, telecom and emerging technologies continue to accelerate, we are well positioned to capitalise on these opportunities</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:08 pm IST - HYDERABAD</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310731\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Improved operational efficiencies, disciplined cost management and the scalability of its diversified business helped Bondada Engineering post 29% year-on-year (YoY) increase in consolidated net profit to ₹53.94 crore for the June quarter FY27 .</p><p>Consolidated revenue from operations rose 24% YoY to ₹691.65 crore in the review quarter.</p><p>On a sequential basis, the profit and revenue declined. The company had reported ₹62.88 crore net profit and ₹913.85 crore revenue from operations for the March quarter.</p><p>The performance reflects the continued strength of its execution capabilities and strategic focus on scaling operations across renewable energy, telecom, EPC and engineering services, the company said.</p><p>“As India’s investments in renewable energy, power infrastructure, telecom and emerging technologies continue to accelerate, we are well positioned to capitalise on these opportunities. Supported by a robust project pipeline, expanding capabilities and a relentless focus on execution, we remain committed to delivering sustainable growth and creating long-term value for all our stakeholders,” CMD Bondada Raghavendra Rao said.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/bondada-acquires-60-in-solar-project-spv-in-maharashtra/article71273681.ece\">\n\t\t\t\t\t\t\t\t\t\tBondada acquires 60% in solar project SPV in Maharashtra</a></div><div class=\"picture\"></div></div></div></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:08 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310731\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/bondada-engineering-q1-net-up-29-to-capitalise-on-renewable-energy-power-and-telecom/article71310731.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ mi
