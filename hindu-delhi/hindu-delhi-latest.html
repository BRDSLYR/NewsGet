<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #1a1a18;
  --ink-muted:  #4a4a45;
  --ink-faint:  #8a8a82;
  --paper:      #f8f6f0;
  --paper-warm: #f0ede4;
  --rule:       #c8c4b8;
  --red:        #b00020;
  --font-head:  'Georgia', 'Times New Roman', serif;
  --font-body:  'Georgia', 'Times New Roman', serif;
  --font-ui:    system-ui, -apple-system, sans-serif;
}

html.dark {
  --ink:        #e8e4dc;
  --ink-muted:  #a8a49c;
  --ink-faint:  #6a6660;
  --paper:      #181816;
  --paper-warm: #211f1c;
  --rule:       #38352f;
  --red:        #e05070;
}

html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ── Masthead ── */
#masthead {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--ink); color: var(--paper);
  padding: 0 1rem;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
  user-select: none;
}
#masthead .nameplate {
  font-family: var(--font-head);
  font-size: 1.3rem; font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
}
#masthead .edition-date {
  font-family: var(--font-ui);
  font-size: 0.7rem; color: #aaa;
  text-align: right; line-height: 1.35;
}
#masthead .back-btn {
  display: none; align-items: center; gap: 6px;
  background: none; border: none; color: var(--paper);
  font-family: var(--font-ui); font-size: 0.8rem;
  cursor: pointer; padding: 8px 0; min-width: 60px;
}
#masthead .back-btn svg { flex-shrink: 0; }

/* ── Section nav strip ── */
#section-nav {
  position: fixed; top: 52px; left: 0; right: 0; z-index: 99;
  background: var(--paper-warm);
  border-bottom: 2px solid var(--ink);
  overflow-x: auto; overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  transition: opacity 0.2s, transform 0.2s;
}
#section-nav::-webkit-scrollbar { display: none; }
#section-nav .nav-inner {
  display: inline-flex; padding: 0 0.5rem;
}
.sec-tab {
  display: inline-block;
  font-family: var(--font-ui); font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-muted);
  padding: 9px 10px;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.sec-tab.active {
  color: var(--ink);
  border-bottom-color: var(--red);
}

/* ── Pages viewport ── */
#pages-viewport {
  position: fixed;
  top: 93px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
#pages-track {
  display: flex; height: 100%;
  transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ── Individual section page ── */
.section-page {
  flex: 0 0 100vw; width: 100vw; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 1.2rem 0 2rem;
}
.section-page::-webkit-scrollbar { width: 3px; }
.section-page::-webkit-scrollbar-thumb { background: var(--rule); }

.sec-header {
  padding: 0 1rem 0.6rem;
  border-bottom: 3px double var(--ink);
  margin-bottom: 0.1rem;
}
.sec-header h2 {
  font-family: var(--font-head);
  font-size: 1.05rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red);
}
.sec-header .art-count {
  font-family: var(--font-ui); font-size: 0.7rem;
  color: var(--ink-faint); margin-top: 1px;
}

.article-row {
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 0.5px solid var(--rule);
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: background 0.12s;
  gap: 0.25rem;
}
.article-row:active { background: var(--paper-warm); }
@media (hover: hover) {
  .article-row:hover { background: var(--paper-warm); }
}

.art-meta {
  font-family: var(--font-ui); font-size: 0.65rem;
  color: var(--ink-faint); letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex; gap: 0.5rem; align-items: center;
}
.art-meta .page-tag {
  background: var(--ink); color: var(--paper);
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.6rem;
}
.art-headline {
  font-family: var(--font-head);
  font-size: 1.02rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
}
.art-teaser {
  font-family: var(--font-body); font-size: 0.8rem;
  color: var(--ink-muted); line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.art-read-cue {
  font-family: var(--font-ui); font-size: 0.68rem;
  color: var(--red); font-weight: 600;
  letter-spacing: 0.03em;
  align-self: end;
  text-align: right;
}

/* ── Article pane fly animations ── */
@keyframes fly-to-pip {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
}
@keyframes fly-from-pip {
  0%   { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
  100% { opacity: 1; transform: scale(1); }
}

/* ── Article pane — floating card ── */
#article-pane {
  position: fixed;
  top: 58px; left: 50%; bottom: 12px;
  transform: translateX(-50%) scale(0.96);
  width: min(900px, calc(100vw - 1rem));
  background: var(--paper);
  border-radius: 12px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity: 0;
  pointer-events: none;
  transform-origin: center bottom;
  z-index: 101;
  padding: 1.5rem 1.5rem 3rem;
  transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
}
#article-pane.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) scale(1);
  animation: none;
}
#article-pane.flying-out { pointer-events: none; animation: fly-to-pip 0.75s cubic-bezier(0.4,0,0.2,1) forwards; }
#article-pane.flying-in  { pointer-events: none; animation: fly-from-pip 0.4s cubic-bezier(0.2,0,0,1) forwards; }
#article-pane::-webkit-scrollbar { width: 3px; }
#article-pane::-webkit-scrollbar-thumb { background: var(--rule); }

#article-pane .art-pane-section {
  font-family: var(--font-ui); font-size: 0.68rem;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--red);
  margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 0.5rem;
}
#article-pane .art-pane-section::after {
  content: ''; flex: 1; height: 1px; background: var(--rule);
}
#article-pane h1 {
  font-family: var(--font-head);
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  font-weight: 700; line-height: 1.25;
  color: var(--ink); margin-bottom: 0.75rem;
}
#article-pane .art-pane-meta {
  font-family: var(--font-ui); font-size: 0.72rem;
  color: var(--ink-faint); margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--rule);
  display: flex; gap: 1rem; flex-wrap: wrap;
}
#article-pane .art-pane-body {
  font-size: 1rem; line-height: 1.75; color: var(--ink);
}
#article-pane .art-pane-body p { margin-bottom: 0.9rem; }
#article-pane .art-pane-body h2,
#article-pane .art-pane-body h3 {
  font-family: var(--font-head);
  font-weight: 700; margin: 1.25rem 0 0.4rem;
  color: var(--ink);
}
#article-pane .art-pane-body img {
  max-width: 100%; height: auto;
  display: block; margin: 1rem 0;
}
#article-pane .art-pane-body figcaption {
  font-size: 0.75rem; color: var(--ink-faint);
  margin-top: -0.5rem; margin-bottom: 1rem;
  font-style: italic;
}
#article-pane .art-source-link {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-faint);
}
#article-pane .art-source-link a { color: var(--red); }

.art-print-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 1rem;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 14px;
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-muted); cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.art-print-btn:hover { border-color: var(--ink-muted); color: var(--ink); }
.art-print-btn svg { flex-shrink: 0; }

/* ── Background blur overlay ── */
#blur-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 98;
  backdrop-filter: blur(6px) brightness(0.85);
  -webkit-backdrop-filter: blur(6px) brightness(0.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}


/* ── PiP card ── */
#pip-card {
  position: fixed;
  bottom: 14px; right: 14px;
  width: 200px;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--rule);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.88) translateY(8px);
  transform-origin: bottom right;
  transition: opacity 0.3s ease 0.52s, transform 0.35s cubic-bezier(0.34,1.4,0.64,1) 0.52s;
  z-index: 103;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
#pip-card.open { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
#pip-card:hover { border-color: var(--ink-muted); }
.pip-head {
  background: var(--ink); padding: 7px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.pip-logo { font-family: var(--font-head); font-size: 0.68rem; font-weight: 700; color: var(--paper); }
.pip-close {
  background: none; border: none; color: #aaa; cursor: pointer;
  padding: 2px; display: flex; align-items: center; border-radius: 3px;
  transition: color 0.15s;
}
.pip-close:hover { color: var(--paper); }
.pip-body { padding: 8px 10px 10px; }
.pip-sec {
  font-family: var(--font-ui); font-size: 0.58rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red); margin-bottom: 4px;
}
.pip-title {
  font-family: var(--font-head); font-size: 0.72rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.pip-hint { font-family: var(--font-ui); font-size: 0.58rem; color: var(--ink-faint); }

/* ── Fallback notice ── */
.fallback-notice {
  font-family: var(--font-ui); font-size: 0.75rem;
  background: #fff8dc; border: 1px solid #e0c000;
  color: #555; padding: 0.5rem 1rem;
  margin: 0.5rem 1rem 0;
  border-radius: 4px;
}

/* ── Print styles ── */
@media print {
  body, html { overflow: visible !important; background: #fff !important; }
  #masthead, #section-nav, #pages-viewport, #blur-overlay,
  #pip-card, #swipe-hint, .art-print-btn { display: none !important; }
  #article-pane {
    position: static !important;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    border-radius: 0 !important;
    padding: 2rem !important;
    background: #fff !important;
    color: #000 !important;
    box-shadow: none !important;
  }
  #article-pane .art-pane-section,
  #article-pane h1,
  #article-pane .art-pane-meta,
  #article-pane .art-pane-body,
  #article-pane .art-source-link { display: block !important; color: #000 !important; }
  #article-pane .art-pane-body img { max-width: 100% !important; }
  a { color: #000 !important; text-decoration: none !important; }
}

/* ── Swipe hint (first load) ── */
#swipe-hint {
  position: fixed; bottom: 1.2rem; left: 50%;
  transform: translateX(-50%);
  background: rgba(26,26,24,0.75); color: #f8f6f0;
  font-family: var(--font-ui); font-size: 0.72rem;
  padding: 6px 14px; border-radius: 20px;
  pointer-events: none;
  animation: fadeout 3s ease 1.5s forwards;
  white-space: nowrap; z-index: 200;
}
@keyframes fadeout { to { opacity: 0; } }

/* ── Desktop: wider article reading column ── */
/* ── Theme toggle ── */
#theme-toggle {
  background: none; border: none;
  color: var(--paper); cursor: pointer;
  padding: 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.75; transition: opacity 0.15s;
  flex-shrink: 0;
}
#theme-toggle:hover { opacity: 1; }
#theme-toggle svg { display: block; }

@media (min-width: 700px) {
  #article-pane {
    padding: 2rem 2.5rem 4rem;
  }
  .article-row {
    grid-template-columns: 1fr;
    padding: 0.9rem 1.5rem;
  }
  .sec-header { padding: 0 1.5rem 0.7rem; }
  .section-page { padding: 1.4rem 0 2rem; }
  .art-headline { font-size: 1.1rem; }
  #masthead .nameplate { font-size: 1.5rem; }
  .fallback-notice { margin: 0.5rem 1.5rem 0; }
}
</style>

e\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Footage released by Ukrainian police shows the drone pursuing a man around a van being used as a street stand before exploding as he dives for cover behind the vehicle</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - August 05, 2026 11:56 pm IST - KYIV</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> Reuters</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/news/national/poy3wb/article71310932.ece/alternates/FREE_1200/Ukraine.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/news/national/poy3wb/article71310932.ece/alternates/FREE_1200/Ukraine.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/news/national/poy3wb/article71310932.ece/alternates/FREE_1200/Ukraine.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/news/national/poy3wb/article71310932.ece/alternates/FREE_1200/Ukraine.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Picture: X/@ZelenskyyUa\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310814\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Ukraine on Tuesday (August 4, 2026) accused Russia of committing a war crime after a ​video was released showing a drone chasing down and wounding a vegetable seller in ⁠the southern Ukrainian city of Kherson.</p><p>Footage released by Ukrainian police shows the drone pursuing a man around a van being used as a street stand before exploding as he dives for cover behind the vehicle. Police said the man in his ‌50s survived but suffered shock and shrapnel injuries.</p><p>Ukrainian officials later identified him only as a 52-year-old called Yurii and released a video interview with him from a hospital ward.</p><h4 class=\"sub_head\">Trigger warning: The following link contains potentially disturbing visuals of violence. Viewer discretion is advised</h4><p class=\"referpara\"><strong><b><a href=\"https://x.com/ZelenskyyUa/status/2084608193645146204\" target=\"_self\">Click here to view the video posted by Mr. Zelenskyy</a></b></strong></p><p>“Today, many ‌were shocked by yet another video of the drone ‘safari’ Russians are carrying out against civilians ‌in Kherson,” ⁠President Volodymyr Zelenskyy wrote on X, saying that “Russia has gone mad” and calling ⁠for more pressure on Moscow and strong security guarantees for Ukraine.</p><p>“We must act and support life in ways that force Russia to think seriously about peace rather than expanding the range of its drones.”</p><p><i>Reuters</i> verified the location using buildings, the road layout and vegetation ​that matched satellite and archive imagery. The date ‌could not be independently confirmed, but Ukraine’s police and Foreign Minister Andrii Sybiha said the incident happened on Tuesday (August 4, 2026).</p><p>Russia’s Defence Ministry did not immediately respond to Reuters request for comment on the incident.</p><h4 class=\"sub_head\">‘It was terryfying’</h4><p>The vegetable seller went to Kherson in the morning to sell produce, said Oleksandr Prokudin, head ‌of the Kherson regional military administration. Prokudin released the video interview with the man on the Telegram ​app.</p><p>“I only just put up the umbrella and started unloading the boxes. My wife was there, too. Then we heard it buzzing but could not even see it. ⁠It came from somewhere behind the market, from those bushes over there, and flew in very low,” said Yurii, sitting in a hospital ward.</p><p>“It is open steppe. There is nowhere to go. It is terrifying, of course. ‌Really terrifying.”</p><p>On the video, Yurii showed his wounds on both legs and also on his back. His wife ran off and was not injured, he said.</p><p>Mr. Sybiha said the attack formed part of a deliberate Russian campaign to intimidate civilians. “This barbaric Russian war crime in Kherson demands international condemnation and justice, but thousands of similar crimes never come to the public eye,” he wrote on Telegram. In July, the U.N. Human Rights Monitoring Mission in Ukraine said it had documented 1,396 civilian deaths and 7,978 injuries in the first six ‌months of 2026, marking a 37% increase from 2025 and more than double the figures from 2024.</p><p>It said that the ​surge in civilian casualties was primarily driven by intensifying Russian long-range missile and drone strikes targeting cities far from the front lines.</p><p>Ukraine is also attacking Russia with drones and ⁠long-range missiles, many of which have caused civilian casualties, Russian authorities say. Russia on Monday (August 3, 2026) accused Ukraine of terrorism after ⁠seven people, including three children, were killed at its Black Sea holiday resort of Gelendzhik in what it said was a deliberate Ukrainian drone attack on civilians.</p><p>A Ukrainian official said that the ‌drone only fell on the beach in Gelendzhik because it was shot down by Russian air defences, adding that “Ukraine uses its weapons exclusively against the Russian military-industrial complex and economic infrastructure facilities”.</p><p>Both Russia and Ukraine ​deny targeting civilians in the war triggered by Russia’s invasion of Ukraine in February 2022.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 11:51 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310814\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/ukraine-accuses-russia-of-war-crime-after-video-shows-drone-attacking-vegetable-seller-in-kherson/article71310814.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp , {"id": 1, "title": "Bangladesh pro-uprising groups turn on each other on second anniversary", "section": "International", "page": "", "teaser": "Control of campuses has become a battleground for parties and students groups that led the July 2024 movement which ousted Sheikh Hasina and her government. Rights group says at least 17 people were killed in mob violence in July. Six were killed in political violence, a drop from nine in June", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        News\n                    </a><meta content=\"News\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/international/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        World\n                    </a><meta content=\"World\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71309789\" data-title=\"Bangladesh pro-uprising groups turn on each other on second anniversary\" data-url=\"https://www.thehindu.com/news/international/bangladesh-pro-uprising-groups-turn-on-each-other-on-second-anniversary/article71309789.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Control of campuses has become a battleground for parties and students groups that led the July 2024 movement which ousted Sheikh Hasina and her government. Rights group says at least 17 people were killed in mob violence in July. Six were killed in political violence, a drop from nine in June</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 11:23 pm IST - DHAKA</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/rabiul-alam-23676/\"> Rabiul Alam</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/xht7lb/article71310894.ece/alternates/FREE_1200/20260707246L.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/xht7lb/article71310894.ece/alternates/FREE_1200/20260707246L.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/xht7lb/article71310894.ece/alternates/FREE_1200/20260707246L.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/xht7lb/article71310894.ece/alternates/FREE_1200/20260707246L.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Smoke billows after a bomb reportedly exploded during a rally organised by the newly formed National Citizen Party at Savar, in Dhaka. File\n                                          | Photo Credit: ANI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309789\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Two years after a mass uprising forced Sheikh Hasina to flee the country, Bangladesh’s campuses and streets are once again witnessing political violence, this time not between the ousted Bangladesh Awami League and its opponents, but among the very parties and student groups that led the movement against her.</p><p>Bangladesh’s Prime Minister Tarique Rahman, who leads the Bangladesh Nationalist Party (BNP), had pledged during February’s election campaign to end the pattern of state-backed violence that marked Ms. Hasina’s rule before her ouster in the 2024 uprising. Six months into BNP-led rule, the country’s first elected government since the uprising, that promise is being tested on campuses nationwide, with rights groups blaming political rivalries, weak law enforcement and a culture of impunity for the continuing bloodshed.</p><p>The anniversary week itself has been marked by a fresh wave of clashes between the Bangladesh Jatiotabadi Chatra Dal (JCD), the BNP’s student wing, and the Bangladesh Islami Chhatra Shibir, the student wing of the Opposition Jamaat-e-Islami.</p><p>On Wednesday (August 5, 2026), at least 30 activists of the two organisations were injured in confrontations in several areas in the country, including Barishal University and Govt. Tolaram College.</p><p>A day earlier, on August 4, clashes between the two groups left more than 100 people injured across at least three institutions in the capital, including Jagannath University and Dhaka College. Within two days, the violence spread from Begum Rokeya University in Rangpur to different universities and colleges in the capital, prompting the university authorities to launch investigations and deploy additional police. A clash at Begum Rokeya University two days earlier had set off the chain of confrontations.</p><h4 class=\"sub_head\">Deepening fracture</h4><p>Political analysts say the clashes underline a deepening fracture within the coalition of parties, student groups and activists that came together to remove Ms. Hasina in August 2024 — one in which control of campuses, rather than ideology alone, has become the central battleground as Bangladesh marks two years since the uprising that reshaped its politics.</p><p>The most serious flashpoint was Jagannath University in Dhaka, where the trouble began during an official event to mark July Mass Uprising Day 2026, attended by University Grants Commission chairman Professor Mamun Ahmed as the chief guest, when student leaders of Chhatra Shibir tried to display placards listing their demands before the chairman. Two rounds of clashes followed, the first on the campus and the next outside the National Medical College Hospital where the injured had been taken. Both the JCD and the Shibir claimed that more than 30 of their activists and students, including the university students union’s vice-president, general secretary and assistant general secretary, were hurt. JCD activists were also seen entering the hospital’s emergency ward to assault the injured undergoing treatment. Accompanied by BNP loyalists, they also attacked the activists of the Chhatra Shakti, the student wing of the National Citizen Party (NCP), and on those of the Socialist Students’ Front at Jagannath University. The JCD and the Shibir have accused each other of instigating the violence.</p><p>The unrest also spilled over into an official state function at the China-Bangladesh Friendship Conference Centre, where Bangladesh Acting President Hafiz Uddin Ahmad was the chief guest at a programme marking the anniversary of the July uprising. The event was attended by senior government officials, diplomats and political leaders. A controversy erupted after a documentary screened during the programme reportedly credited BNP acting chairman Tarique Rahman with announcing the uprising’s one-point demand for Sheikh Hasina’s resignation. Student leaders objected to the portrayal, maintaining that it was Mr. Nahid Islam, convener of the NCP, who had announced the demand during the uprising. The disagreement led to commotion inside the venue. One student leader of the uprising alleged that he was assaulted by activists of the ruling party inside the programme in front of the President. The disruption prompted several diplomats attending the event to leave before the programme concluded.</p><h4 class=\"sub_head\">Mob violence</h4><p>Addressing the gathering, the President later expressed regret over the developments. He said that he felt “ashamed and pained” after witnessing the incident that happened in front of him. “This is a national event, but after witnessing what happened today, I lost interest in delivering my speech. I feel ashamed and painted.”</p><p>The President said the incident had exposed the divisions in the country’s national unity. He added that he had intended to deliver his speech in English for the benefit of the foreign guests, but decided against it after many foreign guests had left the venue, describing the situation as “unexpected”.</p><p>According to the Human Rights Support Society (HRSS), at least 17 people were killed and 51 injured in incidents of mob violence across the country in July 2026, while six more people died and 164 were injured in 45 separate incidents of political violence. The organisation noted that political violence had in fact declined compared with June when nine people were killed and 346 injured in 58 incidents.</p><p>In July’s political violence, two people were killed and 48 injured in 14 clashes within the BNP’s own ranks; six BNP-Jamaat confrontations left 44 injured; three clashes between the BNP and the Awami League loyalists left 13 injured; five clashes between the BNP and the NCP, the party formed by former student leaders of the uprising, left 38 injured; and 14 clashes between the BNP and other parties left 16 more injured. Three people were killed in three other incidents. Separately, 9,157 people were arrested in 193 political and other incidents in July, including 318 Awami League members, 28 BNP members, seven NCP members and one Jamaat member.</p><p>Meanwhile, the second anniversary of the uprising was marked in the midst of political tensions rather than celebrations. While the government inaugurated the July Mass Uprising Memorial Museum in the capital, opposition parties held separate programmes in the capital.</p><h4 class=\"sub_head\">‘Another revolution’</h4><p>Addressing a rally organised by an 11-party alliance near the Baitul Mukarram National Mosque, opposition leader and Ameer of Bangladesh Jamaat-e-Islami, Dr. Shafiqur Rahman, said, “We will not sit back and do nothing while the country is heading towards disaster.” He also claimed that, judging by the current situation, “another revolution is imminent”, and urged the people to be prepared.</p><p>On the other hand, after the inauguration of the July Mass Uprising Memorial Museum at Sher-e-Bangla Nagar in Dhaka, Prime Minister Rahman cautioned against attempts to create instability in the country. He said some people were “creating issues without reason” in post-authoritarian Bangladesh and urged them to consider whether such actions could inadvertently pave the way for the return of the ousted autocratic regime.</p><p>The museum, established by converting the official residence of ousted Prime Minister Sheikh Hasina, Ganabhaban, into a memorial to the 2024 mass uprising, could not be opened earlier due to various complications. It was finally inaugurated by the Prime Minister on the second anniversary of the uprising.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 11:23 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71309789\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/bangladesh-pro-uprising-groups-turn-on-each-other-on-second-anniversary/article71309789.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop ndu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/258-244/\">\n                        Bangladesh\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 2, "title": "Bangladesh turns ousted Hasina’s official residence into museum; observes ‘July Mass Uprising Day’", "section": "International", "page": "", "teaser": "Prime Minister Tarique Rahman inaugurated the ‘July Mass Uprising Memorial Museum’ at Ganabhaban, prime minister’s official residence during Hasina’s regime, coinciding with the day she fled to India", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        News\n                    </a><meta content=\"News\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/international/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        World\n                    </a><meta content=\"World\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310797\" data-title=\"Bangladesh turns ousted Hasina’s official residence into museum; observes ‘July Mass Uprising Day’\" data-url=\"https://www.thehindu.com/news/international/bangladesh-turns-ousted-hasinas-official-residence-into-museum-observes-july-mass-uprising-day/article71310797.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Prime Minister Tarique Rahman inaugurated the ‘July Mass Uprising Memorial Museum’ at Ganabhaban, prime minister’s official residence during Hasina’s regime, coinciding with the day she fled to India</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:44 pm IST - DHAKA</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/rcoz8p/article71310829.ece/alternates/LANDSCAPE_1200/AP08_05_2026_000265B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/rcoz8p/article71310829.ece/alternates/LANDSCAPE_1200/AP08_05_2026_000265B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/rcoz8p/article71310829.ece/alternates/LANDSCAPE_660/AP08_05_2026_000265B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/rcoz8p/article71310829.ece/alternates/LANDSCAPE_320/AP08_05_2026_000265B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Bangladesh's Prime Minister Tarique Rahman, centre left in the first row, and former interim leader Muhammad Yunus, centre in blue, arrive for the inauguration of a museum which will serve as a memorial for those killed during the mass uprisings in July 2024, at the former residence of Bangladesh's ousted leader Sheikh Hasina, in Dhaka, Bangladesh, on August 5, 2026.\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310797\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Amid tightened nationwide security, Bangladesh on Wednesday (August 5, 2026) inaugurated a memorial museum at the official residence of ousted Prime Minister Sheikh Hasina for the victims of violence during the anti-government protests in 2024 that toppled her government.</p><p>Prime Minister Tarique Rahman inaugurated the 'July Mass Uprising Memorial Museum' at Ganabhaban, prime minister's official residence during Hasina's regime, coinciding with the day she fled to India on August 5, 2024.</p><p>“The killers in the anti-fascist movement will be tried in a transparent, impartial and credible manner following the due process of law,” Mr. Rahman said in a brief address while unveiling the museum’s plaque.</p><p>“Justice for every crime is essential to ensure rule of law” Mr. Rahman said as the Interim government chief Muhammad Yunus stood beside him.</p><p>The Prime Minister announced that government institutions would be named after slain activists of the uprising and those who were killed during the rule of Hasina’s Awami League since 2009.</p><p>The 2024 mass uprising did not belong to any individual, group or political party, he said, adding, the true heroes of the uprising are the democratic people of Bangladesh.</p><p>Mr. Rahman toured the museum’s galleries and exhibitions featuring preserved artefacts, photographs, official documents, video footage and memorabilia related to the July Mass Uprising.</p><p>Speaking at the museum event, Mr. Yunus said the July Memorial Museum is not just an establishment but the beginning of a new chapter in Bangladesh's history.</p><p>The July Memorial Museum will become the centre of “our history,” Mr. Yunus was quoted as saying by the state-run news agency <i>Bangladesh Sangbad Sangstha</i> (BSS).</p><p>“The path of a new Bangladesh will begin from here. If we lose our way, we will start from here,” Mr. Yunus said.</p><p>According to a February 2025 UN rights office report, up to 1,400 people were killed between July 15 and August 15 last year, the period dubbed as the ‘July Uprising,’ as Ms. Hasina’s government ordered a security crackdown on protesters.</p><p>Three days after Ms. Hasina fled to India following the widespread protests against her government over a controversial quota system in jobs, Mr. Yunus took over as the chief adviser of the Interim government.</p><p>A special tribunal set up by Mr. Yunus' government gave Ms. Hasina a death sentence in November 2025 on charges of “crimes against humanity” and “genocide.” His interim regime, under an executive order, also banned Ms. Hasina's Awami League that has been in power for many terms since 1971. The decision was endorsed by Mr. Rahman’s Bangladesh Nationalist Party (BNP) government after the February 12 elections.</p><p>Family members of several July uprising victims shared their memories and reflections during the event, a report in <i>Dhaka Tribune</i> said.</p><p>Bangladesh is commemorating August 5 as the ‘July Mass Uprising Day’ with the government, political parties and socio-cultural organisations organising various programmes to honour the sacrifices of those, including students, who took to the streets against what they described as Ms. Hasina's “misrule and autocracy,” according to the <i>BSS</i>.</p><p>Another <i>Dhaka Tribune</i> report said that a state ceremony marking the second anniversary of the July Mass Uprising descended into protests on Wednesday (August 5, 2026) after audience members accused the government of distorting the movement’s history through an official documentary, forcing ministers to apologise and promise immediate corrections.</p><p>The unprecedented disruption unfolded in the presence of Acting President Hafiz Uddin Ahmed Bir Bikram at the Bangladesh-China Friendship Conference Centre, where families of those killed in July Uprising, injured protesters, students and political activists interrupted the programme with chants of “fake, fake” after the documentary was screened, it said.</p><p><i>The Daily Star</i> said the National Citizen Party (NCP) member secretary and lawmaker Akhter Hossen alleged that the government-produced documentary shown at the state programme “deliberately omitted key events and presented an incomplete account of the movement.”</p><p>The NCP is led by those who spearheaded the 2024 street protest toppling the Awami League government.</p><p>“This was not a party programme; it was a state event. After attending, we felt that the documentary failed to present a complete picture of the July Uprising,” he told <i>The Daily Star</i> over the phone after walking out of the event.</p><p>According to Bengali daily <i>Prothom Alo</i>, at least 10 people sustained injuries after a scuffle and subsequent clash broke out between the leaders and activists of Chhatra Dal and Chhatra Shibir at the University of Barishal, in south-central Bangladesh, over a procession marking the anniversary of the July Mass Uprising.</p><p>Bangladesh Jatiotabadi Chhatra Dal, commonly known as Chhatra Dal, is BNP's student wing while Islami Chhatra Shibir, known commonly as Chhatra Shibir, is the student wing of right wing Jamaat-e-Islami.</p><p>Meanwhile, Bangladesh tightened a nationwide security vigil fearing violence as Hasina was set to deliver a virtual public address in New Delhi.</p><p>The authorities had, earlier this week, ordered a nationwide security alert fearing outbreak of violence coinciding with the anniversary, particularly directing police to take extra care for their own personnel and their vehicles.</p><p>Paramilitary Border Guard Bangladesh (BGB) were deployed to enforce the vigil in southwestern Gopalganj, Ms. Hasina’s ancestral home district, and birthplace of her father and Bangladesh’s founder Sheikh Mujibur Rahman.</p><p>However, there were no reports of any violence till Wednesday (August 5, 2026) evening.</p><p>According to media reports and analysts, there has been a sense of unease in Bangladesh since Ms. Hasina announced last month to return home by December.</p><p>The unease intensified as her party announced that she would appear virtually to meet the international press at New Delhi's Foreign Correspondents' Club of South Asia on Wednesday (August 5, 2026).</p><p>Ahead of her public address, Sajeeb Wazed, her U.S.-based son and ICT affairs adviser of the ousted Awami government, in a social media post said, “The August 5 reminds us how an organised state, social system is grabbed by extremists under a unique design of some power greedy anti-Bangladesh quarters.”</p><p>Mr. Wazed said the day severely affected Bangladesh’s democratic continuity causing a protracted political unrest and a long-term crisis for different sectors of the state.</p><p>Mr. Wazed and Ms. Hasina both spoke virtually at the event.</p><p>Following widespread protests against her government over a controversial quota system in jobs, Ms. Hasina fled to India on August 5, 2024, an event that reshaped the country's political landscape. Three days later, Muhammad Yunus took over as the chief adviser of the Interim government.</p><p>On November 17, 2025, the International Crime Tribunal, Bangladesh (ICT-BD) sentenced to death Mr. Hasina and home minister of her cabinet Asaduzzaman Khan Kamal after trial in absentia conserving their superior responsibility in committing crimes by their attempt to tame the protestors.</p><p>Earlier, Bangladesh prime minister’s information adviser Zahed Ur Rahman had warned media outlets that publishing or broadcasting Ms. Hasina's speech would face strict legal actions, saying it would directly violate an active ban by the ICT-BD.</p><p>But ICT-BD chief prosecutor Aminul Islam said there was no blanket legal ban on broadcasting or publishing Ms. Hasina’s statements and said the tribunal restricted the Bangladesh media only from airing remarks that contain “hate speech” or undermined the special court’s dignity and image.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:44 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310797\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/bangladesh-turns-ousted-hasinas-official-residence-into-museum-observes-july-mass-uprising-day/article71310797.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu -->       </a><meta content=\"News\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/international/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        World\n                    </a><meta content=\"World\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71309979\" data-title=\"Fear, personal safety cannot decide my duty to the people: Sheikh Hasina\" data-url=\"https://www.thehindu.com/news/international/sheikh-hasina-former-bangladesh-pm-awami-league-press-interaction-august-5-2026/article71309979.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Ousted Bangladesh PM Sheikh Hasina said the members of her party, Awami League, have been persecuted and killed, and called for lifting the ban on the party</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - August 05, 2026 10:28 pm IST - NEW DELHI</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/kallol-bhattacherjee-680/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/kallol-bhattacherjee-680/\">Kallol Bhattacherjee</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/gyrccu/article71309996.ece/alternates/LANDSCAPE_1200/TH10-Reuters-HaGU8G819BV.3.jpg.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/gyrccu/article71309996.ece/alternates/LANDSCAPE_1200/TH10-Reuters-HaGU8G819BV.3.jpg.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/gyrccu/article71309996.ece/alternates/LANDSCAPE_660/TH10-Reuters-HaGU8G819BV.3.jpg.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/gyrccu/article71309996.ece/alternates/LANDSCAPE_320/TH10-Reuters-HaGU8G819BV.3.jpg.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Bangladesh PM Sheikh Hasina. File\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71309979\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Former Bangladesh Prime Minister Sheikh Hasina, who was deposed in August 2024 following protests, on Wednesday (August 5, 2026) virtually addressed a press conference here and said “fear” and “concerns of personal safety” will not prevent her from returning home.</p><p>She said the members of her party, Awami League, have been persecuted and killed, and called for lifting the ban on the party. She termed India a country that has “always been a friend” and supported Bangladesh when it faced difficulties in 1971 and 1975.</p><p>“I know, I may be detained. I may be sent to prison, and they may implicate me in fabricated cases. But fear cannot decide my duty to the people, my life or beyond. My life has been beyond the considerations of personal safety for long,” said Ms. Hasina indicating that she may return in December 2026 as “December is the month of victory.”</p><p>“You will get to know when I decide to go,” said Ms. Hasina when asked about the date of her return.</p><p>Awami League activists said Ms. Hasina will not use a third country to reach Dhaka, and she will take permission from the Indian authorities in December before starting her journey.</p><p>Ms. Hasina recounted that she along with her mother were imprisoned in 1971 during the Liberation War and that she lost most of her family members in 1975. She said she had survived multiple imprisonments and 19 assassination attempts.</p><p>“Even the August 21, 2004, grenade attack could not stop me. Therefore, I am not worried about my own future. I am worried about the future of Bangladesh. I want to return because people deserve security, development, prosperity and peace,” said Ms. Hasina. She described the protesters of 2024 as “organised” groups that worked according to a “meticulous” plan.</p><p>The media event at the Foreign Correspondents Club was the first occasion when Ms. Hasina answered questions from the international media since arriving here on August 5, 2024.</p><p>“Fear has entered homes, workplaces and campuses. This is not the Bangladesh that we built,” said Ms. Hasina, accusing the interim government and the current dispensation led by Prime Minister Tarique Rahman of being responsible for the breakdown in law-and-order situation in the country.</p><p>Ms. Hasina referred to an investigation committee that she had ordered to probe the uprising of July-August 2024 and accused the interim government under Mohammed Yunus of scrapping that commission.</p><p>On Tuesday, authorities in Bangladesh had issued a notification urging news outlets to avoid telecasting the speech and the interaction that was beamed live on social media.</p><p>The press conference was announced on Sunday following which the Bangladesh government had communicated to Indian High Commissioner Dinesh Trivedi that Ms. Hasina’s political activities from Indian territory may harm bilateral relations. On Tuesday, the External Affairs Ministry said the government had no “involvement” with the programme.</p><p>The meeting was addressed by Sajeeb Wazed Joy, Ms. Hasina’s son, who accused the current government of being soft on extremists. “Bangladesh has become another Pakistan. Hizbut Tahrir moves freely there. Al Qaeda leaders hold public rallies,” Mr. Joy said, adding that the security situation in Bangladesh is a matter of concern for India and the world.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 07:41 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71309979\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/sheikh-hasina-former-bangladesh-pm-awami-league-press-interaction-august-5-2026/article71309979.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/258-244/\">\n                        Bangladesh\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 4, "title": "Russian barrage on Kyiv kills 17 as Ukraine fails to down single missile", "section": "International", "page": "", "teaser": "Kyiv was unable to shoot down any of the missiles launched by Russia, whose intensifying attacks have prompted Kyiv to plead for more U.S.-made Patriot interceptors", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        News\n                    </a><meta content=\"News\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/international/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        World\n                    </a><meta content=\"World\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310778\" data-title=\"Russian barrage on Kyiv kills 17 as Ukraine fails to down single missile\" data-url=\"https://www.thehindu.com/news/international/russian-barrage-on-kyiv-kills-17-as-ukraine-fails-to-down-single-missile/article71310778.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Kyiv was unable to shoot down any of the missiles launched by Russia, whose intensifying attacks have prompted Kyiv to plead for more U.S.-made Patriot interceptors</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:25 pm IST - KYIV, UKRAINE</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AFP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/fgksol/article71310790.ece/alternates/LANDSCAPE_1200/2026-08-05T161913Z_211383291_RC2GSMAQKSRO_RTRMADP_3_UKRAINE-CRISIS-BRITAIN.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/fgksol/article71310790.ece/alternates/LANDSCAPE_1200/2026-08-05T161913Z_211383291_RC2GSMAQKSRO_RTRMADP_3_UKRAINE-CRISIS-BRITAIN.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/fgksol/article71310790.ece/alternates/LANDSCAPE_660/2026-08-05T161913Z_211383291_RC2GSMAQKSRO_RTRMADP_3_UKRAINE-CRISIS-BRITAIN.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/fgksol/article71310790.ece/alternates/LANDSCAPE_320/2026-08-05T161913Z_211383291_RC2GSMAQKSRO_RTRMADP_3_UKRAINE-CRISIS-BRITAIN.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    A building damaged by Russian strikes in the Lukianivska district of Kyiv during Britain Defence Secretary Wes Streeting's one day visit to the Ukrainian capital, Ukraine August 5, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310778\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Russian missile and drone strikes killed at least 17 people and wounded dozens more in Kyiv and the surrounding region overnight, authorities said on Wednesday (August 5, 2026).</p><p>Kyiv was unable to shoot down any of the missiles launched by Russia, whose intensifying attacks have prompted Kyiv to plead for more U.S.-made Patriot interceptors.</p><p>Russia has significantly upped its attacks on the Ukrainian capital in recent months, typically firing salvos of hard-to-intercept ballistic missiles in short blitzes that rock buildings and send booms echoing across the city.</p><p>\"Ballistic interceptors are what could have saved the lives of those killed today,\" Ukrainian President Volodymyr Zelenskyy said, announcing the 17-persion death toll.</p><p>A cloud of smoke hovered over the capital at sunrise, <i>AFP</i> journalists saw, after the attacks sparked fires in several locations in the region. Over 40 people were wounded in the capital and its surrounding areas, local authorities said. <i>AFP</i> journalists heard explosions in Kyiv after midnight (2100 GMT Tuesday), following Ukrainian air force warnings of incoming ballistic missiles.</p><p>One journalist reported seeing dark smoke and the acrid smell of burning lingering in the air hours later.</p><h4 class=\"sub_head\">'We were lucky today'</h4><p>\"The night was so terrifying, so hard,\" Kyiv resident Natalia Reutska told <i>AFP</i> in the morning after the attack.</p><p>\"We've gotten used to waking up thinking, 'we were lucky today,' and that's very scary,\" she added.</p><p>Ukraine did shoot down 98 of the 115 drones fired by Russia overnight, the air force said.</p><p>But it was unable to shoot down any of the missiles, preliminary statistics from the air force showed.</p><p>EU chief Ursula von der Leyen slammed \"horrible atrocities\" while French President Emmanuel Macron said France would \"not give into intimidation\" and called to increase sanctions on Russia.</p><p>Kyiv can intercept the vast majority of drones, but still relies on supplies from allies to counter missiles.</p><p>Mr. Zelenskyy said the number of air defence missiles supplied from allies had dropped threefold compared with 2025.</p><p>He has repeatedly warned about critical air defence shortages, as Moscow fired a record number of missiles at Ukraine in July, an <i>AFP</i> analysis of Ukrainian air force data published on Saturday (August 1, 2026) showed.</p><p>There has been an uptick in civilian deaths in the conflict throughout 2026, the United Nations has reported, as the four-and-a-half-year war grinds on with no sign of a peace deal.</p><p>In Ukraine's eastern Donetsk region, a key target for the Kremlin, local authorities on Wednesday (August 5, 2026) ordered hundreds of families with children to leave the major Ukrainian-held city of Kramatorsk.</p><p>\"This is a difficult but necessary decision. The security situation is deteriorating, so it is unacceptable to leave children under the constant threat of Russian attacks,\" Donetsk region governor Vadym Filashkin said.</p><h4 class=\"sub_head\">Train station hit</h4><p>The Russian attacks overnight mainly targeted warehouses, Kyiv said, with some strikes on infrastructure and a railway station.</p><p>Eight people were killed in a strike on a train station on the eastern edge of Kyiv, where an <i>AFP</i> journalist saw several bodies covered with white sheets next to the train tracks.</p><p>Logistics centres of the general merchandise chain Epicentr were struck, burning one hub completely to the ground and killing an employee, the company said.</p><p>Three people working at a postal sorting centre were also killed, and online retailer Rozetka also said it suffered its third attack this week.</p><p>Moscow said it hit \"transportation, logistics, and distribution centres in the city of Kyiv and the Kyiv region that were involved in the storage, delivering various weapons and military cargo, as well as in the production and distribution of unmanned aerial vehicles.\"</p><p>The network of Russian online retailer Wildberries has been hit around a dozen times since mid-July by Ukrainian forces.</p><p>The series of strikes killed at least eight people and have knocked out a large chunk of the company's storage capacity.</p><p>Kyiv accuses the e-commerce giant — which employs tens of thousands of people and is sometimes referred to as \"Russia's Amazon\" — of storing drone parts and helping the Russian army.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:25 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310778\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/russian-barrage-on-kyiv-kills-17-as-ukraine-fails-to-down-single-missile/article71310778.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side tex \n                        World\n                    </a><meta content=\"World\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310750\" data-title=\"Iran, Oman reach understanding on coordinates of route through Hormuz, Iran Ministry says\" data-url=\"https://www.thehindu.com/news/international/iran-oman-reach-understanding-on-coordinates-of-route-through-hormuz-iran-ministry-says/article71310750.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Iran Foreign Ministry said that any such agreement between Iran and ‌Oman would not, by itself, guarantee ‌security ⁠in the strategic waterway</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 10:13 pm IST - DUBAI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> Reuters</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/xu01dd/article71310758.ece/alternates/LANDSCAPE_1200/2026-08-03T073334Z_269669342_RC2RQMA1TKMQ_RTRMADP_3_IRAN-CRISIS-SHIPPING.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/xu01dd/article71310758.ece/alternates/LANDSCAPE_1200/2026-08-03T073334Z_269669342_RC2RQMA1TKMQ_RTRMADP_3_IRAN-CRISIS-SHIPPING.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/xu01dd/article71310758.ece/alternates/LANDSCAPE_660/2026-08-03T073334Z_269669342_RC2RQMA1TKMQ_RTRMADP_3_IRAN-CRISIS-SHIPPING.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/xu01dd/article71310758.ece/alternates/LANDSCAPE_320/2026-08-03T073334Z_269669342_RC2RQMA1TKMQ_RTRMADP_3_IRAN-CRISIS-SHIPPING.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Vessels in the Strait of Hormuz, as seen from Musandam, Oman, August 3, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310750\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Iran and Oman have reached an understanding ​on the geographic coordinates for a shipping ‌route through the Strait of Hormuz, ​and a joint announcement is ⁠being finalised, provided certain third parties did not interfere, Iran’s Foreign Ministry spokesperson Esmaeil Baghaei ‌said on Wednesday (August 5, 2026).</p><p>Mr. Baghaei added that any such agreement between Iran and ‌Oman would not, by itself, guarantee ‌security ⁠in the strategic waterway.</p><p class=\"referpara\"><strong><b>West Asia war: <a href=\"https://www.thehindu.com/news/international/west-asia-war-tehran-washington-talks-iran-oman-diplomatic-engagement-strait-of-hormuz-live-updates-august-5-2026/article71307954.ece\" target=\"_self\">Follow LIVE updates on August 5, 2026</a></b></strong></p><p>The proposed deal ⁠between Iran and Oman would give Tehran control over ships entering the Gulf through the ​Strait of Hormuz, a ‌senior Iranian source and two regional officials told <i>Reuters</i> on Wednesday (August 5, 2026), in one of the biggest concessions yet ‌to Iran.</p><p>Despite the apparent step towards ​yielding to Iranian demands, the sources pushed back against assertions by ⁠U.S. President Donald Trump that a deal reopening the strait was imminent, saying important ‌details still had to be agreed.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/trump-says-strait-of-hormuz-deal-could-be-announced-soon/article71308448.ece\">\n\t\t\t\t\t\t\t\t\t\tTrump says Strait of Hormuz deal could be announced soon</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/4pm2o0/article71308474.ece/alternates/SQUARE_80/Trump_33758.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAgMBAQAAAAAAAAAAAAAFBgQHAAECAwgBAAIDAQEAAAAAAAAAAAAAAAIDAQQFAAb/2gAMAwEAAhADEAAAAD1Z87y/WM0wEUmFsuxSTGvPabYUjUsa64szH5bZIZCTtz4UajjRV7IU4DtVelRs97+ZbwEVA+aZsR9RrH0JWNxarH7H69d8rZhW3L8zuNdVtgq09fyHz3sLjh4rC30HQUvieB9gN2EC9ajHdUG2lSYwQYA66mGMmo88NnRi7OOvrChpn//EACgQAAIDAQABBAEEAgMAAAAAAAMEAQIFBgcAE
