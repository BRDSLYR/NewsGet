"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 15, "title": "RBI has funds to pay for UPI platform without having to charge merchants, customers", "section": "Business", "page": "", "teaser": "The government has introduced a Bill in Parliament that will allow it to notify the kinds of transactions that can attract such a charge. So far, UPI has been free for merchants and customers", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        News\n                    </a><meta content=\"News\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/news/national/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        India\n                    </a><meta content=\"India\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310040\" data-title=\"RBI has funds to pay for UPI platform without having to charge merchants, customers\" data-url=\"https://www.thehindu.com/news/national/rbi-has-funds-to-pay-for-upi-platform-without-having-to-charge-merchants-customers/article71310040.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The government has introduced a Bill in Parliament that will allow it to notify the kinds of transactions that can attract such a charge. So far, UPI has been free for merchants and customers</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 09:56 pm IST </span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/t-c-a-sharad-raghavan-2252/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/t-c-a-sharad-raghavan-2252/\">T.C.A. Sharad Raghavan</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/heabrl/article71310711.ece/alternates/LANDSCAPE_1200/RBI-balance-sheG44G1SVLF.5.jpg.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/heabrl/article71310711.ece/alternates/LANDSCAPE_1200/RBI-balance-sheG44G1SVLF.5.jpg.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/heabrl/article71310711.ece/alternates/LANDSCAPE_660/RBI-balance-sheG44G1SVLF.5.jpg.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/heabrl/article71310711.ece/alternates/LANDSCAPE_320/RBI-balance-sheG44G1SVLF.5.jpg.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Even with the volume of UPI transactions growing 425% over the last five years, the quantum of surpluses transferred by the RBI to the Union government has grown at more than double that rate.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310040\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Reserve Bank of India Governor Sanjay Malhotra on Wednesday (August 5, 2026) said that “someone will have to pay the cost” of UPI transactions, which are currently free for merchants and customers. The cost is currently being borne by banks and the National Payment Corporation of India.</p><p>Mr. Malhotra was responding to media queries in the context of recent moves by the government to pave the way for a charge to be levied on such transactions. If implemented, certain merchants would have to pay banks for the use of the UPI platform, which experts say they would pass on to customers.</p><p>An analysis by <i>The Hindu</i> has found that the RBI itself has more than enough funds to pay for the UPI platform’s use, without involving any additional charge on merchants or customers. This additional cost would amount to between 3-8.5% of what the central bank transferred to the Union government as its annual surplus.</p><p>Further, even with the volume of UPI transactions growing 425% over the last five years, the quantum of surpluses transferred by the RBI to the Union government has grown at more than double that rate.</p><h4 class=\"sub_head\">Provisions to make ‘someone’ pay</h4><p>“The costs have to be paid by someone,” Mr. Malhotra said. “We all want that this public infrastructure should continue to strengthen. Let’s wait and watch for further developments on this.</p><p>“The cost is already getting passed on,” he added. “It may not be directly on to the very user, but someone is paying the cost. This is what I meant when I said someone will have to pay the cost. What is important is that we continue to invest and we continue to find the means, whether it is MDR or other things.”</p><p>A provision in the Taxation and Other Laws (Amendment) Bill, 2026 introduced in Parliament by the government on Tuesday (August 4, 2026) dilutes the earlier restrictions imposed on banks from imposing charges such as a Merchant Discount Rate (MDR) on UPI transactions. Instead, it says that the government can notify the kinds of transactions that can attract such a charge.</p><h4 class=\"sub_head\">Cost of running UPI</h4><p>According to sources in the government, the proposal to allow banks to levy an MDR is currently limited to a small sub-set of merchants — those with an annual turnover of Rs 1-1.5 crore — and to transactions above ₹2,000 in value.</p><p>However, the wording of the Bill provides an avenue for this charge to be levied on a wider set of transactions in the future.</p><p>According to banking industry officials, the UPI platform currently costs about ₹0.4-1 per transaction to operate and maintain. Official data shows that 24,161.69 crore UPI transactions were conducted in 2025-26. This would peg the cost of running the platform at ₹9,664 to ₹24,161 crore per year.</p><h4 class=\"sub_head\">Surplus available</h4><p>The RBI earned approximately ₹4.3 lakh crore in 2025-26. Out of this, it transferred about ₹2.9 lakh crore to the Union government as surplus for 2025-26. The cost of running the UPI platform that year would have worked out to 3-8.5% of this amount.</p><p>RBI surplus transfers have grown from ₹30,307.45 crore in 2021-22 to about ₹2.9 lakh crore in 2025-26, a growth of 857%. Over this period, the volume of UPI transactions grew 425%.</p><p>This shows that, even with this rapid growth in UPI adoption, the RBI surpluses have grown more than enough to cover the cost of all UPI transactions.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 09:56 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310040\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/rbi-has-funds-to-pay-for-upi-platform-without-having-to-charge-merchants-customers/article71310040.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/topic/reserve-bank-of-india/\">\n                        Reserve Bank of India\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 16, "title": "Letters to The Editor — August 6, 2026", "section": "Opinion", "page": "", "teaser": "", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Opinion\n                    </a><meta content=\"Opinion\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/letters/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Letters\n                    </a><meta content=\"Letters\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 letters\" data-id=\"71310645\" data-title=\"Letters to The Editor — August 6, 2026\" data-url=\"https://www.thehindu.com/opinion/letters/letters-to-the-editor-august-6-2026/article71310645.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 06, 2026 12:24 am IST </span></p></div><div class=\"author\"></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310645\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Language in politics</p><p>Recent developments in political discourse across India, particularly in Tamil Nadu, underscore the need for restraint, dignity, and moderation in public debate. Language is the apparel of democracy. If democracy is the best form of governance, it must be protected, nurtured, and enriched. The language used in public life reflects one’s commitment to democratic values.</p><p>K.S.S. Seshan,</p><p>Errepalle, Andhra Pradesh</p><p>As a septuagenarian, I have witnessed many changes in our country over the decades — some for the better, others for the worse. Among the latter, one of the most disturbing has been the steady decline in the quality of public discourse in recent years, particularly among our political leaders. With millions watching them every day on television and social media, political leaders ought to realise that their words and conduct shape public behaviour. It is therefore unsurprising that coarse, intemperate, and abusive language has gradually become normalised in our society.</p><p>Sharp exchanges between the treasury benches and the Opposition are an integral part of any vibrant democracy. But when political discourse descends into vile personal attacks, drags family members into political battles, pries into private lives, or levels unsubstantiated allegations of moral turpitude, it demeans public life and weakens democratic values. Those who sow the wind of abuse should not complain when they reap the whirlwind of retaliation.</p><p>G.G. Menon,</p><p>Tripunithura, Kerala</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 06, 2026 12:24 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310645\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/letters/letters-to-the-editor-august-6-2026/article71310645.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu -->< >\n                        letters\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 17, "title": "Fiscal federalism, efficiency versus equity concerns", "section": "Opinion", "page": "", "teaser": "The Sixteenth Finance Commission risks moving away from its core mandate of acting as an equalising force within the federation", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Opinion\n                    </a><meta content=\"Opinion\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/lead/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Lead\n                    </a><meta content=\"Lead\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 opinion\" data-id=\"71310469\" data-title=\"Fiscal federalism, efficiency versus equity concerns\" data-url=\"https://www.thehindu.com/opinion/lead/fiscal-federalism-efficiency-versus-equity-concerns/article71310469.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Sixteenth Finance Commission risks moving away from its core mandate of acting as an equalising force within the federation</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - August 06, 2026 04:30 pm IST </span></p></div><div class=\"author\"><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/k-j-joseph-14350/\">K.J. Joseph,</a><a class=\"person-name lnk lnk\" href=\"https://www.thehindu.com/profile/author/sumalatha-b-s-30409/\">Sumalatha  B.S.</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/opinion/op-ed/msjoey/article71310471.ece/alternates/LANDSCAPE_1200/iStock-2279950946.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/opinion/op-ed/msjoey/article71310471.ece/alternates/LANDSCAPE_1200/iStock-2279950946.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/opinion/op-ed/msjoey/article71310471.ece/alternates/LANDSCAPE_660/iStock-2279950946.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/opinion/op-ed/msjoey/article71310471.ece/alternates/LANDSCAPE_320/iStock-2279950946.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    ‘Fiscal discipline, while necessary, cannot substitute for fiscal justice’\n                                          | Photo Credit: Getty Images/iStockphoto\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310469\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>The Finance Commission, an institutional innovation embedded in India’s constitutional architecture, was never intended to be a routine allocator of funds. It was designed as a central pillar of India’s fiscal federal compact and as a corrective institution that would mediate the inherent asymmetry between a fiscally dominant Union and structurally constrained States, while also addressing deep horizontal inequalities arising from history, geography, and institutional capacity. In a country marked by uneven development at Independence, the Commission’s central mandate was to safeguard the interests of the States and thereby preserve a strong Union.</p><p>Each successive Commission, cognisant of its historical context, has interpreted this mandate in its own way, yet all have contributed to sustaining India’s fiscal federal compact. The recently submitted report of the 16th Finance Commission (FC-16), chaired by Arvind Panagariya and covering the period 2026-31, marks a decisive turning point. While it retains the vertical devolution of central taxes to the States at 41%, it fundamentally re-engineers the structure of fiscal transfers, particularly grants-in-aid. In doing so, it prioritises efficiency and performance but raises serious concerns about equity and constitutional intent. At the heart of the issue lies a deeper question: has the Commission moved away from its equalising role toward one that implicitly protects the Union’s fiscal primacy?</p><h4 class=\"sub_head\">The constitutional logic of grants-in-aid</h4><p>Evidently, the provision for grants-in-aid under Article 275 was not an afterthought; it was a foundational design element. In a country more diverse than any other in the world, tax devolution, however sophisticated its formula, cannot account for the diversity of State-specific needs. For instance, Kerala’s “export-oriented” human capital development strategy has accounted for nearly 23% of India’s total remittances, thereby strengthening the country’s external sector. However, this has come at a cost to the State’s fiscal health, as it has had to rely on borrowing to finance investments in education.</p><p class=\"referpara\"><strong>\n        Editorial | <b><a href=\"https://www.thehindu.com/opinion/editorial/a-cautious-nudge-on-the-sixteenth-finance-commissions-recommendations/article70583811.ece\" target=\"_self\">A cautious nudge: On the 16th Finance Commission’s recommendations</a></b></strong></p><p>Similarly, Punjab has played a critical role in ensuring national food security, but at the cost of its revenue base, by focusing on the production of wheat and rice, which are non-taxable apart from paying the price of being a border State. The same is true of the hill States, which face high infrastructure costs; the north-eastern States, which grapple with connectivity constraints; and fiscally stressed States burdened by demographic pressures and social sector commitments.</p><p>Grants-in-aid were therefore conceived as instruments of equalisation, enabling targeted support for States with special needs where formula-based tax devolution falls short. The F-14 and the FC-15 recognised this reality by retaining Revenue Deficit Grants (RDGs), sector-specific grants, and State-specific grants.</p><p>The FC-16 departs sharply from this tradition. It recommends grants-in-aid of ₹9.47 lakh crore, compared with ₹10.1 lakh crore under the FC-15, while their share in total Finance Commission transfers has more than halved, from 19.4% to 8.3%. By restricting grants-in-aid to local bodies and disaster management, it eliminates RDGs, sector-specific grants, and State-specific grants.</p><p>While retaining the States’ share in the divisible pool at 41%, despite the demand from 18 States to raise it to 50%, the Commission presumes that improved fiscal discipline should enable States to manage their finances without additional gap-filling transfers. However, this reasoning rests on a problematic assumption: that fiscal capacity across States is sufficiently uniform for devolution to be self-equalising.</p><p>Empirically and historically, this assumption is untenable. The Commission’s justification for doing away with RDGs is rooted in concerns about fiscal prudence. It argues that RDGs create moral hazard by incentivising States to underperform in revenue mobilisation or overspend in the expectation of central support.</p><p>It also points to aggregate data suggesting that the States, taken as a whole, are not in severe fiscal distress. Yet, this aggregate view masks deep inter-State disparities, with some States remaining fiscally stressed despite contributing disproportionately to national development and continuing to require fiscal assistance. The very purpose of RDGs was to recognise this heterogeneity, as a fiscal surplus in one State cannot offset a fiscal deficit in another.</p><p>More troubling is the contrast between the Commission’s stance on RDGs and its treatment of cesses and surcharges. While advocating fiscal discipline for States through the withdrawal of RDGs, it stops short of recommending any binding rollback of these non-shareable union levies ignoring the demand by many States.</p><h4 class=\"sub_head\">Dual shift</h4><p>Instead, it proposes a “grand bargain”, whereby the Centre would gradually merge cesses into the divisible pool in exchange for States accepting a lower devolution share. This asymmetry is difficult to overlook. RDGs are removed in the name of discipline, yet cesses — arguably a more distortionary instrument from a federal perspective — are only gently nudged toward reform. The resulting framework imposes stringency on States while preserving fiscal flexibility for the Union. This dual shift, protecting Union revenues while constraining State support, raises a fundamental concern: is the Commission inadvertently reinforcing vertical imbalance rather than correcting it?</p><p>The consequences are particularly severe for States that already face structural disadvantages. As many as eight States, including most of the disadvantaged north-eastern States and fiscally stressed West Bengal, are set to experience a reduced share in both tax devolution and grants-in-aid, while another six States have seen a decline in their share of grants. The problem is further compounded by the reduction in the weight assigned to income distance (from 45% to 42.5%) and the introduction of a 10% weight for contribution to GDP. When combined with the removal of the RDGs, which accounted for about 20% of Finance Commission grants in 2024-25, this creates a double burden: lower tax devolution and the absence of compensatory grants. The Commission’s implicit assumption that efficiency should trump equity risks widening regional disparities.</p><p>Another defining feature of the FC-16 is its emphasis on tied and performance-based grants, particularly for local governments. While the allocation of nearly ₹7.2 lakh crore to the third tier is commendable, the conditionalities attached to these grants are stringent, linking the release of funds to targets in water and sanitation, revenue mobilisation, and audited accounts. This approach promotes accountability, but it also reduces fiscal autonomy. In effect, the architecture of grants shifts from need-based equalisation to compliance-based incentivisation. Fiscal discipline, while necessary, cannot substitute for fiscal justice.</p><h4 class=\"sub_head\">Efficiency versus equity</h4><p>The FC-16’s report is bold in ambition but uneven in balance. The dismantling of the RDGs and the shift toward performance-based transfers reflect a technocratic confidence in market-like incentives, even though fiscal federalism is a political and constitutional arrangement designed to manage diversity. The contrast between the Commission’s strict stance on RDGs and its accommodative approach to cesses and surcharges, along with its hesitation to raise the States’ share in the divisible pool to 50% despite demands from several States, reveals a deeper tension.</p><p>It suggests a framework that, intentionally or otherwise, protects the fiscal space of the Union while placing a greater adjustment burden on the States. In doing so, the Commission may have moved away from its core mandate of acting as an equalising force within the federation. If the Finance Commission is to continue playing its historic role in holding India together, future Commissions must reward high-performing States while supporting those that continue to face structural disadvantages.</p><p>For a country as diverse as India, fiscal federalism cannot be sustained on performance alone; it must be anchored in fairness.</p><p><b><i>K.J. Joseph is Director, Gulati Institute of Finance and Taxation, Thiruvananthapuram, Kerala; Sumalatha B.S. is Assistant Professor, Gulati Institute of Finance and Taxation, Thiruvananthapuram, Kerala. The views expressed are personal</i></b></p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 06, 2026 12:16 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310469\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/lead/fiscal-federalism-efficiency-versus-equity-concerns/article71310469.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_I =\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Opinion\n                    </a><meta content=\"Opinion\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/op-ed/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Comment\n                    </a><meta content=\"Comment\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310713\" data-title=\"NEET and the state’s duty to minimise harm\" data-url=\"https://www.thehindu.com/opinion/op-ed/neet-and-the-states-duty-to-minimise-harm/article71310713.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">If the state’s response is confined to resolving individual controversies without undertaking structural reform, the same crises will continue to recur</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 06, 2026 12:02 am IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/shantanu-pachauri-25427/\">Shantanu  Pachauri</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/xyjxh4/article71310723.ece/alternates/LANDSCAPE_1200/_SKP6671.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/xyjxh4/article71310723.ece/alternates/LANDSCAPE_1200/_SKP6671.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/xyjxh4/article71310723.ece/alternates/LANDSCAPE_660/_SKP6671.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/xyjxh4/article71310723.ece/alternates/LANDSCAPE_320/_SKP6671.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Students stage a protest at Jantar Mantar on July 29, 2026.\n                                          | Photo Credit: SHIV KUMAR PUSHPAKAR\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310713\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>The past year marked an important shift in the constitutional understanding of student well-being. In Sukdeb Saha v. State of Andhra Pradesh (2025), the Supreme Court recognised student mental health as part of the right to life under Article 21 and treated student suicides as failures that can arise from institutional conditions. The court directed educational institutions to adopt mental health policies and create psychologically safe environments for students. More importantly, it shifted the focus to the role of educational institutions in protecting student well-being. That shift was reinforced in Amit Kumar v. Union of India (2026), in which the court warned against the tendency to individualise student suicides while ignoring institutionally normalised stressors.</p><p>The Supreme Court-appointed National Task Force, in its interim report, similarly located student distress in a range of institutional, academic, social, and economic pressures. The NEET paper leak has become one of the earliest tests of the court’s recent recognition of institutional responsibility for student well-being. It raises a question about whether constitutional principles can reshape the exercise of public power.</p><p>The NEET controversy presented precisely the kind of situation that the court’s recent jurisprudence sought to address. Even before the police resorted to disproportionate force and surveillance against protesting students, the paper leak and the events that followed had already exposed over 20 lakh students to exactly the kind of pressures identified in Sukdeb Saha and by the National Task Force.</p><p>The NEET controversy acquired national attention because its consequences were immediate and visible. Yet the constitutional significance of institutional failure cannot depend upon the scale of public outrage it generates. Across the country, repeated failures in examination and recruitment processes routinely subject students and job-seekers to uncertainty with far less public scrutiny. Pratap Bhanu Mehta recently captured this culture through the ironic description of students as “Exam Warriors”. The metaphor is revealing because wars are expected to demand endurance and produce casualties. However, the understanding reflected in Sukdeb Saha rests on a different premise.</p><p>It is important to note that Sukdeb Saha was decided in the context of educational institutions. But the right to mental health cannot exclude aspirants for public employment in their interactions with the state. If educational institutions exercising decisive control over educational opportunities have a duty to minimise foreseeable harms, it is difficult to explain why similar expectations should not inform public institutions that exercise comparable control over access to public employment. Recruitment examinations rarely generate the same public urgency as entrance examinations because their consequences unfold gradually rather than through a single admission cycle. Yet delays, irregular notifications, prolonged vacancies and unpredictable recruitment processes often leave aspirants suspended in years of uncertainty.</p><p>This is significant because access to public employment, especially through reservation policies, often places aspirants in a relationship in which the state is understood as conferring a favour rather than discharging a constitutional obligation. In this unequal relationship, aspirants have very little bargaining power. The recent film Homebound captures this reality. A large section of society remains dependent on opportunities created by the state, but the path to securing them has become so uncertain that only the privileged can often afford to remain in the race.</p><p>The state exercises decisive control over access to higher education and public employment. That control carries not only a negative duty to avoid arbitrary decision-making but also a positive duty to create fair systems that minimise foreseeable institutional harm. The events of 2026 were possible because the lessons of the 2024 NEET controversy were never learnt. If the state’s response is confined to resolving individual controversies without undertaking structural reform, the same crises will continue to recur.</p><p>The understanding reflected in Sukdeb Saha must also inform the manner in which courts approach institutional measures intended to create safer educational environments. The Supreme Court’s interim suspension of the UGC Equity Regulations must also be assessed in light of its implications for the institutional conditions that shape student well-being. Similarly, the initial judicial responses of the Supreme Court and the Delhi High Court to challenges arising from the treatment of protesting students illustrate how easily institutional concerns can be viewed through the narrower lens of public order or administrative convenience.</p><p>If Sukdeb Saha is to represent a genuine constitutional shift, its principle cannot remain confined to educational institutions. It must shape the exercise of public power wherever the state exercises decisive control over educational or professional futures. Otherwise, institutional responsibility will remain a constitutional promise recognised in judgments while avoidable uncertainty continues to shape the lives of millions of students and aspirants.</p><p><i>Shantanu Pachauri is an Assistant Professor and Associate Dean, Student Affairs, School of Law, RV University, Bengaluru</i></p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 06, 2026 12:02 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310713\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/op-ed/neet-and-the-states-duty-to-minimise-harm/article71310713.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" d \" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Opinion\n                    </a><meta content=\"Opinion\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/op-ed/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Comment\n                    </a><meta content=\"Comment\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71310673\" data-title=\"The next growth story could be woven by hand\" data-url=\"https://www.thehindu.com/opinion/op-ed/the-next-growth-story-could-be-woven-by-hand/article71310673.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">As India celebrates National Handloom Day on August 7, the sector stands at a critical juncture and protecting it is not only an economic necessity but also a civilisational duty</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- August 06, 2026 12:01 am IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/priyambada-jayakumar-27921/\"> Priyambada Jayakumar</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/69x5rm/article71310700.ece/alternates/LANDSCAPE_1200/_DSC50981.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/69x5rm/article71310700.ece/alternates/LANDSCAPE_1200/_DSC50981.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/69x5rm/article71310700.ece/alternates/LANDSCAPE_660/_DSC50981.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/69x5rm/article71310700.ece/alternates/LANDSCAPE_320/_DSC50981.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    A silk handloom weaver working for the Padiyur Sarvodaya Sangh near Kangayam in Tiruppur district.\n                                          | Photo Credit: PERIASAMY M.\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71310673\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>Today’s handloom sector is often viewed as a small artisanal activity — important culturally but peripheral economically. Long before the Industrial Revolution transformed manufacturing in Europe, India’s handlooms were among the world’s greatest industrial enterprises. Indian textiles travelled across continents, powered global trade, and established India’s reputation as one of history’s foremost manufacturing economies. Handloom was never a cottage industry on the margins; it was the backbone of India’s manufacturing strength and one of the foundations of its global influence.</p><p>This legacy was once again at the centre of India’s freedom movement. From the Swadeshi movement’s boycott of British textiles to Mahatma Gandhi’s adoption of the spinning wheel as the symbol of self-reliance, weaving became an instrument of both economic resistance and national identity. It is, therefore, fitting that India celebrates National Handloom Day on August 7, commemorating the launch of the Swadeshi Movement in 1905 and honouring generations of Indian weavers.</p><p>Today, the sector remains far more significant than it is generally acknowledged to be. It provides livelihoods to more than 35 lakh weavers and allied workers across over 31 lakh households, with women constituting nearly 70% of the workforce. It remains one of rural India’s largest sources of non-farm employment while producing nearly 15% of the country’s cloth despite relying largely on manual technology. Few manufacturing sectors create as many jobs with such modest capital investment.</p><h4 class=\"sub_head\">Extinction threat</h4><p>Yet this remarkable economic and cultural asset stands at a critical juncture. While celebrated traditions such as Banarasi, Kanchipuram, Patola, and Ikat continue to enjoy strong recognition, hundreds of less-known weaving traditions face gradual extinction. Younger generations are leaving the profession as returns diminish, markets remain fragmented, and traditional skills are no longer transferred within families. Every disappearing weave represents not merely the loss of a product but also the disappearance of centuries of accumulated knowledge, distinctive design vocabulary, and cultural identity. Every loom strengthens rural livelihoods, empowers women, supports local economies, preserves knowledge, and maintains civilisational continuity and cultural diversity. Therefore, protecting India’s handloom heritage is not only an economic necessity but also our civilisational duty.</p><p>The government’s recent efforts with policy and programme support seems to be making a difference. Programmes under the National Handloom Development Programme have focused on skill development, design innovation, technology adoption, branding, and improved market access. Greater integration with e-commerce platforms and expanding export opportunities have enabled many artisan clusters to reach consumers who were previously inaccessible.</p><p>Several success stories illustrate what targeted intervention can achieve. The revival of Tangaliya weaving in Gujarat, the transformation of Badturang village in Odisha’s Sambalpur district, and the growing popularity of Siddipet Gollabhama saris demonstrate that traditional crafts can thrive when design, market access, and institutional support converge. It was more than just a fashion statement when Brad Pitt wore a handcrafted shirt in traditional Tangaliya weave in his movie FI.</p><p>The Office of the Development Commissioner, Handloom, in collaboration with UNESCO, has initiated the identification, documentation, and preparation of a comprehensive inventory of India’s languishing and endangered weaves. This should be extended to every nook and corner of the country. This combines well with Textiles Secretary Neelam Rao’s focus on promoting India’s rich Geographical Indication (GI) handloom and handicraft products and strengthening domestic and international market presence.</p><p>Initiatives such as “Weave the Future” demonstrate how heritage, sustainability, innovation, and contemporary design can together inspire a new generation of consumers while ensuring that India’s handloom traditions remain vibrant, relevant, and future-ready.</p><h4 class=\"sub_head\">Preservation to aspiration</h4><p>The next phase of policy must shift from preservation to aspiration. India has successfully transformed yoga, Ayurveda, and millets into global lifestyle brands. Handloom deserves the same ambition. For younger consumers, especially Gen Z, handloom must become contemporary, fashionable, and aspirational rather than merely traditional. Celebrity ambassadors, collaborations with leading designers, limited-edition collections, digital storytelling, and partnerships with influencers can reposition India’s weaves as premium lifestyle products. The objective should not be to celebrate handloom because it is old, but because it represents craftsmanship, sustainability, and exclusivity. Limited production should become a premium feature rather than being viewed as a commercial limitation. Development Commissioner M. Beena’s assertion that every citizen is a custodian of this heritage and each time someone chooses a handloom product she is contributing to India’s heritage is right on the mark.</p><p>India must also think beyond domestic markets. The world increasingly values authenticity, sustainability, and handcrafted luxury — all areas where Indian handlooms enjoy a natural competitive advantage. Expanding exports, however, will require consistent quality standards, stronger branding, better GI protection, and vigilant action against cultural misappropriation. The recent controversy surrounding Kolhapuri footwear and Prada illustrated why protecting India’s traditional intellectual property is becoming increasingly important. The government’s initiative with www.indiahandloombrand.gov.in is in the right direction.</p><p>India should leverage its traditional weaves, which for some global markets are ancient imports, to build India’s soft power.</p><p>Unlike most manufacturing sectors, India’s handloom economy is inadequately measured. Policymakers need reliable data on its contribution to GDP, exports, tax revenues, employment, and household incomes. Better measurement will enable better policy and allow the sector to be recognised for the economic value it already creates.</p><h4 class=\"sub_head\">National platform</h4><p>Similarly, establishing a national platform through which States, producer organisations, and cooperatives can exchange successful practices would accelerate innovation across the sector.</p><p>Handloom is not a relic of India’s past; it is a strategic asset for its future. Few sectors simultaneously generate rural employment, empower women, preserve cultural heritage, promote sustainability, and strengthen India’s global brand. As the country pursues the vision of Viksit Bharat, handloom deserves to be viewed as a serious economic sector. The measure of success will be how many looms remain active, profitable, and capable of attracting the next generation of weavers.</p><p><i>Priyambada Jayakumar is a historian, public speaker, handloom advocate, and author of  </i>The Man Who Fed India</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 06, 2026 12:01 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71310673\" data-coral-notext=\"tru ata-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">A young Brahmin, a young Dalit and a young OBC voter may occupy very different positions in the social hierarchy, yet they can share common anxieties about jobs, mobility, and examinations</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - August 05, 2026 02:22 pm IST </span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/varghese-k-george-306/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/varghese-k-george-306/\">Varghese K. George </a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/x39fgs/article71306982.ece/alternates/LANDSCAPE_1200/IMG_Bankipur_bypoll__2__1_1_7DGBIFPR.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/x39fgs/article71306982.ece/alternates/LANDSCAPE_1200/IMG_Bankipur_bypoll__2__1_1_7DGBIFPR.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" size asonable to assume, for instance, that Muslims are less likely to vote for the BJP, just as African Americans have historically been less likely to vote Republican than Democratic in the U.S. Gerrymandering works by stacking and cracking electorates according to such group identities and their assumed preferences.</p><p>The BJP has had reason to assume that it built a threshold Hindu voting bloc that could provide it with a permanent majority, albeit with regional variations. The party’s continuing electoral triumphs in Gujarat is an example. One reason for its enthusiasm for an early delimitation exercise, which under the existing constitutional scheme can take place only after the data from the Census is published, has been to explore the possibility of redrawing Lok Sabha and Assembly constituencies to maximise its demographic advantage. This is not merely an assumption or an allegation. Assam Chief Minister Himanta Biswa Sarma has publicly stated that the delimitation of Assembly constituencies in the State was intended to reduce the number of seats in which Muslims could influence the outcome. The subsequent electoral outcome suggests that the exercise worked in the party’s favour.</p><p>Yet politics has a habit of unsettling certainties.</p><h4 class=\"sub_head\">An unforseen twist</h4><p>Bankipur’s demographic composition is almost a dream scenario for the BJP. Out of roughly 3.8 lakh voters, around 1.6 lakh are upper-caste Hindus, the party’s strongest social base. Muslims number about 40,000 and Yadavs roughly the same. In effect, the constituency has just enough communities considered adversarial to the BJP, namely the Muslims and Yadavs, to generate counter-polarisation on religious and caste lines, while still allowing the party to build a larger coalition of upper castes, Other Backward Classes (OBCs) and Dalits.</p><p>For years, Bankipur represented an ideal laboratory for the BJP’s twin strategy of caste and religious consolidation. Yet the <a href=\"https://www.thehindu.com/news/national/bihar/bankipur-bihar-bypoll-result-prashant-kishor-rekha-guptaneeraj-kumar-august-3-2026/article71299772.ece\" target=\"_self\">party’s defeat at the hands of Jan Suraaj founder Prashant Kishor</a> suggests that these assumptions may no longer hold automatically. <a href=\"https://www.thehindu.com/news/national/bihar/across-the-spectrum-bankipurs-voters-say-they-have-chosen-a-better-alternative-in-the-jsp/article71301511.ece\" target=\"_self\">Mr. Kishor’s victory appears</a> to have rested on a social coalition that cut across caste and religious boundaries.</p><p>Something similar happened in Datia, though in a very different setting. Datia’s electorate of about 2.2 lakh is overwhelmingly Hindu. It has around 35,000 Brahmins, more than 30,000 Scheduled Caste voters, over 80,000 OBC voters spread across several communities, and another 25,000 to 30,000 Thakur and Vaishya voters. Muslims account for only a small proportion of the electorate. While the relatively new Jan Suraaj could sweep aside the BJP in Bankipur, <a href=\"https://www.thehindu.com/news/national/madhya-pradesh/datia-assembly-bypoll-in-madhya-pradesh-result-august-3-2026/article71299809.ece\" target=\"_self\">the Congress could only secure a narrow victory</a> in Datia. The dynamism within the Hindu electorate makes any permanent assumptions about its political preferences risky for the BJP.</p><h4 class=\"sub_head\">Emergence of a new category</h4><p>What links Jantar Mantar and Bankipur is the emergence of a political variable that neither the BJP nor its opponents had adequately anticipated: Gen Z as a distinct political community. The protests and mobilisations around issues of recruitment, examinations, unemployment and representation have revealed a generation that does not fit neatly into traditional electoral boxes. It is not that Gen Z voters are caste-agnostic. In fact, they appear to be deeply caste-conscious, expressed in sharply different ways, ranging from anti-reservation arguments to assertive Ambedkarite politics. Yet these divergent strands often converge in their scepticism towards the BJP and, in many cases, towards established political parties in general.</p><p>This horizontal social category complicates the older vertical structures of caste and religious mobilisation. A young Brahmin, a young Dalit and a young OBC voter may occupy very different positions in the social hierarchy, yet they can share common anxieties about jobs, mobility, and examinations. Their political choices are therefore not always determined by inherited community loyalties.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/on-delimitation-and-parliament-seats-explained/article70880712.ece\">\n\t\t\t\t\t\t\t\t\t\tOn delimitation and Parliament seats | Explained</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/cewmpj/article70881971.ece/alternates/SQUARE_80/PTI04_17_2026_000495B.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAvAAADAQEBAAAAAAAAAAAAAAADBAUGAgcBAAMBAQAAAAAAAAAAAAAAAAECAwAE/9oADAMBAAIQAxAAAABinnmdq54jeAD5tidNsGMakzDTEckzMYBeCKfN0j5cnPf0XmS50c7AlWHWMWznI2ZVjdQozoCKPljSeENs69Cs9XlH3KhYPLox1w2Q0tqdoGXC+hzskjaletm3Wbq4WrqmOoeiy8sGRRozpjtVznUb/8QAMhAAAgEDAgQFAwIGAwAAAAAAAQIDAAQREiEFEzFBIjJRYXEUI0KB8AYVUmKRsaHR8f/aAAgBAQABPwEdTqDZrJZWODt6UJfCcFskdqWUBtw+cfsVNcBn0OWCEb471a3Gt1GcnVsT3xRlXfCEhn9e/r8UxznOrrqIB60ZVLNqzlq5gZfXPX2rXgP59hXNOW3fdaEhx33HalYtgePy1xDnQI08OMBcssgyKtBMkvNnOX6bdAKWbY4BbLbYNPcaM7NsaaTSrsAx7U0uoHOQPShywW8T9O3agQcl rint-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 21, "title": "​Top spot: On the new phase of the Khelo India Scheme", "section": "Editorial", "page": "", "teaser": "India needs to upgrade infrastructure, train coaches", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\" itemscope=\"\" itemtype=\"https://schema.org/BreadcrumbList\"><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Home\n                    </a><meta content=\"Home\" itemprop=\"name\"/><meta content=\"1\" itemprop=\"position\"/></li><li class=\"breadcrumb-item\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Opinion\n                    </a><meta content=\"Opinion\" itemprop=\"name\"/><meta content=\"2\" itemprop=\"position\"/></li><li class=\"breadcrumb-item active\" itemprop=\"itemListElement\" itemscope=\"\" itemtype=\"https://schema.org/ListItem\"><a href=\"https://www.thehindu.com/opinion/editorial/\" itemprop=\"item\" itemtype=\"https://schema.org/Thing\">\n                        Editorial\n                    </a><meta content=\"Editorial\" itemprop=\"name\"/><meta content=\"3\" itemprop=\"position\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 editorial\" data-id=\"71305508\" data-title=\"​Top spot: On the new phase of the Khelo India Scheme\" data-url=\"https://www.thehindu.com/opinion/editorial/top-spot-on-the-new-phase-of-the-khelo-india-scheme/article71305508.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">India needs to upgrade infrastructure, train coaches</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - August 05, 2026 12:03 pm IST </span></p></div><div class=\"author\"></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71305508\"><div class=\"schemaDiv\" id=\"schemaDiv\" itemprop=\"articleBody\"><p>One of the biggest impediments to <a href=\"https://www.thehindu.com/sport/india-will-leave-no-stone-unturned-in-hosting-2036-olympics-says-pm-modi/article67421515.ece\" target=\"_self\">India’s aspiration to bid for the 2036 Olympics</a> is the lack of enough world-class performers. For India, a prospective host, targeting a prestigious top-10 finish is a humongous task. In the 21st century, the country achieved its best-ever result of 48th with seven medals at the Tokyo Olympics in 2021 and was 71st with six medals at Paris 2024. India needs to win approximately 30 to 40 medals, including gold in double digits, to be in the elite club. To chase this Olympic dream, the Union Cabinet has approved an allocation of ₹29,054 crore — an eight-fold increase — for the new phase of the Khelo India Scheme. The primary goal of this ambitious grassroots programme is to tap talent early for the 2036 Olympics. It aims to increase Khelo India centres, State and National centres of excellence and accredited academies from roughly one per district — more than 1,000 centres at present — to an average of two or three. Involving schools and clubs, encouraging talented children to compete in club-level events, upgrading facilities, and assimilating grassroot-coaches and technical officials are essential ingredients of the wholesome scheme.</p><p>A novel concept of upgrading the knowledge of local coaches by helping them overcome the language barrier posed by English, the formation of a National Coach Accreditation Board to standardise coaching and better utilisation of physical education teachers are expected to impart correct training at the basic level. In sync with the National Education Policy, the Khelo India Feeder Schools and Khelo India Utkrishta Vidyalaya initiatives are designed to integrate education and sports. The existing Khelo India Athletes programme, with 2,904 athletes, and the new Emerging Khelo India Athletes initiative aim to expand the talent pool to around 28,000. Talent identification, digitisation of the sports ecosystem to maintain data on every athlete, and a bottom-to-top communication channel are its key components. The overall outlay, including assistance to National Sports Federations, stands at a staggering ₹36,441 crore for 2026-31. However, the biggest challenge will be effective and transparent implementation of the scheme. Enabling talent to graduate to the highest level, already backed by the Target Olympic Podium Scheme, with an eye on the 2036 Olympics and beyond will be crucial. The 2030 Commonwealth Games in Ahmedabad will be an immediate test. The other major hurdle for India’s attempt to emerge as a sporting power is its dubious distinction as a doping hub. Strict anti-doping measures, promotion of a sports culture by maximising the scope of the Fit India Movement, and a focus on grassroots development must go hand-in-hand to achieve the desired results.</p><div class=\"fragmentcontent lazy\" data-fragment-url=\"https://www.thehindu.com/fragment/getregionallist/71305508\" id=\"reginallist\"></div></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- August 05, 2026 12:10 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71305508\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/editorial/top-spot-on-the-new-phase-of-the-khelo-india-scheme/article71305508.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-siz
