<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>The Hindu — Delhi — 24 August 2026</title>
<script>
(function(){
  var saved = localStorage.getItem('th-theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #1a1a18;
  --ink-muted:  #4a4a45;
  --ink-faint:  #8a8a82;
  --paper:      #f8f6f0;
  --paper-warm: #f0ede4;
  --rule:       #c8c4b8;
  --red:        #b00020;
  --font-head:  'Georgia', 'Times New Roman', serif;
  --font-body:  'Georgia', 'Times New Roman', serif;
  --font-ui:    system-ui, -apple-system, sans-serif;
}

html.dark {
  --ink:        #e8e4dc;
  --ink-muted:  #a8a49c;
  --ink-faint:  #6a6660;
  --paper:      #181816;
  --paper-warm: #211f1c;
  --rule:       #38352f;
  --red:        #e05070;
}

html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ── Masthead ── */
#masthead {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--ink); color: var(--paper);
  padding: 0 1rem;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
  user-select: none;
}
#masthead .nameplate {
  font-family: var(--font-head);
  font-size: 1.3rem; font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
}
#masthead .edition-date {
  font-family: var(--font-ui);
  font-size: 0.7rem; color: #aaa;
  text-align: right; line-height: 1.35;
}
#masthead .back-btn {
  display: none; align-items: center; gap: 6px;
  background: none; border: none; color: var(--paper);
  font-family: var(--font-ui); font-size: 0.8rem;
  cursor: pointer; padding: 8px 0; min-width: 60px;
}
#masthead .back-btn svg { flex-shrink: 0; }

/* ── Section nav strip ── */
#section-nav {
  position: fixed; top: 52px; left: 0; right: 0; z-index: 99;
  background: var(--paper-warm);
  border-bottom: 2px solid var(--ink);
  overflow-x: auto; overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  transition: opacity 0.2s, transform 0.2s;
}
#section-nav::-webkit-scrollbar { display: none; }
#section-nav .nav-inner {
  display: inline-flex; padding: 0 0.5rem;
}
.sec-tab {
  display: inline-block;
  font-family: var(--font-ui); font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-muted);
  padding: 9px 10px;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.sec-tab.active {
  color: var(--ink);
  border-bottom-color: var(--red);
}

/* ── Pages viewport ── */
#pages-viewport {
  position: fixed;
  top: 93px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
#pages-track {
  display: flex; height: 100%;
  transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ── Individual section page ── */
.section-page {
  flex: 0 0 100vw; width: 100vw; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 1.2rem 0 2rem;
}
.section-page::-webkit-scrollbar { width: 3px; }
.section-page::-webkit-scrollbar-thumb { background: var(--rule); }

.sec-header {
  padding: 0 1rem 0.6rem;
  border-bottom: 3px double var(--ink);
  margin-bottom: 0.1rem;
}
.sec-header h2 {
  font-family: var(--font-head);
  font-size: 1.05rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red);
}
.sec-header .art-count {
  font-family: var(--font-ui); font-size: 0.7rem;
  color: var(--ink-faint); margin-top: 1px;
}

.article-row {
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 0.5px solid var(--rule);
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: background 0.12s;
  gap: 0.25rem;
}
.article-row:active { background: var(--paper-warm); }
@media (hover: hover) {
  .article-row:hover { background: var(--paper-warm); }
}

.art-meta {
  font-family: var(--font-ui); font-size: 0.65rem;
  color: var(--ink-faint); letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex; gap: 0.5rem; align-items: center;
}
.art-meta .page-tag {
  background: var(--ink); color: var(--paper);
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.6rem;
}
.art-headline {
  font-family: var(--font-head);
  font-size: 1.02rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
}
.art-teaser {
  font-family: var(--font-body); font-size: 0.8rem;
  color: var(--ink-muted); line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.art-read-cue {
  font-family: var(--font-ui); font-size: 0.68rem;
  color: var(--red); font-weight: 600;
  letter-spacing: 0.03em;
  align-self: end;
  text-align: right;
}

/* ── Article pane fly animations ── */
@keyframes fly-to-pip {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
}
@keyframes fly-from-pip {
  0%   { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
  100% { opacity: 1; transform: scale(1); }
}

/* ── Article pane — floating card ── */
#article-pane {
  position: fixed;
  top: 58px; left: 50%; bottom: 12px;
  transform: translateX(-50%) scale(0.96);
  width: min(900px, calc(100vw - 1rem));
  background: var(--paper);
  border-radius: 12px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity: 0;
  pointer-events: none;
  transform-origin: center bottom;
  z-index: 101;
  padding: 1.5rem 1.5rem 3rem;
  transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
}
#article-pane.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) scale(1);
  animation: none;
}
#article-pane.flying-out { pointer-events: none; animation: fly-to-pip 0.75s cubic-bezier(0.4,0,0.2,1) forwards; }
#article-pane.flying-in  { pointer-events: none; animation: fly-from-pip 0.4s cubic-bezier(0.2,0,0,1) forwards; }
#article-pane::-webkit-scrollbar { width: 3px; }
#article-pane::-webkit-scrollbar-thumb { background: var(--rule); }

#article-pane .art-pane-section {
  font-family: var(--font-ui); font-size: 0.68rem;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--red);
  margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 0.5rem;
}
#article-pane .art-pane-section::after {
  content: ''; flex: 1; height: 1px; background: var(--rule);
}
#article-pane h1 {
  font-family: var(--font-head);
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  font-weight: 700; line-height: 1.25;
  color: var(--ink); margin-bottom: 0.75rem;
}
#article-pane .art-pane-meta {
  font-family: var(--font-ui); font-size: 0.72rem;
  color: var(--ink-faint); margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--rule);
  display: flex; gap: 1rem; flex-wrap: wrap;
}
#article-pane .art-pane-body {
  font-size: 1rem; line-height: 1.75; color: var(--ink);
}
#article-pane .art-pane-body p { margin-bottom: 0.9rem; }
#article-pane .art-pane-body h2,
#article-pane .art-pane-body h3 {
  font-family: var(--font-head);
  font-weight: 700; margin: 1.25rem 0 0.4rem;
  color: var(--ink);
}
#article-pane .art-pane-body img {
  max-width: 100%; height: auto;
  display: block; margin: 1rem 0;
}
#article-pane .art-pane-body figcaption {
  font-size: 0.75rem; color: var(--ink-faint);
  margin-top: -0.5rem; margin-bottom: 1rem;
  font-style: italic;
}
#article-pane .art-source-link {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-faint);
}
#article-pane .art-source-link a { color: var(--red); }

.art-print-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 1rem;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 14px;
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-muted); cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.art-print-btn:hover { border-color: var(--ink-muted); color: var(--ink); }
.art-print-btn svg { flex-shrink: 0; }

/* ── Background blur overlay ── */
#blur-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 98;
  backdrop-filter: blur(6px) brightness(0.85);
  -webkit-backdrop-filter: blur(6px) brightness(0.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}


/* ── PiP card ── */
#pip-card {
  position: fixed;
  bottom: 14px; right: 14px;
  width: 200px;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--rule);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.88) translateY(8px);
  transform-origin: bottom right;
  transition: opacity 0.3s ease 0.52s, transform 0.35s cubic-bezier(0.34,1.4,0.64,1) 0.52s;
  z-index: 103;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
#pip-card.open { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
#pip-card:hover { border-color: var(--ink-muted); }
.pip-head {
  background: var(--ink); padding: 7px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.pip-logo { font-family: var(--font-head); font-size: 0.68rem; font-weight: 700; color: var(--paper); }
.pip-close {
  background: none; border: none; color: #aaa; cursor: pointer;
  padding: 2px; display: flex; align-items: center; border-radius: 3px;
  transition: color 0.15s;
}
.pip-close:hover { color: var(--paper); }
.pip-body { padding: 8px 10px 10px; }
.pip-sec {
  font-family: var(--font-ui); font-size: 0.58rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red); margin-bottom: 4px;
}
.pip-title {
  font-family: var(--font-head); font-size: 0.72rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.pip-hint { font-family: var(--font-ui); font-size: 0.58rem; color: var(--ink-faint); }

/* ── Fallback notice ── */
.fallback-notice {
  font-family: var(--font-ui); font-size: 0.75rem;
  background: #fff8dc; border: 1px solid #e0c000;
  color: #555; padding: 0.5rem 1rem;
  margin: 0.5rem 1rem 0;
  border-radius: 4px;
}

/* ── Print styles ── */
@media print {
  body, html { overflow: visible !important; background: #fff !important; }
  #masthead, #section-nav, #pages-viewport, #blur-overlay,
  #pip-card, #swipe-hint, .art-print-btn { display: none !important; }
  #article-pane {
    position: static !important;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    border-radius: 0 !important;
    padding: 2rem !important;
    background: #fff !important;
    color: #000 !important;
    box-shadow: none !important;
  }
  #article-pane .art-pane-section,
  #article-pane h1,
  #article-pane .art-pane-meta,
  #article-pane .art-pane-body,
  #article-pane .art-source-link { display: block !important; color: #000 !important; }
  #article-pane .art-pane-body img { max-width: 100% !important; }
  a { color: #000 !important; text-decoration: none !important; }
}

/* ── Swipe hint (first load) ── */
#swipe-hint {
  position: fixed; bottom: 1.2rem; left: 50%;
  transform: translateX(-50%);
  background: rgba(26,26,24,0.75); color: #f8f6f0;
  font-family: var(--font-ui); font-size: 0.72rem;
  padding: 6px 14px; border-radius: 20px;
  pointer-events: none;
  animation: fadeout 3s ease 1.5s forwards;
  white-space: nowrap; z-index: 200;
}
@keyframes fadeout { to { opacity: 0; } }

/* ── Desktop: wider article reading column ── */
/* ── Theme toggle ── */
#theme-toggle {
  background: none; border: none;
  color: var(--paper); cursor: pointer;
  padding: 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.75; transition: opacity 0.15s;
  flex-shrink: 0;
}
#theme-toggle:hover { opacity: 1; }
#theme-toggle svg { display: block; }

@media (min-width: 700px) {
  #article-pane {
    padding: 2rem 2.5rem 4rem;
  }
  .article-row {
    grid-template-columns: 1fr;
    padding: 0.9rem 1.5rem;
  }
  .sec-header { padding: 0 1.5rem 0.7rem; }
  .section-page { padding: 1.4rem 0 2rem; }
  .art-headline { font-size: 1.1rem; }
  #masthead .nameplate { font-size: 1.5rem; }
  .fallback-notice { margin: 0.5rem 1.5rem 0; }
}
</style>
</head>

  <button class="back-btn" id="back-btn" onclick="closeArticle(event)" aria-label="Back to section">

         stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    </button>

<nav id="section-nav"><div class="nav-inner" id="nav-inner"></div></nav>



<div id="pages-viewport">

AMmmNIiglmUYGTk1FezNBaSSKPmUcVzYkZ3beSxbqTSGaV7qxbMdtwOhfufpWWWyc5Jz60wHnFBNMQ6kzUZc0oYmgQ41Gwp9NagBhoBxSkU2gYrDcMd6iKkGpaDyKAIab0NSkUxl70gG0lLRQAA1IkjIcg1HRQBdjvyBiRAw9qlN6qj92ufrWbUqt8tJopNk8l1NMdpYgHsKR33HrwOKjTufSlJpolsUGng4qPNGaYidHxTZG38DpUaZdsZxUhGOlMBMBRSFqYWJNKOlIB1Lk02loAM09CM1HTlNAFgNT1Oar5xT1JZsZxQBaFSxSlGBBII6EVX2BPU/jSIxxzTA6nTdVE2IpyA/ZvWtSuJjciuj0e7knRopOdg4bvSGadFFFAH//Z\" title=\"Not ‘delulu’ — an AI tutor for every child in India\"/></div><figcaption class=\"caption\">\n                                \n  \n   \n    Srivatsa Krishna\n    \n     IAS officer\n    \n   \n  \n \n                            </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-\"><p><span class=\"drop_initial\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\"></span>Indian students rank among the top students almost anywhere in the world. The joke is that, from the womb to the afterlife, they are taught to study maths and science which serves them well throughout life. A report by Redseer says that India’s test-preparation market has been estimated at $14.8 billion in FY26, projected to reach $23-$26 billion by FY30 (12%-15% CAGR), with around 2,00,000 coaching centres nationwide. There are 65 million students in classes 9-12, of whom around 27 million attend government schools. A 2025 National Statistical Office survey found that 27% of students were taking or had taken private coaching in the academic year (30.7% urban, 25.5% rural). Across datasets, coaching incidence is around 27%-30%, implying that 17 million to 20 million students in classes 9-12 participate in some form of test-prep coaching.</p><p>No single private platform has the capacity or curriculum breadth to serve as the sole national provider. PhysicsWallah, for example, has around 4.9 million paid online users — while the target population is 10 to 100 times larger. This needs to be built as a platform and network play, not a vendor contract.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Better learning, better outcomes</p></div><p>How can the government take the help of Artificial Intelligence (AI) to deliver a free coach and tutor to every Indian child? The objective should not be to bring down the private coaching industry but to improve the learning standards and examination outcomes of the last child in the line who today spends thousands of rupees on dubious coaching centres without achieving the necessary results. Bring the industry in as suppliers, or they will lobby against it and the reputational risk of failing completely, is high for the government to sustain.</p><p>We should not nationalise coaching. Build a public rail, private engines model: the state supplies the digital public infrastructure (identity, payments, discovery, data, credentialing) and aggregates demand; the private sector — star teachers, ed-tech firms, local tutors — supplies content and last-mile delivery shared by both. Government becomes the platform and market-maker, not the content producer. This is exactly how UPI beat closed payment apps and how the pen Network for Digital Commerce is attempting to beat closed commerce: unbundle the monopoly, open the protocol, let a thousand providers compete on an open network.</p><p>The Indian coaching industry charges high fees because it bundles four things that do not have to be bundled: content; doubt-solving/mentoring; peer group and discipline, a credible signal of quality. DPI lets us unbundle these and drive the marginal cost of the first two toward zero. This can be anchored in an existing centre of excellence such as Bodhan.ai at IIT Madras (which has a ₹500 crore, five year government grant) or a similar National Payments Corporation of India (NPCI)-like body that needs to be created for education (a Section 8 not-for-profit steward).</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Where it should begin</p></div><p>It should start with the National Eligibility cum Entrance Test (Undergraduate), or NEET, and the Joint Entrance Examination, the two most widely taken examinations in India. JEE/NEET are objective, machine-gradable, and high-volume. The content is already freely available on YouTube; what is scarce is a trusted, standardised rank signal and personalised doubt-solving.</p><p>An IIT professor who teaches students who have cleared JEE 30 years ago may not be the best option for teaching test prep. Today’s test prep skill and requirement is in a very different age, time, and pedagogy.</p><p>Government aggregates demand thereby drives down the customer acquisition cost for the private sector and owns the rails and the trust layer; the private sector and star teachers compete to deliver content and mentoring on an open network; the student owns the data and carries a voucher (optional). That is how you turn a $15b paywall industry into free, plural, high-quality prep — without the state trying to become the teacher.</p><p>As with any private good using public rails, it will use Aadhaar/DigiLocker for student sign-up and to de-duplicate; APAAR ID to tie learning to the academic record. Along with this will be a curated content registry, an open catalogue where any accredited provider publishes lessons, problem sets, and mock tests against a standard syllabus taxonomy (NEET/JEE topic tree) and open metadata (language, difficulty, medium, accessibility tags). The government will set the taxonomy and standards for the content and ensure interoperability.</p><p>Content interoperability is the whole game — a student’s progress in one provider’s module must be portable to another’s. There shall be a discovery layer, a government-run reference app plus open APIs so third parties (including the DIKSHA app, state apps, even Google/YouTube) can surface the same content — multiple front ends, one network. For example, PhysicsWallah, Vedantu, Allen or Narayana could offer their material for free and charge for doubt-solving or premium sessions with ranked professors. IIT professors could also upload their lectures and be rated and ranked on the platform. Adaptive personalisation should be a core feature and as a network service, an open recommendation/diagnostic engine that routes say a weak-in-organic-chemistry student to the best-rated module on that topic, regardless of provider. These will be accompanied by a learning wallet and a progress ledger, a student-owned record of what they have studied, mock scores, and mastery per topic, consent-gated through the DEPA/Account Aggregator pattern. The student — not the ed-tech firm — owns the data, which is the single biggest structural break from today’s walled-garden apps. Lastly, while the platform will be mostly free at the point of use, UPI-plumbed premium add-ons (live mentoring, graded assignments) can be micro-charged or voucher-funded, should the government wish to create a DBT-like e-Shiksha wallet. Deliberately thin the government software: The state builds protocols and a reference app; it does not try to build the best learning app. It will not win that race and should not try this. Government alone can aggregate the demand and credential the supply and outcomes — that is all it should do. It should auto-invite every registered Class 11-12 student through schools, CBSE/State boards, and the DIKSHA install base. The system should guarantee reach through free data-light streaming, downloadable content for low-bandwidth areas, and distribution through the five lakh-plus Common Service Centres and school computer labs for students without personal devices. Equity is the mandate — the ₹60,000 crore industry already serves the affluent; the gap is everyone else.</p><p>Government should publish open ratings and outcome data: publish, per provider and per module, how students who used it scored on official mocks and the real exam. Quality signal becomes objective, not marketing. This is the credential the coaching industry currently monopolises. Government alone can ensure independent accreditation of providers (content accuracy, no misleading claims), with delisting teeth. Further there should be a no-lock-in rule to ensure that providers cannot hold a student’s progress data hostage; portability is enforced at the protocol level.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Models on offer</p></div><p>There is no dearth of content, good and bad, on YouTube but where an AI tutor helps is in practice, doubt solving and adaptive personalisation, which only AI can do. There are good open-source models such as Gemma, which give a million tokens for about 20 to 30 cents or 10,000 tokens per day or 3.6 million tokens per year for just ₹100. Further, every AI minute is equivalent to 1,000 voice minutes of a human; frontier tech companies such as Meta and Google are paying star Kota teachers $25 to $30 per hour for commoditising their content. Further, their models will get trained on it and Generative Inference will do the rest on top of it.</p><p>We should not be delulu — as Gen Z would put it — government should not become the AI tutor itself. It should only enable the AI tutor through the blueprint given.</p><p></p><p><span class=\"tagline_credit\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">The views expressed are personal</span></p><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/Hin e4qN4HCfL81MgcuAehJx7VOJCW21am0KxAf9YB7U0dGq4QG+8AagmgEaEqTz2NbRqJiIj/BS/wATU09Upe7VoAf8sx9aX+M/Sm/wL9ad/G30oAb/AMsx9ad/GfpTf+WY+tL/ABn6UAIvSilX7oopgf/Z\" title=\"The return of profanation as a new political language\"/></div><figcaption class=\"caption\">\n                                \n  \n   \n    M.H. Ilias\n    \n     Professor at the School of Gandhian Thought and Development Studies, Mahatma Gandhi University, Keralam\n    \n   \n  \n \n                            </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-\"><p><span class=\"drop_initial\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\"></span>In his work <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Profanations</span>, Italian philosopher Giorgio Agamben observes how the act of profanation applies to the game of chess and children playing with household items as toys. For Agamben, profanation refers to removal or transfer of objects, places, animals, personalities or languages from the realm of sacred or restricted use to the common or ordinary use of people. Religion, state, political ideology, and marketplace are identified by him as the agents that make things sacred, removing them from common use and transferring them to a separate sphere. What chess does is profanation, converting wars or ancient divinatory rituals into a game, a playful activity.</p><p>The same thing happens when a child plays with a household object; they free or liberate it from its restricted use and open it up for a new purpose. These two textbook examples of desecration are best understood within the context of the recent student protest at Jantar Mantar.</p><p>The protest led by the Cockroach Janta Party (CJP) has sparked a national debate over what is “sacred” and “profane”, and what is “formal” and “informal” in Indian politics. It shows how students can desecrate a “sacred” and “invincible” political force through a measured act of profanation. Interestingly, labelling the movement “profane”, “informal”, or “violent” also serves as the ruling party’s best defence.</p><p>Admittedly, a fraction of the students used profanity, slurs and abusive slogans which were directed at the administration out of anger. No one can justify this. However, one must not ignore the instances of profanation in the protest expressed through informality, casualness, and fearlessness, which mainstream media labelled as “anarchism” and the “collapse of political civility”.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>As anti-colonial strategy</p></div><p>Profanation as a mode of serious political intervention is not something new to Indian politics. The Indian national movement has, at various times, resorted to such acts as a part of its core political strategy. Instead of violent means, the movement strategically employed non-cooperation, economic boycotts, and public burning of clothes made in England to strip away the authority, prestige and institutional power of the British Raj. In an act tantamount to profanation, some of its leaders publicly renounced awards and honorific titles conferred on them to show that no honours superseded their national sentiments.</p><p>Mahatma Gandhi sometimes used satiric language to ridicule the authority. To the question by a reporter about his unimpressive dressing while meeting King George V at Buckingham Palace in 1931, Gandhiji is reported to have remarked, “The king had enough on for both of us.” This was not at all a personal insult or an act of belittlement, but a powerful political statement highlighting the vast disparity in power and wealth between the British colonisers and the Indians, the colonised.</p><p>Universally, when conventional means of expression are restricted or suppressed by force, humour, satire, comedy, and trolling fill the vacuum, challenging hegemonic structures in a subtle but more powerful manner. Charlie Chaplin explored this possibility in his 1940 satirical masterpiece, <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">The Great Dictator</span>, satirising Hitler’s mannerisms through a character who closely resembled him. More recent examples come from Palestine, where humour serves as a political tool, transforming the daily suffering of Palestinians into a collective form of resistance.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>India’s new politics</p></div><p>In a novel shift, the students function as the agents of profanation in India; they deal with the excessive power of the state by weaponising humour, satire, memes and trolls in ways unheard of. India’s political orthodoxy may refuse to acknowledge that Indian democracy is equally built through such acts of profanation, not solely through the interventions of formal political institutions. This orthodoxy clearly resonates in media debates, which often write off any form of unconventional politics as either liberal denunciation or left adventurism, completely missing the hopeful cues of a new mode of politics to emerge.</p><p>Further, the demand for greater accountability and transparency in governance from the students, a “non-party” political entity, has elicited sceptical responses from across the political spectrum. Much of the concern stems from the movement’s “informal” and “non-institutional” character and its “single-issue” oriented politics. Critics argue that such “street politics” alone does not have the power to bring about radical political transformation.</p><p>More optimistically, those on the other side argue that it should remain one of the tactics at our disposal when formal opposition struggles to deliver the desired results. The Congress Party, for instance, does not dismiss the potential of the CJP’s mode of politics, even as it detects and warns of an Aam Aadmi element within it. Congress leader Rahul Gandhi himself occasionally adopts an informal style, engaging directly with people through street-level interventions.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Rethinking informal politics</p></div><p>The Jantar Mantar protest has definitely offered a radical component for a rethinking of the ways in which informal politics works in India’s democracy. Expressions of dissent in informal forms are often downplayed as subordinate to “popular consensus”, which is measured chiefly through electoral victory. The question of where to place this protest or what basket suits it — whether as an impromptu student mobilisation driven by anger, a street protest with intensive political content, or a sign of an unconventional style of politics — is therefore a significant one.</p><p></p><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The HinduBusinessLine --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The HinduBusinessLine --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The HinduBusinessLine --></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div></div></div></div>"}, {"id": 63, "title": "Triple test, adrift", "section": "Edit", "page": "8", "teaser": "The Supreme Court should not have discarded a workable test on ‘industry’", "body": "<p><em>Content not available.</em></p>"}, {"id": 64, "title": "Core concerns", "section": "Edit", "page": "8", "teaser": "The Indian economy looks set for tough times ahead", "body": "<div class=\"row justify-content-end\"><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12\"><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">\n  The Indian economy looks set for tough times ahead\n</h2><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-\"><p></p><p><span class=\"drop_initial\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\"></span>The slowdown in the growth of India’s core industrial sectors in July was not surprising, with other indicators predicting easing demand conditions as well. Growth in the index of core industries (ICI) slowed to 5.4% in July from 6% in the previous month. This was in keeping with the Manufacturing Purchasing Managers’ Index, which in July eased to its lowest level since August 2021 due to weak domestic demand conditions. While July’s growth in the ICI was the second-highest growth rate in the last seven months, the data nevertheless highlight some concerning aspects of the Indian economy. The first has to do with the fact that a large part of even this slower growth seems to be based on a statistical low base effect. The coal sector, for example, grew at an 11-month high of 7.6% in July, but this was based on a contraction of 12.3% in July of last year. Similarly, the refinery products sector snapped a three-month streak of contraction to grow at 2.7%, but this too was based on a contraction in July 2025. The iron ore sector, however, grew at a very robust 29.5%, albeit slower than a blistering 44.5% in June. This seems heartening regardless of the contractions of 16.4% and 7.1% in June and July of last year, respectively. But the steel sector slowed drastically in July to 2.9% from 5.6% in June and 15.7% in July of last year.</p><p>The domestic crude oil and natural gas sectors have been lasting drags on the economy. Both have contracted continuously for at least the last 14 months for which the new series of the ICI has data. India’s crude oil imports rose 13.3% in volume terms in July, while Liquefied Natural Gas (LNG) imports grew a more marginal 1.5%, showing that the economy’s appetite is being whetted from abroad. This external dependence is proving very expensive. High oil prices have meant that the crude oil import bill jumped 41% in July. The 100% tariffs that the United States is preparing to levy on countries such as India that import Russian oil will once again burden Indian exporters. Moving to 20% ethanol-blending has not yet impacted oil imports materially. Within the ICI, the only two bright spots of the economy were the cement and electricity sectors. The electricity sector grew at a robust 9% in July, although this was slower than the two consecutive months of double-digit growth in May and June thanks to the prevalent heatwave conditions in many parts of the country. The cement sector sped up to 13.1%, a welcome acceleration. Such positive trends were few and far between. Overall, the Indian economy looks to be in for a period of slack demand, higher costs, and moderating growth.</p><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The HinduBusinessLine --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The HinduBusinessLine --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu eing of children.</p><p>The concerns are not imaginary; social media can expose young people to manipulation, addiction, bullying, and harmful content. While these dangers deserve serious attention, it does not automatically follow that bans are the answer. Regulation is important but the more important question is whether regulation alone can prepare the next generation for a world increasingly shaped by AI and digital technologies.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Fear is not the answer</p></div><p>History suggests that every major communications revolution has generated anxiety. The printing press triggered fears about the uncontrolled spread of information; radio, television, and the Internet provoked similar concerns. The enduring challenge has never been about whether information should flow but how societies can encourage its responsible use.</p><p>Today’s challenge is magnified by scale and speed. The smartphone has become the printing press, library, marketplace, classroom, and public square of the modern age combined. Social media, AI, and emerging digital technologies are together driving perhaps the greatest transformation in society since the Industrial Revolution.</p><p>Many young people understandably find this transition unsettling. They are growing up amid rapid technological disruption, geopolitical uncertainty, widening inequality, and a pervasive sense of instability. In such an environment, fear can become a powerful political force. However, societies should be careful not to allow fear to become the principal driver of policy. Policymakers should ensure that legitimate concerns about children’s well-being do not evolve into a broader resistance to innovation itself. The challenge is not to stop technological change, but to ensure that society develops the institutions to manage it.</p><p>Governments are now attempting to erect barriers against technologies that are becoming more sophisticated, personalised, and difficult to control. The contest between regulation and innovation is increasingly unequal. Sophisticated technology will easily enable people to circumvent the barriers the government creates. Virtual private networks, encrypted applications, alternative platforms, and future AI-driven tools will make circumvention increasingly easy. The real question is therefore not how to keep young people away from technology, but how to prepare them to live with it.</p><p></p><p>Indeed, the debate may already be overtaken by events. The next generation will interact not merely with social media platforms but with intelligent AI systems that can educate, entertain, mentor, and potentially manipulate. The challenge before us is therefore much larger than social media.</p><p>Governments unquestionably have a role. They should demand greater transparency from platforms, establish clear standards for child protection, combat criminal activity, and encourage responsible innovation. However, regulation alone cannot solve what is fundamentally a social, cultural, and civilisational challenge. India should explore a broader response rooted in its own civilisational experience.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Drawing from one’s roots</p></div><p>For centuries, Indian society developed mechanisms to transmit values, wisdom, and social responsibility across generations. Family structures, religious traditions, and educational institutions helped young people navigate periods of change and uncertainty. Among the most enduring of these was the <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">guru-shishya</span> tradition, a relationship that extended far beyond the transmission of knowledge. It sought to cultivate character, self-discipline, and a sense of responsibility.</p><p>The challenge today is not to recreate the past but to adapt its strengths to the realities of the 21st century. Parents must become more digitally literate and engaged in the online lives of their children. Schools should teach not only technological skills but also digital citizenship, critical thinking, ethical reasoning, and resilience. Religious and cultural organisations should engage with technology rather than retreat from it. Technology companies, educators and civil society should work together to encourage responsible behaviour online.</p><p>Just as previous generations learned how to navigate the physical world responsibly, future generations must learn how to navigate the digital world responsibly. This is not simply a technological challenge. It is an educational and cultural one.</p><p>India’s civilisational strength has always been its ability to absorb powerful external influences without losing its cultural core. As one of the world’s oldest civilisations with a growing digital society, India is positioned to demonstrate that tech progress and cultural continuity can coexist. The challenges posed by social media will not be resolved by building a bigger firewall. They will be addressed by combining safeguards with the human institutions that shape judgment, resilience, and responsibility.</p><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End \"/></div><figcaption class=\"caption\">\n                                \n  \n   \n    The law penalises disrespect and disruption of a performance; it does not, on its text, mandate participation in one, nor does it fix which version of the song is entitled to protection. ANI\n    ANI\n   \n  \n \n                            </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-\"><p><span class=\"drop_initial\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\"></span>Parliament has given <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram</span> the same criminal-law protection long enjoyed by the national anthem. But a closer look at the Constituent Assembly’s own reasoning, the actual text of the new law, and the Supreme Court’s judgment in <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Bi</span><span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">joe Emmanuel v. State of Kerala (</span>1986) suggests that the position is far less settled and far more protective of individual conscience than the political rhetoric around the amendment implies.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Why it was not the anthem</p></div><p>The question of India’s national anthem was left open for nearly the entire life of the Constituent Assembly. It was finally settled not by a vote, but by a presidential statement on January 24, 1950, at the Assembly’s last sitting, when Dr. Rajendra Prasad declared that <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Jana Gana Mana</span> would be the National Anthem of India, and that <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram</span>, “which has played a historic part in the struggle for Indian freedom, shall be honoured equally with <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Jana Gana Mana </span>and shall have equal status with it.”</p><p>That formula is worth reading carefully, because what it conspicuously does not do is make <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram</span> the anthem or even a co-anthem. The Constitution, when it came into force two days later, contains no reference whatsoever to a “national song”. The status of <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram</span> rests entirely on Dr. Prasad’s 1950 statement and on subsequent convention, and nothing more.</p><p>The reason for this restraint lies earlier, in the Indian National Congress’s own reckoning with the song in the 1930s. <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram</span>’s later stanzas, rarely sung today, invoke the motherland in explicitly devotional, goddess-centred terms. In the context of the 1882 novel <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Anandamath, </span>from which the song is drawn, some of its verses were also read as casting Muslims as adversaries. Objections from the Muslim League and others led the Congress Working Committee, in October 1937, to resolve that only the first two stanzas — pastoral, secular in imagery and free of any reference to a deity — would be sung at official gatherings.</p><p>That 1937 compromise is what Dr. Prasad’s Constituent Assembly statement inherited and preserved in 1950: full-throated reverence for the song’s role in the freedom struggle, but a deliberate decision to keep its more contentious, devotional verses out of India’s civic and constitutional life. It was not an oversight.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>What the amendment says</p></div><p>The Prevention of Insults to National Honour (Amendment) Bill, 2026, was introduced in the Rajya Sabha on July 24, 2026, and cleared both Houses within a week. The Rajya Sabha cleared it on July 29 and the Lok Sabha on July 30, each after only a brief discussion, with the Opposition, including the DMK and Congress, raising strong objections about the Bill being used to advance a particular cultural agenda and about the timing amid unrelated protests in the House. It received Presidential assent shortly after.</p><p>Given the speed and thinness of the debate, the Amendment — one of 12 Bills passed in a Monsoon Session in which, by Parliament’s own record, most legislation went through with barely any discussion — has had remarkably little parliamentary scrutiny for a law that touches on religious sentiment, free expression and criminal liability all at once.</p><p>What the Amendment actually does is narrower than the headlines suggest. It substitutes Section 3 of the 1971 Act with a provision that punishes two things, and only two things, in relation to both the national anthem and the national song: intentionally preventing their singing and causing disturbance to an assembly engaged in singing them. The punishment — up to three years’ imprisonment, a fine, or both, with a mandatory minimum of one year for repeat offenders — is now common to both compositions.</p><p>Here is the question mark worth putting squarely to the government: nowhere does the amended Act say which stanzas of <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram </span>must be sung, or that all six stanzas must be sung, for the law’s protection to apply. The statute does not prescribe a mandatory version of the song at all. It does not compel singing in the first place by anyone, of any stanza.</p><p>All the amended Section 3 requires is that if the national song is being sung, at whatever length and in whatever form, that rendition must not be intentionally prevented or disturbed. That is a materially narrower obligation than the political framing around the Bill — including the government’s own push, since late 2025, to popularise and even mandate all six stanzas at official functions — might lead the public to believe. The law penalises disrespect and disruption of a performance; it does not, on its text, mandate participation in one, nor does it fix which version of the song is entitled to protection.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>The later stanzas</p></div><p></p><p>The commonly sung opening stanzas of <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram </span>describe the motherland in pastoral terms, her waters, her fruit, her cooling breezes, her fields. It is the later stanzas, historically dropped from public renditions by the Congress in 1937 but increasingly promoted for full recitation since the government’s commemoration of the song’s 150th anniversary in late 2025, that shift register entirely.</p><p>In substance, and in every available English rendering, they describe the motherland as embodied in the Hindu goddesses Durga, Lakshmi and Saraswati, respectively, goddesses of power, wealth and learning, and speak of her as an object of worship enshrined in temples, with “crores” of arms raised in her defence. This is not patriotic verse loosely coloured with cultural reference; on a plain reading, it is a devotional address to a deity, structured in the grammar of prayer.</p><p></p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Freedom of conscience</p></div><p>India is constitutionally committed to a plurality of faiths: Hindu, Muslim, Christian, Sikh, Buddhist, Jain, Parsi and others, each entitled under Article 25 to freedom of conscience and the free profession, practice and propagation of religion, and under Article 26 to manage its own religious affairs without State interference.</p><p>For adherents of monotheistic faiths in particular, being required, whether by direct compulsion or by the coercive pressure of a criminal statute looming over any public assembly, to stand through or refrain from disrupting an extended recitation addressed to Hindu goddesses raises a genuine and serious constitutional difficulty. A citizen’s discomfort with participating in what is, on the text, an act of worship of deities outside their own faith is not eccentric; it is exactly the kind of conscientious objection that Articles 25 and 26 exist to protect.</p><p>Articles 25 and 26 are fundamental rights. It is a basic proposition of Indian constitutional law that no ordinary legislation, however patriotically framed or however overwhelming its parliamentary majority, can override a fundamental right. A law that has the effect of pressuring citizens, on pain of criminal liability for anyone thought to be “disturbing” its recitation, to acquiesce in a devotional performance contrary to their faith would not survive that Part III scrutiny. The 2026 Amendment does not, fortunately, go that far on its text, but the danger, as the next section shows, lies in how it may be applied.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>The Bijoe Emmanuel ruling</p></div><p>This is not an abstract or first-time question for Indian courts. It was addressed directly and decisively in <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">B</span><span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">ijoe Emmanuel &amp; Ors. v. State of Kerala </span>(1986), a case that remains the single most important precedent on the collision between compelled patriotic ritual and freedom of conscience.</p><p>Three siblings, Bijoe, Binu Mol and Bindu Emmanuel, practising Jehovah’s Witnesses, stood respectfully and silently while their schoolmates sang <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Jana Gana Mana</span> during morning assembly. They did not sing themselves because their faith forbade what they understood as an act of worship of anyone or anything other than god. For this, they were expelled.</p><p>The Kerala High Court upheld the expulsion, holding that Article 51A’s fundamental duty to respect the national anthem overrode any claim under Articles 25 and 26, and that Jehovah’s Witnesses could not even invoke those protections.</p><p>The Supreme Court, in a judgment authored by Justice O. Chinnappa Reddy, reversed the High Court in emphatic terms. The Bench held that compelling a person to join in singing despite a genuine, conscientiously held religious objection contravenes both Article 19(1)(a) — freedom of expression, which the court held extends to the freedom to remain silent — and Article 25(1), the guarantee of freedom of conscience.</p><p>Crucially, the court held that the fundamental duties enumerated under Article 51A cannot be used to cut down or override the fundamental rights guaranteed under Part III of the Constitution; a duty to respect national symbols cannot, in law, be turned into a licence to punish sincere religious dissent. The court also read the 1971 Act itself as requiring nothing more than respectful conduct, not active participation from anyone present. It closed with the observation that the country’s tradition, philosophy and Constitution alike “practise tolerance,” urging that this not be diluted.</p><p>That ruling has never been overturned, and its logic transfers with full force to <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram</span>, arguably with greater force, given that the song’s later verses are, unlike the anthem, addressed to specific deities. If the Supreme Court held that a Jehovah’s Witness could not be compelled to sing a secular anthem against conscience, the same protection must extend, a fortiori, to a citizen who objects to reciting verses that are, on their face, prayers to Hindu goddesses.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Legal position</p></div><p>Put together, the three strands here point to a single, clear conclusion.</p><p>First, the Constituent Assembly and the country’s founding leadership deliberately confined official recognition to the first two, secular stanzas of <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Vande Mataram</span>. That is precisely why the fuller, devotional version was never made compulsory, then or since.</p><p>Second, the 2026 Amendment, whatever its political framing, imposes no textual obligation on any citizen to sing any particular version of the song, let alone all six stanzas. It penalises only the prevention or disturbance of a singing that is already taking place.</p><p>Third, and most importantly, even where the song, including its later stanzas, is sung, a citizen who chooses not to join in because doing so would offend their freedom of conscience under Article 25 is under no legal obligation to participate.</p><p>The law as laid down by the Supreme Court in <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">Bijoe Emmanuel</span> gives that citizen complete protection: standing respectfully, in silence, without disrupting others, is not an offence under this Act, was not an offence under the original 1971 Act, and cannot be made one merely by extending the statute to a new composition.</p><p>Citizens uneasy about the fuller version of<span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\"> Vande Mataram</span> do not need to wait for a court to vindicate them after the fact. The law, correctly read, already protects them.</p><p><span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"2\" section=\"A\" zone=\"Delhi\"> (Haris Beeran is a Rajya Sabha MP and a lawyer)</span></p><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The HinduBu asually manufacture dangerous human viruses; it shows that computers are beginning to move from analysing biological information towards proposing biological designs that scientists can physically build", "body": "<div class=\"row justify-content-end\"><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12\"><div class=\"author\"><div class=\"author-name\">Abdul Ghafur</div></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">\n  The Stanford experiment does not show that AI can casually manufacture dangerous human viruses; it shows that computers are beginning to move from analysing biological information towards proposing biological designs that scientists can physically build\n</h2><div class=\"article-picture\"><div class=\"picture verticle\"><img alt=\"What changes when AI moves from reading viral genomes to designing them?\" class=\"lazy\" data-device-variant=\"FREE~FREE~FREE~FREE\" data-src-template=\"https://eimg.thgim.com/ccidist-ws/th/th_delhi/issues/200856/OPS/Public/G2RGEFGQH.1+GJ7GEHISK.1.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAHgAeAAD/4QFyRXhpZgAATU0AKgAAAAgABQEOAAIAAAEFAAAASgEaAAUAAAABAAABUAEbAAUAAAABAAABWAEoAAMAAAABAAIAAAE7AAIAAAAKAAABYAAAAABEZXRhaWxlZCAzRCBpbGx1c3RyYXRpb24gb2YgYW4gZW5naW5lZXJlZCBtaWNyb29yZ2FuaXNtIG9yIHZpcnVzIHdpdGggdmlzaWJsZSBpbm5lciBzdHJ1Y3R1cmUgYW5kIHJlY2VwdG9ycy4gSWRlYWwgZm9yIGNvbmNlcHRzIG9mIHRhcmdldGVkIG9uY29sb2d5IHRyZWF0bWVudCwgY2VsbCBiaW9sb2d5LCBhcnRpZmljaWFsIGludGVsbGlnZW5jZSBpbiBwaGFybWFjeSwgaW1tdW5vdGhlcmFweSwgYW5kIGZ1dHVyaXN0aWMgbWVkaWNhbCB0ZWNobm9sb2d5LgAAABMYbwAAJxAAExhvAAAnEGtvdG9fZmVqYQD/4Q8zaHR0cDovL25zLmFkb2JlLmNvbS94YXAvMS4wLwA8P3hwYWNrZXQgYmVnaW49Iu+7vyIgaWQ9Ilc1TTBNcENlaGlIenJlU3pOVGN6a2M5ZCI/PiA8eDp4bXBtZXRhIHhtbG5zOng9ImFkb2JlOm5zOm1ldGEvIiB4OnhtcHRrPSJYTVAgQ29yZSA2LjAuMCI+IDxyZGY6UkRGIHhtbG5zOnJkZj0iaHR0cDovL3d3dy53My5vcmcvMTk5OS8wMi8yMi1yZGYtc3ludGF4LW5zIyI+IDxyZGY6RGVzY3JpcHRpb24gcmRmOmFib3V0PSIiIHhtbG5zOnhtcFJpZ2h0cz0iaHR0cDovL25zLmFkb2JlLmNvbS94YXA portunities. For biosecurity, it raises equally important questions.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>From reading genomes to designing</p></div><p>Bacteriophages -literally “bacteria eaters” -have been known for more than a century and are among the most abundant biological entities in nature. In 1977, one particularly small phage, X174, pronounced roughly ‘phi-X-one-seventy-four’, became the first complete DNA genome to be sequenced. By the early 2000s, scientists had shown that viral genetic material could be synthesised from known sequence information and used to recover functioning viruses. Humans had progressed from reading viral genomes to writing them. Scientists then became increasingly capable of deliberately altering viruses. The controversial influenza gain-of-function experiments of 2011-12 showed that genetic changes could modify important properties such as transmission in experimental animals. Such research highlighted a dilemma that remains unresolved: the same science that can improve pandemic preparedness may also create biosafety and biosecurity risks.</p><p>The Stanford-Arc experiment represents the next step. The scientists already knew the X174 genome and already knew how to synthesise viral DNA and recover functioning phages. What changed was who -or what -proposed the genome. They used Evo 1 and Evo 2, genome language models. The principle resembles a large language model, except that instead of learning patterns in words, Evo learns patterns in DNA. It studies the genetic alphabet - A, C, G and T - across vast numbers of genomes and then generates new genetic sequences. For this experiment, the models were further trained on thousands of bacteriophage genomes related to X174.</p><p>AI did not invent a completely unrelated virus from nothing: it generated previously unseen X174-like whole genomes within a known biological framework. Scientists selected some of these sequences, physically manufactured the DNA and introduced it into <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">E. coli.</span> If the genetic instructions were biologically coherent, the bacterial machinery produced new phage particles. 16 designs succeeded. The progression is striking: we learnt to read viral genomes, then to write them, then to modify them. Now AI is beginning to help decide what should be written.</p><p>One finding shows why this matters. An AI-designed phage successfully combined a viral protein with other genetic changes in a way that conventional engineering had struggled to achieve. The significance is not simply that AI can propose individual mutations; it may increasingly be able to identify multiple genetic changes that work together across an entire genome, exploring combinations that would be extremely difficult for humans to test one by one.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>The medical opportunity</p></div><p>The most immediate application may be phage therapy. Antibiotic resistance is steadily eroding conventional treatment options, while bacteriophages offer another way of killing bacteria. Their major limitation is specificity: a phage effective against one bacterial strain may fail against another, and bacteria can also develop resistance to phages. Traditionally, researchers have searched nature and phage libraries for suitable candidates or modified existing viruses. Generative biology introduces another possibility. Instead of asking only, “Can we find the phage we need?”, medicine may increasingly ask, “Can we design the phage we need?”</p><p>The Stanford experiment offered an early demonstration. Combinations of AI-designed phages overcame resistance in <span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\">E. coli </span>strains against which the original X174 failed. For clinicians confronting antimicrobial resistance, this is potentially important.</p><p>The possibilities extend beyond phage therapy. AI can assist the design of vaccine antigens, antibodies, therapeutic proteins and viral vectors used to deliver genetic treatments. It may eventually help optimise oncolytic viruses that selectively attack cancer cells. The larger revolution is therefore not simply ‘AI making viruses’. It is AI becoming capable of designing biological function.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>The danger is acceleration</p></div><p>It is tempting to be reassured because X174 is an exceptionally simple bacteriophage, while dangerous human viruses are vastly more complicated. Human pathogens must negotiate receptor binding, host range, tissue tropism, replication, immune escape and transmission. But complexity should not become false reassurance. Human scientists already understand much about these determinants. Decades of virology, reverse genetics and gain-of-function research have linked many genetic changes to viral behaviour.</p><p>AI does not need to rediscover virology. Its power lies in integrating what humanity already knows, examining vastly more combinations than humans can explore manually and accelerating the path from hypothesis to experimental design. This is the real biosecurity concern: capability amplification. The relevant question is not whether an untrained individual can ask today’s chatbot to generate a pandemic virus. It is whether increasingly capable AI could make a knowledgeable and well-equipped laboratory substantially more effective at designing biological systems.</p><p>Future systems may compress months or years of literature review, modelling and experimental planning into much shorter cycles. Combined with increasingly automated laboratories, that acceleration could become profound. Even the apparently modest success rate in the Stanford study deserves this perspective. Only 16 of 285 designs worked, but digital systems can generate enormous numbers of candidates. A low success rate is reassuring only while the number of attempts remains small. Biosecurity will therefore also have to evolve. Traditional DNA-synthesis screening often asks whether an ordered sequence resembles a known pathogen or toxin. In the age of generative biology, researchers increasingly argue that screening must also consider biological function: not simply whether a sequence looks dangerous, but what it might actually do.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Safety without paralysing science</p></div><p>AI companies are already confronting this dilemma. Claude Fable 5 was initially deployed with strong safeguards around biology, chemistry and cybersecurity. Legitimate scientific work could sometimes trigger a fallback to a less capable model. The intention was understandable, but the experience illustrated the problem: too little restriction creates risk, while too much restriction can obstruct legitimate science.</p><p>Those safeguards have since been refined to reduce false-positive biology fallbacks, while more sensitive capabilities remain restricted. This points towards a more practical model: graduated, auditable access in which legitimate researchers can obtain stronger capabilities under appropriate institutional and security controls. Biosecurity also cannot rest entirely on what an AI model agrees or refuses to answer. Safeguards are needed throughout the chain - AI systems, DNA-synthesis providers, laboratories and institutional biosafety oversight.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>India must build capability</p></div><p>There is an important implication for India. If frontier AI becomes central to drug discovery, genomics, vaccines, protein engineering and experimental design, access to advanced AI becomes part of national scientific infrastructure. Smaller and specialised models will be sufficient for many tasks. But a country can choose to use a small model because it is sufficient; it should not be forced to use one because somebody else owns the frontier. If researchers elsewhere receive trusted access to highly capable biomedical models while Indian scientists depend on restricted public versions, the resulting disadvantage could accumulate across drug discovery, vaccines, antimicrobial resistance and other fields.</p><p>India is already investing through the IndiaAI Mission and indigenous foundation-model programmes. That ambition should include scientific and biomedical AI, secure compute, high-quality datasets and trusted-access frameworks for legitimate researchers. AI sovereignty without biosecurity would be reckless; biosecurity without AI sovereignty could leave us scientifically dependent.</p><div class=\"subhead\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" section=\"A\" zone=\"Delhi\"><p>Governing biological intelligence</p></div><p>The Stanford experiment does not show that AI can casually manufacture dangerous human viruses. It shows something more precise: computers are beginning to move from analysing biological information towards proposing biological designs that scientists can physically build. That capability could transform antimicrobial resistance research, vaccines and therapeutics. It could also accelerate harmful biological engineering. The answer is neither prohibition nor unrestricted access, but controlled acceleration -allowing beneficial science to progress while safeguards increase with capability and risk.</p><p>The challenge is no longer simply whether AI should be allowed to understand biology. It is how we govern AI when understanding biology increasingly becomes the ability to design it. India must be capable not only of regulating and consuming that revolution, but of participating in its science and helping shape its safeguards.</p><p><span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"2\" section=\"A\" zone=\"Delhi\"> (Dr.<span class=\"bold\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"0\" section=\"A\" zone=\"Delhi\"></span>Abdul Ghafur is a senior consultant in infectious diseases, Apollo Hospital, Chennai and coordinator, Chennai Declaration on AMR)</span></p><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The HinduBusinessLine --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The HinduBusinessLine --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The HinduBusinessLine --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The HinduBusinessLine --><div class ACiij3PAHOTQAVi6pq2d0Fo3HR5B39h/jUWqaqZ90FsSIujP3f8A+t/OsquulR+1I5alXpEKKKK6jnCnwTSW8qywuUdehFMopAdZpWvx3W2G6xFN0B/hf/A+1bVec1t6Tr7222G8Jkh6B+rL/iKxnT6o2jU6M6umSxJMhSQZBpY5EljWSNgyMMgg8GnVgbJmDe2z2z4PKHo3r7U6zhwPNYcn7v8AjWhdOswMZAKd/eoaylGxv7RyVgoooqRBRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFAASFBLEAAZJPQCue1TVDdZhgJEHc93/wDre1ams/8AIKm/4D/OuYrqoQT95nNWm17qCiiius5gooooAKKKKACiiigC9pmqzadJ8vzwk/NGT+o9DXVJfxXlssls2VbgnuD6H3rhj0rZ8Nffuf8AdWsakVua05O9jdpKKK4pO7OtKyCiiipKCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//2Q==\" title=\"She dummied up when asked about the case\"/></div><figcaption class=\"caption\"></figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-\"><p>“If you ask me, you should delete points 3 and 5. I don’t think they…”</p><p>“What? In the meeting we had the day before, you insisted they be included. They were your brainchild.”</p><p>“Really? I don’t remember.”</p><p>“Are you feeling okay? Or have you fallen victim to scroll fatigue again?”</p><p>“Scroll fatigue? What does…”</p><p>“There are times when we spend a lot of our time scrolling on the phone looking for interesting stuff to read or watch on social media.”</p><p>“I spend nearly two hours every day scrolling. But scrolling doesn’t make me tired.”</p><p>“It doesn’t make you physically tired, but it does mentally.”</p><p>“That’s probably because you focus really hard when you’re scrolling. You are either reading or watching something with total concentration.”</p><p>“That’s right! You’re processing a lot of new information very quickly.”</p><p>“You’re also making very quick decisions. Which article you want to read first, and when you have started reading it, whether you wish to continue reading it, etc.”</p><p>“Very good! Most of the time, we don’t feel the strain sneaking up on us. And when it does, we’re not able to focus on anything; we become highly irritable. After spending three hours on the phone, Shravan experienced a severe case of scroll fatigue.”</p><p>“I’ve never experienced scroll fatigue. I don’t stay online for more than 15 minutes.”</p><p>“That’s hard to believe.”</p><p>“That was just an example.”</p><p>“Okay! The marathon session on the computer resulted in total scroll fatigue.”</p><p>“I think scroll fatigue is going to become a bigger problem in the near future.”</p><p>“Yes. Parents need to discourage…”</p><p>“They need to discourage children from using the phone and….”</p><p>“You encourage someone to do something. But you discourage someone from doing something. Here’s an example. The father encouraged his children to read books. He discouraged them from watching movies.”</p><p>“My parents always encouraged me to wake up early. They discouraged me from wasting money on movies.”</p><p>“When my cousin Revathi said she was joining politics, all the elders in the family discouraged her from joining the profession.”</p><p>“Did your cousin have a showdown with your uncles and aunts?”</p><p>“No, she was smart. When they asked her questions, she just dummied up.”</p><p>“Dummied up?”</p><p>“One of the meanings of dummy is ‘stupid’. But the word has another meaning as well. A model of a human being is also called a dummy. One of the meanings of the expression ‘dummy up’ is to remain silent.”</p><p>“In other words, the person stops talking?”</p><p>“Exactly!”</p><p>“When my cousin Arun went to the States, he dummied up whenever a stranger asked him a question.”</p><p>“In the case of Arun, he didn’t have to dummy up. He is a dummy!”</p><p><span class=\"italic\" edition=\"EPaper\" layoutdesk=\"TH_Edit\" multiline=\"2\" section=\"A\" zone=\"Delhi\"> upendrankye@gmail.com</span></p><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The HinduBusinessLine --><div class=\
