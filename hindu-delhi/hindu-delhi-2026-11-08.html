<html lang="en">
<head>

})();

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #1a1a18;
  --ink-muted:  #4a4a45;
  --ink-faint:  #8a8a82;
  --paper:      #f8f6f0;
  --paper-warm: #f0ede4;
  --rule:       #c8c4b8;
  --red:        #b00020;
  --font-head:  'Georgia', 'Times New Roman', serif;
  --font-body:  'Georgia', 'Times New Roman', serif;
  --font-ui:    system-ui, -apple-system, sans-serif;
}

html.dark {
  --ink:        #e8e4dc;
  --ink-muted:  #a8a49c;
  --ink-faint:  #6a6660;
  --paper:      #181816;
  --paper-warm: #211f1c;
  --rule:       #38352f;
  --red:        #e05070;
}

html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ── Masthead ── */
#masthead {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--ink); color: var(--paper);
  padding: 0 1rem;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
  user-select: none;
}
#masthead .nameplate {
  font-family: var(--font-head);
  font-size: 1.3rem; font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
}
#masthead .edition-date {
  font-family: var(--font-ui);
  font-size: 0.7rem; color: #aaa;
  text-align: right; line-height: 1.35;
}
#masthead .back-btn {
  display: none; align-items: center; gap: 6px;
  background: none; border: none; color: var(--paper);
  font-family: var(--font-ui); font-size: 0.8rem;
  cursor: pointer; padding: 8px 0; min-width: 60px;
}
#masthead .back-btn svg { flex-shrink: 0; }

/* ── Section nav strip ── */
#section-nav {
  position: fixed; top: 52px; left: 0; right: 0; z-index: 99;
  background: var(--paper-warm);
  border-bottom: 2px solid var(--ink);
  overflow-x: auto; overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  transition: opacity 0.2s, transform 0.2s;
}
#section-nav::-webkit-scrollbar { display: none; }
#section-nav .nav-inner {
  display: inline-flex; padding: 0 0.5rem;
}
.sec-tab {
  display: inline-block;
  font-family: var(--font-ui); font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-muted);
  padding: 9px 10px;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.sec-tab.active {
  color: var(--ink);
  border-bottom-color: var(--red);
}

/* ── Pages viewport ── */
#pages-viewport {
  position: fixed;
  top: 93px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
#pages-track {
  display: flex; height: 100%;
  transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ── Individual section page ── */
.section-page {
  flex: 0 0 100vw; width: 100vw; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 1.2rem 0 2rem;
}
.section-page::-webkit-scrollbar { width: 3px; }
.section-page::-webkit-scrollbar-thumb { background: var(--rule); }

.sec-header {
  padding: 0 1rem 0.6rem;
  border-bottom: 3px double var(--ink);
  margin-bottom: 0.1rem;
}
.sec-header h2 {
  font-family: var(--font-head);
  font-size: 1.05rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red);
}
.sec-header .art-count {
  font-family: var(--font-ui); font-size: 0.7rem;
  color: var(--ink-faint); margin-top: 1px;
}

.article-row {
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 0.5px solid var(--rule);
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: background 0.12s;
  gap: 0.25rem;
}
.article-row:active { background: var(--paper-warm); }
@media (hover: hover) {
  .article-row:hover { background: var(--paper-warm); }
}

.art-meta {
  font-family: var(--font-ui); font-size: 0.65rem;
  color: var(--ink-faint); letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex; gap: 0.5rem; align-items: center;
}
.art-meta .page-tag {
  background: var(--ink); color: var(--paper);
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.6rem;
}
.art-headline {
  font-family: var(--font-head);
  font-size: 1.02rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
}
.art-teaser {
  font-family: var(--font-body); font-size: 0.8rem;
  color: var(--ink-muted); line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.art-read-cue {
  font-family: var(--font-ui); font-size: 0.68rem;
  color: var(--red); font-weight: 600;
  letter-spacing: 0.03em;
  align-self: end;
  text-align: right;
}

/* ── Article pane fly animations ── */
@keyframes fly-to-pip {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
}
@keyframes fly-from-pip {
  0%   { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
  100% { opacity: 1; transform: scale(1); }
}

/* ── Article pane — floating card ── */
#article-pane {
  position: fixed;
  top: 58px; left: 50%; bottom: 12px;
  transform: translateX(-50%) scale(0.96);
  width: min(900px, calc(100vw - 1rem));
  background: var(--paper);
  border-radius: 12px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity: 0;
  pointer-events: none;
  transform-origin: center bottom;
  z-index: 101;
  padding: 1.5rem 1.5rem 3rem;
  transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
}
#article-pane.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) scale(1);
  animation: none;
}
#article-pane.flying-out { pointer-events: none; animation: fly-to-pip 0.75s cubic-bezier(0.4,0,0.2,1) forwards; }
#article-pane.flying-in  { pointer-events: none; animation: fly-from-pip 0.4s cubic-bezier(0.2,0,0,1) forwards; }
#article-pane::-webkit-scrollbar { width: 3px; }
#article-pane::-webkit-scrollbar-thumb { background: var(--rule); }

#article-pane .art-pane-section {
  font-family: var(--font-ui); font-size: 0.68rem;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--red);
  margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 0.5rem;
}
#article-pane .art-pane-section::after {
  content: ''; flex: 1; height: 1px; background: var(--rule);
}
#article-pane h1 {
  font-family: var(--font-head);
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  font-weight: 700; line-height: 1.25;
  color: var(--ink); margin-bottom: 0.75rem;
}
#article-pane .art-pane-meta {
  font-family: var(--font-ui); font-size: 0.72rem;
  color: var(--ink-faint); margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--rule);
  display: flex; gap: 1rem; flex-wrap: wrap;
}
#article-pane .art-pane-body {
  font-size: 1rem; line-height: 1.75; color: var(--ink);
}
#article-pane .art-pane-body p { margin-bottom: 0.9rem; }
#article-pane .art-pane-body h2,
#article-pane .art-pane-body h3 {
  font-family: var(--font-head);
  font-weight: 700; margin: 1.25rem 0 0.4rem;
  color: var(--ink);
}
#article-pane .art-pane-body img {
  max-width: 100%; height: auto;
  display: block; margin: 1rem 0;
}
#article-pane .art-pane-body figcaption {
  font-size: 0.75rem; color: var(--ink-faint);
  margin-top: -0.5rem; margin-bottom: 1rem;
  font-style: italic;
}
#article-pane .art-source-link {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-faint);
}
#article-pane .art-source-link a { color: var(--red); }

.art-print-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 1rem;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 14px;
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-muted); cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.art-print-btn:hover { border-color: var(--ink-muted); color: var(--ink); }
.art-print-btn svg { flex-shrink: 0; }

/* ── Background blur overlay ── */
#blur-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 98;
  backdrop-filter: blur(6px) brightness(0.85);
  -webkit-backdrop-filter: blur(6px) brightness(0.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}


/* ── PiP card ── */
#pip-card {
  position: fixed;
  bottom: 14px; right: 14px;
  width: 200px;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--rule);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.88) translateY(8px);
  transform-origin: bottom right;
  transition: opacity 0.3s ease 0.52s, transform 0.35s cubic-bezier(0.34,1.4,0.64,1) 0.52s;
  z-index: 103;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
#pip-card.open { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
#pip-card:hover { border-color: var(--ink-muted); }
.pip-head {
  background: var(--ink); padding: 7px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.pip-logo { font-family: var(--font-head); font-size: 0.68rem; font-weight: 700; color: var(--paper); }
.pip-close {
  background: none; border: none; color: #aaa; cursor: pointer;
  padding: 2px; display: flex; align-items: center; border-radius: 3px;
  transition: color 0.15s;
}
.pip-close:hover { color: var(--paper); }
.pip-body { padding: 8px 10px 10px; }
.pip-sec {
  font-family: var(--font-ui); font-size: 0.58rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red); margin-bottom: 4px;
}
.pip-title {
  font-family: var(--font-head); font-size: 0.72rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.pip-hint { font-family: var(--font-ui); font-size: 0.58rem; color: var(--ink-faint); }

/* ── Fallback notice ── */
.fallback-notice {
  font-family: var(--font-ui); font-size: 0.75rem;
  background: #fff8dc; border: 1px solid #e0c000;
  color: #555; padding: 0.5rem 1rem;
  margin: 0.5rem 1rem 0;
  border-radius: 4px;
}

/* ── Print styles ── */
@media print {
  body, html { overflow: visible !important; background: #fff !important; }
  #masthead, #section-nav, #pages-viewport, #blur-overlay,
  #pip-card, #swipe-hint, .art-print-btn { display: none !important; }
  #article-pane {
    position: static !important;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    border-radius: 0 !important;
    padding: 2rem !important;
    background: #fff !important;
    color: #000 !important;
    box-shadow: none !important;
  }
  #article-pane .art-pane-section,
  #article-pane h1,
  #article-pane .art-pane-meta,
  #article-pane .art-pane-body,
  #article-pane .art-source-link { display: block !important; color: #000 !important; }
  #article-pane .art-pane-body img { max-width: 100% !important; }
  a { color: #000 !important; text-decoration: none !important; }
}

/* ── Swipe hint (first load) ── */
#swipe-hint {
  position: fixed; bottom: 1.2rem; left: 50%;
  transform: translateX(-50%);
  background: rgba(26,26,24,0.75); color: #f8f6f0;
  font-family: var(--font-ui); font-size: 0.72rem;
  padding: 6px 14px; border-radius: 20px;
  pointer-events: none;
  animation: fadeout 3s ease 1.5s forwards;
  white-space: nowrap; z-index: 200;
}
@keyframes fadeout { to { opacity: 0; } }

/* ── Desktop: wider article reading column ── */
/* ── Theme toggle ── */
#theme-toggle {
  background: none; border: none;
  color: var(--paper); cursor: pointer;
  padding: 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.75; transition: opacity 0.15s;
  flex-shrink: 0;
}
#theme-toggle:hover { opacity: 1; }
#theme-toggle svg { display: block; }

@media (min-width: 700px) {
  #article-pane {
    padding: 2rem 2.5rem 4rem;
  }
  .article-row {
    grid-template-columns: 1fr;
    padding: 0.9rem 1.5rem;
  }
  .sec-header { padding: 0 1.5rem 0.7rem; }
  .section-page { padding: 1.4rem 0 2rem; }
  .art-headline { font-size: 1.1rem; }
  #masthead .nameplate { font-size: 1.5rem; }
  .fallback-notice { margin: 0.5rem 1.5rem 0; }
}
</style>
</head>

lock d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Air Quality Early Warning System (EWS) has forecast that Delhi's air quality is likely to slip into the 'severe' category from November 9 and remain there for the subsequent few days</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 11:03 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/6yts88/article71681162.ece/alternates/LANDSCAPE_1200/POLLUTION%20STANDLONE%20DELHI%201.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/6yts88/article71681162.ece/alternates/LANDSCAPE_1200/POLLUTION%20STANDLONE%20DELHI%201.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/6yts88/article71681162.ece/alternates/LANDSCAPE_660/POLLUTION%20STANDLONE%20DELHI%201.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/6yts88/article71681162.ece/alternates/LANDSCAPE_320/POLLUTION%20STANDLONE%20DELHI%201.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    The city’s air quality remained in the very poor category, with the instantaneous Air Quality Index (AQI) recorded at 371 at 7 p.m., close to the severe threshold. File\n                                          | Photo Credit: Sushil Kumar Verma\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681158\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>A smoky haze hung over Delhi on Deepavali night, blurring streetlights and blanketing neighbourhoods as celebrations intensified across the capital, pushing air quality at 20 monitoring stations into the ‘severe’ category, with the overall Air Quality Index standing at 371 at 10 p.m..</p><p>The haze grew denser as the evening progressed, with smoke from firecrackers hanging over roads and residential neighbourhoods. The smell of burnt crackers lingered in the air, while visibility dropped in several parts of the capital and residents reported difficulty breathing.</p><div class=\"also-read\"><p class=\"content\"><strong>ALSO WATCH </strong><a href=\"https://www.thehindu.com/videos/watch-delhi-air-pollution-capital-sees-very-poor-aqi-on-deepavali-as-grap-3-curbs-continue/article71680939.ece\"> Watch: Delhi air pollution: Capital sees ‘very poor’ AQI on Deepavali as GRAP 3 curbs continue</a></p><div class=\"picture video\"><a href=\"https://www.thehindu.com/videos/watch-delhi-air-pollution-capital-sees-very-poor-aqi-on-deepavali-as-grap-3-curbs-continue/article71680939.ece\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"LANDSCAPE~LANDSCAPE~LANDSCAPE~LANDSCAPE\" data-src-template=\"https://th-i.thgim.com/public/incoming/tsl3b3/article71680937.ece/alternates/SQUARE_80/Amsterdam%20protest%201.png\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAABQCAIAAAABc2X6AAAie0lEQVR42uRVd1RUVxp/U6kDzDAM07Erxt7bWnbtRqOJJVk1MXqU1aix5cSYjSRGrDmuiSIiUSxY0BiwR5FBU Ahead of Deepavali, the Delhi government had appealed to people to comply with the Supreme Court’s directions on sale and use of green firecrackers.</p><p>The District Magistrate (East), in an order, had permitted the bursting of green firecrackers only on November 7 and 8, between 6 a.m. and 7 a.m. and 8 p.m. and 10 p.m..</p><p>Residents reported that firecrackers were being burst in outer Delhi’s Pitampura and Burari, with the intensity particularly high in Burari. Similar reports came from Mayur Vihar, while people in the Bishambardas Marg area and Lutyens’ Delhi said fireworks continued, although the intensity had reduced slightly.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/tamil-nadu/one-child-dead-269-treated-for-burn-injuries-in-tn-during-deepavali/article71680951.ece\">\n\t\t\t\t\t\t\t\t\t\tOne child dead, 269 treated for burn injuries in T.N. during Deepavali</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/wxirn9/article71680964.ece/alternates/SQUARE_80/Be_Well_Climate_Choices_Pollution_Tips_21446.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAADAQEBAQEAAAAAAAAAAAAEBQYDBwECAAEAAwEBAAAAAAAAAAAAAAAAAAECAwT/2gAMAwEAAhADEAAAAOaHYGa4sHiB8h6Hsnh7zTRVcpwTV5ZBgpOdnUwe7WHwWjS3SfAU2/m6ZEGwp5IULaYoWmKq2heDVPLUiXrh2iJ/WtSMDRnWqa2lkTtRz7muVQ0S/eQNSfLnqlZzwO31w3jJGd9rTck9a6UAoTJiSTIMn//EAB8QAAMBAQACAwEBAAAAAAAAAAIDBAEFAAYREhQTB//aAAgBAQABBQBefOp3ybfIV/cywViTBWL91y+mvAZqiZtGaBPJG+bJRNs7cGiSxad9mtFfO/WqpLLlKK1yaHkWpY89OiQz3FVPqt5imMqyEVB1DGiPlROXL1+fhTz3H+unnMvXQBg9CtVzu mid a layer of smog and reduced visibility.</p><p>The court prohibited bursting of firecrackers within 300 metres of hospitals, nursing homes, health centres, old-age homes, educational institutions and other notified silence zones.</p><p>Only CSIR-NEERI-certified green firecrackers were permitted for sale, with the administration directing that they be sold exclusively at locations designated by the Delhi Police. The administration had also announced joint patrolling and enforcement teams comprising district officials and Delhi Police personnel to check unauthorised sale and use of prohibited firecrackers.</p><p>Meanwhile, the Air Quality Early Warning System (EWS) has forecast that Delhi's air quality is likely to slip into the 'severe' category from November 9 and remain there for the subsequent few days.</p><p>Weather and air quality experts have attributed the anticipated deterioration to unfavourable meteorological conditions, vehicular emissions, Deepavali celebrations and the ongoing peak stubble-burning season in neighbouring states.</p><p>PM2.5 remained the predominant pollutant in the national capital on Sunday (November 8, 2026), with firecracker emissions adding to the particulate matter levels.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:48 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681158\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/cities/Delhi/delhi-air-quality-deepavali-cracker-ban-ver-poor/article71681158.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl \"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 11:03 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71678977\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The Kengeri police have arrested a habitual offender for allegedly murdering a 65-year-old woman who was sleeping outside a temple and robbing her of cash and a gold ring in Vrushabhavathi Nagar Layout.</p><p>The deceased, Narayanamma, was found dead in front of the Pataladamma Temple at Vrushabhavathi Nagar Layout, Konasandra, within Kengeri police station limits, on November 3.</p><p>According to the police, Narayanamma had left her house due to family problems and had been sleeping outside the temple for the past few days.</p><p>A local resident who noticed her body informed her son, who arrived at the spot and identified her. The Kengeri police initially registered an unnatural death report based on his complaint.</p><p>However, following the post-mortem examination and information gathered during the investigation, police suspected that she had been murdered and robbed. A murder case was subsequently registered on Thursday.</p><p>During the investigation, police apprehended a suspicious person moving around Vrushabhavathi Nagar Layout on Friday. During interrogation, he allegedly confessed to the crime.</p><p>The accused reportedly told investigators that he had noticed Narayanamma sleeping alone and decided to rob her to arrange money to fund his  vices.</p><p>In the early hours of November 3, he allegedly went to the spot, covered her mouth, assaulted her and robbed her of the cash she was carrying and a gold ring before fleeing, leaving her dead.</p><p>Police said the accused has a criminal history and was previously involved in cases registered under the Narcotic Drugs and Psychotropic Substances (NDPS) Act and robbery cases at Girinagar and Cottonpet police stations.</p><p>Further investigation and interrogation are under way, police said.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 07, 2026 11:12 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71678977\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/karnataka/habitual-offender-arrested-for-murdering-65-year-old-woman-in-bengaluru/article71678977.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop     Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681125\" data-title=\"P.T. Usha complains to IOA electoral officer over WhatsApp campaign for SOM polls\" data-url=\"https://www.thehindu.com/sport/pt-usha-complains-to-ioa-electoral-officer-over-whatsapp-campaign-for-som-polls/article71681125.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Indian Olympic Association president alleged former archer Dola Banerjee violated the Model Code of Conduct by circulating a WhatsApp message seeking votes for four candidates ahead of Monday’s election</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:10 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/97to0e/article71681131.ece/alternates/FREE_1200/image%207.jpeg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/97to0e/article71681131.ece/alternates/FREE_1200/image%207.jpeg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/97to0e/article71681131.ece/alternates/FREE_1200/image%207.jpeg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/97to0e/article71681131.ece/alternates/FREE_1200/image%207.jpeg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Usha objected to a WhatsApp message circulated through an account bearing Banerjee’s name, seeking support for the ‘New Bharat Panel’ and asking voters to elect four named candidates, along with their ballot serial numbers and roll numbers. File\n                                          | Photo Credit: The Hindu\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681125\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Indian Olympic Association (IOA) president P.T. Usha has lodged a complaint with the Electoral Officer alleging that former archer Dola Banerjee violated the Model Code of Conduct by circulating a WhatsApp message soliciting votes for a panel of four candidates in Monday’s (November 9, 2026) Sportspersons of Outstanding Merit (SOM) elections.</p><p>In her complaint, Usha objected to a WhatsApp message circulated through an account bearing Banerjee’s name, seeking support for the ‘New Bharat Panel’ and asking voters to elect four named candidates, along with their ballot serial numbers and roll numbers.</p><p>Usha cited Clause 1.9 of the Model Code of Conduct, issued on October 30, 2026, which states that the promotion of a candidate shall exclude any form of publicity, including the use of new media or social networks. She contended that the circulation of the message amounted to targeted solicitation of votes through social media, and appeared to fall within the ambit of the clause. The complaint also referred to Clauses 1.2 and 1.3, which require candidates to conduct their campaigns fairly, with dignity and moderation, and to show due respect to other candidates.</p><p>Usha has urged the election authorities to examine the communication, establish the circumstances under which it was created and circulated, and seek an explanation from the persons concerned. She has also sought appropriate action under the applicable election rules if a violation is established, along with directions to ensure a level playing field for all candidates.</p><p>With polling scheduled from 9 a.m. to 5 p.m. on November 9, 2026, Usha has sought urgent intervention and a decision before voting begins. A screenshot of the WhatsApp message and a copy of the Model Code of Conduct were enclosed with the complaint.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:10 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681125\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/pt-usha-complains-to-ioa-electoral-officer-over-whatsapp-campaign-for-som-polls/article71681125.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none v></div>"}, {"id": 3, "title": "Revanth celebrates Deepavali with Indiramma house beneficiary", "section": "Front Page", "page": "", "teaser": "Ministers, MLAs asked to spend festival with poor families who received houses; 2.21 lakh houses completed under scheme", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/telangana/\">\n                        Telangana\n                    </a><meta content=\"Telangana\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681093\" data-title=\"Revanth celebrates Deepavali with Indiramma house beneficiary\" data-url=\"https://www.thehindu.com/news/national/telangana/revanth-celebrates-deepavali-with-indiramma-house-beneficiary/article71681093.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Ministers, MLAs asked to spend festival with poor families who received houses; 2.21 lakh houses completed under scheme</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 09:54 pm IST - KODANGAL</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/r-ravikanth-reddy-759/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/r-ravikanth-reddy-759/\">R. Ravikanth Reddy</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/news/national/telangana/wmh323/article71681089.ece/alternates/LANDSCAPE_1200/Indiramma%201.jpeg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/news/national/telangana/wmh323/article71681089.ece/alternates/LANDSCAPE_1200/Indiramma%201.jpeg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/news/national/telangana/wmh323/article71681089.ece/alternates/LANDSCAPE_660/Indiramma%201.jpeg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/news/national/telangana/wmh323/article71681089.ece/alternates/LANDSCAPE_320/Indiramma%201.jpeg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Chief Minister A. Revanth Reddy and his Cabinet colleagues celebrate Deepavali with a Indiramma house beneficiaries in Kodangal constituency on November 8, 2026. Photo credit: Special Arrangement.\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681093\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Chief Minister A. Revanth Reddy along with Ministers and MLA celebrated Deepavali with a beneficiary of the Indiramma housing scheme at Parsapur village in Kodangal mandal on Sunday (November 8, 2026), in an initiative aimed at highlighting the government’s flagship housing programme for poor families.</p><p>The Chief Minister inaugurated the newly constructed house of Goripalli Sumitra and Srinivas, presented new clothes to the family, and had a traditional Deepavali meal of fine rice at their residence. Speaker Gaddam Prasad Kumar and Ministers Seethakka, Jupally Krishna Rao, Damodar Rajanarasimha and other public representatives joined the family for lunch.</p><p>The programme, titled ‘Maa Indiramma Intlo Deepavali’ (Deepavali in Our Indiramma Home), was conceived by Mr. Revanth Reddy to take the government’s housing initiative to the people and celebrate the festival with families who were allotted the houses.</p><div class=\"article-picture\"><div class=\"picture zoom-img\"><img alt=\"Chief Minister A. Revanth Reddy and his Cabinet colleagues have lunch at the residence of a Indiramma house beneficiary in Kodangal constituency on November 8, 2026. Photo credit: Special Arrangement.\" class=\"lazy\" data-src-template=\"https://th-i.thgim.com/public/news/national/telangana/ameydp/article71681090.ece/alternates/FREE_1200/Indiramma%202.jpeg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDA  in Kodangal constituency on November 8, 2026 as a part of Deepavali celebrations. Photo credit: Special Arrangement\"/></div><figcaption class=\"caption\">\n\n                            Chief Minister A. Revanth Reddy and his Cabinet colleagues present new clothes to a family of Indiramma house beneficiary in Kodangal constituency on November 8, 2026 as a part of Deepavali celebrations. Photo credit: Special Arrangement\n                                                    </figcaption><span></span><meta content=\"https://th-i.thgim.com/public/news/national/telangana/f8ufo2/article71681092.ece/alternates/FREE_1200/Indiramma%20.jpeg\"/><meta content=\"1200\"/><meta content=\"675\"/></div><p>The beneficiaries are picked up in an open lot without any interference of political leader, and the programmes are held in open spaces in the presence of all those who applied for the scheme.</p><p>The State has committed around ₹40,000 crore towards the two phases and the proposed urban housing programme. Separately, official housing department data available in October showed that ₹7,634 crore had been released to beneficiaries towards construction assistance.</p><p>The Indiramma Indlu scheme was one of the key promises made by the Congress before the 2023 Assembly elections where the party had promised to provide a house to every eligible homeless family extending a financial assistance of ₹5 lakh to construct a house.</p><p>The houses have two rooms, a kitchen and a toilet. In the first phase, the government sanctioned 4.5 lakh houses, with 3,500 houses earmarked for each Assembly constituency.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 09:54 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681093\" data-co suru", "section": "Front Page", "page": "", "teaser": "With this development, five bodies have been traced so far in the case, while the search for the remaining two continues", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/cities/\">\n                        Cities\n                    </a><meta content=\"Cities\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/cities/bangalore/\">\n                        Bengaluru\n                    </a><meta content=\"Bengaluru\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71680991\" data-title=\"Rajajinagar murders: Two more bodies recovered near Chamundi hills in Mysuru\" data-url=\"https://www.thehindu.com/news/cities/bangalore/rajajinagar-murders-two-more-bodies-recovered-near-chamundi-hills-in-mysuru/article71680991.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"d ">\n                    A view of the house in Rajajinagar where Indushekhar allegedly murdered seven members of his wife’s family.\n                                          | Photo Credit: PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680991\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>In a fresh development in the brutal murder of seven members of a family, Rajajinagar Police have recovered two more bodies, suspected to be those of Shivakumar and his wife Divya — the accused Indushekhar’s brother-in-law and sister-in-law — near the foothills of Chamundi Hills in Mysuru, on Sunday (November 8, 2026).</p><p>Police conducted a spot mahazar of the spot with the accused while recovering the bodies.</p><p>With this development, five bodies have been traced so far in the case, while the search for the remaining two continues.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/cities/bangalore/rajajingar-murders-how-did-the-accused-transport-bodies-across-locations-without-being-intercepted/article71679003.ece\">\n\t\t\t\t\t\t\t\t\t\tRajajingar murders: How did the accused transport bodies across locations without being detected?</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/ciamg2/article71679345.ece/alternates/SQUARE_80/_JAI7256.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAwEBAQEAAAAAAAAAAAAFBgMEBwIAAQgBAQADAQEAAAAAAAAAAAAAAAMBAgQABf/aAAwDAQACEAMQAAAASItiTI5EHP dy": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681073\" data-title=\"UK Hindu family takes legal action after school objects to boy wearing tilak\" data-url=\"https://www.thehindu.com/news/international/uk-hindu-family-takes-legal-action-after-school-objects-to-boy-wearing-tilak/article71681073.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The parents of a nine-year-old boy have approached the UK High Court, alleging religious discrimination after he was prevented from wearing the sacred Tilak-Chandlo to school</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 09:01 pm IST - London</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681073\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The parents of a nine-year-old British Hindu boy, who was withdrawn from his primary school in London after it objected to him wearing a tilak on his forehead, have initiated legal proceedings in the UK High Court.</p><p>The boy, who belongs to the Swaminarayan faith tradition, had attended Vicar’s Green Primary School in west London since 2021 and worn his religious marking, known as the Tilak-Chandlo, without difficulty.</p><p>However, the school objected to the practice in late 2025, triggering a dispute that eventually led his parents to withdraw him from the school and pursue legal action.</p><p>“As parents, it has been heartbreaking to see our son go through this simply because he wanted to practise his faith,” the parents said in a statement released by their legal team this weekend.</p><p>“He had worn his Tilak-Chandlo to school for years without difficulty, and we never imagined that something so sacred to our family would become a source of distress,” they said.</p><p>“Our son was just an ordinary little boy who enjoyed learning and spending time with his friends. His religious marking did not hurt anyone or prevent him from being a good pupil.</p><p>“We have always taught our children to respect every religion, and we simply ask that the same respect be shown to ours. We hope that no other child will have to choose between their education and their faith,” they added.</p><p>The family is represented by Ashray Law, which has filed proceedings alleging religious discrimination under the UK’s Equality Act 2010 and breaches of rights protected by the Human Rights Act 1998.</p><p>The case, filed in the High Court of England and Wales, seeks £25,000 in damages. The proceedings are ongoing, and the allegations remain in dispute.</p><p>“This case goes beyond one child or one school. It raises important questions about religious freedom and equality in British education,” said Ambrish Limbachia, director of Ashray Law.</p><p>“No child should feel compelled to choose between their faith and their education. We hope these proceedings will help clarify the rights of children from all religious backgrounds,” he said.</p><p>The Tilak-Chandlo is a U-shaped marking, usually made with sandalwood paste and a small red circle of kumkum powder in the centre. It symbolises devotion to God and humility among followers of the Swaminarayan faith.</p><p>The family alleges that, after the school objected to the marking, the boy was repeatedly questioned by staff about his religious practice and restricted from participating in certain school activities.</p><p>The school has disputed the allegations of discrimination, maintaining that it acted sensitively, recognised the family’s religious beliefs and offered alternative arrangements, which the parents did not accept.</p><p>Vicar’s Green Primary School has said it values and respects the diverse cultural and religious backgrounds of its community. It said its policy was designed to “promote cohesion, fairness, equality and a shared sense of belonging while preventing division or disruption within the school community”.</p><p>The parents are being supported in their legal challenge by the interfaith initiative Action for Harmony.</p><p>Nitin Palan, head of Action for Harmony, said: “Religious equality must extend to all communities, including Hindu children whose traditions and beliefs are an important part of their identity.</p><p>“Action for Harmony is proud to support this legal action, not to create division, but to promote understanding, fairness and equal treatment for everyone, and we hope this case will help establish an important principle.”</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 09:01 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681073\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/uk-hindu-family-takes-legal-action-after-school-objects-to-boy-wearing-tilak/article71681073.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH <i>The Hindu</i></h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 08:12 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/s7x3n8/article71681032.ece/alternates/LANDSCAPE_1200/India-has-resouG4IFM4P1U.3.jpg.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/s7x3n8/article71681032.ece/alternates/LANDSCAPE_1200/India-has-resouG4IFM4P1U.3.jpg.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/s7x3n8/article71681032.ece/alternates/LANDSCAPE_660/India-has-resouG4IFM4P1U.3.jpg.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/s7x3n8/article71681032.ece/alternates/LANDSCAPE_320/India-has-resouG4IFM4P1U.3.jpg.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Economist Jean Drèze. File\n                                          | Photo Credit: Allen Egenuse J.\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681030\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Economist Jean Drèze on Sunday (November 8, 2026) said an English-language book attributed to him as the author and allegedly found in some public libraries of Tamil Nadu is “fake”.</p><p>The confirmation comes following a media report alleging that a title listed in Madurai’s Kalaignar Centenary Library may not have been authored by Mr. Drèze. The book which lists him as the author was identified as the title ‘<i>Democracy and Peoples Right in the Contemporary World’’.</i></p><p>“I am foxed and baffled to read on social media that a book called <i>Democracy and Peoples Right in the Contemporary World, </i>attributed to me, has surfaced in some public libraries of Tamil Nadu. If this book exists under my name, it must be fake, because I have never authored such a book,” he wrote in a clarification issued to <i>The Hindu</i> via e-mail.</p><p>Mr. Drèze urged the Tamil Nadu government to take “strict and swift action against the publishers of this fake book and other culprits”. “It is important to stem the rot before it spreads, all the more so if this book was AI-generated,” he added.</p><p>The economist also raised questions on procurement checks in place at public libraries and said: “The issue is not just that a fake book was printed but also how it was procured by a public library. Surely it would have taken little effort to ascertain the authenticity of this book.”</p><p>According to the media report, the book in question was allegedly procured from Phoenix Publishers and carries a valid International Standard Book Number. It also further alleged that the address of Phoenix Publishers is the same as that of Akal Vilakku Publishers.</p><p>The procurement date cited in the report is June 25, 2023 before the inauguration of the library. <a href=\"https://www.thehindu.com/news/national/tamil-nadu/chief-minister-inaugurates-kalaignar-centenary-library/article67083968.ece\" target=\"_blank\">Madurai’s Kalaignar Centenary Library was inaugurated</a> on July 15, 2023, by the then Tamil Nadu Chief Minister M.K. Stalin.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 08:08 pm IST</span></p></div><button class=\" col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 7, "title": "Minister Agnimitra Paul says rose water to be used for mist spraying in Kolkata; environmentalist slams move", "section": "Front Page", "page": "", "teaser": "", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/cities/\">\n                        Cities\n                    </a><meta content=\"Cities\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/cities/kolkata/\">\n                        Kolkata\n                    </a><meta content=\"Kolkata\"/><meta content=\"4\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681027\" data-title=\"Minister Agnimitra Paul says rose water to be used for mist spraying in Kolkata; environmentalist slams move\" data-url=\"https://www.thehindu.com/news/cities/kolkata/minister-agnimitra-paul-says-rose-water-to-be-used-for-mist-spraying-in-kolkata-environmentalist-slams-move/article71681027.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 08:02 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/k0u3ml/article71681035.ece/alternates/LANDSCAPE_1200/PTI08_19_2026_000069B.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/k0u3ml/article71681035.ece/alternates/LANDSCAPE_1200/PTI08_19_2026_000069B.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/k0u3ml/article71681035.ece/alternates/LANDSCAPE_660/PTI08_19_2026_000069B.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/k0u3ml/article71681035.ece/alternates/LANDSCAPE_320/PTI08_19_2026_000069B.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    West Bengal Cabinet Minister Agnimitra Paul said the Kolkata Municipal Corporation (KMC) has regularly been spraying water mist at various locations across the city, particularly in areas where the Air Quality Index (AQI) is relatively high. File\n                                          | Photo Credit: PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681027\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>West Bengal Minister Agnimitra Paul says rose water will be mixed into mist spraying on special occasions, while environmentalist Somendra Mohan Ghosh says the city’s air needs cleaning at the source</p><p>West Bengal Municipal Affairs and Urban Development Minister Agnimitra Paul has said that, on special occasions, rose water will be mixed with the water normally used for mist spraying to control air pollution in the city.</p><p>The move drew criticism from an environmentalist, who argued that the city’s air needed to be cleaned at the source rather than through such cosmetic interventions.</p><p>In a Facebook post in Bengali, Ms. Paul said the Kolkata Municipal Corporation (KMC) has regularly been spraying water mist at various locations across the city, particularly in areas where the Air Quality Index (AQI) is relatively high. This was being done under the direction of the State government to control air pollution in Kolkata and make the city’s environment cleaner.</p><p>The initiative is helping reduce the concentration of dust particles in the air and keep AQI levels somewhat under control, she said.</p><p>Alongside these measures, rose water will be mixed with the water used for mist spraying on special occasions and during various festivals, including Kali Puja, she said.</p><p>“This will not only help control dust particles in the air but also spread the pleasant fragrance of rose water throughout the surrounding environment... Our goal is to build a cleaner, fresher and fragrant Kolkata. We will continue our efforts to make the city more habitable,” Ms. Paul said in the post on Saturday (November 7, 2026).</p><p>“A few days ago, during my visit to London, I had observed that the AQI in several areas there was below 10, and in some places, even close to 1. This was truly astonishing. In contrast, Kolkata’s AQI rarely falls below 200 for most of the year,” she said.</p><p>This situation is a matter of concern for the health of all residents, and that is why the authorities are making continuous efforts, within their means, to improve the quality of air in the city, the Minister said.</p><p>Questioning Ms. Paul’s proposal, environmentalist Somendra Mohan Ghosh said on Sunday (November 8, 2026) that the city needs concrete measures to curb air pollution rather than cosmetic interventions.</p><p>“Spraying rose water might make the air smell pleasant temporarily but would do little to address the underlying pollution problem. Rose water won’t fix Kolkata’s air. But clean action will. With due respect to the minister, the fragrance will vanish within two minutes. Kolkata’s air does not need perfume; it needs cleaning at the source,” Mr. Ghosh said.</p><p>Mr. Ghosh also said ageing diesel and petrol vehicles were among the major contributors to PM2.5, PM10 and black carbon emissions. To make the air clean, he urged the authorities to stop the practice of coal-fired cooking stoves at roadside eateries and food stalls, suggesting a transition to cleaner LPG or electric cooking systems, with financial and logistical support for small vendors.</p><p>He further proposed deploying 100 water cannons across the city to wash roads, flyovers and dust-prone corridors, claiming that the measure would help settle suspended dust particles and remove accumulated dust from tree leaves.</p><p>On Sunday afternoon, ahead of Kali Puja and Deepavali, Kolkata’s average AQI stood at 165 (PM2.5), according to a Central Pollution Control Board (CPCB) reading. This reading is described as “Moderate” (101-200) on the CPCB scale.</p><p>However, readings from individual monitoring stations operated by the West Bengal Pollution Control Board (WBPCB) indicated considerable variations in pollution levels across different neighbourhoods in the last few days.</p><p>The AQI had touched 232 on November 7, 2026, in the “Poor” category, with monitoring stations at Jadavpur and Bidhannagar recording particularly high pollution levels. Other monitored locations, including Ballygunge, Fort William, Rabindra Bharati University, Rabindra Sarobar and Victoria, reported moderate air quality.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 08:02 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681027\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/cities/kolkata/minister-agnimitra-paul-says-rose-water-to-be-used-for-mist-spraying-in-kolkata-environmentalist-slams-move/article71681027.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad artic e/alternates/LANDSCAPE_320/PTI11_06_2026_000240A.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Workers move away as a massive fire rages following an explosion at Oil India Limited's (OIL) Intermediate Tank Farm (ITF), in Dibrugarh district, on November 6, 2026.\n                                          | Photo Credit: PTI\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681016\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The toll in the fire incident at an Oil India Ltd (OIL) facility in Assam's Dibrugarh district increased to four with another injured worker succumbing on Sunday (November 8, 2026), while the PSU has suspended all four of its personnel who were in charge of the site, officials said.</p><p>Three people who were also injured in the blaze on Friday (November 6, 2026) are undergoing treatment in a critical condition.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/assam/assam-oil-facility-fire-death-toll-rises-to-three/article71677435.ece\">\n\t\t\t\t\t\t\t\t\t\tAssam OIL facility fire death toll rises to three</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/cjj6ru/article71677489.ece/alternates/SQUARE_80/PTI11_06_2026_000240A.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAADAQEBAQAAAAAAAAAAAAAEBQYDAgcBAQADAQEBAAAAAAAAAAAAAAABAwQCAAX/2gAMAwEAAhADEAAAAGKk9HfAELmN5NpK9hwo59ZGqYG8C1YjsY +PEDzgxvSg6gWBWYP1Vy0ty2lkGVaZIUDcYJ+ajvNaPDKMAdNyPWg7JcRiAztB1TO+DGKtiWBugqV5byeGOlWYkkMoYxMrIzVqdeqxKr4sH35/NXpUXHvFAIMksARK7ATIpHmygTVpK5g74gkxxJrQEVxa0rMYBxjFIf07hvgaiDj+kVYRkYMSVRmmI05OcbcTXaFHaLVkS6KrZHp7jFNfLKoJBCknE8dqI21E01xwIOXBGIPA4oabhbMMw/COIA9ck12kMwtosBVk4PAdabLM3E+1M6KNKCcnh1rst97TKVhlGDBHMZE9KHabbtbdjpZQSTq4RtSFlAtpJKaiVHMwMZ5VenUUnUxncj+KJg21TWynqdh7k+leXv2y92N9P87UrfpLAguRA+zVlv8ADxdYBVK+YTMETRH+nsWwFH/bcmh2u2xV+QOSB0q6rB7nfRcug7ak57cqzrY7nl6VbXUDMyJH3mrx8Nq34nuf8juR8UYZOy2zCJG2rmfr1q2Yxg3wPxXknM8dhQUsXZyGS5+J6j041MgMToUkz4VnnmTNKIEwAOgpTOq4oMHp/JoCFI4f3pQORp+adChDHw0E0NebcdB/FbrZeQ13/c3Jf3okW7SKIB9uQr//xAAhEQACAgICAgMBAAAAAAAAAAABAgADESESMQQTIkFRcf/aAAgBAgEBPwDymU1kd56grONGEnO4xUHUVS6H6gLZ+JmyJw/ZfXxwZ4tuGG+otTA6nodRuMmDLeRUASqpgTnqXec7ZxFtsJ/sbAbBMNqrmewtoTgCSTGsCnJll3LqU15SKoA1P//EAB4RAQACAgMBAQEAAAAAAAAAAAEAAgMRBCExQRIT/9oACAEDAQE/AMIlpqHstivodex6gRPkoTE2avc5eBce7GmbJ/QfIKk46Gy05Fq/kKMwcDG635L0pvrwgdbiPyaYZUqFfkdB3G3XUrsh0T//2Q==\"/></div></div></div><p>All the victims were employees of Spectron Engineering Private Limited, a Mumbai-based company engaged by OIL.</p><p>One person was killed in the fire on the day of the incident, while two died the next day.</p><p>A mechanical helper, Sailen Gogoi, who was undergoing treatment at a private hospital here, died during the day, taking the toll to four, the official said.</p><p>A fire had broken out on November 6 after an explosion during maintenance work at OIL's intermediate tank farm (ITF) in Tengakhat, the public sector undertaking said in a statement.</p><p>An ITF is a facility where petroleum products are temporarily stored in tanks before being transferred for further processing or transportation.</p><p>Meanwhile, OIL has instituted a high-level inquiry to probe into the incident, another official said.</p><p>The committee has put all four OIL employees who were in-charge of the ITF, including three officers, on suspension, he said. \"They were placed under suspension until the investigation is over,\" the official added.</p><p>The PSU has announced an ex-gratia of ₹10 lakh to the next of kin of each deceased, and Rs 5 lakh to each injured person.</p><p>Union minister Sarbananda Sonowal and Chief Minister Himanta Biswa Sarma were closely monitoring the situation, the PSU said on Saturday (November 7, 2026).</p><p>Mr. Sonowal, who is the Lok Sabha MP from Dibrugarh, called OIL CMD Ranjit Rath to take stock of the situation.</p><p>CM Sarma has directed his principal secretary to be in touch with OIL chairman-cum-managing director to ensure the best possible medical care for the injured and adequate compensation for the families of those killed.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 07:21 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681016\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/assam/assam-oil-facility-fire-death-toll-rises-to-four-as-another-injured-dies-four-suspended/article71681016.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" d
