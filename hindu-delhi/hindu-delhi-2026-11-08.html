ustry\n                    </a><meta content=\"Industry\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71680605\" data-title=\"Adani Enterprises plans ₹35,000-40,000 crore annual capex in next two years\" data-url=\"https://www.thehindu.com/business/Industry/adani-enterprises-plans-35000-40000-crore-annual-capex-in-next-two-years/article71680605.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The planned spending comes as the group seeks to scale up businesses built over recent years, including airports and data centres, while bringing its large manufacturing investments closer to commercial operation.</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 12:18 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/533l9s/article71680616.ece/alternates/LANDSCAPE_1200/2026-10-28T090231Z_336130509_RC2H9BA6VGL7_RTRMADP_3_ADANI-ENTR-RESULTS.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/533l9s/article71680616.ece/alternates/LANDSCAPE_1200/2026-10-28T090231Z_336130509_RC2H9BA6VGL7_RTRMADP_3_ADANI-ENTR-RESULTS.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/533l9s/article71680616.ece/alternates/LANDSCAPE_660/2026-10-28T090231Z_336130509_RC2H9BA6VGL7_RTRMADP_3_ADANI-ENTR-RESULTS.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/533l9s/article71680616.ece/alternates/LANDSCAPE_320/2026-10-28T090231Z_336130509_RC2H9BA6VGL7_RTRMADP_3_ADANI-ENTR-RESULTS.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    FILE PHOTO: The logo of the Adani Group is seen on the facade of its Corporate House on the outskirts of Ahmedabad, India, November 21, 2024. REUTERS/Amit Dave/File Photo\n                                          | Photo Credit: AMIT DAVE\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680605\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Adani Enterprises Ltd. plans to spend between ₹35,000 crore and ₹40,000 crore annually over the next couple of years, with airports, data centres and its proposed PVC complex emerging as the biggest investment drivers as the conglomerate steps up expansion across its infrastructure businesses.</p><p>\"We expect to do capex at a run rate of around ₹40,000 crore. So, we may be somewhere in the range of Rs 35,000 crore to Rs 40,000 crore, which is the rate we expect to continue over the next couple of years,\" Manan Vakharia, head of finance at Adani Enterprises, said during the company's earnings call.</p><p>The planned spending comes as the group seeks to scale up businesses built over recent years, including airports and data centres, while bringing its large manufacturing investments closer to commercial operation.</p><p>\"The heavy lifting will be done by airports, data centres and PVC,\" Mr. Vakharia said.</p><p>Adani Enterprises, the flagship incubator of the Adani Group, reported its highest-ever half-year EBITDA of ₹11,958 crore for the six months ended September 2026, an increase of 56% from a year earlier.</p><p>Consolidated income rose 62% to Rs 71,569 crore, while profit before tax from continuing operations increased 45 per cent to Rs 3,297 crore.</p><p>Chief Executive Officer Arun Bansal said the company was progressively moving from a \"build-out phase to value realisation phase\", as investments made over the past few years begin contributing more meaningfully to earnings.</p><p>The airport business and data centres are central to that transition. Adani Airport Holdings reported a 52% increase in first-half EBITDA to ₹3,275 crore, while AdaniConneX, its data-centre joint venture, has expanded its contracted capacity to more than 1.2 gigawatts.</p><p>AdaniConneX signed a new 240-megawatt hyperscale contract during the September quarter. Its operational capacity stood at 94.6 MW after handing over an additional 29.2 MW to customers during the period.</p><p>The company expects operational capacity to reach 120-150 MW by the end of the current financial year and approach 500 MW over the following 12-18 months, when the facilities are expected to begin generating billing revenue.</p><p>Of the 1.4 GW of data-centre capacity being developed, 1.2 GW has already been tied up and is at different stages of implementation and construction, its management said.</p><p>The airport portfolio, which comprises eight airports, including Navi Mumbai International Airport, accounts for about 23% of India's passenger traffic and 29% of its air cargo volumes, according to the company officials.</p><p>Adani Airport Holdings handled 21.3 million passengers in the September quarter. Its revenue rose 20% year-on-year to ₹3,786 crore, while EBITDA increased 55% to ₹1,641 crore. Non-aeronautical revenue grew 57%, significantly faster than the 9% increase in aeronautical revenue.</p><p>Navi Mumbai International Airport began international operations on July 15.</p><p>The Management expects the airport to reach its full annual capacity of 20 million passengers by the end of FY28, supported by the expansion of domestic and international routes and the transfer of some international flights from existing Mumbai airports.</p><p>The company's other major investment is a 1-million-tonne-per-annum PVC manufacturing complex at Mundra, Gujarat, involving capital expenditure of about ₹26,000 crore.</p><p>Around 60% of the project spending and construction has been completed, and the first part of the complex is expected to be commissioned in the next financial year. The facility will also include related chemicals and chlor-alkali operations.</p><p>Separately, Adani Enterprises has completed the expansion of its solar module manufacturing capacity to 10 GW and expects to commission 6 GW of solar cell capacity by the end of the current financial year. The company sold 1,478 MW of solar modules in the September quarter, up 35% from a year earlier.</p><p>The proposed investment cycle will require the company to balance expansion with project execution and the generation of returns from newly commissioned assets.</p><p>Management did not provide a specific EBITDA forecast for FY27. PTI ANZ BAL</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 12:18 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680605\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/adani-enterprises-plans-35000-40000-crore-annual-capex-in-next-two-years/article71680605.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: Th s and increased crude inventories to about 39 days, from its usual 33-35 days. It was also holding 20 days of LPG inventory and 23-25 days of petrol and diesel stocks.</p><p>IOC reported a net profit of ₹21,630 crore in the September quarter, compared with a loss of ₹2,661 crore in the preceding quarter and a profit of ₹7,610 crore in the year-earlier period. The company said inventory gains and improved performance across several businesses contributed to its profitability.</p><p>It recorded a gross refining margin of $18.52 per barrel, excluding the impact of the special additional excise duty, and an inventory gain of $6,948 crore during the quarter.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/Economy/crude-oil-prices-very-volatile-in-q2-carried-both-discounts-premium-at-varying-intervals-iocl-official/article71650317.ece\">\n\t\t\t\t\t\t\t\t\t\tIOC says crude Q2 price volatile as procurement swings between discounts and premiums</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/t9f3bb/article71650425.ece/alternates/SQUARE_80/iStock-1466744855.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAACAwEBAQAAAAAAAAAAAAAFBgMEBwIBAAEBAQEBAQEAAAAAAAAAAAAAAwQCBQYB/9oADAMBAAIQAxAAAABQ8kg9j43qyR9gu4HHHiajKo9hopjK/HxWca2y5bpE6D5q+k8zpQxz18pDUt0tnUXT608qmYBM3xGjo9AFAGsfHGwakx8tOmB30I01jRUB9nr8gUK7AyhSsBVUyUMqTUBZEc07GNP5EFIAbzDZIy7DhOkHp2ihqg/1DgFvH//EADsQAAEDAwEEBwQIBgMAAAAAAAECAxEABAUhBhIxQQcTUWFxgaEUIiORFTJCUmKxwdEzgqLC4fCSw/H/2gAIAQEAAT8AIrdpSkIHvqCfE1j7U3zvuhSWUqAUvd4mRoJ56+U9pAra 906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Kishore Biyani’s Future Group witnessed meteoric rise before mounting financial troubles pushed it into insolvency</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:39 am IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/4so72/article71677487.ece/alternates/LANDSCAPE_1200/IMG_wp-bmfgi-bmfgiGLP925_2_1_1P9E0J24.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/4so72/article71677487.ece/alternates/LANDSCAPE_1200/IMG_wp-bmfgi-bmfgiGLP925_2_1_1P9E0J24.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/4so72/article71677487.ece/alternates/LANDSCAPE_660/IMG_wp-bmfgi-bmfgiGLP925_2_1_1P9E0J24.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/4so72/article71677487.ece/alternates/LANDSCAPE_320/IMG_wp-bmfgi-bmfgiGLP925_2_1_1P9E0J24.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Kishore Biyani. File\n                                          | Photo Credit: The Hindu\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71677462\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The Central Bureau of Investigation’s (CBI) recent charges against <a href=\"https://www.thehindubusinessline.com/companies/how-retail-raja-biyani-lost-his-crown/article62188132.ece\" target=\"_blank\">Future Retail Limited (FRL) promoters Kishore Biyani</a> and others, for allegedly <a href=\"https://www.thehindu.com/business/Industry/cbi-books-future-retail-kishore-biyani-others-in-904-crore-bank-fraud-case-searches-conducted-in-mumbai/article71675017.ece\" target=\"_self\">defrauding the State Bank of India (SBI) of ₹904.32 crore</a>, has turned the spotlight again on the beleaguered leaders. Hailed as an industry leader in driving India’s consumption in retail sector, Mr. Biyani’s leadership steered Future Group’s meteoric rise before mounting financial troubles pushed it into insolvency.</p><p>Amid such complexities, Mr. Biyani’s role as FRL’s promoter was marred by a complex legal battle between Amazon and Reliance in 2022. After Reliance backed out of the deal running into thousands of crores, Future Retail had no option but to file for liquidation before the National Company Law Tribunal (NCLT) in 2023.</p><h4 class=\"sub_head\">The story so far</h4><p>The CBI conducted searches at multiple premises linked to the company’s promoters and directors in Mumbai on Friday (November 6, 2026), and seized documents relevant to the investigation. The case was registered following a complaint filed by SBI’s Stressed Assets Management Branch-III in Mumbai.</p><p>The bank alleged that the company failed to utilise the sanctioned funds in accordance with the terms and conditions of the loan facilities. Instead, portions of the funds were allegedly diverted to associate companies and related entities, raising suspicions of financial irregularities.</p><h4 class=\"sub_head\">Failed decisions</h4><p>During the mid- to late-2000s, <a href=\"https://www.thehindu.com/business/at-the-end-of-the-road-the-status-of-the-future-group/article65360298.ece\" target=\"_self\">Future Group</a> was firmly established as the country’s largest retailer and dubbed a “hypergrowth” company that would easily ride India’s consumption boom for years to come, as per a <i>The Hindu Businessline </i>report. At the time, Mr. Biyani felt a few more years of protection from foreign competition would allow Indian retailers to grow much bigger and command better valuations when FDI came in.</p><p class=\"referpara\"><strong>\n        Read More : <b><a href=\"https://www.thehindubusinessline.com/companies/how-wrong-choices-led-to-the-dismantling-of-future-groups-retail-empire/article65229966.ece\" target=\"_blank\">How wrong choices led to the dismantling of Future Group’s retail empire</a></b></strong></p><p>However, according to the <i>Businessline </i>report, if the Future Group had pushed for FDI reforms, it would have attracted several global suitors. A series of partnerships with global firms may have infused cash to sustain further in the market. As e-commerce businesses quickly gained traction, Mr. Biyani struggled with his retail business.</p><p>Doubtful about the financial sustainability of the prevailing e-commerce model, Mr. Biyani opted instead to open hundreds of new small-format supermarkets. By 2015, Future took a leap and operated 218 Bazaar stores, proposing that stores within a two-kilometre radius of every neighbourhood in cities would cater to the consumer’s needs better than e-commerce giants.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/Industry/future-retail-files-caveat-before-delhi-high-court-against-any-early-move-by-amazon/article33012712.ece\">\n\t\t\t\t\t\t\t\t\t\tFuture Retail files caveat before Delhi High Court against any early move by Amazon </a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/business/Industry/qw6gz0/article31979014.ece/alternates/SQUARE_80/THNAKFUTURERETAIL-MampAAMAZONCOM\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAwEBAQAAAAAAAAAAAAAEBQIDBgEHAAEAAwEBAQEAAAAAAAAAAAAAAgMEBQEABv/aAAwDAQACEAMQAAAAJ71t87ur53VD21fWR3w4bRSJBUMAWr9CAHpQbEW4A+ZE1I2sVrBOiQUDgnr2DqoDs0sjq8hrNTO81J2ZGhEpQ63DZejUJKqalneHECG3WFptk39OJzt8XqKpD2Wno14UN2g7RAPUDSyF8TdlmJX5+hnnXOZqmVfUJd//xAAuEAACAQQBAwIFAwUBAAAAAAABAgMABBESIRMiMUFRBRQjMnFCYaEVJFJikYH/2gAIAQEAAT8BaW86fdBGU8M0bkFaRLm3kP0ZZY8kh9gSagnhJackxM4xrL2nj9qabLKwKagdxLeOauHhaFyDuvrp3V8g1su63EsijnR2zRuXmQlbaRSG/WQKEMVwGEiZIbg01qgi5L7L67GihbDxSEZPGeRUV5ayQlFnQkn0PNJdQhNevHsOMbCmj2lLPpLE2e3XP81HFBE4eCHCynDL4FPJZG6Yxxr1sakrSvNcgI/ReA8NwQfxipbiFFMaSKWHAXbn8UY0L90ZDDy3jPNSQK+0si8qeOfIrDB8iV8PyvAwtLFGFOI0Hr9tQwRT/UltFVxkDbmp4mKdGCQQnYYwB4/FSRTW1rIxuNgvsuCKs71orzS3tnJkb0qyu5ry4lDCSDjfOfarl45EynTc5HhhTQpNExkTZgcA0em0cMjnHb3asadWU43ZgeBzjFLb3QPPxCXXxjAq4ac3KpBdGPK/aQKWLp/WfE06jhsAH8V86b3aPoMn+WWBxQZkuHQzmEjxzivhJHzFw5n3AARSeck0lvDbwZEaZ55VfNOEdgGiPk95oxRJIHVAKlQbAdzL/sc0s08QIaGSb12XApLgOvWa3ZceARlqjuUuG6aiUEMM5XX+abpiHDIFr4x8MupZwdYCo+0oCpr4DYXVvIzNhYmHcjLyT71c2Vsm0wjVWHLHH812tFIHUHDnGaltU6ihS6784VsY4qSNOlrySG42NRyNJGhZdDk8ZpSRIZAxPGNakuG60S8alu6lQGLBIwfTNACWExuORxVvL1Ylbw68GlzNLPH+2OakRRcSI8YLZwc1Imow7s5zwdqcRoEbAB loyalty programmes.</p><h4 class=\"sub_head\">Amazon-Reliance Imbroglio</h4><p>The company recorded staggering losses during the Covid-19 pandemic due to rising logistical price, warehouse management, and rent dues. Amid this, Reliance Retail Ventures Ltd’s (RRVL) announced the acquisition of Future Group’s retail, wholesale, logistics and warehousing businesses. As per an announcement made in August 2020, entities of Reliance were to acquire retail and warehousing assets of the Future Group for ₹24,713 crore. Alongside, Reliance was to invest a further ₹2,800 crore in Future Enterprises for a 13% stake.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/49-players-including-reliance-adani-jindal-power-show-interest-in-future-retail/article66721083.ece\">\n\t\t\t\t\t\t\t\t\t\t49 players including Reliance, Adani &amp; Jindal Power show interest in Future Retail</a></div><div class=\"picture\"></div></div></div><p>This was vehemently opposed by U.S.-based e-commerce major Amazon, claiming that it violated contractual arrangements made when it invested in Future Group’s promoter entity in 2019.</p><p>Unfortunately, the deal with Reliance fell apart later after <a href=\"https://www.thehindu.com/business/Industry/reliance-calls-off-24731-crore-deal-with-future-retail/article65347874.ece\" target=\"_self\">secured creditors of the Future Group cited legal challenges</a> to the proposed transaction and the lack of clarity over the outlook for the deal.</p><p class=\"referpara\"><strong>\n        Also Read : <b><a href=\"https://www.thehindu.com/business/Industry/reliance-takes-control-of-about-200-future-retail-stores-offers-jobs-to-staff/article65088003.ece\" target=\"_blank\">Reliance takes control of about 200 Future Retail stores, offers jobs to staff</a></b></strong></p><p>However, amid the legal battle between Amazon and Future Group, landlords of a large number of stores had reportedly approached Reliance to get the lease agreements transferred to its (Reliance) name as Future was unable to pay the rents. The Reliance arm took over the stores. But the Future Group termed that it was a “hostile takeover by Reliance to acquire the assets by not paying the agreed-upon amount”.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:39 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71677462\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/kishore-biyani-future-retail-cbi-defrauding-charges-reliance-amazon-deal/article71677462.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /2 pan><a class=\"txt\" href=\"https://www.thehindu.com/tag/809-808-684/\">\n                        money and monetary policy\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/1349/\">\n                        politics\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/842-833-684/\">\n                        currency values\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/1385-1349/\">\n                        government\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 13, "title": "Live-in relationships in India: Is marriage still the endgame?", "section": "Opinion", "page": "", "teaser": "Is living together a sensible test-drive for marriage, or the perfect arrangement for those who’d rather not commit?/for print: For some, a live-in is a step towards marriage. For others, it is a way to avoid it", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/opinion/\">\n                        Opinion\n                    </a><meta content=\"Opinion\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/opinion/columns/\">\n                        Columns\n                    </a><meta content=\"Columns\"/><meta content=\"3\"/></li><li aria-current=\"page\" class=\"breadcrumb-item kicker\"><span class=\"kicker-outline\">The naked truth</span></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71669024\" data-title=\"Live-in relationships in India: Is marriage still the endgame?\" data-url=\"https://www.thehindu.com/opinion/columns/live-in-relationships-in-india-is-marriage-still-the-endgame/article71669024.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Is living together a sensible test-drive for marriage, or the perfect arrangement for those who’d rather not commit?</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 12:40 pm IST </span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/barry-rodgers-20402/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/barry-rodgers-20402/\">Barry Rodgers</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/vdna8o/article71669035.ece/alternates/LANDSCAPE_1200/iStock-1560606216.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/vdna8o/article71669035.ece/alternates/LANDSCAPE_1200/iStock-1560606216.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/vdna8o/article71669035.ece/alternates/LANDSCAPE_660/iStock-1560606216.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/vdna8o/article71669035.ece/alternates/LANDSCAPE_320/iStock-1560606216.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Sharing a home isn’t as easy as it seems\n                                          | Photo Credit: gorodenkoff\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71669024\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>“Test-drive the car before you put down a deposit,” my mother has always said. It sounds oddly progressive coming from someone of her generation, but she has long believed that living together before marriage is  sensible . If it does not work out, you go your separate ways. At least you’ve tried, she says, without the added complications of divorce, dividing property and untangling two lives legally. Of course, she also thinks it can be an easy escape for men who want the comforts of a relationship without committing all the way.</p><p>It is an argument that captures the peculiar place live-in relationships occupy in India: they are simultaneously a sensible experiment, depending on whom you ask, and a convenient arrangement that lets one partner indefinitely postpone the question of marriage.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 07, 2026 12:25 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71669024\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/opinion/columns/live-in-relationships-in-india-is-marriage-still-the-endgame/article71669024.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu  30, had already created history by becoming the first-ever all-Indian pair to reach the final of a WTA Tour event</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 10:30 pm IST - Chennai</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/nihit-sachdeva-25194/\">Nihit Sachdeva</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/zbqiso/article71681149.ece/alternates/LANDSCAPE_1200/0J6A8182.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/zbqiso/article71681149.ece/alternates/LANDSCAPE_1200/0J6A8182.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/zbqiso/article71681149.ece/alternates/LANDSCAPE_660/0J6A8182.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/zbqiso/article71681149.ece/alternates/LANDSCAPE_320/0J6A8182.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Vaishnavi Adkar and Rutuja Bhosale with Swiss duo of Simona Waltert and Naima Karamoko.\n                                          | Photo Credit: Ragu R.\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681151\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The dream run of Vaishnavi Adkar and Rutuja Bhosale ended in a runner-up finish at the WTA 250 Chennai Open on Sunday (November 8, 2026) as the home favourites went down 2-6, 0-6 to the Swiss duo of Simona Waltert and Naima Karamoko in the final.</p><p>Vaishnavi, 21, and Rutuja, 30, had already created history by becoming the first-ever all-Indian pair to reach the final of a WTA Tour event. They were looking to join former World No. 1 Sania Mirza and Ankita Raina on the list of Indian titlists at this level.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sport/adkar-bhosale-become-first-all-indian-pair-to-reach-wta-tour-doubles-final/article71678367.ece\">\n\t\t\t\t\t\t\t\t\t\tAdkar-Bhosale become first all-Indian pair to reach WTA Tour doubles final</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/pnkcbr/article71678396.ece/alternates/SQUARE_80/DSC_0168.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAABBQEBAAAAAAAAAAAAAAAFAQIDBAcABgEAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAAA84/QH1ZM/bozmZfb0RwZt2k9JZ3FpXJ23vfxbxgwoNv1ehWSTPlgSwoV+sU2eJlhf63Ic87FFyumSVidbmSIxAk6NASS1SovE6d44dRfYVJ9mOBCVJxh7lZK8VWz3mnhelH2oSiOjL0RXxJoD4RwVP8A/8QAPRAAAQIEAwUFAwgLAAAAAAAAAQIDAAQFERIhUQYTMUFhFCJxgZEyodEVI0RScpOx0hckQ1Rzg4SUweHw/9oACAEBAAE/ABR6tcfMy1v4qvywKPVebMt96r8sKo9SA7jLKvFwj/BgUirEZyrA/nn8sGh1Z5xt1ck1dCrpCn8xy0j5InyhSkS1jiICFrAyvxvHyVVx9BR/cD4QKVVrZyCPKYT8Ibo9QIVvGEoIHdG8Cr9OkGl1X9wB/qEwmVGkCVGkJlAcsPugylsin3QJUaCOyjSOyi3COyjSOyjSOzDSAzAaFuEVuUW9RJpDbymCUjE4g2ITiBVbyuI2VStZnwC2GELQlLbaVBKVWuSMWoI9NY3XSN10jc5cIDPSNzlwgNXMBxk/tmfvU/GErb5OtfeJ+MSbK9oKlPBatzIymJhpZOS3ikgqvzsD74VLS2wVEXu5hEzMTMxZwA3SjCkqyHIkc/CGXEvsNupIwuICh3hwIvGAkEgd0c7i0AeHqIt4eoix094iovrlW2ikhCFqwrdIuEaeFzlc5esX6D0hvCVpukWxC+UUirScvsy467NFthiccYJUAF , kept things solid from the baseline.</p><p>Karamoko won her maiden Tour-level title while for Waltert, it was her second after the triumph in Lausanne in 2021 with compatriot Susan Bandecchi.</p><p>“We played together for the first time and won the title, so it couldn’t be better. I really hope we can play some more weeks together and we’ll try to enjoy this one as long as possible,” said the 29-year-old Karamoko.</p><p>“It’s amazing to win a title and to actually finish the last tournament of the season like this. We  played at a great level throughout the week. We got used to each other a bit more and yes, it was a really fun game to spend the week together and I’m looking forward to many more matches with Naima,” added Waltert.</p><p>The doubles final began at 4 p.m. but the Deepavali fireworks had already started. Playing in such an atmosphere was a challenge for the Swiss duo. “Actually, we have never played in such a situation. You can still hear them (the fireworks) now. It was a bit disturbing at the beginning of the week and now, we almost don’t hear them anymore,” said Karamoko.</p><p>“They (the organisers) also told us that it’s going to be the worst today (in terms of fireworks). So, we were also prepared and that’s how we adapted and dealt with it,” added the 25-year-old Waltert.</p><p>Champions Karamoko and Waltert received USD 13,600 while runners-up Vaishnavi and Rutuja earned USD 7,650 in prize money. Aadhav Arjuna, Tamil Nadu’s Minister for Public Works and Sports Development, presented the two pairs with their respective trophies.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:29 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681151\" data-coral-notext=\"true\" data-coral-url= d=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 15, "title": "P.T. Usha complains to IOA electoral officer over WhatsApp campaign for SOM polls", "section": "Sport", "page": "", "teaser": "The Indian Olympic Association president alleged former archer Dola Banerjee violated the Model Code of Conduct by circulating a WhatsApp message seeking votes for four candidates ahead of Monday’s election", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681125\" data-title=\"P.T. Usha complains to IOA electoral officer over WhatsApp campaign for SOM polls\" data-url=\"https://www.thehindu.com/sport/pt-usha-complains-to-ioa-electoral-officer-over-whatsapp-campaign-for-som-polls/article71681125.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Indian Olympic Association president alleged former archer Dola Banerjee violated the Model Code of Conduct by circulating a WhatsApp message seeking votes for four candidates ahead of Monday’s election</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:10 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic lead-img-verticle\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/97to0e/article71681131.ece/alternates/FREE_1200/image%207.jpeg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/97to0e/article71681131.ece/alternates/FREE_1200/image%207.jpeg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/97to0e/article71681131.ece/alternates/FREE_1200/image%207.jpeg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/97to0e/article71681131.ece/alternates/FREE_1200/image%207.jpeg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Usha objected to a WhatsApp message circulated through an account bearing Banerjee’s name, seeking support for the ‘New Bharat Panel’ and asking voters to elect four named candidates, along with their ballot serial numbers and roll numbers. File\n                                          | Photo Credit: The Hindu\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681125\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Indian Olympic Association (IOA) president P.T. Usha has lodged a complaint with the Electoral Officer alleging that former archer Dola Banerjee violated the Model Code of Conduct by circulating a WhatsApp message soliciting votes for a panel of four candidates in Monday’s (November 9, 2026) Sportspersons of Outstanding Merit (SOM) elections.</p><p>In her complaint, Usha objected to a WhatsApp message circulated through an account bearing Banerjee’s name, seeking support for the ‘New Bharat Panel’ and asking voters to elect four named candidates, along with their ballot serial numbers and roll numbers.</p><p>Usha cited Clause 1.9 of the Model Code of Conduct, issued on October 30, 2026, which states that the promotion of a candidate shall exclude any form of publicity, including the use of new media or social networks. She contended that the circulation of the message amounted to targeted solicitation of votes through social media, and appeared to fall within the ambit of the clause. The complaint also referred to Clauses 1.2 and 1.3, which require candidates to conduct their campaigns fairly, with dignity and moderation, and to show due respect to other candidates.</p><p>Usha has urged the election authorities to examine the communication, establish the circumstances under which it was created and circulated, and seek an explanation from the persons concerned. She has also sought appropriate action under the applicable election rules if a violation is established, along with directions to ensure a level playing field for all candidates.</p><p>With polling scheduled from 9 a.m. to 5 p.m. on November 9, 2026, Usha has sought urgent intervention and a decision before voting begins. A screenshot of the WhatsApp message and a copy of the Model Code of Conduct were enclosed with the complaint.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:10 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681125\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/pt-usha-complains-to-ioa-electoral-officer-over-whatsapp-campaign-for-som-polls/article71681125.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publ -lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">India were bowled out for a modest 208 and Pakistan, after a top-order wobble, managed to complete the chase, with Hamza Zahoor taking the team home with an excellent, unbeaten 100 off 108 balls after coming in at number seven</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 07:13 pm IST - Al Amerat (Oman)</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/2w49zi/article71681019.ece/alternates/LANDSCAPE_1200/arjun%20rajput.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/2w49zi/article71681019.ece/alternates/LANDSCAPE_1200/arjun%20rajput.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/2w49zi/article71681019.ece/alternates/LANDSCAPE_660/arjun%20rajput.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/2w49zi/article71681019.ece/alternates/LANDSCAPE_320/arjun%20rajput.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Arjun Rajput top-scored for India with an aggressive 107 off 85 balls, and his knock included 11 fours and five sixes. File\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680996\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Pakistan defeated India by three wickets in their men's U-19 Asia Cup match in Oman on Sunday (November 8, 2026).</p><p>India were bowled out for a modest 208 and Pakistan, after a top-order wobble, managed to complete the chase, with Hamza Zahoor taking the team home with an excellent, unbeaten 100 off 108 balls after coming in at number seven.</p><p>Earlier, Arjun Rajput top-scored for India with an aggressive 107 off 85 balls, and his knock included 11 fours and five sixes. Both Aryavir Sehwag (22) and Anvay Dravid (10) were dismissed cheaply.</p><p>Manal Chauhan picked up 3/32 in 10 overs for India.</p><h4 class=\"sub_head\">Brief scores:</h4><p>India U-19: 208 in 46.3 overs (Arjun Rajput 107, Ali Raza 3/37).</p><p>Pakistan U-19: 209/7 in 48.1 overs (Hamza Zahoor 100 not out; Manal Chauhan 3/32).</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 06:52 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680996\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/pakistan-beat-india-by-three-wickets-in-u-19-asia-cup/article71680996.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div> DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">‘I've been contacted by presidents and international department officials from eight countries, including some outside Asia,’ said Japan Football Association Honorary President Kozo Tashima</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 05:06 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\">Reuters</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/gt2wgz/article71680900.ece/alternates/LANDSCAPE_1200/2026-11-05T130135Z_1464987174_RC2TCX9KCPJU_RTRMADP_3_SOCCER-FIFA-TASHIMA.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/gt2wgz/article71680900.ece/alternates/LANDSCAPE_1200/2026-11-05T130135Z_1464987174_RC2TCX9KCPJU_RTRMADP_3_SOCCER-FIFA-TASHIMA.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/gt2wgz/article71680900.ece/alternates/LANDSCAPE_660/2026-11-05T130135Z_1464987174_RC2TCX9KCPJU_RTRMADP_3_SOCCER-FIFA-TASHIMA.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/gt2wgz/article71680900.ece/alternates/LANDSCAPE_320/2026-11-05T130135Z_1464987174_RC2TCX9KCPJU_RTRMADP_3_SOCCER-FIFA-TASHIMA.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Japanese national team's head coach Hajime Moriyasu and Japan Football Association President Kozo Tashima. File\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680897\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Japan Football Association Honorary President Kozo Tashima said governance was FIFA's biggest problem as he outlined his ​platform for next year's presidential election, while rating his chances of ‌unseating incumbent <a href=\"https://www.thehindu.com/sport/football/gianni-infantino-the-master-of-ceremonies/article66220054.ece\" target=\"_self\">Gianni Infantino</a> at 20% to 30%.</p><p class=\"referpara\"><strong><b>Also read | </b><a href=\"https://www.thehindu.com/sport/football/infantino-says-hes-supported-by-vast-vast-majority-of-football-ahead-of-fifa-elections/article71620231.ece\" target=\"_blank\">Infantino says he’s supported by ‘vast, vast majority’ of football ahead of FIFA elections</a></strong></p><p>Mr. Tashima ​announced on Thursday (November 5, 2026) that he intended to run ⁠in the March election, becoming the first Japanese candidate to seek world football's top job.</p><p>The 68-year-old former Japan international has served on ‌the FIFA Council since 2015 and became JFA president the following year before being succeeded by Tsuneyasu ‌Miyamoto in 2024.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sport/football/gianni-infantino-to-run-for-re-election-despite-failed-world-cup-sell-off-plan/article71437504.ece\">\n\t\t\t\t\t\t\t\t\t\tGianni Infantino to run for re-election despite failed World Cup sell-off plan</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/pausx/article71437521.ece/alternates/SQUARE_80/2026-09-05T183242Z_1192062122_UP1EM951FIH8Q_RTRMADP_3_SOCCER-WORLDCUPU20-POL-ARG.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAACAwEBAQAAAAAAAAAAAAAFBgMEBwIBAAEAAwEBAQAAAAAAAAAAAAAAAAECBAMF/9oADAMBAAIQAxAAAADNzo3Rc7DKrpbVowO9Xeevao3OgSjGRMatBxzac3oZ+0QQGjP4Pa/XyJfIuLUnHvo4NCR2d9NKGiaU6l7lbqdsb0IG6KTnfDFOhKMAy/SyLTmzu0hRd+Q/CI74HAQInFL03o7fpsHyEViDqT4oPdaSjDsaOj//xAA2EAACAQMDAgMFBgUFAAAAAAABAgMEBREAEiEGMRNBUQciYXGBFCMyQpHBJFKhseEzgqLR8P/aAAgBAQABPwBJcsCfcBHDgef66t1qul8k8OgpGkWPO+fhEBx5t2HPx1UdJdR0lkqRDRR1qyYM0lHN4rYHYMoOeO/bT1pzCkixiSJcKNmORwB8frqouMlXDLLUBRKcAMqYwNVDZkz68nUTMGJOSOMYGp5GkjEjBQG7ca6cic1RmMW6NQSz+S/Q8E5x31dqSK2usKzJLMx3vKje6wPI48j9ddP20X2+UtucsUYlpCOCqKMk/M9vrq5STR0yUNGPs9JEMLDFwANWi611luK1NLMwcd89mHofXXWlFQ3WnpuqqVId7YW5xxKPcfybHxzgn5arTHPVyPDG0VP2UFh/46ngQQrtkJYjOwD+51u8Mr7g3A9tNE6xQyZEgZQzJnG3JP8A1pato1ZIywLckDtxrcpUg4YtyTr2eSiHqoSvuYfZ5A2PIkDGrjBsZmC5yM6qYpEqEWNskt948hJJ+Q7Aat1FS1Vtr6WWragmqaVqZCTlZHJBUkeTAjB8sEHg51LvaIrJP954mFRscH4+mnLqoiyrHOSy+fw1uQg5ycHsv76nqd+U3HaTnjtnGNECBEfxW3kHAA7fXSsW/bOrJcjbLilS5YRnKOFGTg+Y+I4OrTUC5WxH8RZo+VWZOVcfD9/jq+UZgmXwaffzz723nVut89clTVcxQ24ConhJ3NsHdgcYGOe5ydM6LTqzNu8R9+4gZ8+NeIxj/CcZwMeeuF4KjOeQe+t3LBcYBznOmcjwyrZIGe2vdMqMTsG7naO2g+wmTzzkY8tezW5z4r6Ryxj4mXJ7MSQf14/TVV4U0LGZAykcnOqO30cYp1nmlho7xM9vMcUpVmVo2O8n0yAMfPV06fttuvstrnu0lKYjxLUQblAI7Hae/oRwR6agtFkLlZOpYEx2/hnwfkQdTdE3Kqtr3Ky1FHdaRPxfZWIkX4FGAOfhydW6wVFdC02Y0VZNrAtzx8tM0eAjFF2kjfnOP8aaVA21W3AHOcjk6qqCWgd6eqbwpx3hBDEfMg4GvZ9JSTdSJaqp5I1rYsJNG2GjlU7kI/qMHg51derbRZr5Lba6okr4YWw7U0OPe/lOWwfjj5a9pF1irrNbZqIyxiOcMuUKFDtJGP8AGq+5Vdxq5KqrmMlRKcySHuxwB+vGt59dWO8NZ7nDV+DFUKjZaKYFkYYIPHrg9+40OrbndLIa7p+ihWSmQmro1jB2gH8UYB3EBcZJA57Z1H7T7ov4qKhf5w6HtPd/9fp+0yjzzDoysX79zzrpqV4+p6B0LbyxC475xq+VNFF7QDII0aljqEVlxgEjAJ/X+2vaGip01Tds/al5Hn7raMjhGQMdh5K+WgDo6st7uFhrkrLdUvDKp/KeG+BHmNVd1sPVbs9wtj0N4lOBVUDKkUjH80qMcd+5XH11cejr7ayploZJYZF3RywfeKw9fdzr8x9dWKRouoLcyfiMu0fXjV1YyXSsYnJM78/7jrrKqep6NskhIPilWY/Hw/8AJ0edZGjrBx6DSg9+w1FWVEZIjkZARyVOC2O2T3Py7auVBNa7rU0M+PFp5DG205BI8x8NUcng3Cil/kmQ/wBdV+Tcqk+szn/kdXev8fpOw02eYxIT9CFGiedGpc0/gqkaoQAdqDJ+Z+mguTj9dU9vV6ZZC0e5hxuPbVRSTR4TaGZjwUHGhTsHKjnAxr2n2oUnUMVdGPuq2FW7fnX3W/Y/XRJ258xz+mqhg9TK/qxOnlZoY0J4jBCj5nOgudDk8aVckAeZ1a+kJLjRUUkMj5qqmSm4AxHtGdxzyRjnj0OqroSmntkYp4aOnq5iqxu6shGT3wGIPAPHx8tXywSWWKmqI62mrYKneI5oNwwVOGBB1//EAB4RAAICAgIDAAAAAAAAAAAAAAABAhEDIRASMUFR/9oACAECAQE/AGklbNUQSj4GvZRluyLbI8yxOUWjDha3I6x+HRHRfRPZenzpj0+KTE0vJa9H/8QAIBEAAQQBBAMAAAAAAAAAAAAAAQACAxIhBBARMSAwYf/aAAgBAwEBPwCGEyFTacsyOvDS1pjtSBtSCiuNonUeHKaYEVauEQs+k/ECv//Z\"/></div></div></div><p>\"I've received many messages saying, 'Thank you for ‌speaking ⁠out'...,\" Tashima told Japanese daily <i>Sports Nippon </i>in ⁠an interview published on Sunday (November 8).</p><p>\"I've been contacted by presidents and international department officials from eight countries, including some outside Asia.</p><p>\"While I haven't received any formal ​endorsements yet, I'm getting ‌a positive response. Since time is short and I don't want to be held up by incomplete paperwork, I want to secure support from at least six associations.\"</p><p>Tashima ‌requires nominations from five national associations, a prerequisite for ​standing in the election.</p><p>Candidates have until November 18 to submit nominations for the election, in which ⁠Infantino is seeking a fourth term as head of world football’s governing body.</p><p>Infantino came under scrutiny in July after an unsuccessful ‌attempt to bring private investors into a new FIFA commercial entity holding rights linked to competitions including the World Cup.</p><p>Despite the criticism, Infantino's candidacy received a significant boost in October when the head of Asian football publicly endorsed him, while support from several FIFA confederations has left him well ‌placed among the organisation's 211 member associations.</p><p>\"I'll keep what's good and ​change what's bad...,\" Tashima added. \"The biggest problem, however, remains governance...</p><p>\"Selflessness is my motto... At this stage, I ⁠think my chances of winning are about 20% to 30%, but ⁠as the campaign progresses, I want to raise my confidence to 40% or 50%. I truly want ‌to change FIFA.\"</p><p>Former Tottenham Hotspur defender Ramon Vega was the first candidate to publicly declare his intention to challenge ​fellow Swiss Infantino last month.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 05:06 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680897\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/football/japans-tashima-rates-fifa-election-chances-at-20-30-in-challenge-to-infantino/article71680897.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display:  21-12, 15-21, 21-16 in the final in Yeosu to extend an unbeaten run that stretches back to March", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li><li aria-current=\"page\" class=\"breadcrumb-item kicker\"><span class=\"kicker-outline\">Badminton</span></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71680734\" data-title=\"An wins Korea Open for 11th badminton title of year\" data-url=\"https://www.thehindu.com/sport/an-wins-korea-open-for-11th-badminton-title-of-year/article71680734.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The 24-year-old beat Japan’s Akane Yamaguchi 21-12, 15-21, 21-16 in the final in Yeosu to extend an unbeaten run that stretches back to March</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 01:18 pm IST - Seoul</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AFP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/njgpmf/article71680738.ece/alternates/LANDSCAPE_1200/Denmark_Badminton_27_44.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/njgpmf/article71680738.ece/alternates/LANDSCAPE_1200/Denmark_Badminton_27_44.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/njgpmf/article71680738.ece/alternates/LANDSCAPE_660/Denmark_Badminton_27_44.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/njgpmf/article71680738.ece/alternates/LANDSCAPE_320/Denmark_Badminton_27_44.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    An Se Young of South Korea. File\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680734\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Badminton world number one An Se-young said she was \"very proud\" of her achievements after winning an incredible 11th title of the year at her home Korea Open on Sunday.</p><p class=\"referpara\"><strong><b>Also read | <a href=\"https://www.thehindu.com/sport/fighting-sindhu-loses-to-nemesis-an-se-young-to-sign-off-with-runner-up-finish/article71623278.ece\" target=\"_self\">Fighting Sindhu loses to nemesis An Se Young to sign off with runner-up finish</a></b></strong></p><p>The 24-year-old beat Japan's Akane Yamaguchi 21-12, 15-21, 21-16 in the final in Yeosu to extend an unbeaten run that stretches back to March.</p><p>An has been head and shoulders above the rest of the competition this year but she said she still had to be on her guard against world number two Yamaguchi.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sport/other-sports/india-open-badminton-reigning-champion-an-se-young-serves-a-masterclass/article70518883.ece\">\n\t\t\t\t\t\t\t\t\t\tIndia Open badminton | Reigning champion An Se-young serves a masterclass</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/lskxqb/article70519020.ece/alternates/SQUARE_80/YONEX%20BADMINTON%20DELHI_17_01_47.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAABBQEBAAAAAAAAAAAAAAABAAIFBgcEAwEAAwEBAAAAAAAAAAAAAAAAAQIDAAT/2gAMAwEAAhADEAAAAMDSdg1ScYcS07PAVASHbeXTzOkQpKN2SKbIpMCkTvNzVI26FjbWpgZayBWzlWms1RpBI9vOSC9Ec7qe8PeQk42SyFJ6Oiqx4lGuGO2mVrxYNZNf9o2w+07D5pPEuu/2R1yTh3DqpH//xAA2EAABAgQDBwEGBAcAAAAAAAABAgMABAUREiExBhMiQVFhcRAHFCBSgaFCgrHBFRcjMnKR8P/aAAgBAQABPwD4BrFoGWsDX0HoptaEIWpJCVglJPOxt+sVsUZMyymimbU0lhAeVMW4nbcZQNQm+gOfwXvAi0D0bdSqUcl3Aom+NojOyuY8EfcCLQNIt65kQPS0JKkqCkkhQNxFZpL1KfYxcTE0w3MsOWsFoWAcvBuk9x6W7QPEfSMu8ZQIBgmKNNy20UmxQKvNql9ygpp8wRdLSib4VDXCdMv2itUOeoFRVJVFjdugYkKBxIcSdFIUMlJPURR6a/WKvKUyWw76adDSCrQE9Y2v2XOys8zLioMzzbzeNDrQw87HK5+AawBf0SbZ3sRpaKRtc4ZQ02sYJqTI4d+jeJT5Go/yTYxK0zZxVWpM7SZmbkH0KLr6EPBxJQObajY4jnlnpFc2SnKwpc23WJZ5ttYbS46FJSoqPDc2yP0sOsbJUSkz1XqErX5lyUTKy7jlkpJ406gkf8YUU4jgvgvkFa27+ghuRddBLaFrA1ITe0e75kYjfxG5t+L7R7ssZ5j8sUadVTZ1t5xG9bRcFCkBWR6BWWucVmvMzjbJlpfdFlZUVGwUroMsrRUK1SXtnpmZk2koqc4hMu8QbHCnt1PM87DvG7V0jdq6GMCuhhqaa3IbcK0YUKRdv8V+sKngXlLDQ4rdjoB+0PTIesCm1uhyhc3iUjAnDZWQxXv0EbO7LO7QPOM4pdCm0YlqffLSWvJtnFR2cQiofw+Sq9NnnCP7pdxRTjvbBcpFz307wy2WnFBxBxJNrHke8JSgqN05csoU03bIcobabw8agD50gU53pApbp0TCaM+rRtX+op+w77NFmKzPPKkiiwkUKTxPuX5Am9h1HPxDdL2hnG3feXH7PqCnEbzJRHzAZGNhdjEPz07LVVa2mHGrhKQLqsep6Xhz2ezLc460lSVIQshKvmF8jDXs6mljKxPYR/LCqOJJQ1f7Q/7MK2gHDKrPjOGdn5Zk8cjLkdFOBP7w3I0Zq16TKq04VTDis/yiKi03S22RK0OSRPOpu3dCrMD5l4iTc8haKVI0xl0zs9NuTtScThcmJgBVh0QDcJHjOHJWl1EpU5/WWkWBNjl9AIdokgG1BlxqXctwruQUnwT9oXVhQi1KVIJLzrhKZiWN2sHe4ve/fK8Nq4Er3ri0KF0qCclDqDeG30JOTaiepVCJy2iQPv8ArH//xAAiEQACAQMDBQEAAAAAAAAAAAABAgAQESEDEkETIjFRYaH/2gAIAQIBAT8AoJu4maKeRQD7D6pkeJ1LtaA3NMe4pW2YSCceIiKBmbVPM62lwv7H1g3aq2+xgCtgIuoTA45AM//EACERAAEDAwQDAAAAAAAAAAAAAAEAAhEDEiEEIDFREBPR/9oACAEDAQE/ANxEbZnlWi1EQJ8WieFVwcKSBBKc8yryhqCUKzaYl5k9fUzVG+45CqucDLThe53a/9k=\"/></div></div></div><p>\"She's a player who can always keep the score close so I tried to keep the intensity up all the way until the end,\" An told the Badminton World Federation.</p><p>\"When the match was over, I was very proud of myself.</p><p>\"It felt a bit different because it's my home tournament.\"</p><p>It was An's 11th straight win over Yamaguchi.</p><p>Yamaguchi's most recent win over the world number one came in the final of last year's Korea Open.</p><p>\"Whenever we play each other, sometimes I win and sometimes she does, so I didn't think too much about last year's result,\" said An.</p><p>\"Yamaguchi is a player who brings different styles into every match, so I knew it wouldn't be easy and it wasn't.\"</p><p>Of the titles An did not win this year, she finished runner-up at the All-England Open and pulled out injured from the Japan Open.</p><p>She claimed her second world crown in August in New Delhi and became the first woman to win two Asian Games singles titles in Nagoya in September.</p><p>\"We don't play many matches in Korea so this feels like a dream moment,\" said An.</p><p>\"I'm just so proud and happy that so many people in Korea are now supporting badminton.\"</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 01:18 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680734\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/an-wins-korea-open-for-11th-badminton-title-of-year/article71680734.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Des public/incoming/wiuqf5/article71680628.ece/alternates/LANDSCAPE_660/2026-11-07T193647Z_806178562_UP1EMB71IHAVI_RTRMADP_3_SOCCER-ENGLAND-NFO-MCI.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/wiuqf5/article71680628.ece/alternates/LANDSCAPE_320/2026-11-07T193647Z_806178562_UP1EMB71IHAVI_RTRMADP_3_SOCCER-ENGLAND-NFO-MCI.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Nottingham Forest's Ryan Yates celebrates after the match on November 7, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680621\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>It might be too early to start talking about an on-field crisis at Manchester City, even though it fell to a third straight Premier League defeat.</p><p>City coach Enzo Maresca was certainly not panicking.</p><p>After opening the campaign with seven wins in a row, City lost at struggler Nottingham Forest 3-1 to fall six points behind league leader Arsenal after the defending champion beat Hull 1-0.</p><p>“We are conceding too many goals unfortunately and we need to improve that,\" Maresca told the <i>BBC</i>.</p><p>\"Use the international break to understand why and try to avoid in the future. Always concerned but we need balance — seven wins in a row then three (defeats) in a row. Need the balance. No panic. We need to understand but no panic.”</p><p>Liam Delap, a City academy graduate, netted two goals for Forest — which had yet to score at home this season coming into the match.</p><p>It was only a second win of the season for Forest, which moved two points out of the relegation zone — with Manchester United taking its place in the bottom three ahead of Sunday's (November 8) match against Aston Villa.</p><p>Forest got off to a dream start.</p><p>Jair Cunha caught City defender Josko Gvardiol in possession and he surged forward, finding a gap to slide the ball into the bottom left corner and give his team the lead in the sixth minute.</p><p>More defensive mishaps from City, which again lost the ball, allowed Delap to sprint from inside his own half and between two defenders before firing into the back of the net to double Forest's advantage in the 18<sup>th</sup>.</p><div class=\"article-picture\"><div class=\"picture zoom-img\"><img alt=\"Manchester City's Erling Haaland applauds fans after the match.\" class=\"lazy\" data-src-template=\"https://th-i.thgim.com/public/incoming/7cu57i/article71680627.ece/alternates/FREE_1200/2026-11-07T193933Z_1237713967_UP1EMB71ILVVT_RTRMADP_3_SOCCER-ENGLAND-NFO-MCI.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAx8EsAMBIgACEQEDEQH/xAA0AAABBQEBAQAAAAAAAAAAAAACAAEDBAUGBwgBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/2gAMAwEAAhADEAAAAOYMDQzA8bMwPGyISzok6lFnHWREg6c3QvqO4vYkLITMhJKxOiE6Q7JDEJDuygmZqJmYdJxk6GYkCiQydwWJhnSRJ0MnSp3cSdDMTDOyCIHzSTIdCqdk1jpOM7Id2cTphM7ImdDJ0MzsqZ2Rk7jJ2EnQydAu6Hdnmk6UrpPNMkgRJrkGdtZFiZGSYdMhmSVM6RJJXZ2EkwkmEkwkziScF0hMkJxQSZUmdoZJhM6IzEpTOM8bOSOTGyMSzokylYHj3hAg68nQrUJCkJM46YhOnHdnE6YTJCJnE6eGYmBSVO7OOzoSSEkhnSEzoZ3YSTjJ0O6cSJQLGNAxCOmQSFBMyHTOjuLjpnCScTOIkkJkhJMOySpIhk7gomGYmRmdh0zjuLyukykhdXQuhA7WCjEFiYEZBARCjIkoomGTsjJ2VkkJJDM7DOyHdnEnYFjEZOwkyHZIZJDJOA7FKRgedGYHnRnGWNmLDDAQdMALt15JJDpnHdkOQkE7FCTsJkqdJDuylJ2SJkhmJqTs46ZCSYd2cdO4KdhJIZOhJOOQuGkoYXGkJCMnSJnQLuwnZxJnHcSCdiVmJAImBRMjJ0C6ZXdkO4uOkhmdkZnYTshJnV0yHTMEQuEzoZOgRNgGMQGJDJ0MicjY2BYhBToTOgU6BYhHSQnZxmdhJ0CiYFJDOnBd3WF2cI4zykKMpqQo3zoxTDCQ6yCdbwKdCSQ7s4iZw3F4dM1Okh3SlSTjskiZNSSQ6ZxOmE4kO7EO7ITOwzOhMmHcSCcXDQvDM7UmTDpOMncFjYZiQKJhOkEQkJOhknBToFEIIkwnZDuzBszozEgWJgU7CdnV0kMxMIhcJ2IZJDJMIDAZgrRdVRi "caption\">\n\n                            Manchester City's Erling Haaland applauds fans after the match.\n                                                            | Photo Credit: \n                                Action Images via Reuters\n                                                    </figcaption><span></span><meta content=\"https://th-i.thgim.com/public/incoming/7cu57i/article71680627.ece/alternates/FREE_1200/2026-11-07T193933Z_1237713967_UP1EMB71ILVVT_RTRMADP_3_SOCCER-ENGLAND-NFO-MCI.JPG\"/><meta content=\"1200\"/><meta content=\"675\"/></div><p>City managed to get one back early in the second half. Jeremy Doku latched onto a long ball over the top on the left flank and his cross was deflected into the path of Rayan Cherki, who drove it into the top left corner.</p><p>City was pushing hard for the equalizer but Forest restored its two-goal advantage in the 74th, with Delap finishing off a rapid counterattack with a fine shot that went in off the inside of the far post.</p><p>Forest coach Oliver Glasner sprinted half the length of the field to celebrate with his players.</p><p>“One of my best running stats, I guess,\" Glasner told the BBC. \"I will be fatigued tomorrow but I can be because it's the international break so I can have a rest!”</p><h4 class=\"sub_head\">Defending champ grinds out narrow win</h4><p>Earlier, it seemed as if Arsenal was in for a frustrating day, with things not clicking against a well-organized Hull, before Martin Ødegaard found a way through in the 72<sup>nd</sup> minute.</p><p>Noni Madueke cut in from the right wing and Konstantinos Tzolakis managed to parry his effort but not nearly far enough and the captain was there to slam home the loose ball.</p><h4 class=\"sub_head\">Controversy at Leeds</h4><p>Substitute Noah Okafor had been on the field for only 97 seconds when he scored to send Leeds to a 1-0 victory over Tottenham in a match marked by controversy.</p><p>A throw-in was headed on by Dominic Calvert-Lewin and Harry Wilson pushed the ball into Okafor's path to drive home in the 79th.</p><p>It was Leeds' first victory in almost two months and lifted the team into eighth, two points above Spurs — who were looking for their fourth straight win after none from their first six matches.</p><p>Tottenham will feel Leeds should have played the second half with 10 men after a nasty challenge by Jayden Bogle on Mathys Tel in the 34th. It wasn't malicious but the late tackle saw Bogle's studs land on the trailing ankle of Tel, leaving the Tottenham forward writhing in agony.</p><p>A long VAR check for a possible red card for Bogle ended with no action deemed necessary. Tel tried to continue but came off a few minutes later.</p><p>Newcastle drew at Fulham 1-1.</p><h4 class=\"sub_head\">No FA Cup fairytale again for Macclesfield</h4><p>There will be no repeat of Macclesfield's heroics in the FA Cup this season as the team lost at Mansfield 3-0 in the first round.</p><p>Non-league Macclesfield pulled off the biggest upset in the history of the competition last campaign when knocking out holder Crystal Palace.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:56 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680621\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/football/man-city-suffers-third-straight-premier-league-loss-at-forest-and-arsenal-opens-6-point-lead/article71680621.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div cl
