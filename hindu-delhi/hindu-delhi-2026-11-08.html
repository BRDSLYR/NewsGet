><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/national/\">\n                        India\n                    </a><meta content=\"India\"/><meta content=\"3\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/national/tamil-nadu/\">\n                        Tamil Nadu\n                    </a><meta content=\"Tamil Nadu\"/><meta content=\"4\"/></li><li aria-current=\"page\" class=\"breadcrumb-item kicker\"><span class=\"kicker-outline\">The Hindu Impact</span></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71679299\" data-title=\"NGT issues notice to Tirunelveli Collector over threats to Tamirabharani fish species\" data-url=\"https://www.thehindu.com/news/national/tamil-nadu/ngt-issues-notice-to-tirunelveli-collector-over-threats-to-tamirabharani-fish-species/article71679299.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">National Green Tribunal takes <i>suo motu </i>cognisance of <i>The Hindu</i> report</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 07:06 pm IST - CHENNAI</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/b-kolappan-674/\">B. Kolappan</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/p8p9yz/article71681013.ece/alternates/LANDSCAPE_1200/2315_23_2_2024_19_20_16_3_DEVARIOAEQUIPINNATUS.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/p8p9yz/article71681013.ece/alternates/LANDSCAPE_1200/2315_23_2_2024_19_20_16_3_DEVARIOAEQUIPINNATUS.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/p8p9yz/article71681013.ece/alternates/LANDSCAPE_660/2315_23_2_2024_19_20_16_3_DEVARIOAEQUIPINNATUS.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/p8p9yz/article71681013.ece/alternates/LANDSCAPE_320/2315_23_2_2024_19_20_16_3_DEVARIOAEQUIPINNATUS.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Some of the fishes found in the Tamirabharani River in Tirunelveli district. File\n                                          | Photo Credit: Special arrangement\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71679299\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The Principal Bench of the National Green Tribunal (NGT), New Delhi, has issued notice to the Tirunelveli Collector and five others over threats faced by fish species in Tamirabharani River due to pollution and habitat loss.</p><p>Taking <i>suo motu </i>cognisance of a report, titled ‘Tamirabharani’s Endemic Fish Face Threats From Pollution, Habitat Loss’, published in <i>The Hindu </i>on September 28, the Bench, comprising Justice Arun Kumar Tyagi and expert members A. Senthil Vel and Afroz Ahamed, directed that the Tamil Nadu Pollution Control Board, the Central Pollution Control Board’s Regional Office in Chennai, Ashoka Trust for Research in Ecology and the Environment (ATREE), and Agasthyamalai Community Conservation Centre (ACCC) be impleaded as respondents, besides the Collector.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/tamil-nadu/tamirabharanis-endemic-fish-face-threats-from-pollution-habitat-loss/article71519261.ece\">\n\t\t\t\t\t\t\t\t\t\tTamirabharani’s endemic fish face threats from pollution, habitat loss</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/news/national/tamil-nadu/8yokdh/article71519382.ece/alternates/SQUARE_80/1000090635.jpg.jpeg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAEAAgIDAQAAAAAAAAAAAAAABQYDBAECBwgBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAPn8AAAABIa0uDnNL1zO7/Olc1ZSY1z836eo1zG4uVhpDl1mITvb0hcl17dOXm0zZ9qqXksVNxupapY29QbtppLWbHHxiUAAAAAD/8QAOBAAAQMDAgMEBwUJAAAAAAAAAQIDBAAFERIhBhMxQVFhgQcQIjJxodEUQJHB4RUWIzNCUnKisf/aAAgBAQABPwD7uAT0Gaty2xHCVxI6j3uNAk+dQuGIt1SVqhhtOM62VFOPIkineEA5JLcSXkZIHMHd3kVM4Ou8RGsNIeSOvKVkjyNONOMrKHEKQodihg+pdpcOSwtK/A+yfpTkOS0f4kd1PiUmo8KVLXojxnXVdyEE1a7G6u4IYlvNxcnfXuR8alWK1MRWgxKLjijlTilDGO0YHSnbsLVb3I0Z0laMoBxtnt+X/ahXtbLo0DBBykD86/edQbbbKenvb+9+poKtF+C4r8VGdOyjsUHwPZV94Dn25H2qDmbEIzlvdafiO3yqJNS9jsWOo76kXF9u2oSwsoAXkgHqaiX69S44bRlXQagmrhEuDUpRfadCjuSRsfOoNukqiJUtJSr3gDTloeLDoICnD0Peat9okquGlxvQgHJJ6U9Z22nippeoK3G3SkQS2By2ytRXgqxUO23xM5rlyXm9ByEAnFRWQwkAj21dfpX7XhwRhbCZSx0bzhIPifyFMccXSOtKWEQ2GQf5bcZOB5nJ+dWzjBUtAamsoBz77aNvMfSmTFuKi3GmRXnAMqaQ4NaR4p60uyPgFQHTvpu1hK/aQo5/tpNk1jUYylD4/pU+88LcOJCX5PPko3+zxjzFJPcVZwPM1ffSVcLhqatjQt7J/rSrU6R/l2eX40/NW6SEewk+O/qBwQetOXGQvISvlpPYjarZObgS0vuRkv6TkAqKcGn/AEm3bkcmDHjREYxq0lxX+23ypHHnE7aNCbu8E77aU/Sp3EV5uWRMuct5J6pW6dP4dKz95x68Vj1//8QAHxEBAAMAAQQDAAAAAAAAAAAAAQACETESEyAhMDJB/9oACAECAQE/APER4mky1q6TtP4yx0vuAKhK1KfUhbI3ziapxADiZN9Z8H//xAAiEQEAAgECBgMAAAAAAAAAAAABAAIRITEDEhMgIjBBUWH/2gAIAQMBAT8A7WqbzDChR8p1D5IPNtFQFl+Ja5q7RVgfcyD+RsrlmUmNc+j/2Q==\"/></div></div></div><p>The order said: “The above news item attracts the provisions of the Environment (Protection) Act, 1986, the Water (Prevention and Control of Pollution) Act, 1974, and the Biological Diversity Act, 2002, and prima facie raises substantial questions relating to the environment arising out of the implementation of the enactments specified in Schedule I to the National Green Tribunal Act, 2010.”</p><p>The Bench directed the Registry to list the matter before the Southern Bench of the Tribunal, Chennai, on January 22, 2027, as the cause of action had arisen within its territorial jurisdiction.</p><p>It also directed the respondents to file their responses before the Bench at least one day ahead of the date of hearing. <i>The Hindu</i> had reported that 125 fish species had been identified in upstream, midstream and lower estuarine stretches of the river. Seven of them are endemic to the Tamirabharani.</p><p>Pollution, habitat destruction, loss of riparian vegetation, invasive fish and aquatic plants, use of soaps and shampoos by people bathing in the river, rituals performed on its banks, dumping of puja materials and clothes, and discharge of untreated sewage have contributed to the decline in fish populations.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 07, 2026 10:30 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71679299\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/national/tamil-nadu/ngt-issues-notice-to-tirunelveli-collector-over-threats-to-tamirabharani-fish-species/article71679299.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher -12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 10, "title": "Tens of thousands march in Amsterdam, pressing Dutch government on Gaza, Israel", "section": "International", "page": "", "teaser": "Organisers of the “Red Line” demonstration called for stricter trade sanctions, a halt to arms sales, and an official declaration that Israel’s actions in Gaza amount to genocide", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681124\" data-title=\"Tens of thousands march in Amsterdam, pressing Dutch government on Gaza, Israel\" data-url=\"https://www.thehindu.com/news/international/tens-of-thousands-march-in-amsterdam-pressing-dutch-government-on-gaza-israel/article71681124.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Organisers of the “Red Line” demonstration called for stricter trade sanctions, a halt to arms sales, and an official declaration that Israel’s actions in Gaza amount to genocide</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:19 pm IST - Amsterdam</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/5l38ab/article71681172.ece/alternates/LANDSCAPE_1200/Netherlands_Red_Line_Protest_35126.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/5l38ab/article71681172.ece/alternates/LANDSCAPE_1200/Netherlands_Red_Line_Protest_35126.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/5l38ab/article71681172.ece/alternates/LANDSCAPE_660/Netherlands_Red_Line_Protest_35126.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/5l38ab/article71681172.ece/alternates/LANDSCAPE_320/Netherlands_Red_Line_Protest_35126.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Demonstrators march during the fourth \"Red Line\" protest, with the focus on the Dutch economic and military ties with Israel, in Amsterdam, Netherlands, on November 8, 2026. File\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681124\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Tens of thousands of people, many of them dressed in red, marched through Amsterdam on Sunday (November 8, 2026) in a mass demonstration aimed at pressing the Dutch government to take more decisive action against Israel over Gaza.</p><p>The organisers of the “Red Line” demonstrations in the Netherlands called for measures including stricter trade sanctions on Israel, officially declaring that Israel’s actions in Gaza amount to genocide, and halting all arms sales to Israel. The Dutch branch of Amnesty International, one of the organisers, said in an online post that more than 200,000 people joined the march.</p><p>“What is happening there is inhumane,” said Mike van Dongen, as he walked in the huge throng. He was critical of the Dutch government’s actions. “As far as I’m concerned, they are doing nothing,” he said. “They don’t dare take any serious steps.”</p><p>As the protesters marched along a normally busy Amsterdam street that was closed to traffic on Sunday, a man stood on a bus stop with a loudspeaker shouting “Free, free Palestine!” Many of the marchers echoed his cry as they passed.</p><p>Israel strongly rejects suggestions it is committing genocide in Gaza in its military campaign, which followed the attacks by Hamas-led militants in southern Israel on October 7, 2023. Militants killed about 1,200 people and took 251 hostages.</p><p>Israel’s retaliatory offensive has killed tens of thousands of Palestinians and destroyed much of Gaza. More than 1,550 Palestinians in Gaza have been killed by the Israeli military since a ceasefire between Israel and Hamas began in October 2025, according to the territory’s Health Ministry.</p><p>The ministry, part of the Hamas-run government, does not distinguish between civilians and militants, though it says women and children make up roughly half of the dead.</p><p>The campaign in Gaza has strained relations between the Netherlands and Israel. The Dutch Foreign Minister resigned last year after failing to secure new sanctions against Israel. Since then, a new minority coalition government has taken power and introduced an import ban on products from Israeli settlements, which the Dutch government and most of the international community consider illegal, a move that provoked a diplomatic spat with Israel.</p><p>Prime Minister Rob Jetten, who took part in a march last year but was not present on Sunday, defended his government’s actions at his weekly press conference on Friday (November 6, 2026). “Every single day and every single week, we do what we can to alleviate the terrible situation there,” he said.</p><p>He added that his administration was “exerting greater political and diplomatic pressure” on Israel to abide by its agreements on Gaza. At the same time, he said, the government was applying more pressure on Hamas and other organisations that continue to carry out “various operations that endanger the safety of ordinary Israelis.”</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:19 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681124\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/tens-of-thousands-march-in-amsterdam-pressing-dutch-government-on-gaza-israel/article71681124.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : thor-name noimg\"><a class=\"person-name no-lnk\">Reuters</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/lejopg/article71681184.ece/alternates/LANDSCAPE_1200/2026-10-13T133141Z_1205178318_RC2JSEAAP0OR_RTRMADP_3_USA-COURT-TRUMP-DOGE.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/lejopg/article71681184.ece/alternates/LANDSCAPE_1200/2026-10-13T133141Z_1205178318_RC2JSEAAP0OR_RTRMADP_3_USA-COURT-TRUMP-DOGE.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/lejopg/article71681184.ece/alternates/LANDSCAPE_660/2026-10-13T133141Z_1205178318_RC2JSEAAP0OR_RTRMADP_3_USA-COURT-TRUMP-DOGE.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/lejopg/article71681184.ece/alternates/LANDSCAPE_320/2026-10-13T133141Z_1205178318_RC2JSEAAP0OR_RTRMADP_3_USA-COURT-TRUMP-DOGE.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    U.S. President Donald Trump and Elon Musk.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681171\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Tech megabillionaire Elon Musk and President ‌Donald Trump's newly appointed White House chief of staff, Stephen Miller, ​will likely be targets of congressional probes when Democrats take control ⁠of Congress in January, a senior lawmaker said on Sunday (November 8, 2026).</p><p>California Representative Robert Garcia, who is in line to chair the powerful House Oversight Committee next year after Democrats' sweeping midterm election victory, ‌said investigations will focus on Mr. Musk's involvement in the Department of Government Efficiency's firing of federal workers last year, and Mr. Miller's role in Mr. Trump's ‌hardline immigration crackdown.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/democratic-wins-in-stateag-races-give-trump-a-new-headache/article71680926.ece\">\n\t\t\t\t\t\t\t\t\t\tDemocratic wins in State AG races give Trump a new headache</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/hze93h/article71680944.ece/alternates/SQUARE_80/Election_2_26_Mississippi__2448.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAwEBAQAAAAAAAAAAAAAFBgEDBAIHAAEAAgMBAQAAAAAAAAAAAAAAAQUABAYCA//aAAwDAQACEAMQAAAAX5snToON2ZkrWAeX00ItvJv2ylyqpi+OhHVnQmv0hLP591tXuc9G4vxmwNVxn6+HKrnqzoQmZDhszoN4Qkg8dMg9gByEyKxuY1D3Y8m0VWLL75rmdGJhLbjD7wNvIUCSycLtVJoslR6MSX2bw7RdSyxn3JYCXoXr4ptMJkn/xAAlEAACAgICAgIDAQEBAAAAAAACAwEEBQYAEhETFCIHFSExIzL/2gAIAQEAARIAgeQPOvMSljcmgV9YLt/6t1rTnHefaiVHEj06868686868gedeQPNbw9g2RcIYFXjwMWcZVeqYegGCJePF/XKZQXp8oOOWqTabpW2I8/7E9ededeQPIHmGx0ZDIgoo/5j9z4KxWvqEREDMeIsPSv2dzGB8eeXs/j1CJzZX9P4fMnsWPIfV7wLqX8kfBgJDPkSjzE9edOQPIHmu2FUhe04kmHIrWBvYx61XXzWhoEwId7rNFL69NS7UOj2TaKK+VuGy1WCs5Yj6MsvFW0u9lmpLBQSlzj8tTohVomQl2GI9nTnTkDyB5i6pVii2RSMlEQHDrHILh7l1u0/WXbTrjKOSdVK3lDxyYNgWdtczVf2+NwNFBDbmuY3s5aY/WmtRVGhk1iVmG4a5etZmuNZHyKN4ESI26mIrIp2XsaxQQJsXINWLFlBAUeRKB5A8qZI1VPXTGCvMhqVtXi7Fl+ubVmHMmwlXlq8cilhN2ymE9FcKdsCZBjs0hpuQ1k6ti32sd div><p>\"I think there's a lot of interest, not just from ‌our committee, ⁠but from committees across the Congress to speak to Mr. Musk,\" Mr. Garcia ⁠told <i>CNN's</i> \"State of the Union.\"</p><p>Mr. Miller — whom Mr. Garcia called the architect of a \"horrific, unjust\" immigration policy — has been promoted to White House chief of staff, Mr. Trump said on Friday (November 6, 2026).</p><p>\"Stephen Miller is at the centre ​of the major policy decisions that ‌are happening in the administration, and so it does deserve oversight and investigation,\" Mr. Garcia said.</p><p>The crackdown on immigration, which included operations in which two people were fatally shot in Minnesota by federal agents, has proven widely unpopular. A<i> Reuters/Ipsos</i> ‌poll in October found that only 37% approved of Mr. Trump's handling of immigration, ​down from 50% when he took office.</p><p>Voters delivered a historic rebuke to Republicans in Tuesday's (November 3, 2026) midterm election, but with Mr. Miller as White ⁠House chief of staff, the Trump administration is expected to continue its aggressive approach to immigration enforcement, amplify cultural conflicts and give no ground to a Democratic-controlled Congress, say officials ‌and experts who spoke to <i>Reuters</i>.</p><h4 class=\"sub_head\">HEGSETH 'HAS GOT TO GO'</h4><p>Hakeem Jeffries, who will become speaker of the U.S. House in January, said on Sunday (November 8, 2026) that Democrats would support a measure to impeach Defense Secretary Pete Hegseth, a congressional process that could remove him from office.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/why-are-the-us-midterm-elections-significant/article71679440.ece\">\n\t\t\t\t\t\t\t\t\t\tWhy are the U.S. midterm elections significant?</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-devic  by Mr. Trump in February, which has led ⁠to a spike in gas prices.</p><p>Attorney General Todd Blanche signalled on Sunday (November 8, 2026) that the Trump ⁠administration was prepared to battle the Democrats in Congress, calling threats by some Democrats to target administration officials and allies \"not something we can tolerate in ‌this country.\"</p><p>\"If that's what this new incoming leadership wants to do, we are ready,\" Mr. Blanche said. \"If you work in this administration, you have a lawyer. ​It's me.\"</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:11 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681171\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/democrats-eye-musk-miller-probes-after-midterm-rout/article71681171.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publis t to Benjamin Netanyahu's allies as he warned the veteran Prime Minister had brought the country to a historic crisis.</p><p>Mr. Eisenkot, 66, a political novice who has vowed to bridge Israel's deep polarisation under Mr. Netanyahu, formally received a mandate from President Isaac Herzog, giving him 28 days to form a government despite his bloc lacking a clear majority.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/israel-defence-minister-says-mission-not-complete-on-iran/article71680896.ece\">\n\t\t\t\t\t\t\t\t\t\tIsrael Defence Minister says 'mission not complete' on Iran</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/tw4j4y/article71680958.ece/alternates/SQUARE_80/Election_2_26_Isolated_Israel_31262.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAwEBAQAAAAAAAAAAAAAFBgIEBwMAAQEAAQUBAAAAAAAAAAAAAAAABgECAwQFAP/aAAwDAQACEAMQAAAAd/squZqTsqttXH4WOTo6vusmrXr36q9eEnuXdmJMMOWXYvYJtr6q0JJBSgUnX9wmrbSO+hgs4zdDsi9GD2g5yxLX1cGfViAd48hJ591+zp9yYJKFTg6p2pmQLh3dE0lVZF7fH04xH0l/X0JkDB5BlAiXrtCLinlU7Xw1wXujvQRfBub/AP/EAD8QAAIBAwIEAwQFBw0AAAAAAAECAwAEEQUhBhIxQRNRYQcicbEUMpGhwRAVIyVCUpIzNDVDRFRigYOT0eHw/9oACAEBAAE/ABAB05txXKEx0x3J8qkvIMqhkJJ+OKALKrKwPkcVy98knHYUYhuTnJ9acAYO5Hxr6MpJyGAGP2utPADseY/5708CAe6cHO29R5J6bVfNyuiy8xQgsVXufKtWvFhjK20IRx2GPvrhLV0v7eSzcv49sfe5htg/8fjXxNMoLAjPToKkX3QQBgbAY6Uw5Gzk4PbsPWmTKgkYwemayrSADmwDuOlIsig4iz6bVxHBNPpYZbhrIxSK5kVh9XOCD6UkdhZveS2d29xKzMqNISe++Cep7VwxqcVj+cb+SEraW8Q8efupBHU9/P7a8VpkDJGGRhkMGBUjzHnTCTPMYyd/3hXEd5eJqrxrPJGgVcIrnA2qTVNSPW/  Minister — a community mostly descended from West Asian or North African Jews — in a country long dominated by an Ashkenazi elite with ties to Europe.</p><p>Mr. Netanyahu is Israel's longest-serving Prime Minister, having led the country on and off for nearly two decades. He has taken the country in a sharply rightward direction and led wars in Gaza, Lebanon, and Iran since the October 7, 2023, attacks by Hamas.</p><p>Both Mr. Eisenkot and Mr. Herzog acknowledged Israel's growing isolation under Mr. Netanyahu, who is wanted by the International Criminal Court.</p><p>In the United States, the most vital ally of Israel, Democrats on Tuesday (November 3, 2026) swept elections with calls to rein in Israel after the devastation in Gaza and the unpopular Iran war which Mr. Netanyahu launched with President Donald Trump.</p><p>\"We are in the midst of a devastating diplomatic crisis. Even our closest friends and strategic allies are saying their relationship with Israel must be reassessed,\" Mr. Eisenkot said.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/israel-election-commission-rejects-benjamin-netanyahu-charges-of-fraud/article71665384.ece\">\n\t\t\t\t\t\t\t\t\t\tIsrael election commission rejects Benjamin  Netanyahu charges of fraud</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/la6sic/article71665456.ece/alternates/SQUARE_80/2026-10-29T125022Z_90415747_RC21COANZRXI_RTRMADP_3_ISRAEL-ELECTION.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAwEBAQEAAAAAAAAAAAAFB KiWxCTmJo2tZQRdXHsRbsKBkVrqTfe/Og0a5jK2Q2Lsd7mspRB4VI2rRRZQPQVlxHCkMEkD+EvYAhg3WxtY+9fDpIMYjZXjkJUq3RrmgGxsiZRbURg8h/Jr6UH+P4okEcxRNmFeYWAqSOaTKAZEJv6G+opb8kW/mbpW5Nye9SrHiJoePh3b6WHhYjvYj2qRcTizKqcYg+JnsbknXnzrG/q8Ip/oZ1s8Y6X5jtyoWYZABe9ha4/esemNws8fEjcDKy6kFXHJhb9vkLXqQqw5ilCRxrYKuxbmf2oU2VEYq5/tYEH9wfxTZpOPxweuv+NK1R40kU9iAaOhxLKPRfD/AB8v/8QAHxEAAgICAgMBAAAAAAAAAAAAAQIAAxEhBBITMUEy/9oACAECAQE/ADyGO8yjkBz1PuNetf6MvsWyzss43LFGQRnMZ1X3KLl8gxLeS7k5MqsPbZhYhs51GX6dyt1rYN1jgEkmEgYxBUOufssGjiMWY5joSoIHyKhdsQjWoo3DxyG16nQATjYLMZ1n/8QAIREAAgIDAAICAwAAAAAAAAAAAQIAAwQRIRIxBRMiQaH/2gAIAQMBAT8AGIg5qZGMax5D1ExXtP4iY1D1VeLTKwjkaO9aldTOdKJk4r/SxPqUYddaLzcvpXw0o1DWpQqRomI42VU6MtqNyFC8r8goA/UCnu4+Wfs56lBIcE+tysJWNbldyrYwY83LrVrTe+wHvYTyDLBT12A9nzgtSilW9a/uhNz/2Q==\"/></div></div></div><p>Mr. Eisenkot appealed to Mr. Netanyahu's Likud Party as well as the far-right party of Finance Minister Bezalel Smotrich to join — but only with himself as Prime Minister.</p><p>\"My door is open and my hand is extended, wholeheartedly and willingly, to anyone who understands the gravity of this moment,\" he said.</p><h4 class=\"sub_head\">Wooing the ultra-Orthodox</h4><p>In consultations last week with Mr. Herzog, Mr. Eisenkot received recommendations from parties accounting for 67 lawmakers, against 46 for Mr. Netanyahu.</p><p>But that vote count included Israeli Arabs, whose seat haul surged to a historic high on anger over Mr. Netanyahu's government and whom several parties oppose having in government.</p><p>Avigdor Liberman, a former Netanyahu aide turned sharp critic who nonetheless shares his hawkish views, has been adamant against any alliance with Arab Israelis, who are descendants of Palestinians who stayed after Israel's creation in 1948.</p><p>Taking back one of his signature campaign pledges, Mr. Liberman instead voiced an openness to an alliance with ultra-Orthodox Jews, whose almost singular priority is ensuring that they remain exempt from military service.</p><p>The exemption for the ultra-Orthodox — whose two main parties had been aligned with Mr. Netanyahu but could push Mr. Eisenkot to a majority — has been a source of growing resentment for many Israelis as reservists fight on multiple tours of duty.</p><p>Mr. Liberman said on Sunday (November 8, 2026) he still backed conscription for all Israelis but that he had to make \"difficult decisions\" for the higher priority of ousting Mr. Netanyahu, who faces corruption charges that could land him in jail if he loses power.</p><p>Naftali Bennett, the second strongest opposition leader after Mr. Liberman, has also been outspoken against the ultra-Orthodox community's military exemption and has stayed quiet since Mr. Liberman's about-face.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/tamil-nadu/indias-policy-shift-towards-israel-is-regrettable-says-former-madras-high-court-judge-at-book-launch/article71679140.ece\">\n\t\t\t\t\t\t\t\t\t\tIndia’s policy shift towards Israel is regrettable, says former Madras High Court judge at book launch</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/news/national/tamil-nadu/43sb6d/article71679321.ece/alternates/SQUARE_80/WhatsApp%20Image%202026-11-07%20at%209.25.35%20PM.jpeg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAADAQEBAQEAAAAAAAAAAAAEBQYDAgEHAAEAAwEBAAAAAAAAAAAAAAAAAAECAwT/2gAMAwEAAhADEAAAAPpGpu7WHZRDFnDbkFKqpFRNaO/UwdIs9jYLU1pXv1oSF4XqPPUbNOHmKeX0v6QE8lMWX6xZ1MIrodLkeqk3fPcncfOqDoyuJtQom6w1OqKW4p+nk5GaTUXswAI5O33PsrfLzwr9pgjyd8c/XPkNeqj/xAAlEAACAwEAAgEEAgMAAAAAAA ws/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681148\" data-title=\"South Africa's ANC suffers worst election result as decline continues\" data-url=\"https://www.thehindu.com/news/international/south-africas-anc-suffers-worst-election-result-as-decline-continues/article71681148.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The once-dominant ANC — the party of Nelson Mandela — had received around 30% of the vote in Wednesday's (November 4, 2026) local government elections with 99% of ballots counted</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:36 pm IST - Cape Town</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/mnguaz/article71681154.ece/alternates/LANDSCAPE_1200/2026-11-06T144059Z_513778233_RC2DIOAH5PIA_RTRMADP_3_SAFRICA-ELECTIONS.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/mnguaz/article71681154.ece/alternates/LANDSCAPE_1200/2026-11-06T144059Z_513778233_RC2DIOAH5PIA_RTRMADP_3_SAFRICA-ELECTIONS.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/mnguaz/article71681154.ece/alternates/LANDSCAPE_660/2026-11-06T144059Z_513778233_RC2DIOAH5PIA_RTRMADP_3_SAFRICA-ELECTIONS.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/mnguaz/article71681154.ece/alternates/LANDSCAPE_320/2026-11-06T144059Z_513778233_RC2DIOAH5PIA_RTRMADP_3_SAFRICA-ELECTIONS.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Members of the uMkhonto weSizwe Party (MKP) interact inside the Western Cape Provincial Results Operation Centre as they await municipal election results in Cape Town, South Africa, November 6, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681148\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>South Africa's African National Congress party faced its worst election results ever on Sunday (November 8, 2026) and a new low point on its gradual decline in popularity as voters rebuked it for a failure to deliver basic services like water and electricity in towns and cities.</p><p>The once-dominant ANC — the party of Nelson Mandela — had received around 30% of the vote in Wednesday's (November 4, 2026) local government elections with 99% of ballots counted. The final results were expected late on Sunday (November 8, 2026), according to the Independent Electoral Commission.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/south-african-anti-migrant-protests-turn-violent-government-blames-disinformation/article71561419.ece\">\n\t\t\t\t\t\t\t\t\t\tSouth African anti-migrant protests turn violent, government blames disinformation</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/7lw9wx/article71562206.ece/alternates/SQUARE_80/South_Africa_Unrest_9723_.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAACAwEBAQAAAAAAAAAAAAAFBgIDBAEHAAEBAQEBAQEAAAAAAAAAAAAAAgMBBAAF/9oADAMBAAIQAxAAAABY0y03nnHlBbGHLprpLLQSxIZwhc4EzSnDm7KhxYc5j56OsDGZTIowOGvPJ0cqDUOD7I8acEdHHkocVanKKg7JVJtChurLZubrpUE0n5ILOw7zfKWB9l7fOs3p1CKSRVtGYw9DV0mfmvfIsHy/BhjqWsu5/8QAOBAAAgEDAgIIBQEGBwAAAAAAAQIDAAQRBSESMRMiQVFhcYGRBhQVMkIjFjNScoLRkqGiweHw8f/aAAgBAQABPwBIdhUUAxkinjBGwq7TFMobGTyqYnJC9lCThXfIqeQnLMc5qS+zo0llKrt+qJY8N1UOMHbxGPaimSaRcEUuMYqUhRtV22SR/nQQ5JzTR7nFLApjYEct6e0kZ+ijUszHAA3Jqaydb1LWXEZLhSSwIGTjORtWs/BQ0DQoLy91GJ765PFDaW44wqD82flvg4AoKp3rl2VKpZdquomCknspFJbGM08FxArSGNuBlwW4cigwBOSeXdWjvp9vYq0tvY30pbjEMykEcurxDsPP/wBrXNKupIZb17dY41J6kYwsYJ2AHYMmtStHuvg99curqOTpIEbr5yW5BeeM5z7VwcESkqQDyriyMU3UXsq5kdtguceFW2FfLLyq9vpDE8eTwsMEA7YpZCd+6rCVVZd9y3Kp4LvUNAvbWSCMEs0LkHdABkt6YFaDNc6usOk3l3w6daLJdLE2AGfGy+OSeXiagZrmEod+jGQfOiODn31NEzWQmEZ4VPWYb4FPBIy9JtgnHOhCAW6UsoH8I376KKZCRkp44p4kRsDNJJ0T5zyOa0/40WHpRNat vember 8, 2026) for a steep drop of about 15 percentage points from the last local elections and the loss of approximately one-third of its support from five years ago.</p><p>“If anyone has not heard what the people are saying in this election, then you are lost,” said ANC Secretary-General Fikile Mbalula. “This has been a very catastrophic outcome for the ANC.”</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/south-africa-votes-as-anc-faces-further-losses-and-coalition-rule-looms/article71667127.ece\">\n\t\t\t\t\t\t\t\t\t\tSouth Africa votes as ANC faces further losses and coalition rule looms</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/xoji9z/article71667183.ece/alternates/SQUARE_80/2026-10-29T140629Z_1679833974_RC2YCOAOPG9Z_RTRMADP_3_SAFRICA-ELECTION.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAADAQEBAQEAAAAAAAAAAAAFBgcEAwIAAQEAAgMBAAAAAAAAAAAAAAAAAgMAAQUE/9oADAMBAAIQAxAAAADc3IZLLcRPcu21nbM2nxKWWcfnl9mFZ3yobTkivZmnrT3GW6HE5jxZDjYyZsjFKwDCwfvUu0BFsKWT+esAwxaVhyXOY+jWHMoNdLqjOglK4wa2atSlMps059GrJjrLujNezEoOrn72PBF2uUeSe4FT6TnbREloZkOiGf7otpDQD4PD/8QAKBAAAgMAAgEEAQMFAAAAAAAAAwQBAgUABhIRExQVIyEyNhYiJjM1/9oACAEBAAEIATjHcl2C5D1miXi3WjWZ0NI92fOOzJeGt75FfirbQqh64yMemIuzrfEBkxPtM1nHb+boaZYUYszS9rDfAzMUj3zL5L9py88ebplANmfTs6HImJ7DavNuaExHqxg0IW7rxbM3WQ0vawUSZzLS5cRiWcwh4pafxTAFJc0FKzX/AL5eMay1uzr+ea2F7srR13WK1WapdHRs1cdaoq+9qtHu2WQuaF6hj6vAcDVVc/uhm+J+tDcj+Q35pv8AtaLfl1IkF2XL1cpPnM1ypvLAvPNmPladeMBsbegcE9Dasp28IXdfpbGy4zal8c3SjQ7O5SNulharVq9ZFWsql45YkvF88GZ+0rE0mv2O e left many cities and towns with regular water and electricity outages, broken roads and streetlights, and uncollected refuse.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/cyril-ramaphosa-tells-south-africa-to-prepare-for-loss-of-us-africa-trade-deal/article71603027.ece\">\n\t\t\t\t\t\t\t\t\t\tCyril Ramaphosa tells South Africa to prepare for loss of U.S.-Africa trade deal</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/a960wv/article71603026.ece/alternates/SQUARE_80/South_Africa_Killings_914_7.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAABBQEBAQAAAAAAAAAAAAAFAgMEBgcIAAEBAAMBAQEAAAAAAAAAAAAAAAECAwAEBf/aAAwDAQACEAMQAAAA1p6FN82/xK/gEOn1Ma99nI8878JSEq8mHFBs+irYeaTc+zhxdvRA7Dj2+tyk/eQsBRIbRnGnVHCRtU0oNZ2bUhWoFlDS6vd5Ru/M2u80a/irme18T0zs1wye8ETc/PV8FcZxnYuH1lha5w1ozSvnlnKJ2AhrkwjU1NpbXf/EADoQAAIBAwIDBQUFBgcAAAAAAAECAwQFEQAhBhIxBxNBUWEUInGBkRBCYqHBFSMyUrHRFkRTY5Ki8P/aAAgBAQABPwCmbmiB+w/ZX3GltlMaismWOMdM9WPkB46XtMo3qzElBIyA7N3ygn5Yx+erVfKC8Rk0k2ZFGXif3XT4jy9RtrOsaI1QPmPH2431xZcZb9xNWRd6wp6ZzCigEgAdfqcnT2ynhjVg77jIKrn54G+ludRbq6KekmZamnfMbjb5EeIPiNUFUtfbqasUcqzxLIB5ZGcaGiNULFZMeH21s70tDUVEah3iieRVPiQpIH5ahSmaBqueoWKSeRi0sjkAE7nb0z+emgpnuMdPFcY6o8ndgxyfwfMdD5Hz1dqeGjqT3DM7tISQ7ZIwPE67OrrUXLhoR1MMcfsTLToyk++oUHJz476+H2U6pBBLluuWJPnqFzJAjHqQCdE6njM9PLCDymRGQHyyMapDUUtQIWMaqkpWRpl5ghBwcjVXcCGT2Z6OYcpD9zFycoOw8TnSxPdb9TW+nbnlnnCA4zgk4z8B11w3YI+HbLFQd6s7hmeSXlxzMep+HQD4aEKd4shY7HIAOBppB7Wyr05AT8dThuVQDhOhA1TPmEaLAAknAHUnoNXjtL4bs1Q9O1RJVyovMwo1EgG+MFsgZ1DS3Ti6e58VcO0KtG1 ailed services have been most under scrutiny, the white-led DA put forward its former leader, 75-year-old Helen Zille, as a candidate for mayor.</p><p>Her campaign included stunts like her snorkeling in a trench filled with water in the middle of one of the city's roads in an attempt to highlight the failures.</p><p>There will now be complex coalition negotiations</p><p>While the ANC's decline was obvious in the biggest cities, most of them could be left with hung councils because no party was set to win a majority.</p><p>That meant a series of complex coalition agreements will be required to decide who governs and the ANC could be part of the governing coalitions.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:36 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681148\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/south-africas-anc-suffers-worst-election-result-as-decline-continues/article71681148.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\" ntent=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681120\" data-title=\"Trump vows comeback as bitter showdown with Congress looms\" data-url=\"https://www.thehindu.com/news/international/trump-vows-comeback-as-bitter-showdown-with-congress-looms/article71681120.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The devastating result leaves Trump politically hamstrung as he enters the remaining two-year 'lame duck' period of his White House tenure</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 10:20 pm IST - Washington</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AFP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/ur2zln/article71681146.ece/alternates/LANDSCAPE_1200/Election_2_26_Climate_Policies_8_817.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/ur2zln/article71681146.ece/alternates/LANDSCAPE_1200/Election_2_26_Climate_Policies_8_817.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/ur2zln/article71681146.ece/alternates/LANDSCAPE_660/Election_2_26_Climate_Policies_8_817.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/ur2zln/article71681146.ece/alternates/LANDSCAPE_320/Election_2_26_Climate_Policies_8_817.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    U.S. President Donald Trump. File\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681120\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>U.S. President Donald Trump vowed a political comeback on Sunday (November 8, 2026) after his Republican Party lost control of both houses of Congress in midterm elections that amounted to an unequivocal repudiation of his turbulent Presidency.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/opinion/editorial/trump-debacle-on-the-us-midterm-election-results/article71670096.ece\">\n\t\t\t\t\t\t\t\t\t\tTrump debacle: On the U.S. midterm election results</a></div><div class=\"picture\"></div></div></div><p>The devastating result leaves Mr. Trump politically hamstrung as he enters the remaining two-year 'lame duck' period of his White House tenure, while opening the door to multiple investigations by the Democrat-controlled Congress into the President, his family and senior members of his administration.</p><p>\"America took a giant step back in History with the results of the last Election,\" Mr. Trump said in a post on Truth Social, adding that the stock market that had grown during his tenure took a loss after the vote.</p><p>\"But have no fear, we will be back, BIGGER AND STRONGER THAN EVER BEFORE!\"</p><p>While the resounding election loss last Tuesday (November 3, 2026) has prompted soul-searching among Republican lawmakers, Mr. Trump has sounded defiant.</p><p>On Friday (November 6, 2026), he appointed hardline advisor Stephen Miller as his new chief of staff, signalling a bare-knuckle fightback.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/democratic-wins-in-stateag-races-give-trump-a-new-headache/article71680926.ece\">\n\t\t\t\t\t\t\t\t\t\tDemocratic wins in State AG races give Trump a new headache</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/hze93h/article71680944.ece/alternates/SQUARE_80/Election_2_26_Mississippi__2448.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAwEBAQAAAAAAAAAAAAAFBgEDBAIHAAEAAgMBAQAAAAAAAAAAAAAAAQUABAYCA//aAAwDAQACEA Robert Garcia, the ranking Democrat on the House Oversight Committee, took aim at Mr. Blanche, saying one role of Congress under the U.S. constitution is to hold the executive branch to account.</p><p>\"All he wants to do is protect Donald Trump, is protect Donald Trump's cabinet and administration officials. That is not his job,\" Mr. Garcia told <i>CNN</i>, vowing to stop corruption and investigate \"those that are committing crimes against the American public.\"</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/why-are-the-us-midterm-elections-significant/article71679440.ece\">\n\t\t\t\t\t\t\t\t\t\tWhy are the U.S. midterm elections significant?</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/wlwfpc/article71679444.ece/alternates/SQUARE_80/APTOPIX_Election_2_26_New_Hampshire_Senate_12184.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAwEBAQEAAAAAAAAAAAAEBQMGBwIBAAgBAAEFAQAAAAAAAAAAAAAAAAEAAgMEBQb/2gAMAwEAAhADEAAAABQ3Y/cMFTtPs4BB2CvOAEyGytcB6OqQ1SbkvMu3OsGlT0qddh5HAqo1hlQmeV6vzoqPqytrjS7The7bRgPV+2VkzqrMedis9Lf1xi846hDu9bzLROjir+44/qucfzsKcLnSOEk8bUwKrxUUh7tIZ1tVjpOR6JROTAFBZEsvnHTF/8QAJhAAAQQCAQQCAwEBAAAAAAAABAECAwUGEQAHEhMhFBUWIzFBUf/aAAgBAQABDACCBUlbv+W1ZWyUPzbBlhKs+NkxzRudVZI2apoQLOue2uAyCYd2Pfv+MoWUNlMBq8bmcGYl9A4d+MjEwzpPeucUdjxJLp1KvY1Y/F42EN8167jp8Xe6Byy3vGxo3apw8yaro6w4cdSJh7Closg/IB6jJEkq+oCS1kAxNb8k8nOgELf3xWwEmXPhujxiKqmKjawaWaTxxRSPfjOLDWnkU6weHJb0zhbFIxJJDIVhc2RzHMc1bAsiAmEMINxZdKeSmUY5TWAjICGX2QSdRpqV1f5KPGqgDH8uzPIY40aB1hr2TkVeRDpuK7yC+ocdxr6QJTH officially given opposition leader Gadi Eisenkot the first chance to form the next government.</p><p>After the formal announcement on Sunday evening (November 8, 2026), Mr. Eisenkot, who ran as Prime Minister Benjamin Netanyahu’s main rival, now has to launch complicated negotiations with potential coalition partners. He has six weeks to form a government.</p><p>The October 27 elections gave neither Mr. Netanyahu’s bloc nor Mr. Eisenkot a clear majority in parliament. Among the kingmakers — and most politically fraught potential allies — are the Arab-led parties. They made historic gains in the election and have been a target of Netanyahu and his allies</p><div class=\"also-read\"><p class=\"content\"><strong>ALSO WATCH </strong><a href=\"https://www.thehindu.com/videos/israel-netanyahu-rival-gadi-eisenkot-gets-first-chance-to-form-new-government/article71680535.ece\"> Israel: Netanyahu rival Gadi Eisenkot gets first chance to form new government</a></p><div class=\"picture video\"><a href=\"https://www.thehindu.com/videos/israel-netanyahu-rival-gadi-eisenkot-gets-first-chance-to-form-new-government/article71680535.ece\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"LANDSCAPE~LANDSCAPE~LANDSCAPE~LANDSCAPE\" data-src-template=\"https://th-i.thgim.com/public/incoming/gs0ith/article71680533.ece/alternates/SQUARE_80/israel.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAgMBAQAAAAAAAAAAAAAEBgUIAgMHAQABAAMBAQEBAAAAAAAAAAAAAAIDBAEFAAb/2gAMAwEAAhADEAAAAJ6HapP5PpJmp5j2AqS8J0xbOcFuiOZejvIjhHJG19ZZCxMKmYgWTqna2gQ4aWWWGw7RvpSw83YjiTHvpglWi1tU7W3RL66SKFGcr5FxUtImgkg0IrHzAxTrd0079dNvzAYE1rpW+BjYmv8AxrGvn964VmNvo+29Wbd0Apcv7gBtfHTYdkkz/8QAKRAAAgICAgIBAwMFAAAAAAAAAgMBBAUGABESEyEUMTMHFSIWQkVTVf/aAAgBAQABDACMhn7eJoQh .com/tag/244/\">\n                        World\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/333-244/\">\n                        Israel\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 16, "title": "Turkey, Azerbaijan leaders vow unity after tensions", "section": "International", "page": "", "teaser": "The Turkic-speaking allies describe their relationship as \"one nation, two states\" and, despite the friction, remain closely bound by military and energy ties", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681057\" data-title=\"Turkey, Azerbaijan leaders vow unity after tensions\" data-url=\"https://www.thehindu.com/news/international/turkey-azerbaijan-leaders-vow-unity-after-tensions/article71681057.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Turkic-speaking allies describe their relationship as \"one nation, two states\" and, despite the friction, remain closely bound by military and energy ties</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 08:44 pm IST - Shusha, Azerbaijan</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AFP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/5z4ez7/article71681079.ece/alternates/LANDSCAPE_1200/2026-11-08T133318Z_1975847592_RC2PJOADIRE7_RTRMADP_3_AZERBAIJAN-TURKEY.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/5z4ez7/article71681079.ece/alternates/LANDSCAPE_1200/2026-11-08T133318Z_1975847592_RC2PJOADIRE7_RTRMADP_3_AZERBAIJAN-TURKEY.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/5z4ez7/article71681079.ece/alternates/LANDSCAPE_660/2026-11-08T133318Z_1975847592_RC2PJOADIRE7_RTRMADP_3_AZERBAIJAN-TURKEY.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/5z4ez7/article71681079.ece/alternates/LANDSCAPE_320/2026-11-08T133318Z_1975847592_RC2PJOADIRE7_RTRMADP_3_AZERBAIJAN-TURKEY.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Turkish President Tayyip Erdogan and Azerbaijani President Ilham Aliyev hold hands during a press conference in Shusha, Azerbaijan, November 8, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681057\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Turkey's President Recep Tayyip Erdogan and Azerbaijan's President Ilham Aliyev vowed on Sunday (November 8, 2026) that their countries' alliance would remain solid, in a show of unity aimed at overcoming a public rift between the close neighbours.</p><p>Tensions flared in September, when Baku revised school uniform regulations to prohibit clothing deemed incompatible with secular education, effectively barring Islamic headscarves in classrooms.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/azerbaijan-slams-ally-israels-recognition-of-armenian-genocide/article71162775.ece\">\n\t\t\t\t\t\t\t\t\t\tAzerbaijan slams ally Israel’s recognition of Armenian genocide</a></div><div class=\"picture\"></div></div></div><p>Mr. Erdogan's government has dismantled restrictions on hijabs in Turkey.</p><p>Azerbaijan's move sparked protests at home and drew criticism from Mr. Erdogan's Islamist-rooted Justice and Development Party (AKP). Presidential adviser Oktay Saral demanded that Azerbaijan reverse the restrictions.</p><p>Mr. Aliyev's ruling party, Yeni Azerbaijan, denounced the comments as \"interference in Azerbaijan's internal affairs\".</p><p>Baku also declared 31 Turkish nationals, including an Opposition lawmaker and party leaders, persona non grata over critical social media posts.</p><p>Mr. Erdogan subsequently dismissed Mr. Saral, but Mr. Aliyev stayed away from an October 30 summit of Turkic leaders in Ankara — despite a personal invitation from Mr. Erdogan. Instead, he sent Foreign Minister Jeyhun Bayramov.</p><p>On Sunday (November 8, 2026), as Azerbaijan marked Victory Day commemorating a 2020 war with Armenia, Mr. Erdogan arrived in the country's Fuzuli district, which Baku recaptured from Armenian forces six years ago.</p><p>A guard of honour lined up at the airport, where Mr. Aliyev and First Lady Mehriban Aliyeva, welcomed Mr. Erdogan and his wife Ms. Emine.</p><p>\"With the permission of Almighty God, our unity will endure forever,\" Mr. Erdogan told a joint press conference with Mr. Aliyev.</p><p>\"This unity of hearts, which we describe with the motto 'One Nation, Two States,' is an everlasting torch that draws strength from our shared past and illuminates our future.\"</p><p>Mr. Aliyev said the alliance — \"an important factor across a vast geographical area\" — remained unshaken.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/opinion/editorial/rebuilding-ties-the-hindu-editorial-on-india-engaging-with-turkiye-and-azerbaijan/article70847837.ece\">\n\t\t\t\t\t\t\t\t\t\tRebuilding ties: On India engaging with Turkiye and Azerbaijan</a></div><div class=\"picture\"></div></div></div><p>\"Together, Azerbaijan and Turkey are even stronger,\" he said, adding that Mr. Erdogan's visit \"shows the whole world our unity\".</p><p>\"I am confident that this unity will last forever.\"</p><h4 class=\"sub_head\">'Deeper rift'</h4><p>Analysts say the quarrel reflects deeper unease over Baku's diplomatic independence and its close ties to Israel.</p><p>\"Azerbaijan-Turkey tensions stemmed from the fact that Baku does not see itself as the younger brother in this alliance and insists on relations between equal partners,\" Elkhan Shahinoglu, head of the Baku-based Atlas Research Centre, told <i>AFP</i>.</p><p>\"The hijab dispute is a symptom of a deeper rift,\" Gonul Tol, an analyst at the Washington-based Middle East Institute, wrote on X.</p><p>\"Tensions have long simmered over a number of issues including Azerbaijan's sovereignty, Ankara's influence in Baku, diverging policies toward Israel, and Turkey's rapprochement with Armenia.\"</p><p>Baku has forged strong military and economic ties with Israel, which supplied Azerbaijan with weapons during its 2020 war with Armenia over the breakaway Karabakh region.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/jaishankar-meets-azerbaijan-president-foreign-minister-as-india-attempts-reset-of-ties/article71617306.ece\">\n\t\t\t\t\t\t\t\t\t\tJaishankar meets Azerbaijan President, Foreign Minister as India attempts reset of ties</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/ciw8oz/article71617616.ece/alternates/SQUARE_80/20261023256L.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAwEBAQAAAAAAAAAAAAADBgIEBQEHAAEAAgMBAQAAAAAAAAAAAAAAAQMAAgQFBv/aAAwDAQACEAMQAAAAyp78tWddgwjgV7VtiToSTnuMTli1RkNpRcW/vARYjMosPKCBAxJJzsiT6lO2nWEdqLcmPcWWRba/K1KFmBDrFC0xqZLVFZGL+Wegr95VqgJYjkuzh509Ci39n6PXxbGLsV/QxX2F/c8H1fkP0Xzq6vR9zP3QP//EADoQAAEDAgMFBgMGBQUAAAAAAAECAxEABAUSIQYTMUFRFCJhcYGRB0KxFSMyocHhMzZj0fBDUmJysv/aAAgBAQABPwBVr3kafN+hrsvhRtfCjbaHSlIU5csWTTiWnXRAWoSAY0HrR2dxBDLRRco7QkqL4WuUoHyn2Bq3Um5bC0jUKKTRYHSiwOlKZEp050uxAW3p836GjZAcqVZDpRsZB05Vhh3e0qW1IYQ2SEOOPJ/hpAnMDykcKZwm0bxB7EhizC2LsLSwFyA6f9pkQIiKsLcvv3Dgt22Mzn8NsEAQCDx8aVZqHKjbKHKjaqKk6c6YbBt7fUq7wEnieNFsKEpgg8CKLYzFPzASRW60OnKsbwZ66bZurVGZ1LYStJ+YctOdNYbiLiEW92w8Wk5ihKe8nXjrPlVvYos2UiAFEgqPoaU2CY0npRYHSuzgFOnOmhmswiSCHCmRxHH+9KwlooCQ64EhOUcJAmeMU7ZW7buUvLQopJmOI1kz6/SksMpVBu5iCDmkdNfE8aYaaaQlS31wpknvdDOgE0myQlMN3qgkJPdB9ToDSrcLaCVXySFcZOnDxNC2TvUKF594oyJTr011puyfUDF8pQBykgH/ADnSbZ5l5CnLhTgPynhTSoecb/qIV7p/ahqkU9bNPGVokxEyRpXYmAAA3GXhBOlXy2bZFm2GFOuLhKEBeXTxJ86tbe3KFLQyptRKkKBOo61iNta2dqq53f4CB+MgCTEnw5mm7NpZ3RdZezIKg6wFAJJjTvTOhBBpphDKMqBAmf8AParnRxHnWIlgY+VMZ0pdQlRbW2UKSR4EcDP1ps9ylFIMSJiYnWiR41i2LWWIYxZYdZvMOXaElJ3hAbUSI3YUe7m4xOk6SDWFFoYe1unUOpMnOiIJnXhpxrabaDDMJtuzXjqy+6mW2mk5lHkD0GvWsU2lc2bYw5N7bb1x4OFTTSjKEhUZpVxlQOnhWDYva43Y9rtM4QFFCkuCFJI6+9XysozHkZpLFw0q2S/cJuXWSouLQrMEJIAAJHMnWPCmVhSJHA1dBCVoucqSpqQVRrkMZh+QPpV5mXY3CG53imlhMHmUmKZUUMok6cCJ4Gvh3iTtxeXtupUJ3aXVCOK5ylXhpHma+IF8he2RCDn7O20FD/kO8R+dbVYyMTxd24bXnbQhLbOugAH9ya+GWIHtt1alfdeZDoST8yTBj0NbQv7jCbh0fKgmtqMYbdwTD3cMUG27twwpAAyZUEkR1kCfKk7Qvb9TXbHc6VlJGRIjUjp5UvGrvKUrfeGkEFCeg/ejjzqYBu3gBpoE+P7VtfkaVYLat0FLqFKOVCUzok8vM+9fDq4P2jiG6twVC2E on fire; Sensex jumps 1,718 points, Nifty reclaims 25,000</a></b></strong></p><p>After starting the special trading session to mark the beginning of Hindu calendar Samvat 2083 on a bullish note, the 30-share BSE Sensex failed to sustain the rally. The barometer dipped 28.62 points, or 0.04%, to settle at 80,999.40, with 16 of its constituents ending higher and 14 lower. During the special session, it hit a high of 81,442.11, surging 414.09 points, or 0.51%.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/markets/stock-markets-extend-rally-in-early-trade-sensex-jumps-615-points/article71659466.ece\">\n\t\t\t\t\t\t\t\t\t\tStock markets extend rally in early trade; Sensex jumps 615 points</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/syqx8m/article71659474.ece/alternates/SQUARE_80/iStock-2260474979%203.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAyAAACAwEBAQAAAAAAAAAAAAADBQECBAAGBwEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAD5GHY29HyfM36Y2ggyoJBuvOD0XiFzNdOlri1hOZkNTn1TW4ZdK1Rl0Fb5dadgea5/MPOHQsdbF8qNRBullygrQ9wlSYqrY0nXmGFCziDtnqXxnPrw16+tzgFvGVms0G81e+uln//EACYQAAMBAAICAgIBBQEAAAAAAAECAwQFERITACEiMSMGFDJBURX/2gAIAQEAARIA0cbtzpR9OekkkQHE5Wsp9Ej4j9lorI90YFv+DS/XhBAv+vi5rWbs/agftppBg3sRiF7LQ1Gcf4ukb9FihtQIjE9/RMsIvoPQB7+/G/HQmjh2nN1APwcopzmGwPfvvyev9QzrxtpQU+yomnXqmX8606Hf38a0EX+NW6B+iraNHiilioH18/8AL0EKGH+R7JhhySVK6rElgCJo8gj0WP5deI+Ns0X4v8QxEqeIM56NFAB0vf2SWjP9dsf++21B0o6HxMdG7ajKvX2fiCEuvap6A7+Psmuf1Siq+49lk2sjP4pPwovRWVPYWewZux0BniI9FmVVI78RhNeKrKM6MfYvYw55QwrRmlIOSvfM 8P/aAAgBAwEBPwBnygfbfxOPnCDzOkIF2IUa72tJjbbUNXrCfyMDoBYjgmydI2Bgn1Ghx9dYXTd7NWeR1ikbVVFYuwVV5jTrGyPnyEL1j4vE5c7YjrVk8uFk+3Kb98r2VrU+XHjFyEZCSON+8wUhu+v8/wB3m8VGAVdFrv158zfaYfEqPEnKw0JJPf8AY+ZTwlgIGI1M3xJoTI54if/Z\"/></div></div></div><p>The 50-share NSE Nifty declined 43.95 points, or 0.18%t, to end at 24,986.40 after a positive beginning.</p><p>In the 30 Sensex firms, Mahindra &amp; Mahindra, InterGlobe Aviation, Trent, Infosys, Bharti Airtel and Axis Bank were among the biggest laggards. Sun Pharma, Tata Steel, Maruti and Power Grid were among the gainers.</p><p>Muhurat trading is a symbolic market session held on Deepavali, which also marks the beginning of the new Hindu calendar year. It is believed that trading during the 'Muhurat' or auspicious hour brings prosperity and financial growth for the stakeholders.</p><p>Unlike regular trading days, when equity markets operate from 9.15 a.m. to 3.30 p.m., Muhurat trading runs for a shorter period.</p><p>In the last Samvat Year 2082, the BSE benchmark has tumbled 3,398.32 points, or 4%, and the Nifty declined 838.25 points or 3.24%.</p><p>Meanwhile, Foreign Institutional Investors (FIIs) bought equities worth ₹13,749.82 crore on Friday (November 6, 2026), according to exchange data. The U.S. equity markets ended mostly higher on Friday (November 6).</p><p>On Friday (November 6), the Sensex jumped 1,718.01 points, or 2.17%, to settle at the day's high of 81,028.02. The Nifty rallied 493.75 points, or 2.01%, to end at the day's high of 25,030.35.</p><p>In the past seven consecutive sessions, the Sensex has surged 7,781.99 points, or 10.62%, and the Nifty rallied 2,331.5 points, or 10.27%.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 03:19 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class
