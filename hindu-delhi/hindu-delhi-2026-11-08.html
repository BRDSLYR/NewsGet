id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 27, "title": "Hawking, the celebrity theoretical physicist", "section": "Science", "page": "", "teaser": "On November 8, 2018, one of the earliest wheelchairs used by Stephen Hawking fetched a whopping sum of nearly £300,000, while a copy of his doctoral thesis fetched almost £585,000. How did a theoretical physicist turn into one of the most celebrated scientists of recent times? A.S.Ganesh gives you the answer with a brief look at his life and work…", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/sci-tech/\">\n                        Sci-Tech\n                    </a><meta content=\"Sci-Tech\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sci-tech/science/\">\n                        Science\n                    </a><meta content=\"Science\"/><meta content=\"3\"/></li><li aria-current=\"page\" class=\"breadcrumb-item kicker\"><span class=\"kicker-outline\">An eye for an i #673</span></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71630590\" data-title=\"Hawking, the celebrity theoretical physicist\" data-url=\"https://www.thehindu.com/sci-tech/science/hawking-the-celebrity-theoretical-physicist/article71630590.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">On November 8, 2018, one of the earliest wheelchairs used by Stephen Hawking fetched a whopping sum of nearly £300,000, while a copy of his doctoral thesis fetched almost £585,000. How did a theoretical physicist turn into one of the most celebrated scientists of recent times? A.S.Ganesh gives you the answer with a brief look at his life and work…</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 10:54 am IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/ganesh-as-273/\">A.S.Ganesh</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/2w0shz/article71630587.ece/alternates/LANDSCAPE_1200/2018-03-14T050705Z_250647580_RC1D04EEE400_RTRMADP_3_PEOPLE-HAWKING.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/2w0shz/article71630587.ece/alternates/LANDSCAPE_1200/2018-03-14T050705Z_250647580_RC1D04EEE400_RTRMADP_3_PEOPLE-HAWKING.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/2w0shz/article71630587.ece/alternates/LANDSCAPE_660/2018-03-14T050705Z_250647580_RC1D04EEE400_RTRMADP_3_PEOPLE-HAWKING.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/2w0shz/article71630587.ece/alternates/LANDSCAPE_320/2018-03-14T050705Z_250647580_RC1D04EEE400_RTRMADP_3_PEOPLE-HAWKING.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    British physicist Stephen Hawking delivers a lecture on \"The Origin of the Universe\" in Brussels in 2007.\n                                          | Photo Credit: REUTERS\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71630590\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>If the name “Stephen Hawking” immediately brings to your mind the image of a spectacled genius seated in his wheelchair, it is only natural. That’s how most of us think of the man who spent the bulk of his lifetime in a wheelchair. For more than a quarter of his life, however, English theoretical physicist Hawking didn’t require one. That came later.</p><p>Born on January 8, 1942 — with the world still embroiled in a war like no other — Hawking was the eldest of four siblings. He grew up in St Albans, England as a normal boy, a teen, and a young man, with nothing extraordinary to mark him out as a wunderkind.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 07:46 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data 2390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/topic/the-hindu-teen-digest/\">\n                        The Hindu Teen Digest\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/topic/The_Hindu_In_School/\">\n                        In School\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}];
const SECTIONS = [{"name": "Front Page", "ids": [0, 1, 2, 3, 4, 5, 6, 7]}, {"name": "National", "ids": [8, 9]}, {"name": "International", "ids": [10, 11, 12, 13, 14, 15, 16]}, {"name": "Business", "ids": [17, 18, 19, 20, 21]}, {"name": "Sport", "ids": [22, 23, 24, 25, 26]}, {"name": "Science", "ids": [27]}];

let currentSection = 0;
let articlePaneOpen = false;
const track = document.getElementById('pages-track');
const navInner = document.getElementById('nav-inner');
const pane = document.getElementById('article-pane');
const backBtn = document.getElementById('back-btn');

function syncThemeIcon() {
  const dark = document.documentElement.classList.contains('dark');
  document.getElementById('icon-sun').style.display  = dark ? 'block' : 'none';
  document.getElementById('icon-moon').style.display = dark ? 'none'  : 'block';
}

function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('th-theme', dark ? 'dark' : 'light');
  syncThemeIcon();
}

function buildUI() {
  SECTIONS.forEach((sec, si) => {
    const tab = document.createElement('div');
    tab.className = 'sec-tab' + (si === 0 ? ' active' : '');
    tab.textContent = sec.name;
    tab.onclick = () => goToSection(si);
    navInner.appendChild(tab);

    const page = document.createElement('div');
    page.className = 'section-page';
    page.id = 'page-' + si;

    const header = document.createElement('div');
    header.className = 'sec-header';
    header.innerHTML = `<h2>${sec.name}</h2><div class="art-count">${sec.ids.length} article${sec.ids.length !== 1 ? 's' : ''}</div>`;
    page.appendChild(header);

    sec.ids.forEach(aid => {
      const art = ARTICLES[aid];
      const row = document.createElement('div');
      row.className = 'article-row';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      row.setAttribute('aria-label', art.title);

      let metaHtml = '';
      if (art.page) metaHtml += `<span class="page-tag">P.${art.page}</span>`;
      metaHtml += `<span>${sec.name}</span>`;

      row.innerHTML = `
        <div class="art-meta">${metaHtml}</div>
        <div class="art-headline">${escHtml(art.title)}</div>
        ${art.teaser ? `<div class="art-teaser">${escHtml(art.teaser)}</div>` : ''}
        <div class="art-read-cue">Read &rsaquo;</div>
      `;
      row.onclick = () => openArticle(aid);
      row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openArticle(aid); };
      page.appendChild(row);
    });

    track.appendChild(page);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function goToSection(idx) {
  if (articlePaneOpen) return;
  currentSection = idx;
  track.style.transform = `translateX(${-idx * 100}vw)`;
  document.querySelectorAll('.sec-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  const activeTab = navInner.children[idx];
  if (activeTab) activeTab.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
}

function openArticle(aid) {
  const art = ARTICLES[aid];
  document.getElementById('pane-section').textContent = art.section;
  document.getElementById('pane-title').textContent = art.title;

  let metaHtml = '';
  if (art.page) metaHtml += `<span>Page ${art.page}</span>`;
  metaHtml += `<span>${art.section}</span>`;
  document.getElementById('pane-meta').innerHTML = metaHtml;

  const body = art.body || '<p><em>Content not available.</em></p>';
  document.getElementById('pane-body').innerHTML = body;

  const srcEl = document.getElementById('pane-source');
  srcEl.innerHTML = art.url
    ? `Read on thehindu.com: <a href="${escHtml(art.url)}" target="_blank" rel="noopener">${escHtml(art.url)}</a>`
    : '';

  pane.scrollTop = 0;
  pane.classList.remove('flying-out', 'flying-in');
  pane.classList.add('open');
  document.getElementById('pip-card').classList.remove('open');
  document.getElementById('blur-overlay').style.opacity = '1';
  document.getElementById('blur-overlay').style.pointerEvents = 'auto';
  articlePaneOpen = true;
  backBtn.style.display = 'flex';
  document.getElementById('section-nav').style.opacity = '0.4';
  document.getElementById('section-nav').style.pointerEvents = 'none';
  history.pushState({ article: aid }, '');
}

function pipArticle() {
  if (!articlePaneOpen) return;
  const sec  = document.getElementById('pane-section').textContent;
  const titl = document.getElementById('pane-title').textContent;
  document.getElementById('pip-sec').textContent   = sec;
  document.getElementById('pip-title').textContent = titl;
  pane.classList.remove('open');
  pane.classList.add('flying-out');
  pane.addEventListener('animationend', () => {
    pane.classList.remove('flying-out');
  }, { once: true });
  document.getElementById('blur-overlay').style.opacity = '0';
  document.getElementById('blur-overlay').style.pointerEvents = 'none';
  document.getElementById('pip-card').classList.add('open');
  articlePaneOpen = false;
  backBtn.style.display = 'none';
  document.getElementById('section-nav').style.opacity = '';
  document.getElementById('section-nav').style.pointerEvents = '';
}

function restoreArticle() {
  document.getElementById('pip-card').classList.remove('open');
  pane.classList.remove('open');
  pane.classList.add('flying-in');
  pane.addEventListener('animationend', () => {
    pane.classList.remove('flying-in');
    pane.classList.add('open');
  }, { once: true });
  setTimeout(() => {
    document.getElementById('blur-overlay').style.opacity = '1';
    document.getElementById('blur-overlay').style.pointerEvents = 'auto';
  }, 100);
  articlePaneOpen = true;
  backBtn.style.display = 'flex';
  document.getElementById('section-nav').style.opacity = '0.4';
  document.getElementById('section-nav').style.pointerEvents = 'none';
}

function closeArticle(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  pane.classList.remove('open', 'flying-out', 'flying-in');
  document.getElementById('pip-card').classList.remove('open');
  document.getElementById('blur-overlay').style.opacity = '0';
  document.getElementById('blur-overlay').style.pointerEvents = 'none';
  articlePaneOpen = false;
  backBtn.style.display = 'none';
  document.getElementById('section-nav').style.opacity = '';
  document.getElementById('section-nav').style.pointerEvents = '';
}

window.addEventListener('popstate', () => {
  if (articlePaneOpen) pipArticle();
  else closeArticle();
});

// Touch swipe on pages viewport
let touchStartX = 0, touchStartY = 0, swiping = false;
const viewport = document.getElementById('pages-viewport');

viewport.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  swiping = false;
}, { passive: true });

viewport.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!swiping && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
    swiping = true;
  }
  if (swiping) e.preventDefault();
}, { passive: false });

viewport.addEventListener('touchend', e => {
  if (!swiping || articlePaneOpen) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 45) {
    const next = currentSection + (dx < 0 ? 1 : -1);
    if (next >= 0 && next < SECTIONS.length) goToSection(next);
  }
}, { passive: true });

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (articlePaneOpen) pipArticle(); else closeArticle(); return; }
  if (e.key === 'ArrowRight' && currentSection < SECTIONS.length - 1) goToSection(currentSection + 1);
  if (e.key === 'ArrowLeft' && currentSection > 0) goToSection(currentSection - 1);
});

buildUI();
goToSection(0);
syncThemeIcon();
</script>
