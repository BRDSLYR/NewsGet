icletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 18, "title": "Adani Enterprises plans ₹35,000-40,000 crore annual capex in next two years", "section": "Business", "page": "", "teaser": "The planned spending comes as the group seeks to scale up businesses built over recent years, including airports and data centres, while bringing its large manufacturing investments closer to commercial operation.", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/business/\">\n                        Business\n                    </a><meta content=\"Business\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/business/Industry/\">\n                        Industry\n                    </a><meta content=\"Industry\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71680605\" data-title=\"Adani Enterprises plans ₹35,000-40,000 crore annual capex in next two years\" data-url=\"https://www.thehindu.com/business/Industry/adani-enterprises-plans-35000-40000-crore-annual-capex-in-next-two-years/article71680605.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The planned spending comes as the group seeks to scale up businesses built over recent years, including airports and data centres, while bringing its large manufacturing investments closer to commercial operation.</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 12:18 pm IST - New Delhi</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/533l9s/article71680616.ece/alternates/LANDSCAPE_1200/2026-10-28T090231Z_336130509_RC2H9BA6VGL7_RTRMADP_3_ADANI-ENTR-RESULTS.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/533l9s/article71680616.ece/alternates/LANDSCAPE_1200/2026-10-28T090231Z_336130509_RC2H9BA6VGL7_RTRMADP_3_ADANI-ENTR-RESULTS.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/533l9s/article71680616.ece/alternates/LANDSCAPE_660/2026-10-28T090231Z_336130509_RC2H9BA6VGL7_RTRMADP_3_ADANI-ENTR-RESULTS.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/533l9s/article71680616.ece/alternates/LANDSCAPE_320/2026-10-28T090231Z_336130509_RC2H9BA6VGL7_RTRMADP_3_ADANI-ENTR-RESULTS.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    FILE PHOTO: The logo of the Adani Group is seen on the facade of its Corporate House on the outskirts of Ahmedabad, India, November 21, 2024. REUTERS/Amit Dave/File Photo\n                                          | Photo Credit: AMIT DAVE\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680605\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Adani Enterprises Ltd. plans to spend between ₹35,000 crore and ₹40,000 crore annually over the next couple of years, with airports, data centres and its proposed PVC complex emerging as the biggest investment drivers as the conglomerate steps up expansion across its infrastructure businesses.</p><p>\"We expect to do capex at a run rate of around ₹40,000 crore. So, we may be somewhere in the range of Rs 35,000 crore to Rs 40,000 crore, which is the rate we expect to continue over the next couple of years,\" Manan Vakharia, head of finance at Adani Enterprises, said during the company's earnings call.</p><p>The planned spending comes as the group seeks to scale up businesses built over recent years, including airports and data centres, while bringing its large manufacturing investments closer to commercial operation.</p><p>\"The heavy lifting will be done by airports, data centres and PVC,\" Mr. Vakharia said.</p><p>Adani Enterprises, the flagship incubator of the Adani Group, reported its highest-ever half-year EBITDA of ₹11,958 crore for the six months ended September 2026, an increase of 56% from a year earlier.</p><p>Consolidated income rose 62% to Rs 71,569 crore, while profit before tax from continuing operations increased 45 per cent to Rs 3,297 crore.</p><p>Chief Executive Officer Arun Bansal said the company was progressively moving from a \"build-out phase to value realisation phase\", as investments made over the past few years begin contributing more meaningfully to earnings.</p><p>The airport business and data centres are central to that transition. Adani Airport Holdings reported a 52% increase in first-half EBITDA to ₹3,275 crore, while AdaniConneX, its data-centre joint venture, has expanded its contracted capacity to more than 1.2 gigawatts.</p><p>AdaniConneX signed a new 240-megawatt hyperscale contract during the September quarter. Its operational capacity stood at 94.6 MW after handing over an additional 29.2 MW to customers during the period.</p><p>The company expects operational capacity to reach 120-150 MW by the end of the current financial year and approach 500 MW over the following 12-18 months, when the facilities are expected to begin generating billing revenue.</p><p>Of the 1.4 GW of data-centre capacity being developed, 1.2 GW has already been tied up and is at different stages of implementation and construction, its management said.</p><p>The airport portfolio, which comprises eight airports, including Navi Mumbai International Airport, accounts for about 23% of India's passenger traffic and 29% of its air cargo volumes, according to the company officials.</p><p>Adani Airport Holdings handled 21.3 million passengers in the September quarter. Its revenue rose 20% year-on-year to ₹3,786 crore, while EBITDA increased 55% to ₹1,641 crore. Non-aeronautical revenue grew 57%, significantly faster than the 9% increase in aeronautical revenue.</p><p>Navi Mumbai International Airport began international operations on July 15.</p><p>The Management expects the airport to reach its full annual capacity of 20 million passengers by the end of FY28, supported by the expansion of domestic and international routes and the transfer of some international flights from existing Mumbai airports.</p><p>The company's other major investment is a 1-million-tonne-per-annum PVC manufacturing complex at Mundra, Gujarat, involving capital expenditure of about ₹26,000 crore.</p><p>Around 60% of the project spending and construction has been completed, and the first part of the complex is expected to be commissioned in the next financial year. The facility will also include related chemicals and chlor-alkali operations.</p><p>Separately, Adani Enterprises has completed the expansion of its solar module manufacturing capacity to 10 GW and expects to commission 6 GW of solar cell capacity by the end of the current financial year. The company sold 1,478 MW of solar modules in the September quarter, up 35% from a year earlier.</p><p>The proposed investment cycle will require the company to balance expansion with project execution and the generation of returns from newly commissioned assets.</p><p>Management did not provide a specific EBITDA forecast for FY27. PTI ANZ BAL</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 12:18 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680605\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/adani-enterprises-plans-35000-40000-crore-annual-capex-in-next-two-years/article71680605.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-un KCB6FSkiPRBlWbUejqB3RAQaSaX//2Q==\"/></div></div></div><p>\"The country needs oil sector companies to focus more on the shipping area now,\" Mr. Jain said, adding that IOC was also exploring the possibility of building ships in India under the government's Make in India initiative.</p><p>The move marks a potential shift in the company's shipping strategy, which has traditionally relied on a mix of time-charter and voyage-chartered vessels. IOC is now examining three approaches: optimising existing charter arrangements, owning ships and supporting domestic shipbuilding.</p><p>The importance of securing shipping capacity has increased as geopolitical tensions in West Asia disrupt commercial movement near the Strait of Hormuz, pushing up freight rates and war-risk insurance costs.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/indian-refiners-fuel-exports-to-west-surge-43-amid-russian-crude-imports/article71599323.ece\">\n\t\t\t\t\t\t\t\t\t\tIndian refiners’ fuel exports to West surge 43% amid Russian crude imports</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/news/national/4smlvw/article71599332.ece/alternates/SQUARE_80/iStock-471824724.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAACAgMBAAAAAAAAAAAAAAADBAUGAQIHAAEAAwEBAAAAAAAAAAAAAAAAAQIEAAP/2gAMAwEAAhADEAAAAO15DmWo/g5INqIew0RPT04lki9eQMg259DeFkqSDmKwdSuw8a62yuaDyrI7KqL2lswj+zlYna2V51JVWYpj7eXnlqmsypB7UyPytfU2ttAkKTh6DsMA/OzX7ivWk61YdTdqjsW1ejUaxoRwyFSOHDIWZZBG/8QANBAAAgEDAwMBBgQFBQAAAAAAAQIDAAQRBRIhBjFBExQiUWFxoQcVYoEQMkKRsSMzcs  compared to spot-market rates of as much as $8-10 per barrel.</p><p>LPG freight rates, which would normally be around $40 per tonne, have risen to $160-180 per tonne in the spot market, he said.</p><p>The shipping strategy is part of a broader effort to diversify crude procurement and reduce exposure to supply disruptions. IOC sourced 55% of its crude requirements from Russia during the first half of the current financial year, while Middle Eastern supplies accounted for 24%, Mr. Jain said.</p><p>Africa contributed about 10%, Brazil 7%, the United States 2-5% and Venezuela 3-4%.</p><p>The company has also substantially increased its reliance on spot purchases. Spot imports accounted for about 87% of crude sourcing in the first half of FY27, compared to around 50% in the previous financial year.</p><p>Mr. Jain said the company had been able to negotiate discounts against benchmark prices even as global crude markets remained volatile. The premium or discount paid over benchmark crude during the September quarter ranged from a discount of $5 per barrel to a premium of $12 per barrel, compared to a range of zero to $18 per barrel in the preceding quarter.</p><p>IOC has continued to buy Russian crude at what it described as optimal prices and has also been processing Venezuelan crude.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/iocl-chairman-laments-limited-investment-in-energy-innovations-commits-to-fund-start-ups-in-hydrogenmobility-space/article71425085.ece\">\n\t\t\t\t\t\t\t\t\t\tIOCL chairman laments limited investment in energy innovations, commits to fund start-ups in hydrogen,mobility space</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/business/6uw2e4/article71425236.ece/alternates/SQUARE_80/s                  </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/business/\">\n                        Business\n                    </a><meta content=\"Business\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/business/Industry/\">\n                        Industry\n                    </a><meta content=\"Industry\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71677462\" data-title=\"Kishore Biyani, Future Retail and the ₹904-crore bank fraud case: What led to the Group’s collapse?\" data-url=\"https://www.thehindu.com/business/Industry/kishore-biyani-future-retail-cbi-defrauding-charges-reliance-amazon-deal/article71677462.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Kishore Biyani’s Future Group witnessed meteoric rise before mounting financial troubles pushed it into insolvency</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:39 am IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/the-hindu-bureau-14355/\"> The Hindu Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/4so72/article71677487.ece/alternates/LANDSCAPE_1200/IMG_wp-bmfgi-bmfgiGLP925_2_1_1P9E0J24.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/4so72/article71677487.ece/alternates/LANDSCAPE_1200/IMG_wp-bmfgi-bmfgiGLP925_2_1_1P9E0J24.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/4so72/article71677487.ece/alternates/LANDSCAPE_660/IMG_wp-bmfgi-bmfgiGLP925_2_1_1P9E0J24.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/4so72/article71677487.ece/alternates/LANDSCAPE_320/IMG_wp-bmfgi-bmfgiGLP925_2_1_1P9E0J24.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Kishore Biyani. File\n                                          | Photo Credit: The Hindu\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71677462\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The Central Bureau of Investigation’s (CBI) recent charges against <a href=\"https://www.thehindubusinessline.com/companies/how-retail-raja-biyani-lost-his-crown/article62188132.ece\" target=\"_blank\">Future Retail Limited (FRL) promoters Kishore Biyani</a> and others, for allegedly <a href=\"https://www.thehindu.com/business/Industry/cbi-books-future-retail-kishore-biyani-others-in-904-crore-bank-fraud-case-searches-conducted-in-mumbai/article71675017.ece\" target=\"_self\">defrauding the State Bank of India (SBI) of ₹904.32 crore</a>, has turned the spotlight again on the beleaguered leaders. Hailed as an industry leader in driving India’s consumption in retail sector, Mr. Biyani’s leadership steered Future Group’s meteoric rise before mounting financial troubles pushed it into insolvency.</p><p>Amid such complexities, Mr. Biyani’s role as FRL’s promoter was marred by a complex legal battle between Amazon and Reliance in 2022. After Reliance backed out of the deal running into thousands of crores, Future Retail had no option but to file for liquidation before the National Company Law Tribunal (NCLT) in 2023.</p><h4 class=\"sub_head\">The story so far</h4><p>The CBI conducted searches at multiple premises linked to the company’s promoters and directors in Mumbai on Friday (November 6, 2026), and seized documents relevant to the investigation. The case was registered following a complaint filed by SBI’s Stressed Assets Management Branch-III in Mumbai.</p><p>The bank alleged that the company failed to utilise the sanctioned funds in accordance with the terms and conditions of the loan facilities. Instead, portions of the funds were allegedly diverted to associate companies and related entities, raising suspicions of financial irregularities.</p><h4 class=\"sub_head\">Failed decisions</h4><p>During the mid- to late-2000s, <a href=\"https://www.thehindu.com/business/at-the-end-of-the-road-the-status-of-the-future-group/article65360298.ece\" target=\"_self\">Future Group</a> was firmly established as the country’s largest retailer and dubbed a “hypergrowth” company that would easily ride India’s consumption boom for years to come, as per a <i>The Hindu Businessline </i>report. At the time, Mr. Biyani felt a few more years of protection from foreign competition would allow Indian retailers to grow much bigger and command better valuations when FDI came in.</p><p class=\"referpara\"><strong>\n        Read More : <b><a href=\"https://www.thehindubusinessline.com/companies/how-wrong-choices-led-to-the-dismantling-of-future-groups-retail-empire/article65229966.ece\" target=\"_blank\">How wrong choices led to the dismantling of Future Group’s retail empire</a></b></strong></p><p>However, according to the <i>Businessline </i>report, if the Future Group had pushed for FDI reforms, it would have attracted several global suitors. A series of partnerships with global firms may have infused cash to sustain further in the market. As e-commerce businesses quickly gained traction, Mr. Biyani struggled with his retail business.</p><p>Doubtful about the financial sustainability of the prevailing e-commerce model, Mr. Biyani opted instead to open hundreds of new small-format supermarkets. By 2015, Future took a leap and operated 218 Bazaar stores, proposing that stores within a two-kilometre radius of every neighbourhood in cities would cater to the consumer’s needs better than e-commerce giants.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/Industry/future-retail-files-caveat-before-delhi-high-court-against-any-early-move-by-amazon/article33012712.ece\">\n\t\t\t\t\t\t\t\t\t\tFuture Retail files caveat before Delhi High Court against any early move by Amazon </a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/business/Industry/qw6gz0/article31979014.ece/alternates/SQUARE_80/THNAKFUTURERETAIL-MampAAMAZONCOM\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIy PP8AmfOaiGU7HkEvBiBc5RIPQT3AxnN8YehxesQH7dAfRDVmEhtGja480885CRKSXf8A8xJx+IQ655x0AaoZRKabPtHHSpXqicT4mVy3oIbKT84eWAnGtxR3nMH8BE7j7OnO5DLK9KrfjpfmYsYfhH0epxO8K+Z+XEDA4C+f24kjU2Cq15miBArRZLzxvNEcIvRI3DI1xSL77cWRh7LxH+ZlVoxqP+XeLCm26Sa/i4aofY004l04B4Im3Nu4L4XjHSICmpNeR6zVEgsUIofvABDIHDq+4IXNoHyuAsVsl4eL7mqAAqaeq8fuZXsTyJDkEpZxzvF3dTBrvW2PuKO4Agbgu3x63jBCXKJN37/xiEyNCt2euLU6gAK6bx6llG0/BiIWOIC7pm4WASA77cMQ81Maa/7/AHi2bgaPudtyeECqqXvOOCEROt8Uj/HWSlJGLWBKyh2J2ORU1NsJ/rWBpGIgkb4GCMRNlejjOYmFiJkK+YQBOuwGCaGhwzAqK4MxLHfDzgGxA/AMpkYpBBxa54y8nnUjX8YnRMQLChXgVP1hFhZQmcb1iM1KqPlcrfeIRw6C9N7Q9ycRZew/1cFA+mbfjJp4q00bu3jNoDE1vWf/xAAjEQACAgEDBAMBAAAAAAAAAAAAAQIRAwQhQRIxUWEiMoGh/9oACAECAQE/AHKtqG0U0vRF/gnfJtdWRTf13Mkai3W4n4IsuuDQNdLaGl3NZiUZKS5E/Z8u1mkdSMrbi1F7mdxWLo6rf9EvIkjSQtuiMWuDPBxyOyj/xAAgEQACAgEEAwEAAAAAAAAAAAAAAQIRAwQSIUEQMYGh/9oACAEDAQE/AK7RGxMaGimN17IytpXx8KGiuzWJ7lYm1waXJui4vrxx7NUriYqU05Lgw7pZdyVL88cmrlSVkpJmnkpY1RZ//9k=\"/></div></div></div><p>Mr. Biyani offered Bharti a 10 per cent stake in the group and a seat on the board to Rajan Bharti Mittal. Future hoped to tap into Airtel’s then 250 million subscribers with Future apps preloaded on Airtel SIM cards and crosspollinate customer loyalty programmes.</p><h4 class=\"sub_head\">Amazon-Reliance Imbroglio</h4><p>The company recorded staggering losses during the Covid-19 pandemic due to rising logistical price, warehouse management, and rent dues. Amid this, Reliance Retail Ventures Ltd’s (RRVL) announced the acquisition of Future Group’s retail, wholesale, logistics and warehousing businesses. As per an announcement made in August 2020, entities of Reliance were to acquire retail and warehousing assets of the Future Group for ₹24,713 crore. Alongside, Reliance was to invest a further ₹2,800 crore in Future Enterprises for a 13% stake.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/49-players-including-reliance-adani-jindal-power-show-interest-in-future-retail/article66721083.ece\">\n\t\t\t\t\t\t\t\t\t\t49 players including Reliance, Adani &amp; Jindal Power show interest in Future Retail</a></div><div class=\"picture\"></div></div></div><p>This was vehemently opposed by U.S.-based e-commerce major Amazon, claiming that it violated contractual arrangements made when it invested in Future Group’s promoter entity in 2019.</p><p>Unfortunately, the deal with Reliance fell apart later after <a href=\"https://www.thehindu.com/business/Industry/reliance-calls-off-24731-crore-deal-with-future-retail/article65347874.ece\" target=\"_self\">secured creditors of the Future Group cited legal challenges</a> to the proposed transaction and the lack of clarity over the outlook for the deal.</p><p class=\"referpara\"><strong>\n        Also Read : <b><a href=\"https://www.thehindu.com/business/Industry/reliance-takes-control-of-about-200-future-retail-stores-offers-jobs-to-staff/article65088003.ece\" target=\"_blank\">Reliance takes control of about 200 Future Retail stores, offers jobs to staff</a></b></strong></p><p>However, amid the legal battle between Amazon and Future Group, landlords of a large number of stores had reportedly approached Reliance to get the lease agreements transferred to its (Reliance) name as Future was unable to pay the rents. The Reliance arm took over the stores. But the Future Group termed that it was a “hostile takeover by Reliance to acquire the assets by not paying the agreed-upon amount”.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:39 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71677462\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/kishore-biyani-future-retail-cbi-defrauding-charges-reliance-amazon-deal/article71677462.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/indian-railways/\">\n                        India\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/692-684/\">\n                        business (general)\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/605-601-600/\">\n                        fraud\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/600/\">\n                        crime, law and justice\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 21, "title": "10 years since demonetisation: Cash usage unchanged, fake notes on the rise", "section": "Business", "page": "", "teaser": "This Deepavali marks 10 years since Prime Minister Narendra Modi announced overnight demonetisation of 86% of the country’s cash. Data shows some stated aims of the move remain largely unmet", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/business/\">\n                        Business\n                    </a><meta content=\"Business\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71673986\" data-title=\"10 years since demonetisation: Cash usage unchanged, fake notes on the rise\" data-url=\"https://www.thehindu.com/business/10-years-since-demonetisation-cash-usage-unchanged-fake-notes-on-the-rise/article71673986.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">This Deepavali marks 10 years since Prime Minister Narendra Modi announced overnight demonetisation of 86% of the country’s cash. Data shows some stated aims of the move remain largely unmet</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 11:06 am IST - New Delhi</span></p></div><div class=\"author\"><div class=\"aut-img author-img picture\"><a class=\"lnk\" href=\"https://www.thehindu.com/profile/author/t-c-a-sharad-raghavan-2252/\"></a></div><div class=\"author-name\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/t-c-a-sharad-raghavan-2252/\">T.C.A. Sharad Raghavan</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/news/national/lgtow2/article71678816.ece/alternates/LANDSCAPE_1200/iStock-806907204.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/news/national/lgtow2/article71678816.ece/alternates/LANDSCAPE_1200/iStock-806907204.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/news/national/lgtow2/article71678816.ece/alternates/LANDSCAPE_660/iStock-806907204.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/news/national/lgtow2/article71678816.ece/alternates/LANDSCAPE_320/iStock-806907204.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Representational image.\n                                          | Photo Credit: Getty Images/iStockphoto\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71673986\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Ten years after<a href=\"\" target=\"_self\"> demonetisation</a>, Reserve Bank of India (RBI) data show that the exercise has had little impact on reducing cash in circulation and that detection of counterfeit notes, particularly ₹500 notes, has also increased.</p><p>On the other hand, the value of transactions on the Unified Payments Interface (UPI) has grown steadily year after year, even when measured as a percentage of India’s Gross Domestic Product (GDP).</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 05:08 am IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71673986\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/10-years-since-demonetisation-cash-usage-unchanged-fake-notes-on-the-rise/article71673986.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid05, publisher: The Hindu --></div><div class=\"d-block d-sm-none\"><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_MWeb_AT_Middle01\" id=\"MWeb_AT_Middle01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetyp : 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/zbqiso/article71681149.ece/alternates/LANDSCAPE_660/0J6A8182.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/zbqiso/article71681149.ece/alternates/LANDSCAPE_320/0J6A8182.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Vaishnavi Adkar and Rutuja Bhosale with Swiss duo of Simona Waltert and Naima Karamoko.\n                                          | Photo Credit: Ragu R.\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681151\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The dream run of Vaishnavi Adkar and Rutuja Bhosale ended in a runner-up finish at the WTA 250 Chennai Open on Sunday (November 8, 2026) as the home favourites went down 2-6, 0-6 to the Swiss duo of Simona Waltert and Naima Karamoko in the final.</p><p>Vaishnavi, 21, and Rutuja, 30, had already created history by becoming the first-ever all-Indian pair to reach the final of a WTA Tour event. They were looking to join former World No. 1 Sania Mirza and Ankita Raina on the list of Indian titlists at this level.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sport/adkar-bhosale-become-first-all-indian-pair-to-reach-wta-tour-doubles-final/article71678367.ece\">\n\t\t\t\t\t\t\t\t\t\tAdkar-Bhosale become first all-Indian pair to reach WTA Tour doubles final</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/pnkcbr/article71678396.ece/alternates/SQUARE_80/DSC_0168.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJC CAggHAAAAAAAAAAABAAIDBBEhElEFMRATFEFhcZHwFUKBkqGxwf/aAAgBAgEBPwCeXqmalV8QfHSOlbzC4XW1Ug1Ps4HlkBRzl5AsPUHodPO4WLVUNkmidEW4P7UE80EzdJxt3KgkmeTKM7eHu662p26JKuWIOlYRpN7A3JJ/mfZUhDC0ONzYAe/P8qmkr6A6hHdjh9PPwwoZWyxiRvI5Qq6N1SJu0Y2vjZH4dISRIPu797XtdT01K/iMUbSNIBJzffF/NRBrWBrTeyAAFgjBMPlK0SjmCi0hmonKEjxyKbVzt5PPqv/EACcRAAICAQMCBQUAAAAAAAAAAAECAAMRBBIhMUETIlFhwRCBobHw/9oACAEDAQE/AK03tiU6VWuCes1WnqU7QMEe0asKM/ExBVWOQZXtrcOD0jrXZSxYc+veXIg8pnh1fRdOGZU78ZMCtaGK9M5MsTTahSC+GH9iMu0kTbYKimz794GvUAY/EpuuXR2MepOP18R8lixnWcTAm/yeH75m2FMz/9k=\"/></div></div></div><p>Former Doubles World No. 1 Rohan Bopanna, who is Vaishnavi’s mentor and had won the mixed doubles gold with Rutuja at the Hangzhou Asian Games, came down from the stands to the players’ box to encourage the two though the second essay turned out to be completely one-sided. World No. 99 Karamoka showed why she was the best doubles player on the court with her impressive poaching skills on multiple occasions while Waltert, predominantly a singles player, kept things solid from the baseline.</p><p>Karamoko won her maiden Tour-level title while for Waltert, it was her second after the triumph in Lausanne in 2021 with compatriot Susan Bandecchi.</p><p>“We played together for the first time and won the title, so it couldn’t be better. I really hope we can play some more weeks together and we’ll try to enjoy this one as long as possible,” said the 29-year-old Karamoko.</p><p>“It’s amazing to win a title and to actually finish the last tournament of the season like this. We  played at a great level throughout the week. We got used to each other a bit more and yes, it was a really fun game to spend the week together and I’m looking forward to many more matches with Naima,” added Waltert.</p><p>The doubles final began at 4 p.m. but the Deepavali fireworks had already started. Playing in such an atmosphere was a challenge for the Swiss duo. “Actually, we have never played in such a situation. You can still hear them (the fireworks) now. It was a bit disturbing at the beginning of the week and now, we almost don’t hear them anymore,” said Karamoko.</p><p>“They (the organisers) also told us that it’s going to be the worst today (in terms of fireworks). So, we were also prepared and that’s how we adapted and dealt with it,” added the 25-year-old Waltert.</p><p>Champions Karamoko and Waltert received USD 13,600 while runners-up Vaishnavi and Rutuja earned USD 7,650 in prize money. Aadhav Arjuna, Tamil Nadu’s Minister for Public Works and Sports Development, presented the two pairs with their respective trophies.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:29 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681151\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/wta-chennai-open-vaishnavi-and-rutuja-settle-for-runners-up-finish/article71681151.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\">< div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/1569/\">\n                        sport\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 23, "title": "Anuj Shrivatri becomes India’s 100th chess Grandmaster", "section": "Sport", "page": "", "teaser": "The 22-year-old won the 7th ASEAN+ Individual Open chess championship in Ozamiz City, the Philippines", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681083\" data-title=\"Anuj Shrivatri becomes India’s 100th chess Grandmaster\" data-url=\"https://www.thehindu.com/sport/anuj-shrivatri-becomes-indias-100th-chess-grandmaster/article71681083.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The 22-year-old won the 7th ASEAN+ Individual Open chess championship in Ozamiz City, the Philippines</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 09:10 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name lnk\" href=\"https://www.thehindu.com/profile/author/sports-bureau-307/\">Sports Bureau</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/buu5dl/article71681086.ece/alternates/LANDSCAPE_1200/HWmurP4akAATrZL.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/buu5dl/article71681086.ece/alternates/LANDSCAPE_1200/HWmurP4akAATrZL.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/buu5dl/article71681086.ece/alternates/LANDSCAPE_660/HWmurP4akAATrZL.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/buu5dl/article71681086.ece/alternates/LANDSCAPE_320/HWmurP4akAATrZL.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Anuj Shrivatri also became the first GM from Madhya Pradesh. Credit: X/@ChessbaseIndia\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681083\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Anuj Shrivatri on Sunday (November 8, 2026) became India’s 100th chess Grandmaster, by winning the 7th ASEAN+ Individual Open chess championship in Ozamiz City, the Philippines.</p><p>The 22-year-old Anuj also became the first GM from Madhya Pradesh. He won the tournament with seven points from nine rounds after suffering a loss in the opening round. His triumph enabled him earn the GM title.</p><p>The legendary Viswanathan Anand had become the country’s first Grandmaster in 1988. </p><p>The wait for the 100th GM was watched intently after S. Aswath and V.S. Rathanvel recently became the 98th and 99th GMs respectively.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 09:10 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681083\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/anuj-shrivatri-becomes-indias-100th-chess-grandmaster/article71681083.ece\"></s \"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 24, "title": "Pakistan beat India by three wickets in U-19 Asia Cup", "section": "Sport", "page": "", "teaser": "India were bowled out for a modest 208 and Pakistan, after a top-order wobble, managed to complete the chase, with Hamza Zahoor taking the team home with an excellent, unbeaten 100 off 108 balls after coming in at number seven", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71680996\" data-title=\"Pakistan beat India by three wickets in U-19 Asia Cup\" data-url=\"https://www.thehindu.com/sport/pakistan-beat-india-by-three-wickets-in-u-19-asia-cup/article71680996.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">India were bowled out for a modest 208 and Pakistan, after a top-order wobble, managed to complete the chase, with Hamza Zahoor taking the team home with an excellent, unbeaten 100 off 108 balls after coming in at number seven</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 07:13 pm IST - Al Amerat (Oman)</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/2w49zi/article71681019.ece/alternates/LANDSCAPE_1200/arjun%20rajput.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/2w49zi/article71681019.ece/alternates/LANDSCAPE_1200/arjun%20rajput.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/2w49zi/article71681019.ece/alternates/LANDSCAPE_660/arjun%20rajput.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/2w49zi/article71681019.ece/alternates/LANDSCAPE_320/arjun%20rajput.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Arjun Rajput top-scored for India with an aggressive 107 off 85 balls, and his knock included 11 fours and five sixes. File\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680996\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Pakistan defeated India by three wickets in their men's U-19 Asia Cup match in Oman on Sunday (November 8, 2026).</p><p>India were bowled out for a modest 208 and Pakistan, after a top-order wobble, managed to complete the chase, with Hamza Zahoor taking the team home with an excellent, unbeaten 100 off 108 balls after coming in at number seven.</p><p>Earlier, Arjun Rajput top-scored for India with an aggressive 107 off 85 balls, and his knock included 11 fours and five sixes. Both Aryavir Sehwag (22) and Anvay Dravid (10) were dismissed cheaply.</p><p>Manal Chauhan picked up 3/32 in 10 overs for India.</p><h4 class=\"sub_head\">Brief scores:</h4><p>India U-19: 208 in 46.3 overs (Arjun Rajput 107, Ali Raza 3/37).</p><p>Pakistan U-19: 209/7 in 48.1 overs (Hamza Zahoor 100 not out; Manal Chauhan 3/32).</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 06:52 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680996\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/pakistan-beat-india-by-three-wickets-in-u-19-asia-cup/article71680996.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></d 30% in challenge to Infantino", "section": "Sport", "page": "", "teaser": "‘I've been contacted by presidents and international department officials from eight countries, including some outside Asia,’ said Japan Football Association Honorary President Kozo Tashima", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/football/\">\n                        Football\n                    </a><meta content=\"Football\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71680897\" data-title=\"Japan’s Tashima rates FIFA election chances at 20%-30% in challenge to Infantino\" data-url=\"https://www.thehindu.com/sport/football/japans-tashima-rates-fifa-election-chances-at-20-30-in-challenge-to-infantino/article71680897.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">‘I've been contacted by presidents and international department officials from eight countries, including some outside Asia,’ said Japan Football Association Honorary President Kozo Tashima</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 05:06 pm IST </span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\">Reuters</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/gt2wgz/article71680900.ece/alternates/LANDSCAPE_1200/2026-11-05T130135Z_1464987174_RC2TCX9KCPJU_RTRMADP_3_SOCCER-FIFA-TASHIMA.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/gt2wgz/article71680900.ece/alternates/LANDSCAPE_1200/2026-11-05T130135Z_1464987174_RC2TCX9KCPJU_RTRMADP_3_SOCCER-FIFA-TASHIMA.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/gt2wgz/article71680900.ece/alternates/LANDSCAPE_660/2026-11-05T130135Z_1464987174_RC2TCX9KCPJU_RTRMADP_3_SOCCER-FIFA-TASHIMA.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/gt2wgz/article71680900.ece/alternates/LANDSCAPE_320/2026-11-05T130135Z_1464987174_RC2TCX9KCPJU_RTRMADP_3_SOCCER-FIFA-TASHIMA.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Japanese national team's head coach Hajime Moriyasu and Japan Football Association President Kozo Tashima. File\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680897\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Japan Football Association Honorary President Kozo Tashima said governance was FIFA's biggest problem as he outlined his ​platform for next year's presidential election, while rating his chances of ‌unseating incumbent <a href=\"https://www.thehindu.com/sport/football/gianni-infantino-the-master-of-ceremonies/article66220054.ece\" target=\"_self\">Gianni Infantino</a> at 20% to 30%.</p><p class=\"referpara\"><strong><b>Also read | </b><a href=\"https://www.thehindu.com/sport/football/infantino-says-hes-supported-by-vast-vast-majority-of-football-ahead-of-fifa-elections/article71620231.ece\" target=\"_blank\">Infantino says he’s supported by ‘vast, vast majority’ of football ahead of FIFA elections</a></strong></p><p>Mr. Tashima ​announced on Thursday (November 5, 2026) that he intended to run ⁠in the March election, becoming the first Japanese candidate to seek world football's top job.</p><p>The 68-year-old former Japan international has served on ‌the FIFA Council since 2015 and became JFA president the following year before being succeeded by Tsuneyasu ‌Miyamoto in 2024.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sport/football/gianni-infantino-to-run-for-re-election-despite-failed-world-cup-sell-off-plan/article71437504.ece\">\n\t\t\t\t\t\t\t\t\t\tGianni Infantino to run for re-election despite failed World Cup sell-off plan</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/inco QDII0aljqEVlxgEjAJ/X+2vaGip01Tds/al5Hn7raMjhGQMdh5K+WgDo6st7uFhrkrLdUvDKp/KeG+BHmNVd1sPVbs9wtj0N4lOBVUDKkUjH80qMcd+5XH11cejr7ayploZJYZF3RywfeKw9fdzr8x9dWKRouoLcyfiMu0fXjV1YyXSsYnJM78/7jrrKqep6NskhIPilWY/Hw/8AJ0edZGjrBx6DSg9+w1FWVEZIjkZARyVOC2O2T3Py7auVBNa7rU0M+PFp5DG205BI8x8NUcng3Cil/kmQ/wBdV+Tcqk+szn/kdXev8fpOw02eYxIT9CFGiedGpc0/gqkaoQAdqDJ+Z+mguTj9dU9vV6ZZC0e5hxuPbVRSTR4TaGZjwUHGhTsHKjnAxr2n2oUnUMVdGPuq2FW7fnX3W/Y/XRJ258xz+mqhg9TK/qxOnlZoY0J4jBCj5nOgudDk8aVckAeZ1a+kJLjRUUkMj5qqmSm4AxHtGdxzyRjnj0OqroSmntkYp4aOnq5iqxu6shGT3wGIPAPHx8tXywSWWKmqI62mrYKneI5oNwwVOGBB1//EAB4RAAICAgIDAAAAAAAAAAAAAAABAhEDIRASMUFR/9oACAECAQE/AGklbNUQSj4GvZRluyLbI8yxOUWjDha3I6x+HRHRfRPZenzpj0+KTE0vJa9H/8QAIBEAAQQBBAMAAAAAAAAAAAAAAQACAxIhBBARMSAwYf/aAAgBAwEBPwCGEyFTacsyOvDS1pjtSBtSCiuNonUeHKaYEVauEQs+k/ECv//Z\"/></div></div></div><p>\"I've received many messages saying, 'Thank you for ‌speaking ⁠out'...,\" Tashima told Japanese daily <i>Sports Nippon </i>in ⁠an interview published on Sunday (November 8).</p><p>\"I've been contacted by presidents and international department officials from eight countries, including some outside Asia.</p><p>\"While I haven't received any formal ​endorsements yet, I'm getting ‌a positive response. Since time is short and I don't want to be held up by incomplete paperwork, I want to secure support from at least six associations.\"</p><p>Tashima ‌requires nominations from five national associations, a prerequisite for ​standing in the election.</p><p>Candidates have until November 18 to submit nominations for the election, in which ⁠Infantino is seeking a fourth term as head of world football’s governing body.</p><p>Infantino came under scrutiny in July after an unsuccessful ‌attempt to bring private investors into a new FIFA commercial entity holding rights linked to competitions including the World Cup.</p><p>Despite the criticism, Infantino's candidacy received a significant boost in October when the head of Asian football publicly endorsed him, while support from several FIFA confederations has left him well ‌placed among the organisation's 211 member associations.</p><p>\"I'll keep what's good and ​change what's bad...,\" Tashima added. \"The biggest problem, however, remains governance...</p><p>\"Selflessness is my motto... At this stage, I ⁠think my chances of winning are about 20% to 30%, but ⁠as the campaign progresses, I want to raise my confidence to 40% or 50%. I truly want ‌to change FIFA.\"</p><p>Former Tottenham Hotspur defender Ramon Vega was the first candidate to publicly declare his intention to challenge ​fellow Swiss Infantino last month.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 05:06 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680897\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/sport/football/japans-tashima-rates-fifa-election-chances-at-20-30-in-challenge-to-infantino/article71680897.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticl b_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/football/\">\n                        Football\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 26, "title": "An wins Korea Open for 11th badminton title of year", "section": "Sport", "page": "", "teaser": "The 24-year-old beat Japan’s Akane Yamaguchi 21-12, 15-21, 21-16 in the final in Yeosu to extend an unbeaten run that stretches back to March", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/sport/\">\n                        Sport\n                    </a><meta content=\"Sport\"/><meta content=\"2\"/></li><li aria-current=\"page\" class=\"breadcrumb-item kicker\"><span class=\"kicker-outline\">Badminton</span></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71680734\" data-title=\"An wins Korea Open for 11th badminton title of year\" data-url=\"https://www.thehindu.com/sport/an-wins-korea-open-for-11th-badminton-title-of-year/article71680734.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The 24-year-old beat Japan’s Akane Yamaguchi 21-12, 15-21, 21-16 in the final in Yeosu to extend an unbeaten run that stretches back to March</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 01:18 pm IST - Seoul</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AFP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/njgpmf/article71680738.ece/alternates/LANDSCAPE_1200/Denmark_Badminton_27_44.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/njgpmf/article71680738.ece/alternates/LANDSCAPE_1200/Denmark_Badminton_27_44.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/njgpmf/article71680738.ece/alternates/LANDSCAPE_660/Denmark_Badminton_27_44.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/njgpmf/article71680738.ece/alternates/LANDSCAPE_320/Denmark_Badminton_27_44.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    An Se Young of South Korea. File\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680734\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Badminton world number one An Se-young said she was \"very proud\" of her achievements after winning an incredible 11th title of the year at her home Korea Open on Sunday.</p><p class=\"referpara\"><strong><b>Also read | <a href=\"https://www.thehindu.com/sport/fighting-sindhu-loses-to-nemesis-an-se-young-to-sign-off-with-runner-up-finish/article71623278.ece\" target=\"_self\">Fighting Sindhu loses to nemesis An Se Young to sign off with runner-up finish</a></b></strong></p><p>The 24-year-old beat Japan's Akane Yamaguchi 21-12, 15-21, 21-16 in the final in Yeosu to extend an unbeaten run that stretches back to March.</p><p>An has been head and shoulders above the rest of the competition this year but she said she still had to be on her guard against world number two Yamaguchi.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/sport/other-sports/india-open-badminton-reigning-champion-an-se-young-serves-a-masterclass/article70518883.ece\">\n\t\t\t\t\t\t\t\t\t\tIndia Open badminton | Reigning champion An Se-young serves a masterclass</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/lskxqb/article70519020.ece/alternates/SQUARE_80/YONEX%20BADMINTON%20DELHI_17_01_47.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAxAAABBQEBAAAAAAAAAAAAAAABAAIFBgcEAwEAAwEBAAAAAAAAAAAAAAAAAQIDAAT/2gAMAwEAAhADEAAAAMDSdg1ScYcS07PAVASHbeXTzOkQpKN2SKbIpMCkTvNzVI26FjbWpgZayBWzlWms1RpBI9vOSC9Ec7qe8PeQk42SyFJ6Oiqx4lGuGO2mVrxYNZNf9o2w+07D5pPEuu/2R1yTh3DqpH//xAA2EAABAgQDBwEGBAcAAAAAAAABAgMABAUREiExBhMiQVFhcRAHFCBSgaFCgrHBFRcjMnKR8P/aAAgBAQABPwD4BrFoGWsDX0HoptaEIWpJCVglJPOxt+sVsUZMyymimbU0lhAeVMW4nbcZQNQm+gOfwXvAi0D0bdSqUcl3Aom+NojOyuY8EfcCLQNIt65kQPS0JKkqCkkhQNxFZpL1KfYxcTE0w3MsOWsFoWAcvBuk9x6W7QPEfSMu8ZQIBgmKNNy20UmxQKvNql9ygpp8wRdLSib4VDXCdMv2itUOeoFRVJVFjdugYkKBxIcSdFIUMlJPURR6a/WKvKUyWw76adDSCrQE9Y2v2XOys8zLioMzzbzeNDrQw87HK5+AawBf0SbZ3sRpaKRtc4ZQ02sYJqTI4d+jeJT5Go/yTYxK0zZxVWpM7SZmbkH0KLr6EPBxJQObajY4jnlnpFc2SnKwpc23WJZ5ttYbS46FJSoqPDc2yP0sOsbJUSkz1XqErX5lyUTKy7jlkpJ406gkf8YUU4jgvgvkFa27+ghuRddBLaFrA1ITe0e75kYjfxG5t+L7R7ssZ5j8sUadVTZ1t5xG9bRcFCkBWR6BWWucVmvMzjbJlpfdFlZUVGwUroMsrRUK1SXtnpmZk2koqc4hMu8QbHCnt1PM87DvG7V0jdq6GMCuhhqaa3IbcK0YUKRdv8V+sKngXlLDQ4rdjoB+0PTIesCm1uhyhc3iUjAnDZWQxXv0EbO7LO7QPOM4pdCm0YlqffLSWvJtnFR2cQiofw+Sq9NnnCP7pdxRTjvbBcpFz307wy2WnFBxBxJNrHke8JSgqN05csoU03bIcobabw8agD50gU53pApbp0TCaM+rRtX+op+w77NFmKzPPKkiiwkUKTxPuX5Am9h1HPxDdL2hnG3feXH7PqCnEbzJRHzAZGNhdjEPz07LVVa2mHGrhKQLqsep6Xhz2ezLc460lSVIQshKvmF8jDXs6mljKxPYR/LCqOJJQ1f7Q/7MK2gHDKrPjOGdn5Zk8cjLkdFOBP7w3I0Zq16TKq04VTDis/yiKi03S22RK0OSRPOpu3dCrMD5l4iTc8haKVI0xl0zs9NuTtScThcmJgBVh0QDcJHjOHJWl1EpU5/WWkWBNjl9AIdokgG1BlxqXctwruQUnwT9oXVhQi1KVIJLzrhKZiWN2sHe4ve/fK8Nq4Er3ri0KF0qCclDqDeG30JOTaiepVCJy2iQPv8ArH//xAAiEQACAQMDBQEAAAAAAAAAAAABAgAQESEDEkETIjFRYaH/2gAIAQIBAT8AoJu4maKeRQD7D6pkeJ1LtaA3NMe4pW2YSCceIiKBmbVPM62lwv7H1g3aq2+xgCtgIuoTA45AM//EACERAAEDAwQDAAAAAAAAAAAAAAEAAhEDEiEEIDFREBPR/9oACAEDAQE/ANxEbZnlWi1EQJ8WieFVwcKSBBKc8yryhqCUKzaYl5k9fUzVG+45CqucDLThe53a/9k=\"/></div></div></div><p>\"She's a player who can always keep the score close so I tried to keep the intensity up all the way until the end,\" An told the Badminton World Federation.</p><p>\"When the match was over, I was very proud of myself.</p><p>\"It felt a bit different because it's my home tournament.\"</p><p>It was An's 11th straight win over Yamaguchi.</p><p>Yamaguchi's most recent win over the world number one came in the final of last year's Korea Open.</p><p>\"Whenever we play each other, sometimes I win and sometimes she does, so I didn't think too much about last year's result,\" said An.</p><p>\"Yamaguchi is a player who brings different styles into every match, so I knew it wouldn't be easy and it wasn't.\"</p><p>Of the titles An did not win this year, she finished runner-up at the All-England Open and pulled out injured from the Japan Open.</p><p>She claimed her second world crown in August in New Delhi and became the first woman to win two Asian Games singles titles in Nagoya in September.</p><p>\"We don't play many matches in Korea so this feels like a dream moment,\" said An.</p><p>\"I'm just so proud and happy that so many people in Korea are now supporting badminton.\"</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 01:18 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n
