<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #1a1a18;
  --ink-muted:  #4a4a45;
  --ink-faint:  #8a8a82;
  --paper:      #f8f6f0;
  --paper-warm: #f0ede4;
  --rule:       #c8c4b8;
  --red:        #b00020;
  --font-head:  'Georgia', 'Times New Roman', serif;
  --font-body:  'Georgia', 'Times New Roman', serif;
  --font-ui:    system-ui, -apple-system, sans-serif;
}

html.dark {
  --ink:        #e8e4dc;
  --ink-muted:  #a8a49c;
  --ink-faint:  #6a6660;
  --paper:      #181816;
  --paper-warm: #211f1c;
  --rule:       #38352f;
  --red:        #e05070;
}

html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ── Masthead ── */
#masthead {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--ink); color: var(--paper);
  padding: 0 1rem;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
  user-select: none;
}
#masthead .nameplate {
  font-family: var(--font-head);
  font-size: 1.3rem; font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
}
#masthead .edition-date {
  font-family: var(--font-ui);
  font-size: 0.7rem; color: #aaa;
  text-align: right; line-height: 1.35;
}
#masthead .back-btn {
  display: none; align-items: center; gap: 6px;
  background: none; border: none; color: var(--paper);
  font-family: var(--font-ui); font-size: 0.8rem;
  cursor: pointer; padding: 8px 0; min-width: 60px;
}
#masthead .back-btn svg { flex-shrink: 0; }

/* ── Section nav strip ── */
#section-nav {
  position: fixed; top: 52px; left: 0; right: 0; z-index: 99;
  background: var(--paper-warm);
  border-bottom: 2px solid var(--ink);
  overflow-x: auto; overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  transition: opacity 0.2s, transform 0.2s;
}
#section-nav::-webkit-scrollbar { display: none; }
#section-nav .nav-inner {
  display: inline-flex; padding: 0 0.5rem;
}
.sec-tab {
  display: inline-block;
  font-family: var(--font-ui); font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-muted);
  padding: 9px 10px;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.sec-tab.active {
  color: var(--ink);
  border-bottom-color: var(--red);
}

/* ── Pages viewport ── */
#pages-viewport {
  position: fixed;
  top: 93px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
#pages-track {
  display: flex; height: 100%;
  transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ── Individual section page ── */
.section-page {
  flex: 0 0 100vw; width: 100vw; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 1.2rem 0 2rem;
}
.section-page::-webkit-scrollbar { width: 3px; }
.section-page::-webkit-scrollbar-thumb { background: var(--rule); }

.sec-header {
  padding: 0 1rem 0.6rem;
  border-bottom: 3px double var(--ink);
  margin-bottom: 0.1rem;
}
.sec-header h2 {
  font-family: var(--font-head);
  font-size: 1.05rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red);
}
.sec-header .art-count {
  font-family: var(--font-ui); font-size: 0.7rem;
  color: var(--ink-faint); margin-top: 1px;
}

.article-row {
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 0.5px solid var(--rule);
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: background 0.12s;
  gap: 0.25rem;
}
.article-row:active { background: var(--paper-warm); }
@media (hover: hover) {
  .article-row:hover { background: var(--paper-warm); }
}

.art-meta {
  font-family: var(--font-ui); font-size: 0.65rem;
  color: var(--ink-faint); letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex; gap: 0.5rem; align-items: center;
}
.art-meta .page-tag {
  background: var(--ink); color: var(--paper);
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.6rem;
}
.art-headline {
  font-family: var(--font-head);
  font-size: 1.02rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
}
.art-teaser {
  font-family: var(--font-body); font-size: 0.8rem;
  color: var(--ink-muted); line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.art-read-cue {
  font-family: var(--font-ui); font-size: 0.68rem;
  color: var(--red); font-weight: 600;
  letter-spacing: 0.03em;
  align-self: end;
  text-align: right;
}

/* ── Article pane fly animations ── */
@keyframes fly-to-pip {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
}
@keyframes fly-from-pip {
  0%   { opacity: 0; transform: translate(calc(50vw - 150px), calc(50vh)) scale(0.18); border-radius: 10px; }
  100% { opacity: 1; transform: scale(1); }
}

/* ── Article pane — floating card ── */
#article-pane {
  position: fixed;
  top: 58px; left: 50%; bottom: 12px;
  transform: translateX(-50%) scale(0.96);
  width: min(900px, calc(100vw - 1rem));
  background: var(--paper);
  border-radius: 12px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity: 0;
  pointer-events: none;
  transform-origin: center bottom;
  z-index: 101;
  padding: 1.5rem 1.5rem 3rem;
  transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
}
#article-pane.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) scale(1);
  animation: none;
}
#article-pane.flying-out { pointer-events: none; animation: fly-to-pip 0.75s cubic-bezier(0.4,0,0.2,1) forwards; }
#article-pane.flying-in  { pointer-events: none; animation: fly-from-pip 0.4s cubic-bezier(0.2,0,0,1) forwards; }
#article-pane::-webkit-scrollbar { width: 3px; }
#article-pane::-webkit-scrollbar-thumb { background: var(--rule); }

#article-pane .art-pane-section {
  font-family: var(--font-ui); font-size: 0.68rem;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--red);
  margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 0.5rem;
}
#article-pane .art-pane-section::after {
  content: ''; flex: 1; height: 1px; background: var(--rule);
}
#article-pane h1 {
  font-family: var(--font-head);
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  font-weight: 700; line-height: 1.25;
  color: var(--ink); margin-bottom: 0.75rem;
}
#article-pane .art-pane-meta {
  font-family: var(--font-ui); font-size: 0.72rem;
  color: var(--ink-faint); margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--rule);
  display: flex; gap: 1rem; flex-wrap: wrap;
}
#article-pane .art-pane-body {
  font-size: 1rem; line-height: 1.75; color: var(--ink);
}
#article-pane .art-pane-body p { margin-bottom: 0.9rem; }
#article-pane .art-pane-body h2,
#article-pane .art-pane-body h3 {
  font-family: var(--font-head);
  font-weight: 700; margin: 1.25rem 0 0.4rem;
  color: var(--ink);
}
#article-pane .art-pane-body img {
  max-width: 100%; height: auto;
  display: block; margin: 1rem 0;
}
#article-pane .art-pane-body figcaption {
  font-size: 0.75rem; color: var(--ink-faint);
  margin-top: -0.5rem; margin-bottom: 1rem;
  font-style: italic;
}
#article-pane .art-source-link {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-faint);
}
#article-pane .art-source-link a { color: var(--red); }

.art-print-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 1rem;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 14px;
  font-family: var(--font-ui); font-size: 0.75rem;
  color: var(--ink-muted); cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.art-print-btn:hover { border-color: var(--ink-muted); color: var(--ink); }
.art-print-btn svg { flex-shrink: 0; }

/* ── Background blur overlay ── */
#blur-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 98;
  backdrop-filter: blur(6px) brightness(0.85);
  -webkit-backdrop-filter: blur(6px) brightness(0.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}


/* ── PiP card ── */
#pip-card {
  position: fixed;
  bottom: 14px; right: 14px;
  width: 200px;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--rule);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.88) translateY(8px);
  transform-origin: bottom right;
  transition: opacity 0.3s ease 0.52s, transform 0.35s cubic-bezier(0.34,1.4,0.64,1) 0.52s;
  z-index: 103;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
#pip-card.open { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
#pip-card:hover { border-color: var(--ink-muted); }
.pip-head {
  background: var(--ink); padding: 7px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.pip-logo { font-family: var(--font-head); font-size: 0.68rem; font-weight: 700; color: var(--paper); }
.pip-close {
  background: none; border: none; color: #aaa; cursor: pointer;
  padding: 2px; display: flex; align-items: center; border-radius: 3px;
  transition: color 0.15s;
}
.pip-close:hover { color: var(--paper); }
.pip-body { padding: 8px 10px 10px; }
.pip-sec {
  font-family: var(--font-ui); font-size: 0.58rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--red); margin-bottom: 4px;
}
.pip-title {
  font-family: var(--font-head); font-size: 0.72rem; font-weight: 700;
  line-height: 1.3; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.pip-hint { font-family: var(--font-ui); font-size: 0.58rem; color: var(--ink-faint); }

/* ── Fallback notice ── */
.fallback-notice {
  font-family: var(--font-ui); font-size: 0.75rem;
  background: #fff8dc; border: 1px solid #e0c000;
  color: #555; padding: 0.5rem 1rem;
  margin: 0.5rem 1rem 0;
  border-radius: 4px;
}

/* ── Print styles ── */
@media print {
  body, html { overflow: visible !important; background: #fff !important; }
  #masthead, #section-nav, #pages-viewport, #blur-overlay,
  #pip-card, #swipe-hint, .art-print-btn { display: none !important; }
  #article-pane {
    position: static !important;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    border-radius: 0 !important;
    padding: 2rem !important;
    background: #fff !important;
    color: #000 !important;
    box-shadow: none !important;
  }
  #article-pane .art-pane-section,
  #article-pane h1,
  #article-pane .art-pane-meta,
  #article-pane .art-pane-body,
  #article-pane .art-source-link { display: block !important; color: #000 !important; }
  #article-pane .art-pane-body img { max-width: 100% !important; }
  a { color: #000 !important; text-decoration: none !important; }
}

/* ── Swipe hint (first load) ── */
#swipe-hint {
  position: fixed; bottom: 1.2rem; left: 50%;
  transform: translateX(-50%);
  background: rgba(26,26,24,0.75); color: #f8f6f0;
  font-family: var(--font-ui); font-size: 0.72rem;
  padding: 6px 14px; border-radius: 20px;
  pointer-events: none;
  animation: fadeout 3s ease 1.5s forwards;
  white-space: nowrap; z-index: 200;
}
@keyframes fadeout { to { opacity: 0; } }

/* ── Desktop: wider article reading column ── */
/* ── Theme toggle ── */
#theme-toggle {
  background: none; border: none;
  color: var(--paper); cursor: pointer;
  padding: 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.75; transition: opacity 0.15s;
  flex-shrink: 0;
}
#theme-toggle:hover { opacity: 1; }
#theme-toggle svg { display: block; }

@media (min-width: 700px) {
  #article-pane {
    padding: 2rem 2.5rem 4rem;
  }
  .article-row {
    grid-template-columns: 1fr;
    padding: 0.9rem 1.5rem;
  }
  .sec-header { padding: 0 1.5rem 0.7rem; }
  .section-page { padding: 1.4rem 0 2rem; }
  .art-headline { font-size: 1.1rem; }
  #masthead .nameplate { font-size: 1.5rem; }
  .fallback-notice { margin: 0.5rem 1.5rem 0; }
}
</style>

t\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">Organisers of the “Red Line” demonstration called for stricter trade sanctions, a halt to arms sales, and an official declaration that Israel’s actions in Gaza amount to genocide</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:19 pm IST - Amsterdam</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/5l38ab/article71681172.ece/alternates/LANDSCAPE_1200/Netherlands_Red_Line_Protest_35126.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/5l38ab/article71681172.ece/alternates/LANDSCAPE_1200/Netherlands_Red_Line_Protest_35126.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/5l38ab/article71681172.ece/alternates/LANDSCAPE_660/Netherlands_Red_Line_Protest_35126.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/5l38ab/article71681172.ece/alternates/LANDSCAPE_320/Netherlands_Red_Line_Protest_35126.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Demonstrators march during the fourth \"Red Line\" protest, with the focus on the Dutch economic and military ties with Israel, in Amsterdam, Netherlands, on November 8, 2026. File\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681124\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Tens of thousands of people, many of them dressed in red, marched through Amsterdam on Sunday (November 8, 2026) in a mass demonstration aimed at pressing the Dutch government to take more decisive action against Israel over Gaza.</p><p>The organisers of the “Red Line” demonstrations in the Netherlands called for measures including stricter trade sanctions on Israel, officially declaring that Israel’s actions in Gaza amount to genocide, and halting all arms sales to Israel. The Dutch branch of Amnesty International, one of the organisers, said in an online post that more than 200,000 people joined the march.</p><p>“What is happening there is inhumane,” said Mike van Dongen, as he walked in the huge throng. He was critical of the Dutch government’s actions. “As far as I’m concerned, they are doing nothing,” he said. “They don’t dare take any serious steps.”</p><p>As the protesters marched along a normally busy Amsterdam street that was closed to traffic on Sunday, a man stood on a bus stop with a loudspeaker shouting “Free, free Palestine!” Many of the marchers echoed his cry as they passed.</p><p>Israel strongly rejects suggestions it is committing genocide in Gaza in its military campaign, which followed the attacks by Hamas-led militants in southern Israel on October 7, 2023. Militants killed about 1,200 people and took 251 hostages.</p><p>Israel’s retaliatory offensive has killed tens of thousands of Palestinians and destroyed much of Gaza. More than 1,550 Palestinians in Gaza have been killed by the Israeli military since a ceasefire between Israel and Hamas began in October 2025, according to the territory’s Health Ministry.</p><p>The ministry, part of the Hamas-run government, does not distinguish between civilians and militants, though it says women and children make up roughly half of the dead.</p><p>The campaign in Gaza has strained relations between the Netherlands and Israel. The Dutch Foreign Minister resigned last year after failing to secure new sanctions against Israel. Since then, a new minority coalition government has taken power and introduced an import ban on products from Israeli settlements, which the Dutch government and most of the international community consider illegal, a move that provoked a diplomatic spat with Israel.</p><p>Prime Minister Rob Jetten, who took part in a march last year but was not present on Sunday, defended his government’s actions at his weekly press conference on Friday (November 6, 2026). “Every single day and every single week, we do what we can to alleviate the terrible situation there,” he said.</p><p>He added that his administration was “exerting greater political and diplomatic pressure” on Israel to abide by its agreements on Gaza. At the same time, he said, the government was applying more pressure on Hamas and other organisations that continue to carry out “various operations that endanger the safety of ordinary Israelis.”</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:19 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681124\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/tens-of-thousands-march-in-amsterdam-pressing-dutch-government-on-gaza-israel/article71681124.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"dis nd that only 37% approved of Mr. Trump's handling of immigration, ​down from 50% when he took office.</p><p>Voters delivered a historic rebuke to Republicans in Tuesday's (November 3, 2026) midterm election, but with Mr. Miller as White ⁠House chief of staff, the Trump administration is expected to continue its aggressive approach to immigration enforcement, amplify cultural conflicts and give no ground to a Democratic-controlled Congress, say officials ‌and experts who spoke to <i>Reuters</i>.</p><h4 class=\"sub_head\">HEGSETH 'HAS GOT TO GO'</h4><p>Hakeem Jeffries, who will become speaker of the U.S. House in January, said on Sunday (November 8, 2026) that Democrats would support a measure to impeach Defense Secretary Pete Hegseth, a congressional process that could remove him from office.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/why-are-the-us-midterm-elections-significant/article71679440.ece\">\n\t\t\t\t\t\t\t\t\t\tWhy are the U.S. midterm elections significant?</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/wlwfpc/article71679444.ece/alternates/SQUARE_80/APTOPIX_Election_2_26_New_Hampshire_Senate_12184.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAwEBAQEAAAAAAAAAAAAEBQMGBwIBAAgBAAEFAQAAAAAAAAAAAAAAAAEAAgMEBQb/2gAMAwEAAhADEAAAABQ3Y/cMFTtPs4BB2CvOAEyGytcB6OqQ1SbkvMu3OsGlT0qddh5HAqo1hlQmeV6vzoqPqytrjS7The7bRgPV+2VkzqrMedis9Lf1xi846hDu9bzLROjir+44/qucfzsKcLnSOEk8bUwKrxUUh7tIZ1tVjpOR6JROTAFBZEsvnHTF/8QAJhAAAQQCAQQCAwEBAAAAAAAABAECAwUGEQAHEhMhFBUWIzFBUf 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/1mws2d/article71681167.ece/alternates/LANDSCAPE_660/Israel_Elections_35248.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/1mws2d/article71681167.ece/alternates/LANDSCAPE_320/Israel_Elections_35248.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Gadi Eisenkot, leader of the Yashar party, listens to Israeli President Isaac Herzog as Herzog tasks him with forming a government at the President's residence in Jerusalem, Sunday, Nov. 8, 2026.\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681159\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Israel's former military chief Gadi Eisenkot started the tough task on Sunday (November 8, 2026) of <a href=\"https://www.thehindu.com/news/international/israeli-president-picks-gadi-eisenkot-netanyahu-rival-to-try-to-form-government/article71679477.ece\" target=\"_self\">forming a government</a>, reaching out to Benjamin Netanyahu's allies as he warned the veteran Prime Minister had brought the country to a historic crisis.</p><p>Mr. Eisenkot, 66, a political novice who has vowed to bridge Israel's deep polarisation under Mr. Netanyahu, formally received a mandate from President Isaac Herzog, giving him 28 days to form a government despite his bloc lacking a clear majority.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/israel-defence-minister-says-mission-not-complete-on-iran/article71680896.ece\">\n\t\t\t\t\t\t\t\t\t\tIsrael Defence Minister says 'mission not complete' on Iran</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy a etanyahu launched with President Donald Trump.</p><p>\"We are in the midst of a devastating diplomatic crisis. Even our closest friends and strategic allies are saying their relationship with Israel must be reassessed,\" Mr. Eisenkot said.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/israel-election-commission-rejects-benjamin-netanyahu-charges-of-fraud/article71665384.ece\">\n\t\t\t\t\t\t\t\t\t\tIsrael election commission rejects Benjamin  Netanyahu charges of fraud</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/la6sic/article71665456.ece/alternates/SQUARE_80/2026-10-29T125022Z_90415747_RC21COANZRXI_RTRMADP_3_ISRAEL-ELECTION.JPG\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAA0AAACAwEBAQEAAAAAAAAAAAAFBgMEBwIACAEBAAIDAQEAAAAAAAAAAAAAAAMEAAIFAQb/2gAMAwEAAhADEAAAAGGdd7ezWLvJng4DUc4tlNlaMod83YMZOq5sQfH5bKZuquvYhutVhMBnFd5cpMi/UlBXavVIpxUrspwyhXvsT3pHMDJeg5t8utE87oMpGYIK5VmV1AV0tafrPNLYSs+ragJr5vDPSK9jR9RXeR8qBIAuB9cyxhaSetSzPZEPT/NK+TXtHy//xAAkEAACAwEAAgIDAAMBAAAAAAADBAECBQYAERITBxQhFSVBMv/aAAgBAQABCACXBQzRerLNU6TaVmwNx6pekR/fLj9+WFHrzmL/AFsnF568eVo5nsrXy/lfNFUqjy++zQ67e9z+P7/Y2fyepWf9XxnUV6rBoyRgwlx/YR7UML1AFOkezTVaup2OY1kMaFui/N2+y0yPFPp6LBJIf+19+fGPfxi3/Yn8RNXF1BloHpl23YYrZMxRREM51rDik1UqJcy5l+B5+Fakv2PKqqo/tJfRaLfGyfO2KCSkpzZGjzA+Qwl1txlG3FlDfPHfwx16VmtSMAkdvGSQSaR4bozKKjrQtVulzrisVNaNOq1j74MwlheD6t85K0HyOA5uH6o7fCuSrmno3XWyCjr8GerRKaE8+pfup9stMpc4azjYO0y30iUzGmZhr5VT0Yv/AG8aKAtcTDP00WZoAXIqkYJpBZyeNUzN4bF3ecxIflk7NFqVHQHVPHPusiOnowmItK9HI3Xf8hmc2zYzDaZeSxDz1bNpcGZZE ><p>Mr. Eisenkot appealed to Mr. Netanyahu's Likud Party as well as the far-right party of Finance Minister Bezalel Smotrich to join — but only with himself as Prime Minister.</p><p>\"My door is open and my hand is extended, wholeheartedly and willingly, to anyone who understands the gravity of this moment,\" he said.</p><h4 class=\"sub_head\">Wooing the ultra-Orthodox</h4><p>In consultations last week with Mr. Herzog, Mr. Eisenkot received recommendations from parties accounting for 67 lawmakers, against 46 for Mr. Netanyahu.</p><p>But that vote count included Israeli Arabs, whose seat haul surged to a historic high on anger over Mr. Netanyahu's government and whom several parties oppose having in government.</p><p>Avigdor Liberman, a former Netanyahu aide turned sharp critic who nonetheless shares his hawkish views, has been adamant against any alliance with Arab Israelis, who are descendants of Palestinians who stayed after Israel's creation in 1948.</p><p>Taking back one of his signature campaign pledges, Mr. Liberman instead voiced an openness to an alliance with ultra-Orthodox Jews, whose almost singular priority is ensuring that they remain exempt from military service.</p><p>The exemption for the ultra-Orthodox — whose two main parties had been aligned with Mr. Netanyahu but could push Mr. Eisenkot to a majority — has been a source of growing resentment for many Israelis as reservists fight on multiple tours of duty.</p><p>Mr. Liberman said on Sunday (November 8, 2026) he still backed conscription for all Israelis but that he had to make \"difficult decisions\" for the higher priority of ousting Mr. Netanyahu, who faces corruption charges that could land him in jail if he loses power.</p><p>Naftali Bennett, the second strongest opposition leader after Mr. Liberman, has also been outspoken against the ultra-Orthodox community's military exemption and has stayed quiet since Mr. Liberman's about-face.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoR parties — before bringing other lawmakers into his coalition.</p><p>Assaf Shapira, a political expert at the Israel Democracy Institute, said Mr. Eisenkot would face an exceptionally fragile government if it only had 48 lawmakers in the 120-member parliament, with extensive negotiations needed on every piece of legislation.</p><p>Mr. Eisenkot has vowed to put an end to rampant violence against Palestinians by extremist West Bank settlers supported by Mr. Netanyahu's government and has warned that the incumbent premier does not have the mandate for another attack on Iran.</p><p>But he has largely backed Mr. Netanyahu's war decisions and as military chief during the 2006 Lebanon war advocated massive force against civilian infrastructure where enemies operate, a policy critics say amounts to a war crime.</p><p>In Tel Aviv, Neri Bar-On, who works in educational technology, said he expected Mr. Eisenkot to succeed in forming a government.</p><p>\"But the problems run deeper,\" he said.</p><p>\"The country is facing a massive internal conflict; even if he manages to form a government, it won't solve the underlying issues.\"</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 11:01 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681159\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/eisenkot-warns-of-israel-crisis-as-he-seeks-to-replace-netanyahus-government/article71681159.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publi \"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/mnguaz/article71681154.ece/alternates/LANDSCAPE_320/2026-11-06T144059Z_513778233_RC2DIOAH5PIA_RTRMADP_3_SAFRICA-ELECTIONS.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Members of the uMkhonto weSizwe Party (MKP) interact inside the Western Cape Provincial Results Operation Centre as they await municipal election results in Cape Town, South Africa, November 6, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681148\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>South Africa's African National Congress party faced its worst election results ever on Sunday (November 8, 2026) and a new low point on its gradual decline in popularity as voters rebuked it for a failure to deliver basic services like water and electricity in towns and cities.</p><p>The once-dominant ANC — the party of Nelson Mandela — had received around 30% of the vote in Wednesday's (November 4, 2026) local government elections with 99% of ballots counted. The final results were expected late on Sunday (November 8, 2026), according to the Independent Electoral Commission.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/south-african-anti-migrant-protests-turn-violent-government-blames-disinformation/article71561419.ece\">\n\t\t\t\t\t\t\t\t\t\tSouth African anti-migrant protests turn violent, government blames disinformation</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/7lw9wx/art QE/ANJZoisRL0WmjWoVq+n0RzZfik8/Di5dbneib3sjk0XFMtuROhOj2+0VPl6aEmukJR9imD44YuODwk//xAAiEQACAgIBBAMBAAAAAAAAAAABAgARAzFRBBITIUGhsfD/2gAIAQMBAT8AqMIRDYikx1KmjDUqBqOo2MofY3MmBXw9xYWBzv8AtTqenpUcDY+52cRsdR8xcANcIEIWA16BiOUNqYSDs/kJfiF34nmyD4hzPxPK3E//2Q==\"/></div></div></div><p>The ANC remained the largest party by total share in an election involving hundreds of parties, but the Democratic Alliance that is its main Opposition had received around 25% of votes in the near-complete count.</p><p>That brought closer to reality the once-unthinkable notion that the ANC that led South Africa out of the white minority rule of apartheid and delivered freedom in 1994 under Mandela might one day not be its biggest party. It used to command 70% of the vote.</p><h4 class=\"sub_head\">Catastrophic outcome for the ANC</h4><p>The ANC's popularity has declined for more than a decade. It won 45% support in the last local elections in 2021, the first time it had dropped below 50% in any election. In 2024, it then lost its Parliamentary majority for the first time in a national election, which brought about a coalition national government and a seismic shift in South African politics.</p><p>The ANC was on course Sunday (November 8, 2026) for a steep drop of about 15 percentage points from the last local elections and the loss of approximately one-third of its support from five years ago.</p><p>“If anyone has not heard what the people are saying in this election, then you are lost,” said ANC Secretary-General Fikile Mbalula. “This has been a very catastrophic outcome for the ANC.”</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/south-africa-votes-as-anc-faces-further-losses-and-coalition-rule-looms/article71667127.ece\">\n\t\t\t\t\t\t\t\t\t\tSouth Africa votes as ANC faces further losses and coalition rule looms</a></div><div class=\"picture\"><img alt=\"\" class=\"med w+GPPnDpXzajbqdSlaWvrspGuaMn9j75PeXbptg2FK7UBjOxWpf/9k=\"/></div></div></div><p>He said the results called for the ANC “to be humble, to hear our people and respect them,” and to “earn again through service and not through slogans the trust people have lent to others.”</p><p>DA leader Geordin Hill-Lewis said his party — which was around 20% points behind the ANC in the 2024 national election — had now “taken a big step forward” in its aim to be South Africa's biggest.</p><h4 class=\"sub_head\">As the ANC declines, voters leave for several parties</h4><p>But, while the ANC's popularity has dropped sharply, no single party has overtaken it as the vote has fragmented among many parties on a local and national scale.</p><p>Another seven major parties shared around 30% of the vote in these local elections, which had more than 500 parties contesting and many picking up small shares. The MK Party led by former South African President Jacob Zuma, who broke away from the ANC and was expelled by it, held the third-largest share of votes at around 10%.</p><h4 class=\"sub_head\">Failed public services key issue</h4><p>Voters across South Africa have long expressed frustration over failed public services that have left many cities and towns with regular water and electricity outages, broken roads and streetlights, and uncollected refuse.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/cyril-ramaphosa-tells-south-africa-to-prepare-for-loss-of-us-africa-trade-deal/article71603027.ece\">\n\t\t\t\t\t\t\t\t\t\tCyril Ramaphosa tells South Africa to prepare for loss of U.S.-Africa trade deal</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/a960wv/article71603026.ece/alternates/SQUARE_80/South_Africa_Killin WTONj4/rpj+7J0h99T5HXCdStLxraJicKlSCfoRrilgeKLu3QGrkP1bTtyjA0ze9qmORIPxa/wANdm3dZF2qycb7N/bU/CPZ4kfOtwruUkYLKwH1xqS08HezRUouEzQRsWA3BBPXfG/TX7B4LKY9umJP4z/bTWPhBD7tbMd/5tR0XD8FUk8FRJ3kTBkLSbZGrhR2W611RUzzsJJ3MjhJABk+WjYrI/8Amn2/3V1NY7OrbVEp8sSrqCxWsMwWscEnxddf/8QAIxEAAgIABQQDAAAAAAAAAAAAAQIAEQMEEBMhEhQx8EGx0f/aAAgBAgEBPwDRQo8x16fEMZa0o3KJHMK0LjKWali5X5YzYXiocJTMXLmrUzAHHUdBK5uGABRQ+xNwe1N5R6P2HMIJ3OHP/8QAIhEAAgEDBAIDAAAAAAAAAAAAAAECAxFREBIUIQQTIDHx/9oACAEDAQE/ANI0m43GmtE9I7dpWce7CZey7HPBGvJRsOTuRnkqfdvj6pN/px5nFnlC8So8HDqn/9k=\"/></div></div></div><p>Those local government failures, along with long-held anger over corruption scandals connected to the ANC, largely were the key issues in this election. The election was to choose local government councilors that run South Africa's eight biggest cities as well as its 44 district and 205 local municipalities.</p><h4 class=\"sub_head\">The ANC loses major cities</h4><p>The ANC was on course to lose its place as the largest party to the DA in the economic hub of Johannesburg, the capital of Pretoria, and the large Ekurhuleni municipality east of Johannesburg. The DA retained its control of the second biggest city of Cape Town.</p><p>In Johannesburg, where failed services have been most under scrutiny, the white-led DA put forward its former leader, 75-year-old Helen Zille, as a candidate for mayor.</p><p>Her campaign included stunts like her snorkeling in a trench filled with water in the middle of one of the city's roads in an attempt to highlight the failures.</p><p>There will now be complex coalition negotiations</p><p>While the ANC's decline was obvious in the biggest cities, most of them could be left with hung councils because no party was set to win a majority.</p><p>That meant a series of complex coalition agreements will be required to decide who governs and the ANC could be part of the governing coalitions.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time arti - Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The devastating result leaves Trump politically hamstrung as he enters the remaining two-year 'lame duck' period of his White House tenure</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 10:20 pm IST - Washington</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AFP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/ur2zln/article71681146.ece/alternates/LANDSCAPE_1200/Election_2_26_Climate_Policies_8_817.jpg\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/ur2zln/article71681146.ece/alternates/LANDSCAPE_1200/Election_2_26_Climate_Policies_8_817.jpg\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/ur2zln/article71681146.ece/alternates/LANDSCAPE_660/Election_2_26_Climate_Policies_8_817.jpg\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/ur2zln/article71681146.ece/alternates/LANDSCAPE_320/Election_2_26_Climate_Policies_8_817.jpg\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    U.S. President Donald Trump. File\n                                          | Photo Credit: AP\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681120\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>U.S. President Donald Trump vowed a political comeback on Sunday (November 8, 2026) after his Republican Party lost control of both houses of Congress in midterm elections that amounted to an unequivocal repudiation of his turbulent Presidency.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/opinion/editorial/trump-debacle-on-the-us-midterm-election-results/article71670096.ece\">\n\t\t\t\t\t\t\t\t\t\tTrump debacle: On the U.S. midterm election results</a></div><div class=\"picture\"></div></div></div><p>The devastating result leaves Mr. Trump politically hamstrung as he enters the remaining two-year 'lame duck' period of his White House tenure, while opening the door to multiple investigations by the Democrat-controlled Congress into the President, his family and senior members of his administration.</p><p>\"America took a giant step back in History with the results of the last Election,\" Mr. Trump said in a post on Truth Social, adding that the stock market that had grown during his tenure took a loss after the vote.</p><p>\"But have no fear, we will be back, BIGGER AND STRONGER THAN EVER BEFORE!\"</p><p>While the resounding election loss last Tuesday (November 3, 2026) has prompted soul-searching among Republican lawmakers, Mr. Trump has sounded defiant.</p><p>On Friday (November 6, 2026), he appointed hardline advisor Stephen Miller as his new chief of staff, signalling a bare-knuckle fightback.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/democratic-wins-in-stateag-races-give-trump-a-new-headache/article71680926.ece\">\n\t\t\t\t\t\t\t\t\t\tDemocratic wins in State AG races give Trump a new headache</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/hze93h/article71680944.ece/alternates/SQUARE_80/Election_2_26_Mississippi__2448.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAwEBAQAAAAAAAAAAAAAFBgEDBAIHAAEAAgMBAQAAAAAAAAAAAAAAAQUABAYCA//aAAwDAQACEAMQAAAAX5snToON2ZkrWAeX00ItvJv2ylyqpi+OhHVnQmv0hLP591tXuc9G4vxmwNVxn6+HKrnqzoQmZDhszoN4Qkg8dMg9gByEyKxuY1D3Y8m0VWLL75rmdGJhLbjD7wNvIUCSycLtVJoslR6MSX2bw7RdSyxn3JYCXoXr4ptMJkn/xAAlEAACAgICAgIDAQEBAAAAAAACAwEEBQYAEhETFCIHFSExIzL/2gAIAQEAARIAgeQPOvMSljcmgV9YLt/6t1rTnHefaiVHEj06868686868gedeQPNbw9g2RcIYFXjwMWcZVeqYegGCJePF/XKZQXp8oOOWqTabpW2I8/7E9ededeQPIHmGx0ZDIgoo/5j9z4KxWvqEREDMeIsPSv2dzGB8eeXs/j1CJzZX9P4fMnsWPIfV7wLqX8kfBgJDPkSjzE9edOQPIHmu2FUhe04kmHIrWBvYx61XXzWhoEwId7rNFL69NS7UOj2TaKK+VuGy1WCs5Yj6MsvFW0u9lmpLBQSlzj8tTohVomQl2GI9nTnTkDyB5i6pVii2RSMlEQHDrHILh7l1u0/WXbTrjKOSdVK3lDxyYNgWdtczVf2+NwNFBDbmuY3s5aY/WmtRVGhk1iVmG4a5etZmuNZHyKN4ESI26mIrIp2XsaxQQJsXINWLFlBAUeRKB5A8qZI1VPXTGCvMhqVtXi7Fl+ubVmHMmwlXlq8cilhN2ymE9FcKdsCZBjs0hpuQ1k6ti32sd02K7Kuxfjuo1QBNmooqxDs7Mh+yK7jDIZz pledged to hold the Trump administration to account and fight against Mr. Miller, the architect of Mr. Trump's tough immigration policy.</p><p>Amid Democrat threats for administration officials to \"lawyer up,\" Mr. Trump said on Saturday (November 8, 2026) he was ordering the Justice Department to examine Democratic threats to impeach members of his administration, likening it to \"extortion.\"</p><h4 class=\"sub_head\">'They can come after us'</h4><p>That stance stoked a war of words between top Republicans and Democrats on U.S. political shows on Sunday (November 8, 2026).</p><p>Attorney General Todd Blanche, a former personal lawyer for Mr. Trump and now head of the Justice Department, vowed to actively defend Mr. Trump and senior members of his administration.</p><p>\"You have members of Congress who, after Tuesday (November 3, 2026), have done nothing but threaten everything that's happening in this administration,\" Mr. Blanche told <i>CNN</i>, citing impeachment threats against Mr. Miller after his appointment.</p><p>\"If they try to come after Stephen Miller...instead of actually just conducting oversight and leading, of course the Department of Justice will be there to defend him.\"</p><p>Robert Garcia, the ranking Democrat on the House Oversight Committee, took aim at Mr. Blanche, saying one role of Congress under the U.S. constitution is to hold the executive branch to account.</p><p>\"All he wants to do is protect Donald Trump, is protect Donald Trump's cabinet and administration officials. That is not his job,\" Mr. Garcia told <i>CNN</i>, vowing to stop corruption and investigate \"those that are committing crimes against the American public.\"</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/why-are-the-us-midterm-elections-significant/article71679440.ece\">\n\t\t\t\t\t\t\t\t\t\tWhy are the U.S. midterm elections significant?</a>< ump family's business and cryptocurrency dealings, government contracts involving billionaire Elon Musk, cuts to federal agencies, immigration enforcement and the conduct of the Iran war.</p><p>During his first Presidency, Mr. Trump himself was impeached by the House of Representatives twice, but on both occasions he was acquitted by the Senate.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 10:19 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681120\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/trump-vows-comeback-as-bitter-showdown-with-congress-looms/article71681120.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- End DFP : /22390678/TH_Desktop_AT_Mid02, publisher: The Hindu --><!-- Begi eight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_MWeb_AT_Middle01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><div class=\"dfp-ad\" data-devicetype=\"small\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Mweb_AT_Bottom01\" id=\"Mweb_AT_Bottom01\" style=\"{ minHeight: ‘330px’}\"></div><!-- End DFP : /22390678/TH_Mweb_AT_Bottom01, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle02, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/244/\">\n                        World\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/333-244/\">\n                        Israel\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 6, "title": "UK Hindu family takes legal action after school objects to boy wearing tilak", "section": "International", "page": "", "teaser": "The parents of a nine-year-old boy have approached the UK High Court, alleging religious discrimination after he was prevented from wearing the sacred Tilak-Chandlo to school", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681073\" data-title=\"UK Hindu family takes legal action after school objects to boy wearing tilak\" data-url=\"https://www.thehindu.com/news/international/uk-hindu-family-takes-legal-action-after-school-objects-to-boy-wearing-tilak/article71681073.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The parents of a nine-year-old boy have approached the UK High Court, alleging religious discrimination after he was prevented from wearing the sacred Tilak-Chandlo to school</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 09:01 pm IST - London</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681073\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>The parents of a nine-year-old British Hindu boy, who was withdrawn from his primary school in London after it objected to him wearing a tilak on his forehead, have initiated legal proceedings in the UK High Court.</p><p>The boy, who belongs to the Swaminarayan faith tradition, had attended Vicar’s Green Primary School in west London since 2021 and worn his religious marking, known as the Tilak-Chandlo, without difficulty.</p><p>However, the school objected to the practice in late 2025, triggering a dispute that eventually led his parents to withdraw him from the school and pursue legal action.</p><p>“As parents, it has been heartbreaking to see our son go through this simply because he wanted to practise his faith,” the parents said in a statement released by their legal team this weekend.</p><p>“He had worn his Tilak-Chandlo to school for years without difficulty, and we never imagined that something so sacred to our family would become a source of distress,” they said.</p><p>“Our son was just an ordinary little boy who enjoyed learning and spending time with his friends. His religious marking did not hurt anyone or prevent him from being a good pupil.</p><p>“We have always taught our children to respect every religion, and we simply ask that the same respect be shown to ours. We hope that no other child will have to choose between their education and their faith,” they added.</p><p>The family is represented by Ashray Law, which has filed proceedings alleging religious discrimination under the UK’s Equality Act 2010 and breaches of rights protected by the Human Rights Act 1998.</p><p>The case, filed in the High Court of England and Wales, seeks £25,000 in damages. The proceedings are ongoing, and the allegations remain in dispute.</p><p>“This case goes beyond one child or one school. It raises important questions about religious freedom and equality in British education,” said Ambrish Limbachia, director of Ashray Law.</p><p>“No child should feel compelled to choose between their faith and their education. We hope these proceedings will help clarify the rights of children from all religious backgrounds,” he said.</p><p>The Tilak-Chandlo is a U-shaped marking, usually made with sandalwood paste and a small red circle of kumkum powder in the centre. It symbolises devotion to God and humility among followers of the Swaminarayan faith.</p><p>The family alleges that, after the school objected to the marking, the boy was repeatedly questioned by staff about his religious practice and restricted from participating in certain school activities.</p><p>The school has disputed the allegations of discrimination, maintaining that it acted sensitively, recognised the family’s religious beliefs and offered alternative arrangements, which the parents did not accept.</p><p>Vicar’s Green Primary School has said it values and respects the diverse cultural and religious backgrounds of its community. It said its policy was designed to “promote cohesion, fairness, equality and a shared sense of belonging while preventing division or disruption within the school community”.</p><p>The parents are being supported in their legal challenge by the interfaith initiative Action for Harmony.</p><p>Nitin Palan, head of Action for Harmony, said: “Religious equality must extend to all communities, including Hindu children whose traditions and beliefs are an important part of their identity.</p><p>“Action for Harmony is proud to support this legal action, not to create division, but to promote understanding, fairness and equal treatment for everyone, and we hope this case will help establish an important principle.”</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 09:01 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681073\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/uk-hindu-family-takes-legal-action-after-school-objects-to-boy-wearing-tilak/article71681073.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" s e03, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle03, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle04, publisher: The Hindu --><!-- Begin DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --><!-- End DFP : /22390678/TH_MWeb_AT_Middle05, publisher: The Hindu --></div><div class=\"related-topics print-hide\"><h3 class=\"title-patch\">\n            Related Topics\n        </h3><p class=\"related-topics-list\"><a class=\"txt\" href=\"https://www.thehindu.com/tag/indian-railways/\">\n                        India\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/244/\">\n                        World\n                    </a><span>\n                            /                      \n                        </span><a class=\"txt\" href=\"https://www.thehindu.com/tag/417-244/\">\n                        United Kingdom\n                    </a></p></div></div></div><div class=\"print-hide col-xl-3 col-lg-4 col-md-12 col-sm-12 col-12\"><div class=\"d-none d-sm-block d-lg-block d-xl-block sticky\" id=\"read-more-ad\"><div class=\"adbg\"><!-- Begin DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --><div class=\"dfp-ad flexdfpad\" data-devicetype=\"large\" data-size=\"[[300,250],[336,280],[200,200],[250,250],[300,300]]\" data-unit=\"/22390678/TH_Desktop_AT_RT\" id=\"articledivsub\" style=\"min-height: 330px;\"></div><!-- End DFP : /22390678/TH_Desktop_AT_RT, publisher: The Hindu --></div></div><div class=\"read-more-content-sticky\"><div class=\"articletopnews\" id=\"articletopnews\"></div><div class=\"d-none d-sm-block d-lg-block d-xl-block popular-premium-tabs\"><div id=\"articledivtrendD\"></div></div><div class=\"d-block d-sm-none\"><div id=\"articledivtrendM\"></div></div></div></div></div>"}, {"id": 7, "title": "Turkey, Azerbaijan leaders vow unity after tensions", "section": "International", "page": "", "teaser": "The Turkic-speaking allies describe their relationship as \"one nation, two states\" and, despite the friction, remain closely bound by military and energy ties", "body": "<div class=\"row\"><nav aria-label=\"breadcrumb\"><ol class=\"breadcrumb print-hide\"><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/\">\n                        Home\n                    </a><meta content=\"Home\"/><meta content=\"1\"/></li><li class=\"breadcrumb-item\"><a href=\"https://www.thehindu.com/news/\">\n                        News\n                    </a><meta content=\"News\"/><meta content=\"2\"/></li><li class=\"breadcrumb-item active\"><a href=\"https://www.thehindu.com/news/international/\">\n                        World\n                    </a><meta content=\"World\"/><meta content=\"3\"/></li></ol></nav><div class=\"col-xl-9 col-lg-8 col-md-12 col-sm-12 col-12 storyline\" data-id=\"71681057\" data-title=\"Turkey, Azerbaijan leaders vow unity after tensions\" data-url=\"https://www.thehindu.com/news/international/turkey-azerbaijan-leaders-vow-unity-after-tensions/article71681057.ece\"><div class=\"d-none d-sm-block d-lg-block d-xl-block artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"large\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Desktop_Outofpage_Interstitial\" id=\"div-gpt-ad-1755756805906-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Desktop_Outofpage_Interstitial, publisher: The Hindu --></div><div class=\"d-block d-sm-none artinrstl-ad\"><!-- Begin DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --><div class=\"dfp-ad INTERSTITIAL no-text\" data-devicetype=\"small\" data-positiontype=\"INTERSTITIAL\" data-size=\"[1, 1]\" data-unit=\"/22390678/TH_Mweb_OutofPage_Interstitial\" id=\"div-gpt-ad-1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">The Turkic-speaking allies describe their relationship as \"one nation, two states\" and, despite the friction, remain closely bound by military and energy ties</h2><div class=\"update-publish-time\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 08:44 pm IST - Shusha, Azerbaijan</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> AFP</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/5z4ez7/article71681079.ece/alternates/LANDSCAPE_1200/2026-11-08T133318Z_1975847592_RC2PJOADIRE7_RTRMADP_3_AZERBAIJAN-TURKEY.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/5z4ez7/article71681079.ece/alternates/LANDSCAPE_1200/2026-11-08T133318Z_1975847592_RC2PJOADIRE7_RTRMADP_3_AZERBAIJAN-TURKEY.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/5z4ez7/article71681079.ece/alternates/LANDSCAPE_660/2026-11-08T133318Z_1975847592_RC2PJOADIRE7_RTRMADP_3_AZERBAIJAN-TURKEY.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/5z4ez7/article71681079.ece/alternates/LANDSCAPE_320/2026-11-08T133318Z_1975847592_RC2PJOADIRE7_RTRMADP_3_AZERBAIJAN-TURKEY.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    Turkish President Tayyip Erdogan and Azerbaijani President Ilham Aliyev hold hands during a press conference in Shusha, Azerbaijan, November 8, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71681057\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Turkey's President Recep Tayyip Erdogan and Azerbaijan's President Ilham Aliyev vowed on Sunday (November 8, 2026) that their countries' alliance would remain solid, in a show of unity aimed at overcoming a public rift between the close neighbours.</p><p>Tensions flared in September, when Baku revised school uniform regulations to prohibit clothing deemed incompatible with secular education, effectively barring Islamic headscarves in classrooms.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/international/azerbaijan-slams-ally-israels-recognition-of-armenian-genocide/article71162775.ece\">\n\t\t\t\t\t\t\t\t\t\tAzerbaijan slams ally Israel’s recognition of Armenian genocide</a></div><div class=\"picture\"></div></div></div><p>Mr. Erdogan's government has dismantled restrictions on hijabs in Turkey.</p><p>Azerbaijan's move sparked protests at home and drew criticism from Mr. Erdogan's Islamist-rooted Justice and Development Party (AKP). Presidential adviser Oktay Saral demanded that Azerbaijan reverse the restrictions.</p><p>Mr. Aliyev's ruling party, Yeni Azerbaijan, denounced the comments as \"interference in Azerbaijan's internal affairs\".</p><p>Baku also declared 31 Turkish nationals, including an Opposition lawmaker and party leaders, persona non grata over critical social media posts.</p><p>Mr. Erdogan subsequently dismissed Mr. Saral, but Mr. Aliyev stayed away from an October 30 summit of Turkic leaders in Ankara — despite a personal invitation from Mr. Erdogan. Instead, he sent Foreign Minister Jeyhun Bayramov.</p><p>On Sunday (November 8, 2026), as Azerbaijan marked Victory Day commemorating a 2020 war with Armenia, Mr. Erdogan arrived in the country's Fuzuli district, which Baku recaptured from Armenian forces six years ago.</p><p>A guard of honour lined up at the airport, where Mr. Aliyev and First Lady Mehriban Aliyeva, welcomed Mr. Erdogan and his wife Ms. Emine.</p><p>\"With the permission of Almighty God, our unity will endure forever,\" Mr. Erdogan told a joint press conference with Mr. Aliyev.</p><p>\"This unity of hearts, which we describe with the motto 'One Nation, Two States,' is an everlasting torch that draws strength from our shared past and illuminates our future.\"</p><p>Mr. Aliyev said the alliance — \"an important factor across a vast geographical area\" — remained unshaken.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/opinion/editorial/rebuilding-ties-the-hindu-editorial-on-india-engaging-with-turkiye-and-azerbaijan/article70847837.ece\">\n\t\t\t\t\t\t\t\t\t\tRebuilding ties: On India engaging with Turkiye and Azerbaijan</a></div><div class=\"picture\"></div></div></div><p>\"Together, Azerbaijan and Turkey are even stronger,\" he said, adding that Mr. Erdogan's visit \"shows the whole world our unity\".</p><p>\"I am confident that this unity will last forever.\"</p><h4 class=\"sub_head\">'Deeper rift'</h4><p>Analysts say the quarrel reflects deeper unease over Baku's diplomatic independence and its close ties to Israel.</p><p>\"Azerbaijan-Turkey tensions stemmed from the fact that Baku does not see itself as the younger brother in this alliance and insists on relations between equal partners,\" Elkhan Shahinoglu, head of the Baku-based Atlas Research Centre, told <i>AFP</i>.</p><p>\"The hijab dispute is a symptom of a deeper rift,\" Gonul Tol, an analyst at the Washington-based Middle East Institute, wrote on X.</p><p>\"Tensions have long simmered over a number of issues including Azerbaijan's sovereignty, Ankara's influence in Baku, diverging policies toward Israel, and Turkey's rapprochement with Armenia.\"</p><p>Baku has forged strong military and economic ties with Israel, which supplied Azerbaijan with weapons during its 2020 war with Armenia over the breakaway Karabakh region.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/news/national/jaishankar-meets-azerbaijan-president-foreign-minister-as-india-attempts-reset-of-ties/article71617306.ece\">\n\t\t\t\t\t\t\t\t\t\tJaishankar meets Azerbaijan President, Foreign Minister as India attempts reset of ties</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/ciw8oz/article71617616.ece/alternates/SQUARE_80/20261023256L.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDIBCQkJDAsMGA0NGDIhHCEyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/CABEIAFAAUAMBIgACEQEDEQH/xAAzAAACAwEBAQAAAAAAAAAAAAADBgIEBQEHAAEAAgMBAQAAAAAAAAAAAAAAAQMAAgQFBv/aAAwDAQACEAMQAAAAyp78tWddgwjgV7VtiToSTnuMTli1RkNpRcW/vARYjMosPKCBAxJJzsiT6lO2nWEdqLcmPcWWRba/K1KFmBDrFC0xqZLVFZGL+Wegr95VqgJYjkuzh509Ci39n6PXxbGLsV/QxX2F/c8H1fkP0Xzq6vR9zP3QP//EADoQAAEDAgMFBgMGBQUAAAAAAAECAxEABAUSIQYTMUFRFCJhcYGRB0KxFSMyocHhMzZj0fBDUmJysv/aAAgBAQABPwBVr3kafN+hrsvhRtfCjbaHSlIU5csWTTiWnXRAWoSAY0HrR2dxBDLRRco7QkqL4WuUoHyn2Bq3Um5bC0jUKKTRYHSiwOlKZEp050uxAW3p836GjZAcqVZDpRsZB05Vhh3e0qW1IYQ2SEOOPJ/hpAnMDykcKZwm0bxB7EhizC2LsLSwFyA6f9pkQIiKsLcvv3Dgt22Mzn8NsEAQCDx8aVZqHKjbKHKjaqKk6c6YbBt7fUq7wEnieNFsKEpgg8CKLYzFPzASRW60OnKsbwZ66bZurVGZ1LYStJ+YctOdNYbiLiEW92w8Wk5ihKe8nXjrPlVvYos2UiAFEgqPoaU2CY0npRYHSuzgFOnOmhmswiSCHCmRxHH+9KwlooCQ64EhOUcJAmeMU7ZW7buUvLQopJmOI1kz6/SksMpVBu5iCDmkdNfE8aYaaaQlS31wpknvdDOgE0myQlM ber 8 marks Azerbaijan's capture of the city of Shusha in Karabakh during its war with Armenia, a victory achieved with Turkish backing.</p><p>The Turkic-speaking allies describe their relationship as \"one nation, two states\" and, despite the friction, remain closely bound by military and energy ties.</p><p>Turkey serves as a key transit route for Azerbaijani oil and gas exports to Western markets.</p><p>An ex-Soviet republic, Azerbaijan is a mainly Shiite Muslim country, but after decades of Soviet rule it emerged as one of the most secular states in the Muslim world.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 08:44 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71681057\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/news/international/turkey-azerbaijan-leaders-vow-unity-after-tensions/article71681057.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- En 1755756889364-0\" style=\"\"></div><!-- End DFP : /22390678/TH_Mweb_OutofPage_Interstitial, publisher: The Hindu --></div><h2 class=\"sub-title\" style=\"font-family: 'Merriweather', serif; font-weight: bold;\">In the 30 Sensex firms, Mahindra &amp; Mahindra, InterGlobe Aviation, Trent, Infosys, Bharti Airtel and Axis Bank were among the biggest laggards. Sun Pharma, Tata Steel, Maruti and Power Grid were among the gainers</h2><div class=\"update-publish-time\"><p class=\"updated-time\">Updated <span> - November 08, 2026 04:43 pm IST - Mumbai</span></p></div><div class=\"author\"><div class=\"author-name noimg\"><a class=\"person-name no-lnk\"> PTI</a></div></div><div class=\"article-picture top-pic\"><div class=\"picture verticle\"><picture><!--[if IE 9]><video style=\"display: none;\"><![endif]--><source media=\"(min-width: 1600px)\" sizes=\"960px\" srcset=\"https://th-i.thgim.com/public/incoming/ilriwr/article71680831.ece/alternates/LANDSCAPE_1200/2026-11-08T093929Z_556595169_RC2KJOAPKSK9_RTRMADP_3_INDIA-STOCKS-DIWALI.JPG\"/><source media=\"(min-width: 768px) and (max-width: 1599px)\" sizes=\"640px\" srcset=\"https://th-i.thgim.com/public/incoming/ilriwr/article71680831.ece/alternates/LANDSCAPE_1200/2026-11-08T093929Z_556595169_RC2KJOAPKSK9_RTRMADP_3_INDIA-STOCKS-DIWALI.JPG\"/><source media=\"(min-width: 321px) and (max-width: 767px)\" sizes=\"400px\" srcset=\"https://th-i.thgim.com/public/incoming/ilriwr/article71680831.ece/alternates/LANDSCAPE_660/2026-11-08T093929Z_556595169_RC2KJOAPKSK9_RTRMADP_3_INDIA-STOCKS-DIWALI.JPG\"/><source media=\"(max-width: 320px)\" sizes=\"320px\" srcset=\"https://th-i.thgim.com/public/incoming/ilriwr/article71680831.ece/alternates/LANDSCAPE_320/2026-11-08T093929Z_556595169_RC2KJOAPKSK9_RTRMADP_3_INDIA-STOCKS-DIWALI.JPG\"/><!--[if IE 9]></video><![endif]--></picture></div><figcaption class=\"caption\">\n                    A stockbroker trader reacts as his family watches him trading during a special “muhurat” trading session for Diwali, the Hindu festival of lights, at the Bombay Stock Exchange (BSE) in Mumbai, India, November 8, 2026.\n                                          | Photo Credit: Reuters\n                                      </figcaption></div><div class=\"articlebodycontent col-xl-9 col-lg-12 col-md-12 col-sm-12 col-12\" id=\"content-body-71680829\"><div class=\"schemaDiv\" id=\"schemaDiv\"><p>Benchmark indices Sensex and Nifty ended marginally lower in the special Deepavali Muhurat trading session on Sunday (November 8, 2026) amid profit-taking by investors after a seven-day rally.</p><p class=\"referpara\"><strong><b>Also read | <a href=\"https://www.thehindu.com/business/markets/stock-markets-on-fire-sensex-jumps-1718-points-nifty-reclaims-25000/article71674151.ece\" target=\"_blank\">Stock markets on fire; Sensex jumps 1,718 points, Nifty reclaims 25,000</a></b></strong></p><p>After starting the special trading session to mark the beginning of Hindu calendar Samvat 2083 on a bullish note, the 30-share BSE Sensex failed to sustain the rally. The barometer dipped 28.62 points, or 0.04%, to settle at 80,999.40, with 16 of its constituents ending higher and 14 lower. During the special session, it hit a high of 81,442.11, surging 414.09 points, or 0.51%.</p><div class=\"also-read print-hide\" data-ga-label=\"AlsoReadArticle\"><div class=\"element\"><div class=\"title\"><a href=\"https://www.thehindu.com/business/markets/stock-markets-extend-rally-in-early-trade-sensex-jumps-615-points/article71659466.ece\">\n\t\t\t\t\t\t\t\t\t\tStock markets extend rally in early trade; Sensex jumps 615 points</a></div><div class=\"picture\"><img alt=\"\" class=\"media-object lazy adaptive placeholder lazy\" data-device-variant=\"SQUARE~SQUARE~SQUARE~SQUARE\" data-src-template=\"https://th-i.thgim.com/public/incoming/syqx8m/article71659474.ece/alternates/SQUARE_80/iStock-2260474979%203.jpg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofH W83kaXf7Z4cGMWV8h6GGLX+8I/ZebjLiPDZbGnSNfOeDANWVVfbPEmLIs8wG2g/OMdIkRbV5Bkp6KUSSuV2f25N8sSltew4t2+rgNLdVpkCuJvl/wCV16ZJUjEKGuatns5GOrJ7e3xhO3w4Hmm69aifODp6/p98hBXzeaVf2x/zMOZHY9dHGepx+TiK6BIL6rjTruvsFd3GX9NlKuN6c698/CsjGEfzPXSN5KOg6Hu3b3cZlb0qjsVJ0xlfDGt69Bv2x14mSSn/AIkS/VyIoDUWXdIm2QiCRAjAPVZROurkjh8sQjFr2k165HdOdd9sGolaRAvYD9MZgQF4kPYiX3ycriMdeJ11rR+MZ0w8Ejwsw6zk+I+7jI8kXhF/b3wkWx/LxeilHtjI2wn+WEbkQrui/wDXF04nn8XkvDRa/wCW/T9fTGDXE7Nen7Y3ZpRy9++K7aL81kvFLN2u1u2Ei6NevbL0q1Xf1x1I1W+uvP5zphdfiOg+wuRneML3ximrtnFX3wR/fOF3dX+emOn0PoaaGKSP1yRXY+Pvnhoqbpp1yXda+xnOcuhkuWl77bYGDz+n/8QAJBEAAgIBAwMFAQAAAAAAAAAAAAECERIDITFBcfAyUWGBkcH/2gAIAQIBAT8ASi3ycfBa6CbFNVwSqLq/w7ISbW5GUUrFrx9Q3JOxKTpNkoRapseN4+3nn2ZaV1Xf+IwjHe7FBY7ihSohpJIejUaXJcSkOKFBVZGHRn//xAAqEQACAgEBBgUFAQAAAAAAAAABAgARAyESEzFBUYEEYZGhsSIyUsHh8P/aAAgBAwEBPwBnygfbfxOPnCDzOkIF2IUa72tJjbbUNXrCfyMDoBYjgmydI2Bgn1Ghx9dYXTd7NWeR1ikbVVFYuwVV5jTrGyPnyEL1j4vE5c7YjrVk8uFk+3Kb98r2VrU+XHjFyEZCSON+8wUhu+v8/wB3m8VGAVdFrv158zfaYfEqPEnKw0JJPf8AY+ZTwlgIGI1M3xJoTI54if/Z\"/></div></div></div><p>The 50-share NSE Nifty declined 43.95 points, or 0.18%t, to end at 24,986.40 after a positive beginning.</p><p>In the 30 Sensex firms, Mahindra &amp; Mahindra, InterGlobe Aviation, Trent, Infosys, Bharti Airtel and Axis Bank were among the biggest laggards. Sun Pharma, Tata Steel, Maruti and Power Grid were among the gainers.</p><p>Muhurat trading is a symbolic market session held on Deepavali, which also marks the beginning of the new Hindu calendar year. It is believed that trading during the 'Muhurat' or auspicious hour brings prosperity and financial growth for the stakeholders.</p><p>Unlike regular trading days, when equity markets operate from 9.15 a.m. to 3.30 p.m., Muhurat trading runs for a shorter period.</p><p>In the last Samvat Year 2082, the BSE benchmark has tumbled 3,398.32 points, or 4%, and the Nifty declined 838.25 points or 3.24%.</p><p>Meanwhile, Foreign Institutional Investors (FIIs) bought equities worth ₹13,749.82 crore on Friday (November 6, 2026), according to exchange data. The U.S. equity markets ended mostly higher on Friday (November 6).</p><p>On Friday (November 6), the Sensex jumped 1,718.01 points, or 2.17%, to settle at the day's high of 81,028.02. The Nifty rallied 493.75 points, or 2.01%, to end at the day's high of 25,030.35.</p><p>In the past seven consecutive sessions, the Sensex has surged 7,781.99 points, or 10.62%, and the Nifty rallied 2,331.5 points, or 10.27%.</p></div><div class=\"articleblock-container\" id=\"arthardpv\"></div><div class=\"update-publish-time article-published-time-end\"><p class=\"publish-time-new\"> Published <span>- November 08, 2026 03:19 pm IST</span></p></div><button class=\"btn comments comment-btn print-hide\">\n                          Read  Comments <span class=\"coral-count\" data-coral-id=\"71680829\" data-coral-notext=\"true\" data-coral-url=\"https://www.thehindu.com/business/Industry/stock-markets-begin-samvat-2083-on-a-firm-note-in-special-muhurat-trading/article71680829.ece\"></span></button><div class=\"spliter pt-0 mb-0 print-hide\"></div><div class=\"article-ad two-side text-ad print-hide\"><div class=\"ad-text\" id=\"artproduct2\" style=\"display: none;\"></div></div><div class=\"d-none d-lg-block d-xl-block\"><!-- Begin DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><div class=\"dfp-ad articleinlinead middleonead\" data-devicetype=\"large\" data-size=\"[728, 90]\" data-unit=\"/22390678/TH_Desktop_AT_Mid01\" id=\"Desktop_AT_Mid01\" style=\"{ minHeight: ‘90px’}\"></div><!-- End DFP : /22390678/TH_Desktop_AT_Mid01, publisher: The Hindu --><!-- Begin DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><div class=\"dfp-ad articleinlinead\" data-devicetype=\"large\" data-size=\"[1, 1]\" data-unit=\"/22390678/Hindu_Desktop_Inarticle_1x1\" id=\"Desktop_Inarticle_1x1\" style=\"{ minHeight: ‘250px’}\"></div><!-- End DFP : /22390678/Hindu_Desktop_Inarticle_1x1, publisher: The Hindu --><!-- Begin DFP : /
